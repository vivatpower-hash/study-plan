"เมื่อเจ้าหนี้ได้รับค่าสินไหมทดแทนความเสียหายเต็มตามราคาทรัพย์หรือสิทธิซึ่งเป็นวัตถุแห่งหนี้นั้นแล้ว ท่านว่าลูกหนี้ย่อมเข้าสู่ฐานะเป็นผู้รับช่วงสิทธิของเจ้าหนี้อันเกี่ยวกับทรัพย์หรือสิทธินั้น ๆ ด้วยอำนาจกฎหมาย"], "ป.พ.พ.|389": ["", "ถ้าการชำระหนี้ทั้งหมดหรือแต่บางส่วนกลายเป็นพ้นวิสัยเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษลูกหนี้ได้ไซร้ เจ้าหนี้จะเลิกสัญญานั้นเสียก็ได้"], "ป.พ.พ.|138": ["", "ทรัพย์สิน หมายความรวมทั้งทรัพย์และวัตถุไม่มีรูปร่าง ซึ่งอาจมีราคาและอาจถือเอาได้"], "ป.พ.พ.|415": ["", "บุคคลผู้ได้รับทรัพย์สินไว้โดยสุจริตย่อมจะได้ดอกผลอันเกิดแต่ทรัพย์สินนั้นตลอดเวลาที่ยังคงสุจริตอยู่ ถ้าผู้ที่ได้รับไว้จะต้องคืนทรัพย์สินนั้นเมื่อใด ให้ถือว่าผู้นั้นตกอยู่ในฐานะทุจริตจำเดิมแต่เวลาที่เรียกคืนนั้น"], "ป.พ.พ.|875": ["", "ถ้าวัตถุอันได้เอาประกันภัยไว้นั้น เปลี่ยนมือไปจากผู้เอาประกันภัยโดยพินัยกรรมก็ดี หรือโดยบัญญัติกฎหมายก็ดี ท่านว่าสิทธิอันมีอยู่ในสัญญาประกันภัยก็ย่อมโอนตามไปด้วย ถ้าในสัญญามิได้กำหนดไว้เป็นอย่างอื่น เมื่อผู้เอาประกันภัยโอนวัตถุที่เอาประกันภัยและบอกกล่าวการโอนไปยังผู้รับประกันภัยไซร้ ท่านว่าสิทธิอันมีอยู่ในสัญญาประกันภัยนั้นย่อมโอนตามไปด้วย อนึ่ง ถ้าในการโอนเช่นนี้ช่องแห่งภัยเปลี่ยนแปลงไปหรือเพิ่มขึ้นหนักไซร้ ท่านว่าสัญญาประกันภัยนั้นกลายเป็นโมฆะ"], "ป.พ.พ.|1652": ["", "บุคคลผู้อยู่ในความปกครองนั้น จะทำพินัยกรรมยกทรัพย์มรดกของตนให้แก่ผู้ปกครองหรือคู่สมรส บุพการี หรือผู้สืบสันดาน หรือพี่น้องของผู้ปกครองไม่ได้จนกว่าผู้ปกครองจะได้ทำคำแถลงการณ์ปกครองตามที่บัญญัติไว้ในมาตรา 1577 และมาตราต่อ ๆ ไปแห่งประมวลกฎหมายนี้เสร็จสิ้นแล้ว"], "ป.พ.พ.|462": ["", "การส่งมอบนั้นจะทำอย่างหนึ่งอย่างใดก็ได้สุดแต่ว่าเป็นผลให้ทรัพย์สินนั้นไปอยู่ในเงื้อมมือของผู้ซื้อ"], "ป.พ.พ.|729": ["", "ในการบังคับจำนองตามมาตรา 728 ถ้าไม่มีการจำนองรายอื่นหรือบุริมสิทธิอื่นอันได้จดทะเบียนไว้เหนือทรัพย์สินอันเดียวกันนี้ ผู้รับจำนองจะฟ้องคดีต่อศาลเพื่อเรียกเอาทรัพย์จำนองหลุดภายในบังคับแห่งเงื่อนไขดังจะกล่าวต่อไปนี้แทนการขายทอดตลาดก็ได้ (1) ลูกหนี้ได้ขาดส่งดอกเบี้ยมาแล้วเป็นเวลาถึงห้าปี และ (2) ผู้รับจำนองแสดงให้เป็นที่พอใจแก่ศาลว่าราคาทรัพย์สินนั้นน้อยกว่าจำนวนเงินอันค้างชำระ"], "ป.พ.พ.|1647": ["", "การแสดงเจตนากำหนดการเผื่อตายนั้นย่อมทำได้ด้วยคำสั่งสุดท้ายกำหนดไว้ในพินัยกรรม"], "ป.พ.พ.|640": ["", "อันว่ายืมใช้คงรูปนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้ให้ยืม ให้บุคคลอีกคนหนึ่ง เรียกว่าผู้ยืม ใช้สอยทรัพย์สินสิ่งใดสิ่งหนึ่งได้เปล่า และผู้ยืมตกลงว่าจะคืนทรัพย์สินนั้น เมื่อได้ใช้สอยเสร็จแล้ว"], "ป.พ.พ.|1399": ["", "ภาระจำยอมนั้น ถ้ามิได้ใช้สิบปี ท่านว่าย่อมสิ้นไป"], "ป.พ.พ.|430": ["", "ครูบาอาจารย์ นายจ้าง หรือบุคคลอื่นซึ่งรับดูแลบุคคลผู้ไร้ความสามารถอยู่เป็นนิตย์ก็ดี ชั่วครั้งคราวก็ดี จำต้องรับผิดร่วมกับผู้ไร้ความสามารถในการละเมิดซึ่งเขาได้กระทำลงในระหว่างที่อยู่ในความดูแลของตน ถ้าหากพิสูจน์ได้ว่าบุคคลนั้น ๆ มิได้ใช้ความระมัดระวังตามสมควร"], "ป.พ.พ.|387": ["", "ถ้าคู่สัญญาฝ่ายหนึ่งไม่ชำระหนี้ อีกฝ่ายหนึ่งจะกำหนดระยะเวลาพอสมควร แล้วบอกกล่าวให้ฝ่ายนั้นชำระหนี้ภายในระยะเวลานั้นก็ได้ ถ้าและฝ่ายนั้นไม่ชำระหนี้ภายในระยะเวลาที่กำหนดให้ไซร้ อีกฝ่ายหนึ่งจะเลิกสัญญาเสียก็ได้"], "ป.พ.พ.|449": ["", "บุคคลใดเมื่อกระทำการป้องกันโดยชอบด้วยกฎหมายก็ดี กระทำตามคำสั่งอันชอบด้วยกฎหมายก็ดี หากก่อให้เกิดเสียหายแก่ผู้อื่นไซร้ ท่านว่าบุคคลนั้นหาต้องรับผิดใช้ค่าสินไหมทดแทนไม่ ผู้ต้องเสียหายอาจเรียกค่าสินไหมทดแทนจากผู้เป็นต้นเหตุให้ต้องป้องกันโดยชอบด้วยกฎหมาย หรือจากบุคคลผู้ให้คำสั่งโดยละเมิดนั้นก็ได้"], "ป.พ.พ.|1705": ["", "พินัยกรรมหรือข้อกำหนดพินัยกรรมนั้น ถ้าได้ทำขึ้นขัดต่อบทบัญญัติแห่งมาตรา 1652 มาตรา 1653 มาตรา 1656 มาตรา 1657 มาตรา 1658 มาตรา 1660 มาตรา 1661 หรือมาตรา 1663 ย่อมเป็นโมฆะ"], "ป.พ.พ.|1712": ["", "ผู้จัดการมรดกโดยพินัยกรรมอาจตั้งขึ้นได้ (1) โดยผู้ทำพินัยกรรมเอง (2) โดยบุคคลซึ่งระบุไว้ในพินัยกรรม ให้เป็นผู้ตั้ง"], "ป.พ.พ.|1517": ["", "เหตุฟ้องหย่าตามมาตรา 1516 (1) และ (2) ถ้าคู่สมรสฝ่ายใดฝ่ายหนึ่ง แล้วแต่กรณี ได้ยินยอมหรือรู้เห็นเป็นใจในการกระทำที่เป็นเหตุหย่านั้น ฝ่ายที่ยินยอมหรือรู้เห็นเป็นใจนั้นจะยกเป็นเหตุฟ้องหย่าไม่ได้ เหตุฟ้องหย่าตามมาตรา 1516 (10) ถ้าเกิดเพราะการกระทำของอีกฝ่ายหนึ่ง อีกฝ่ายหนึ่งนั้นจะยกเป็นเหตุฟ้องหย่าไม่ได้ ในกรณีฟ้องหย่าโดยอาศัยเหตุแห่งการผิดทัณฑ์บนตามมาตรา 1516 (8) นั้น ถ้าศาลเห็นว่าความประพฤติของคู่สมรสอันเป็นเหตุให้ทำทัณฑ์บนเป็นเหตุเล็กน้อยหรือไม่สำคัญเกี่ยวแก่การอยู่ร่วมกันฉันคู่สมรสโดยปกติสุข ศาลจะไม่พิพากษาให้หย่าก็ได้"], "ป.พ.พ.|226": ["", "บุคคลผู้รับช่วงสิทธิของเจ้าหนี้ ชอบที่จะใช้สิทธิทั้งหลายบรรดาที่เจ้าหนี้มีอยู่โดยมูลหนี้ รวมทั้งประกันแห่งหนี้นั้นได้ในนามของตนเอง ช่วงทรัพย์ ได้แก่เอาทรัพย์สินอันหนึ่งเข้าแทนที่ทรัพย์สินอีกอันหนึ่ง ในฐานะนิตินัยอย่างเดียวกันกับทรัพย์สินอันก่อน"], "ป.พ.พ.|869": ["", "อันคำว่า “วินาศภัย” ในหมวดนี้ ท่านหมายรวมเอาความเสียหายอย่างใด ๆ บรรดาซึ่งจะพึงประมาณเป็นเงินได้"], "ป.พ.พ.|448": ["", "สิทธิเรียกร้องค่าเสียหายอันเกิดแต่มูลละเมิดนั้น ท่านว่าขาดอายุความเมื่อพ้นปีหนึ่งนับแต่วันที่ผู้ต้องเสียหายรู้ถึงการละเมิดและรู้ตัวผู้จะพึงต้องใช้ค่าสินไหมทดแทน หรือเมื่อพ้นสิบปีนับแต่วันทำละเมิด แต่ถ้าเรียกร้องค่าเสียหายในมูลอันเป็นความผิดมีโทษตามกฎหมายลักษณะอาญา และมีกำหนดอายุความทางอาญายาวกว่าที่กล่าวมานั้นไซร้ ท่านให้เอาอายุความที่ยาวกว่านั้นมาบังคับ"], "ป.พ.พ.|822": ["", "ถ้าตัวแทนทำการอันใดเกินอำนาจตัวแทน แต่ทางปฏิบัติของตัวการทำให้บุคคลภายนอกมีมูลเหตุอันสมควรจะเชื่อว่าการอันนั้นอยู่ภายในขอบอำนาจของตัวแทนไซร้ ท่านให้ใช้บทบัญญัติมาตราก่อนนี้เป็นบทบังคับ แล้วแต่กรณี"], "ป.พ.พ.|1476": ["", "คู่สมรสต้องจัดการสินสมรสร่วมกันหรือได้รับความยินยอมจากอีกฝ่ายหนึ่งในกรณี ดังต่อไปนี้ (1) ขาย แลกเปลี่ยน ขายฝาก ให้เช่าซื้อ จำนอง ปลดจำนอง หรือโอนสิทธิจำนอง ซึ่งอสังหาริมทรัพย์หรือสังหาริมทรัพย์ที่อาจจำนองได้ (2) ก่อตั้งหรือกระทำให้สุดสิ้นลงทั้งหมดหรือบางส่วนซึ่งภาระจำยอม สิทธิอาศัย สิทธิเหนือพื้นดิน สิทธิเก็บกิน หรือภาระติดพันในอสังหาริมทรัพย์ (3) ให้เช่าอสังหาริมทรัพย์เกินสามปี (4) ให้กู้ยืมเงิน (5) ให้โดยเสน่หา เว้นแต่การให้ที่พอควรแก่ฐานานุรูปของครอบครัวเพื่อการกุศล เพื่อการสังคม หรือตามหน้าที่ธรรมจรรยา (6) ประนีประนอมยอมความ (7) มอบข้อพิพาทให้อนุญาโตตุลาการวินิจฉัย (8) นำทรัพย์สินไปเป็นประกันหรือหลักประกันต่อเจ้าพนักงานหรือศาล การจัดการสินสมรสนอกจากกรณีที่บัญญัติไว้ในวรรคหนึ่ง คู่สมรสฝ่ายใดฝ่ายหนึ่งจัดการได้โดยมิต้องได้รับความยินยอมจากอีกฝ่ายหนึ่ง"], "ป.พ.พ.|75": ["", "ถ้ากรณีตามมาตรา 74 เป็นเหตุให้ไม่มีผู้แทนของนิติบุคคลเหลืออยู่ หรือผู้แทนของนิติบุคคลที่เหลืออยู่มีจำนวนไม่พอจะเป็นองค์ประชุม หรือไม่พอจะกระทำการอันนั้นได้ หากกฎหมาย ข้อบังคับ หรือตราสารจัดตั้งของนิติบุคคลนั้น มิได้มีข้อกำหนดในเรื่องนี้ไว้เป็นอย่างอื่น ให้นำความในมาตรา 73 มาใช้บังคับเพื่อตั้งผู้แทนเฉพาะการโดยอนุโลม"], "ป.พ.พ.|882": ["", "ในการเรียกให้ใช้ค่าสินไหมทดแทน ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นกำหนดสองปีนับแต่วันวินาศภัย ในการเรียกให้ใช้หรือให้คืนเบี้ยประกันภัย ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นเวลาสองปีนับแต่วันซึ่งสิทธิจะเรียกให้ใช้หรือคืนเบี้ยประกันภัยถึงกำหนด"], "ป.พ.พ.|22": ["", "ผู้เยาว์อาจทำการใด ๆ ได้ทั้งสิ้น หากเป็นเพียงเพื่อจะได้ไปซึ่งสิทธิอันใดอันหนึ่ง หรือเป็นการเพื่อให้หลุดพ้นจากหน้าที่อันใดอันหนึ่ง"], "ป.พ.พ.|1582": ["", "ถ้าผู้ใช้อำนาจปกครองเป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถโดยคำสั่งของศาลก็ดี ใช้อำนาจปกครองเกี่ยวแก่ตัวผู้เยาว์โดยมิชอบก็ดี ประพฤติชั่วร้ายก็ดี ในกรณีเหล่านี้ศาลจะสั่งเอง หรือจะสั่งเมื่อญาติของผู้เยาว์หรืออัยการร้องขอให้ถอนอำนาจปกครองเสียบางส่วนหรือทั้งหมดก็ได้ ถ้าผู้ใช้อำนาจปกครองล้มละลายก็ดี หรือจัดการทรัพย์สินของผู้เยาว์ในทางที่ผิดจนอาจเป็นภัยก็ดี ศาลจะสั่งตามวิธีในวรรคหนึ่งให้ถอนอำนาจจัดการทรัพย์สินเสียก็ได้"], "ป.พ.พ.|1303": ["", "ถ้าบุคคลหลายคนเรียกเอาสังหาริมทรัพย์เดียวกัน โดยอาศัยหลักกรรมสิทธิ์ต่างกันไซร้ ท่านว่าทรัพย์สินตกอยู่ในครอบครองของบุคคลใด บุคคลนั้นมีสิทธิยิ่งกว่าบุคคลอื่น ๆ แต่ต้องได้ทรัพย์นั้นมาโดยมีค่าตอบแทนและได้การครอบครองโดยสุจริต ท่านมิให้ใช้มาตรานี้บังคับถึงสังหาริมทรัพย์ซึ่งระบุไว้ในมาตราก่อนและในเรื่องทรัพย์สินหาย กับทรัพย์สินที่ได้มาโดยการกระทำผิด"], "ป.พ.พ.|678": ["", "ในข้อความรับผิดใช้ค่าสินไหมทดแทนเพื่อทรัพย์สินของคนเดินทางหรือแขกอาศัยสูญหายหรือบุบสลายนั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาหกเดือนนับแต่วันที่คนเดินทางหรือแขกอาศัยออกไปจากสถานที่นั้น"], "ป.พ.พ.|1359": ["", "เจ้าของรวมคนหนึ่ง ๆ อาจใช้สิทธิอันเกิดแต่กรรมสิทธิ์ครอบไปถึงทรัพย์สินทั้งหมดเพื่อต่อสู้บุคคลภายนอก แต่ในการเรียกร้องเอาทรัพย์สินคืนนั้น ท่านว่าต้องอยู่ในบังคับแห่งเงื่อนไขที่ระบุไว้ในมาตรา 302 แห่งประมวลกฎหมายนี้"], "ป.พ.พ.|705": ["", "การจำนองทรัพย์สินนั้น นอกจากผู้เป็นเจ้าของในขณะนั้นแล้ว ท่านว่าใครอื่นจะจำนองหาได้ไม่"], "ป.พ.พ.|1535": ["", "เมื่อการสมรสสิ้นสุดลง ให้แบ่งความรับผิดในหนี้ที่จะต้องรับผิดด้วยกันตามส่วนเท่ากัน"], "ป.พ.พ.|890": ["", "จำนวนเงินอันจะพึงใช้นั้น จะชำระเป็นเงินจำนวนเดียว หรือเป็นเงินรายปีก็ได้ สุดแล้วแต่จะตกลงกันระหว่างคู่สัญญา"], "ป.พ.พ.|1087": ["", "อันห้างหุ้นส่วนจำกัดนั้น ท่านว่าต้องให้แต่เฉพาะผู้เป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิดเท่านั้นเป็นผู้จัดการ"], "ป.พ.พ.|891": ["", "แม้ในกรณีที่ผู้เอาประกันภัยมิได้เป็นผู้รับประโยชน์เองก็ดี ผู้เอาประกันภัยย่อมมีสิทธิที่จะโอนประโยชน์แห่งสัญญานั้นให้แก่บุคคลอีกคนหนึ่งได้ เว้นแต่จะได้ส่งมอบกรมธรรม์ประกันภัยให้แก่ผู้รับประโยชน์ไปแล้ว และผู้รับประโยชน์ได้บอกกล่าวเป็นหนังสือไปยังผู้รับประกันภัยแล้วว่าตนจำนงจะถือเอาประโยชน์แห่งสัญญานั้น ถ้ากรมธรรม์ประกันภัยได้ทำเป็นรูปให้ใช้เงินตามเขาสั่งแล้ว ท่านให้นำบทบัญญัติมาตรา 309 มาใช้บังคับ"], "ป.พ.พ.|545": ["", "ถ้าผู้เช่าเอาทรัพย์สินซึ่งตนเช่าไปให้ผู้อื่นเช่าช่วงอีกทอดหนึ่งโดยชอบ ท่านว่าผู้เช่าช่วงย่อมต้องรับผิดต่อผู้ให้เช่าเดิมโดยตรง ในกรณีเช่นว่านี้หากผู้เช่าช่วงจะได้ใช้ค่าเช่าให้แก่ผู้เช่าไปก่อน ท่านว่าผู้เช่าช่วงหาอาจจะยกขึ้นเป็นข้อต่อสู้ผู้ให้เช่าได้ไม่ อนึ่ง บทบัญญัติอันนี้ไม่ห้ามการที่ผู้ให้เช่าจะใช้สิทธิของตนต่อผู้เช่า"], "ป.พ.พ.|349": ["", "เมื่อคู่กรณีที่เกี่ยวข้องได้ทำสัญญาเปลี่ยนสิ่งซึ่งเป็นสาระสำคัญแห่งหนี้ไซร้ ท่านว่าหนี้นั้นเป็นอันระงับสิ้นไปด้วยแปลงหนี้ใหม่ ถ้าทำหนี้มีเงื่อนไขให้กลายเป็นหนี้ปราศจากเงื่อนไขก็ดี เพิ่มเติมเงื่อนไขเข้าในหนี้อันปราศจากเงื่อนไขก็ดี เปลี่ยนเงื่อนไขก็ดี ท่านถือว่าเป็นอันเปลี่ยนสิ่งซึ่งเป็นสาระสำคัญแห่งหนี้นั้น ถ้าแปลงหนี้ใหม่ด้วยเปลี่ยนตัวเจ้าหนี้ ท่านให้บังคับด้วยบทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้ ว่าด้วยโอนสิทธิเรียกร้อง"], "ป.พ.พ.|331": ["", "ถ้าเจ้าหนี้บอกปัดไม่ยอมรับชำระหนี้ก็ดี หรือไม่สามารถจะรับชำระหนี้ได้ก็ดี หากบุคคลผู้ชำระหนี้วางทรัพย์อันเป็นวัตถุแห่งหนี้ไว้เพื่อประโยชน์แก่เจ้าหนี้แล้ว ก็ย่อมจะเป็นอันหลุดพ้นจากหนี้ได้ ความข้อนี้ท่านให้ใช้ตลอดถึงกรณีที่บุคคลผู้ชำระหนี้ไม่สามารถจะหยั่งรู้ถึงสิทธิ หรือไม่รู้ตัวเจ้าหนี้ได้แน่นอนโดยมิใช่เป็นความผิดของตน"], "ป.พ.พ.|206": ["", "ในกรณีหนี้อันเกิดแต่มูลละเมิด ลูกหนี้ได้ชื่อว่าผิดนัดมาแต่เวลาที่ทำละเมิด"], "ป.พ.พ.|681": ["", "อันค้ำประกันนั้นจะมีได้แต่เฉพาะเพื่อหนี้อันสมบูรณ์ หนี้ในอนาคตหรือหนี้มีเงื่อนไขจะประกันไว้เพื่อเหตุการณ์ซึ่งหนี้นั้นอาจเป็นผลได้จริงก็ประกันได้ แต่ต้องระบุวัตถุประสงค์ในการก่อหนี้รายที่ค้ำประกัน ลักษณะของมูลหนี้ จำนวนเงินสูงสุดที่ค้ำประกัน และระยะเวลาในการก่อหนี้ที่จะค้ำประกัน เว้นแต่เป็นการค้ำประกันเพื่อกิจการเนื่องกันไปหลายคราวตามมาตรา 699 จะไม่ระบุระยะเวลาดังกล่าวก็ได้ สัญญาค้ำประกันต้องระบุหนี้หรือสัญญาที่ค้ำประกันไว้โดยชัดแจ้ง และผู้ค้ำประกันย่อมรับผิดเฉพาะหนี้หรือสัญญาที่ระบุไว้เท่านั้น หนี้อันเกิดแต่สัญญาซึ่งไม่ผูกพันลูกหนี้เพราะทำด้วยความสำคัญผิดหรือเพราะเป็นผู้ไร้ความสามารถนั้นก็อาจจะมีประกันอย่างสมบูรณ์ได้ ถ้าหากว่าผู้ค้ำประกันรู้เหตุสำคัญผิดหรือไร้ความสามารถนั้นในขณะที่เข้าทำสัญญาผูกพันตน"], "ป.พ.พ.|896": ["", "ถ้ามรณภัยเกิดขึ้นเพราะความผิดของบุคคลภายนอก ผู้รับประกันภัยหาอาจจะเรียกเอาค่าสินไหมทดแทนจากบุคคลภายนอกนั้นได้ไม่ แต่สิทธิของฝ่ายทายาทแห่งผู้มรณะในอันจะได้ค่าสินไหมทดแทนจากบุคคลภายนอกนั้นหาสูญสิ้นไปด้วยไม่ แม้ทั้งจำนวนเงินอันจะพึงใช้ตามสัญญาประกันชีวิตนั้นจะหวนกลับมาได้แก่ตนด้วย"], "ป.พ.พ.|1391": ["", "เจ้าของสามยทรัพย์มีสิทธิทำการทุกอย่างอันจำเป็นเพื่อรักษาและใช้ภาระจำยอม แต่ต้องเสียค่าใช้จ่ายของตนเอง ในการนี้เจ้าของสามยทรัพย์จะก่อให้เกิดความเสียหายแก่ภารยทรัพย์ได้ก็แต่น้อยที่สุดตามพฤติการณ์ เจ้าของสามยทรัพย์ต้องเสียค่าใช้จ่ายของตนเองรักษาซ่อมแซมการที่ได้ทำไปแล้วให้เป็นไปด้วยดี แต่ถ้าเจ้าของภารยทรัพย์ได้รับประโยชน์ด้วยไซร้ ท่านว่าต้องออกค่าใช้จ่ายตามส่วนแห่งประโยชน์ที่ได้รับ"], "ป.พ.พ.|145": ["", "ไม้ยืนต้นเป็นส่วนควบกับที่ดินที่ไม้นั้นขึ้นอยู่ ไม้ล้มลุกหรือธัญชาติอันจะเก็บเกี่ยวรวงผลได้คราวหนึ่งหรือหลายคราวต่อปีไม่เป็นส่วนควบกับที่ดิน"], "ป.พ.พ.|521": ["", "อันว่าให้นั้น คือสัญญาซึ่งบุคคลคนหนึ่งเรียกว่าผู้ให้ โอนทรัพย์สินของตนให้โดยเสน่หาแก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับ และผู้รับยอมรับเอาทรัพย์สินนั้น"], "ป.พ.พ.|803": ["", "ตัวแทนไม่มีสิทธิจะได้รับบำเหน็จ เว้นแต่จะได้มีข้อตกลงกันไว้ในสัญญาว่ามีบำเหน็จ หรือทางการที่คู่สัญญาประพฤติต่อกันนั้นเป็นปริยายว่ามีบำเหน็จ หรือเคยเป็นธรรมเนียมมีบำเหน็จ"], "ป.พ.พ.|1012": ["", "อันว่าสัญญาจัดตั้งห้างหุ้นส่วนหรือบริษัทนั้น คือสัญญาซึ่งบุคคลตั้งแต่สองคนขึ้นไปตกลงเข้ากันเพื่อกระทำกิจการร่วมกัน ด้วยประสงค์จะแบ่งปันกำไรอันจะพึงได้แต่กิจการที่ทำนั้น"], "ป.พ.พ.|1389": ["", "ถ้าความต้องการแห่งเจ้าของสามยทรัพย์เปลี่ยนแปลงไป ท่านว่าความเปลี่ยนแปลงนั้นไม่ให้สิทธิแก่เจ้าของสามยทรัพย์ที่จะทำให้เกิดภาระเพิ่มขึ้นแก่ภารยทรัพย์ได้"], "ป.พ.พ.|1402": ["", "บุคคลใดได้รับสิทธิอาศัยในโรงเรือน บุคคลนั้นย่อมมีสิทธิอยู่ในโรงเรือนนั้นโดยไม่ต้องเสียค่าเช่า"], "ป.พ.พ.|525": ["", "การให้ทรัพย์สินซึ่งถ้าจะซื้อขายกันจะต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่นั้น ท่านว่าย่อมสมบูรณ์ต่อเมื่อได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ ในกรณีเช่นนี้ การให้ย่อมเป็นอันสมบูรณ์โดยมิพักต้องส่งมอบ"], "ป.พ.พ.|1728": ["", "ผู้จัดการมรดกต้องลงมือจัดทำบัญชีทรัพย์มรดกภายในสิบห้าวัน (1) นับแต่เจ้ามรดกตาย ถ้าในขณะนั้นผู้จัดการมรดกได้รู้ถึงการตั้งแต่งตามพินัยกรรมที่มอบหมายไว้แก่ตน หรือ (2) นับแต่วันที่เริ่มหน้าที่ผู้จัดการมรดกตามมาตรา 1716 ในกรณีที่ศาลตั้งเป็นผู้จัดการมรดก หรือ (3) นับแต่วันที่ผู้จัดการมรดกรับเป็นผู้จัดการมรดกในกรณีอื่น"], "ป.พ.พ.|1307": ["", "ท่านห้ามมิให้ยึดทรัพย์สินของแผ่นดิน ไม่ว่าทรัพย์สินนั้นจะเป็นสาธารณสมบัติของแผ่นดินหรือไม่"], "ป.พ.พ.|486": ["", "ผู้ซื้อจำต้องรับมอบทรัพย์สินที่ตนได้รับซื้อและใช้ราคาตามข้อสัญญาซื้อขาย"], "ป.พ.พ.|735": ["", "เมื่อผู้รับจำนองคนใดจะบังคับจำนองเอาแก่ผู้รับโอนทรัพย์สินซึ่งจำนอง ผู้รับจำนองต้องมีจดหมายบอกกล่าวแก่ผู้รับโอนล่วงหน้าเป็นระยะเวลาไม่น้อยกว่าหกสิบวันก่อน จึงจะบังคับจำนองได้"], "ป.พ.พ.|27": ["", "ผู้แทนโดยชอบธรรมอาจให้ความยินยอมแก่ผู้เยาว์ในการประกอบธุรกิจทางการค้าหรือธุรกิจอื่น หรือในการทำสัญญาเป็นลูกจ้างในสัญญาจ้างแรงงานได้ ในกรณีที่ผู้แทนโดยชอบธรรมไม่ให้ความยินยอมโดยไม่มีเหตุอันสมควร ผู้เยาว์อาจร้องขอต่อศาลให้สั่งอนุญาตได้ ในความเกี่ยวพันกับการประกอบธุรกิจหรือการจ้างแรงงานตามวรรคหนึ่งให้ผู้เยาว์มีฐานะเสมือนดังบุคคลซึ่งบรรลุนิติภาวะแล้ว ถ้าการประกอบธุรกิจหรือการทำงานที่ได้รับความยินยอมหรือที่ได้รับอนุญาตตามวรรคหนึ่ง ก่อให้เกิดความเสียหายถึงขนาดหรือเสื่อมเสียแก่ผู้เยาว์ ผู้แทนโดยชอบธรรมอาจบอกเลิกความยินยอมที่ได้ให้แก่ผู้เยาว์เสียได้ หรือในกรณีที่ศาลอนุญาต ผู้แทนโดยชอบธรรมอาจร้องขอต่อศาลให้เพิกถอนการอนุญาตที่ได้ให้แก่ผู้เยาว์นั้นเสียได้ ในกรณีที่ผู้แทนโดยชอบธรรมบอกเลิกความยินยอมโดยไม่มีเหตุอันสมควร ผู้เยาว์อาจร้องขอต่อศาลให้เพิกถอนการบอกเลิกความยินยอมของผู้แทนโดยชอบธรรมได้ การบอกเลิกความยินยอมโดยผู้แทนโดยชอบธรรมหรือการเพิกถอนการอนุญาตโดยศาล ย่อมทำให้ฐานะเสมือนดังบุคคลซึ่งบรรลุนิติภาวะแล้วของผู้เยาว์สิ้นสุดลง แต่ไม่กระทบกระเทือนการใด ๆ ที่ผู้เยาว์ได้กระทำไปแล้วก่อนมีการบอกเลิกความยินยอมหรือเพิกถอนการอนุญาต"], "ป.พ.พ.|1082": ["", "ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดคนใดยินยอมโดยแสดงออกชัดหรือโดยปริยายให้ใช้ชื่อของตนระคนเป็นชื่อห้างไซร้ ท่านว่าผู้เป็นหุ้นส่วนคนนั้นจะต้องรับผิดต่อบุคคลภายนอกเสมือนดังว่าเป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิดฉะนั้น แต่ในระหว่างผู้เป็นหุ้นส่วนกันเองนั้น ความรับผิดของผู้เป็นหุ้นส่วนเช่นนี้ ท่านให้คงบังคับตามสัญญาหุ้นส่วน"], "ป.พ.พ.|1461": ["", "คู่สมรสต้องอยู่กินด้วยกันฉันคู่สมรส คู่สมรสต้องช่วยเหลืออุปการะเลี้ยงดูกันตามความสามารถและฐานะของตน"], "ป.พ.พ.|593": ["", "ถ้าผู้รับจ้างไม่เริ่มทำการในเวลาอันควร หรือทำการชักช้าฝ่าฝืนข้อกำหนดแห่งสัญญาก็ดี หรือทำการชักช้าโดยปราศจากความผิดของผู้ว่าจ้าง จนอาจคาดหมายล่วงหน้าได้ว่าการนั้นจะไม่สำเร็จภายในกำหนดเวลาที่ได้ตกลงกันไว้ก็ดี ผู้ว่าจ้างชอบที่จะเลิกสัญญาเสียได้ มิพักต้องรอคอยให้ถึงเวลากำหนดส่งมอบของนั้นเลย"], "ป.พ.พ.|1465": ["", "ถ้าคู่สมรสมิได้ทำสัญญากันไว้ในเรื่องทรัพย์สินเป็นพิเศษก่อนสมรส ความสัมพันธ์ระหว่างคู่สมรสในเรื่องทรัพย์สินนั้น ให้บังคับตามบทบัญญัติในหมวดนี้ ถ้าข้อความใดในสัญญาก่อนสมรสขัดต่อความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชน หรือระบุให้ใช้กฎหมายประเทศอื่นบังคับเรื่องทรัพย์สินนั้น ข้อความนั้น ๆ เป็นโมฆะ"], "ป.พ.พ.|1175": ["", "คำบอกกล่าวเรียกประชุมใหญ่ให้ส่งทางไปรษณีย์ตอบรับไปยังผู้ถือหุ้นทุกคนที่มีชื่อในทะเบียนของบริษัทก่อนวันนัดประชุมไม่น้อยกว่าเจ็ดวัน แต่ในกรณีที่บริษัทมีหุ้นชนิดที่มีใบหุ้นออกให้แก่ผู้ถือ ให้โฆษณาในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งครั้งหรือในสื่ออิเล็กทรอนิกส์ตามหลักเกณฑ์ วิธีการที่กำหนดในกฎกระทรวง ก่อนวันนัดประชุมไม่น้อยกว่าเจ็ดวันด้วย หากเป็นคำบอกกล่าวเรียกประชุมใหญ่เพื่อลงมติพิเศษให้กระทำการดังกล่าว ก่อนวันนัดประชุมไม่น้อยกว่าสิบสี่วัน คำบอกกล่าวเรียกประชุมใหญ่นั้น ให้ระบุสถานที่ วัน เวลา และสภาพแห่งกิจการที่จะได้ประชุมปรึกษากัน และในกรณีที่เป็นคำบอกกล่าวเรียกประชุมใหญ่เพื่อลงมติพิเศษให้ระบุข้อความที่จะนำเสนอให้ลงมติด้วย"], "ป.พ.พ.|391": ["", "เมื่อคู่สัญญาฝ่ายหนึ่งได้ใช้สิทธิเลิกสัญญาแล้ว คู่สัญญาแต่ละฝ่ายจำต้องให้อีกฝ่ายหนึ่งได้กลับคืนสู่ฐานะดังที่เป็นอยู่เดิม แต่ทั้งนี้จะให้เป็นที่เสื่อมเสียแก่สิทธิของบุคคลภายนอกหาได้ไม่ ส่วนเงินอันจะต้องใช้คืนในกรณีดังกล่าวมาในวรรคต้นนั้น ท่านให้บวกดอกเบี้ยเข้าด้วย คิดตั้งแต่เวลาที่ได้รับไว้ ส่วนที่เป็นการงานอันได้กระทำให้และเป็นการยอมให้ใช้ทรัพย์นั้น การที่จะชดใช้คืน ท่านให้ทำได้ด้วยใช้เงินตามควรค่าแห่งการนั้น ๆ หรือถ้าในสัญญามีกำหนดว่าให้ใช้เงินตอบแทน ก็ให้ใช้ตามนั้น การใช้สิทธิเลิกสัญญานั้นหากระทบกระทั่งถึงสิทธิเรียกร้องค่าเสียหายไม่"], "ป.พ.พ.|573": ["", "ผู้เช่าจะบอกเลิกสัญญาในเวลาใดเวลาหนึ่งก็ได้ ด้วยส่งมอบทรัพย์สินกลับคืนให้แก่เจ้าของโดยเสียค่าใช้จ่ายของตนเอง"], "ป.พ.พ.|1338": ["", "ข้อจำกัดสิทธิแห่งเจ้าของอสังหาริมทรัพย์ซึ่งกฎหมายกำหนดไว้นั้น ท่านว่าไม่จำต้องจดทะเบียน ข้อจำกัดเช่นนี้ ท่านว่าจะถอนหรือแก้ให้หย่อนลงโดยนิติกรรมไม่ได้ นอกจากจะได้ทำนิติกรรมเป็นหนังสือและจดทะเบียนกับพนักงานเจ้าหน้าที่ ข้อจำกัดซึ่งกำหนดไว้เพื่อสาธารณประโยชน์นั้น ท่านว่าจะถอนหรือแก้ให้หย่อนลงมิได้เลย"], "ป.พ.พ.|1624": ["", "ทรัพย์สินใดเป็นของบุคคลก่อนอุปสมบทเป็นพระภิกษุ ทรัพย์สินนั้นหาตกเป็นสมบัติของวัดไม่ และให้เป็นมรดกตกทอดแก่ทายาทโดยธรรมของบุคคลนั้นหรือบุคคลนั้นจะจำหน่ายโดยประการใดตามกฎหมายก็ได้"], "ป.พ.พ.|1438": ["", "การหมั้นไม่เป็นเหตุที่จะร้องขอให้ศาลบังคับให้สมรสได้ ถ้าได้มีข้อตกลงกันไว้ว่าจะให้เบี้ยปรับในเมื่อผิดสัญญาหมั้น ข้อตกลงนั้นเป็นโมฆะ"], "ป.พ.พ.|1368": ["", "บุคคลอาจได้มาซึ่งสิทธิครอบครองโดยผู้อื่นยึดถือไว้ให้"], "ป.พ.พ.|806": ["", "ตัวการซึ่งมิได้เปิดเผยชื่อจะกลับแสดงตนให้ปรากฏและเข้ารับเอาสัญญาใด ๆ ซึ่งตัวแทนได้ทำไว้แทนตนก็ได้ แต่ถ้าตัวการผู้ใดได้ยอมให้ตัวแทนของตนทำการออกหน้าเป็นตัวการไซร้ ท่านว่าตัวการผู้นั้นหาอาจจะทำให้เสื่อมเสียถึงสิทธิของบุคคลภายนอกอันเขามีต่อตัวแทน และเขาขวนขวายได้มาแต่ก่อนที่รู้ว่าเป็นตัวแทนนั้นได้ไม่"], "ป.พ.พ.|895": ["", "เมื่อใดจะต้องใช้จำนวนเงินในเหตุมรณะของบุคคลคนหนึ่งคนใด ท่านว่าผู้รับประกันภัยจำต้องใช้เงินนั้นในเมื่อมรณภัยอันนั้นเกิดขึ้น เว้นแต่ (1) บุคคลผู้นั้นได้กระทำอัตตวินิบาตด้วยใจสมัครภายในปีหนึ่งนับแต่วันทำสัญญา หรือ (2) บุคคลผู้นั้นถูกผู้รับประโยชน์ฆ่าตายโดยเจตนา ในกรณีที่ 2 นี้ ท่านว่าผู้รับประกันภัยจำต้องใช้เงินค่าไถ่ถอนกรมธรรม์ให้แก่ผู้เอาประกันภัย หรือให้แก่ทายาทของผู้นั้น"], "ป.พ.พ.|1450": ["", "บุคคลสองคนซึ่งเป็นญาติสืบสายโลหิตโดยตรงขึ้นไปหรือลงมาก็ดี เป็นพี่น้องร่วมบิดามารดาหรือร่วมแต่บิดาหรือมารดาก็ดี จะทำการสมรสกันไม่ได้ ความเป็นญาติดังกล่าวมานี้ให้ถือตามสายโลหิต โดยไม่คำนึงว่าจะเป็นญาติโดยชอบด้วยกฎหมายหรือไม่"], "ป.พ.พ.|344": ["", "สิทธิเรียกร้องใดยังมีข้อต่อสู้อยู่ สิทธิเรียกร้องนั้นท่านว่าหาอาจจะเอามาหักกลบลบหนี้ได้ไม่ อนึ่ง อายุความย่อมไม่ตัดรอนการหักกลบลบหนี้ แม้สิทธิเรียกร้องขาดอายุความแล้ว แต่ว่าในเวลาที่อาจจะหักกลบลบกับสิทธิเรียกร้องฝ่ายอื่นได้นั้น สิทธิยังไม่ขาด"], "ป.พ.พ.|1641": ["", "ถ้าบุคคลใดซึ่งจะเป็นทายาทตามมาตรา 1629 (2) หรือ (5) ถึงแก่ความตาย หรือถูกกำจัดมิให้รับมรดกก่อนเจ้ามรดกตาย ถ้ามีทายาทในลำดับเดียวกันยังมีชีวิตอยู่ ก็ให้ส่วนแบ่งทั้งหมดตกได้แก่ทายาทนั้นเท่านั้น ห้ามมิให้มีการรับมรดกแทนที่กันต่อไป"], "ป.พ.พ.|649": ["", "ในข้อความรับผิดเพื่อเสียค่าทดแทนอันเกี่ยวกับการยืมใช้คงรูปนั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาหกเดือนนับแต่วันสิ้นสัญญา"], "ป.พ.พ.|967": ["", "ในเรื่องตั๋วแลกเงินนั้น บรรดาบุคคลผู้สั่งจ่ายก็ดี รับรองก็ดี สลักหลังก็ดี หรือรับประกันด้วยอาวัลก็ดี ย่อมต้องร่วมกันรับผิดต่อผู้ทรง ผู้ทรงย่อมมีสิทธิว่ากล่าวเอาความแก่บรรดาบุคคลเหล่านี้เรียงตัวหรือรวมกันก็ได้ โดยมิพักต้องดำเนินตามลำดับที่คนเหล่านั้นมาต้องผูกพัน สิทธิเช่นเดียวกันนี้ ย่อมมีแก่บุคคลทุกคนซึ่งได้ลงลายมือชื่อในตั๋วเงินและเข้าถือเอาตั๋วเงินนั้น ในการที่จะใช้บังคับเอาแก่ผู้ที่มีความผูกพันอยู่แล้วก่อนตน การว่ากล่าวเอาความแก่คู่สัญญาคนหนึ่ง ซึ่งต้องรับผิดย่อมไม่ตัดหนทางที่จะว่ากล่าวเอาความแก่คู่สัญญาคนอื่น ๆ แม้ทั้งจะเป็นฝ่ายอยู่ในลำดับภายหลังบุคคลที่ได้ว่ากล่าวเอาความมาก่อน"], "ป.พ.พ.|1532": ["", "เมื่อหย่ากันแล้วให้จัดการแบ่งทรัพย์สินของคู่สมรส แต่ในระหว่างคู่สมรส (ก) ถ้าเป็นการหย่าโดยความยินยอมของทั้งสองฝ่าย ให้จัดการแบ่งทรัพย์สินของคู่สมรสตามที่มีอยู่ในเวลาจดทะเบียนการหย่า (ข) ถ้าเป็นการหย่าโดยคำพิพากษาของศาล คำพิพากษาส่วนที่บังคับทรัพย์สินระหว่างคู่สมรสนั้น มีผลย้อนหลังไปถึงวันฟ้องหย่า"], "ป.พ.พ.|652": ["", "ถ้าในสัญญาไม่มีกำหนดเวลาให้คืนทรัพย์สินซึ่งยืมไป ผู้ให้ยืมจะบอกกล่าวแก่ผู้ยืมให้คืนทรัพย์สินภายในเวลาอันควร ซึ่งกำหนดให้ในคำบอกกล่าวนั้นก็ได้"], "ป.พ.พ.|1607": ["", "การถูกกำจัดมิให้รับมรดกนั้นเป็นการเฉพาะตัว ผู้สืบสันดานของทายาทที่ถูกกำจัดสืบมรดกต่อไปเหมือนหนึ่งว่าทายาทนั้นตายแล้ว แต่ในส่วนทรัพย์สินซึ่งผู้สืบสันดานได้รับมรดกมาเช่นนี้ ทายาทที่ว่านั้นไม่มีสิทธิที่จะจัดการและใช้ดังที่ระบุไว้ในบรรพ 5 ลักษณะ 2 หมวด 3 แห่งประมวลกฎหมายนี้ ในกรณีเช่นนั้นให้ใช้มาตรา 1548 บังคับโดยอนุโลม"], "ป.พ.พ.|1417": ["", "อสังหาริมทรัพย์อาจต้องตกอยู่ในบังคับสิทธิเก็บกิน อันเป็นเหตุให้ผู้ทรงสิทธินั้นมีสิทธิครอบครอง ใช้ และถือเอาซึ่งประโยชน์แห่งทรัพย์สินนั้น ผู้ทรงสิทธิเก็บกินมีอำนาจจัดการทรัพย์สิน ผู้ทรงสิทธิเก็บกินในป่าไม้ เหมืองแร่ หรือที่ขุดหิน มีสิทธิทำการแสวงประโยชน์จากป่าไม้ เหมืองแร่ หรือที่ขุดหินนั้น"], "ป.พ.พ.|1490": ["", "หนี้ที่คู่สมรสเป็นลูกหนี้ร่วมกันนั้นให้รวมถึงหนี้ที่คู่สมรสฝ่ายใดฝ่ายหนึ่งก่อให้เกิดขึ้นในระหว่างสมรส ดังต่อไปนี้ (1) หนี้เกี่ยวแก่การจัดการบ้านเรือนและจัดหาสิ่งจำเป็นสำหรับครอบครัว การอุปการะเลี้ยงดู ตลอดถึงการรักษาพยาบาลบุคคลในครอบครัวและการศึกษาของบุตรตามสมควรแก่อัตภาพ (2) หนี้ที่เกี่ยวข้องกับสินสมรส (3) หนี้ที่เกิดขึ้นเนื่องจากการงานซึ่งคู่สมรสทำด้วยกัน (4) หนี้ที่คู่สมรสฝ่ายใดฝ่ายหนึ่งก่อขึ้นเพื่อประโยชน์ตนฝ่ายเดียว แต่อีกฝ่ายหนึ่งได้ให้สัตยาบัน"], "ป.พ.พ.|985": ["", "บทบัญญัติทั้งหลายในหมวด 2 ว่าด้วยตั๋วแลกเงินดังจะกล่าวต่อไปนี้ ท่านให้ยกมาบังคับในเรื่องตั๋วสัญญาใช้เงินเพียงเท่าที่ไม่ขัดกับสภาพแห่งตราสารชนิดนี้คือบทมาตรา 911 มาตรา 913 มาตรา 916 มาตรา 917 มาตรา 919 มาตรา 920 มาตรา 922 ถึงมาตรา 926 มาตรา 938 ถึงมาตรา 947 มาตรา 949 มาตรา 950 มาตรา 954 ถึงมาตรา 959 มาตรา 967 ถึงมาตรา 971 ถ้าเป็นตั๋วสัญญาใช้เงินที่ออกมาแต่ต่างประเทศ ท่านให้นำบทบัญญัติต่อไปนี้มาใช้บังคับด้วย คือบทมาตรา 960 ถึงมาตรา 964 มาตรา 973 มาตรา 974"], "ป.พ.พ.|1514": ["", "การหย่านั้นจะทำได้แต่โดยความยินยอมของทั้งสองฝ่ายหรือโดยคำพิพากษาของศาล การหย่าโดยความยินยอมต้องทำเป็นหนังสือและมีพยานลงลายมือชื่ออย่างน้อยสองคน"], "ป.พ.พ.|447": ["", "บุคคลใดทำให้เขาต้องเสียหายแก่ชื่อเสียง เมื่อผู้ต้องเสียหายร้องขอ ศาลจะสั่งให้บุคคลนั้นจัดการตามควรเพื่อทำให้ชื่อเสียงของผู้นั้นกลับคืนดีแทนให้ใช้ค่าเสียหาย หรือทั้งให้ใช้ค่าเสียหายด้วยก็ได้"], "ป.พ.พ.|1459": ["", "การสมรสในต่างประเทศระหว่างคนที่มีสัญชาติไทยด้วยกัน หรือฝ่ายใดฝ่ายหนึ่งมีสัญชาติไทย จะทำตามแบบที่กำหนดไว้ตามกฎหมายไทยหรือกฎหมายแห่งประเทศนั้นก็ได้ ในกรณีที่คู่สมรสประสงค์จะจดทะเบียนตามกฎหมายไทย ให้พนักงานทูตหรือกงสุลไทยเป็นผู้รับจดทะเบียน"], "ป.พ.พ.|383": ["", "ถ้าเบี้ยปรับที่ริบนั้นสูงเกินส่วน ศาลจะลดลงเป็นจำนวนพอสมควรก็ได้ ในการที่จะวินิจฉัยว่าสมควรเพียงใดนั้น ท่านให้พิเคราะห์ถึงทางได้เสียของเจ้าหนี้ทุกอย่างอันชอบด้วยกฎหมาย ไม่ใช่แต่เพียงทางได้เสียในเชิงทรัพย์สิน เมื่อได้ใช้เงินตามเบี้ยปรับแล้ว สิทธิเรียกร้องขอลดก็เป็นอันขาดไป นอกจากกรณีที่กล่าวไว้ในมาตรา 379 และมาตรา 382 ท่านให้ใช้วิธีเดียวกันนี้บังคับ ในเมื่อบุคคลสัญญาว่าจะให้เบี้ยปรับเมื่อตนกระทำหรืองดเว้นกระทำการอันหนึ่งอันใดนั้นด้วย"], "ป.พ.พ.|1394": ["", "ถ้ามีการแบ่งแยกภารยทรัพย์ ท่านว่าภาระจำยอมยังคงมีอยู่ทุกส่วนที่แยกออก แต่ถ้าในส่วนใดภาระจำยอมนั้นไม่ใช้และใช้ไม่ได้ตามรูปการ ท่านว่าเจ้าของส่วนนั้นจะเรียกให้พ้นจากภาระจำยอมก็ได้"], "ป.พ.พ.|295": ["", "ข้อความจริงอื่นใด นอกจากที่ระบุไว้ในมาตรา 292 ถึงมาตรา 294 นั้น เมื่อเป็นเรื่องเท้าถึงตัวลูกหนี้ร่วมกันคนใดก็ย่อมเป็นไปเพื่อคุณและโทษแต่เฉพาะแก่ลูกหนี้คนนั้น เว้นแต่จะปรากฏว่าขัดกับสภาพแห่งหนี้นั้นเอง ความที่ว่ามานี้ เมื่อจะกล่าวโดยเฉพาะก็คือว่าให้ใช้แก่การให้คำบอกกล่าว การผิดนัด การที่หยิบยกอ้างความผิด การชำระหนี้อันเป็นพ้นวิสัยแก่ฝ่ายลูกหนี้ร่วมกันคนหนึ่ง กำหนดอายุความหรือการที่อายุความสะดุดหยุดลง และการที่สิทธิเรียกร้องเกลื่อนกลืนกันไปกับหนี้สิน"], "ป.พ.พ.|554": ["", "ถ้าผู้เช่ากระทำการฝ่าฝืนบทบัญญัติในมาตรา 552 มาตรา 553 หรือฝ่าฝืนข้อสัญญา ผู้ให้เช่าจะบอกกล่าวให้ผู้เช่าปฏิบัติให้ถูกต้องตามบทกฎหมายหรือข้อสัญญานั้น ๆ ก็ได้ ถ้าและผู้เช่าละเลยเสียไม่ปฏิบัติตาม ท่านว่าผู้ให้เช่าจะบอกเลิกสัญญาเสียก็ได้"], "ป.พ.พ.|1471": ["", "สินส่วนตัวได้แก่ทรัพย์สิน (1) ที่ฝ่ายใดฝ่ายหนึ่งมีอยู่ก่อนสมรส (2) ที่เป็นเครื่องใช้สอยส่วนตัว เครื่องแต่งกาย หรือเครื่องประดับกายตามควรแก่ฐานะ หรือเครื่องมือเครื่องใช้ที่จำเป็นในการประกอบอาชีพหรือวิชาชีพของคู่สมรสฝ่ายใดฝ่ายหนึ่ง (3) ที่ฝ่ายใดฝ่ายหนึ่งได้มาระหว่างสมรสโดยการรับมรดกหรือโดยการให้โดยเสน่หา (4) ที่เป็นของหมั้น"], "ป.พ.พ.|217": ["", "ลูกหนี้จะต้องรับผิดชอบในความเสียหายบรรดาที่เกิดแต่ความประมาทเลินเล่อในระหว่างเวลาที่ตนผิดนัด ทั้งจะต้องรับผิดชอบในการที่การชำระหนี้กลายเป็นพ้นวิสัยเพราะอุบัติเหตุอันเกิดขึ้นในระหว่างเวลาที่ผิดนัดนั้นด้วย เว้นแต่ความเสียหายนั้น ถึงแม้ว่าตนจะได้ชำระหนี้ทันเวลากำหนดก็คงจะต้องเกิดมีอยู่นั่นเอง"], "ป.พ.พ.|716": ["", "จำนองย่อมครอบไปถึงบรรดาทรัพย์สินซึ่งจำนองหมดทุกสิ่ง แม้จะได้ชำระหนี้แล้วบางส่วน"], "ป.พ.พ.|24": ["", "ผู้เยาว์อาจทำการใด ๆ ได้ทั้งสิ้น ซึ่งเป็นการสมแก่ฐานานุรูปแห่งตน และเป็นการอันจำเป็นในการดำรงชีพตามสมควร"], "ป.พ.พ.|314": ["", "อันการชำระหนี้นั้น ท่านว่าบุคคลภายนอกจะเป็นผู้ชำระก็ได้ เว้นแต่สภาพแห่งหนี้จะไม่เปิดช่องให้บุคคลภายนอกชำระ หรือจะขัดกับเจตนาอันคู่กรณีได้แสดงไว้ บุคคลผู้ไม่มีส่วนได้เสียด้วยในการชำระหนี้นั้น จะเข้าชำระหนี้โดยขืนใจลูกหนี้หาได้ไม่"], "ป.พ.พ.|1167": ["", "ความเกี่ยวพันกันในระหว่างกรรมการและบริษัทและบุคคลภายนอกนั้น ท่านให้บังคับตามบทบัญญัติแห่งประมวลกฎหมายนี้ ว่าด้วยตัวแทน"], "ป.พ.พ.|1615": ["", "การที่ทายาทสละมรดกนั้น มีผลย้อนหลังไปถึงเวลาที่เจ้ามรดกตาย เมื่อทายาทโดยธรรมคนใดสละมรดก ผู้สืบสันดานของทายาทคนนั้นสืบมรดกได้ตามสิทธิของตน และชอบที่จะได้รับส่วนแบ่งเท่ากับส่วนแบ่งที่ผู้สละมรดกนั้นจะได้รับ แต่ผู้สืบสันดานนั้นต้องไม่ใช่ผู้ที่บิดามารดา ผู้ปกครอง หรือผู้อนุบาล แล้วแต่กรณี ได้บอกสละมรดกโดยสมบูรณ์ในนามของผู้สืบสันดานนั้น"], "ป.พ.พ.|1387": ["", "อสังหาริมทรัพย์อาจต้องตกอยู่ในภาระจำยอมอันเป็นเหตุให้เจ้าของต้องยอมรับกรรมบางอย่างซึ่งกระทบถึงทรัพย์สินของตน หรือต้องงดเว้นการใช้สิทธิบางอย่างอันมีอยู่ในกรรมสิทธิ์ทรัพย์สินนั้น เพื่อประโยชน์แก่อสังหาริมทรัพย์อื่น"], "ป.พ.พ.|889": ["", "ในสัญญาประกันชีวิตนั้น การใช้จำนวนเงินย่อมอาศัยความทรงชีพ หรือมรณะของบุคคลคนหนึ่ง"], "ป.พ.พ.|901": ["", "ถ้าบุคคลคนใดลงลายมือชื่อของตนในตั๋วเงิน และมิได้เขียนแถลงว่ากระทำการแทนบุคคลอีกคนหนึ่งไซร้ ท่านว่าบุคคลคนนั้นย่อมเป็นผู้รับผิดตามความในตั๋วเงินนั้น"], "ป.พ.พ.|1144": ["", "บรรดาบริษัทจำกัด ให้มีกรรมการคนหนึ่งหรือหลายคนด้วยกันจัดการตามข้อบังคับของบริษัท และอยู่ในความครอบงำของที่ประชุมใหญ่แห่งผู้ถือหุ้นทั้งปวง"], "ป.พ.พ.|1515": ["", "เมื่อได้จดทะเบียนสมรสตามประมวลกฎหมายนี้ การหย่าโดยความยินยอมจะสมบูรณ์ต่อเมื่อคู่สมรสได้จดทะเบียนการหย่านั้นแล้ว"], "ป.พ.พ.|218": ["", "ถ้าการชำระหนี้กลายเป็นพ้นวิสัยจะทำได้ เพราะพฤติการณ์อันใดอันหนึ่งซึ่งลูกหนี้ต้องรับผิดชอบไซร้ ท่านว่าลูกหนี้จะต้องใช้ค่าสินไหมทดแทนให้แก่เจ้าหนี้เพื่อค่าเสียหายอย่างใด ๆ อันเกิดแต่การไม่ชำระหนี้นั้น ในกรณีที่การชำระหนี้กลายเป็นพ้นวิสัยแต่เพียงบางส่วน ถ้าหากว่าส่วนที่ยังเป็นวิสัยจะทำได้นั้นจะเป็นอันไร้ประโยชน์แก่เจ้าหนี้แล้ว เจ้าหนี้จะไม่ยอมรับชำระหนี้ส่วนที่ยังเป็นวิสัยจะทำได้นั้นแล้ว และเรียกค่าสินไหมทดแทนเพื่อการไม่ชำระหนี้เสียทั้งหมดทีเดียวก็ได้"], "ป.พ.พ.|1711": ["", "ผู้จัดการมรดกนั้นรวมตลอดทั้งบุคคลที่ตั้งขึ้นโดยพินัยกรรมหรือโดยคำสั่งศาล"], "ป.พ.พ.|1605": ["", "ทายาทคนใดยักย้าย หรือปิดบังทรัพย์มรดกเท่าส่วนที่ตนจะได้หรือมากกว่านั้นโดยฉ้อฉลหรือรู้อยู่ว่า ตนทำให้เสื่อมประโยชน์ของทายาทคนอื่น ทายาทคนนั้นต้องถูกกำจัดมิให้ได้มรดกเลย แต่ถ้าได้ยักย้ายหรือปิดบังทรัพย์มรดกน้อยกว่าส่วนที่ตนจะได้ ทายาทคนนั้นต้องถูกกำจัดมิให้ได้มรดกเฉพาะส่วนที่ได้ยักย้ายหรือปิดบังไว้นั้น มาตรานี้มิให้ใช้บังคับแก่ผู้รับพินัยกรรม ซึ่งผู้ตายได้ทำพินัยกรรมยกทรัพย์สินให้เฉพาะสิ่งเฉพาะอย่าง ในอันที่จะได้รับทรัพย์สินนั้น"], "ป.พ.พ.|825": ["", "ถ้าตัวแทนเข้าทำสัญญากับบุคคลภายนอกโดยเห็นแก่อามิสสินจ้างเป็นทรัพย์สินอย่างใด ๆ หรือประโยชน์อย่างอื่นอันบุคคลภายนอกได้ให้เป็นลาภส่วนตัวก็ดี หรือให้คำมั่นว่าจะให้ก็ดี ท่านว่าตัวการหาต้องผูกพันในสัญญาซึ่งตัวแทนของตนได้ทำนั้นไม่ เว้นแต่ตัวการจะได้ยินยอมด้วย"], "ป.พ.พ.|676": ["", "ทรัพย์สินซึ่งมิได้นำฝากบอกราคาชัดแจ้งนั้น เมื่อพบเห็นว่าสูญหายหรือบุบสลายขึ้น คนเดินทางหรือแขกอาศัยต้องแจ้งความนั้นต่อเจ้าสำนักโรงแรม โฮเต็ล หรือสถานที่เช่นนั้นทันที มิฉะนั้นท่านว่าเจ้าสำนักย่อมพ้นจากความรับผิดดังบัญญัติไว้ในมาตรา 674 และมาตรา 675"], "ป.พ.พ.|798": ["", "กิจการอันใดท่านบังคับไว้โดยกฎหมายว่าต้องทำเป็นหนังสือ การตั้งตัวแทนเพื่อกิจการอันนั้นก็ต้องทำเป็นหนังสือด้วย กิจการอันใดท่านบังคับไว้ว่าต้องมีหลักฐานเป็นหนังสือ การตั้งตัวแทนเพื่อกิจการอันนั้นก็ต้องมีหลักฐานเป็นหนังสือด้วย"], "ป.พ.พ.|459": ["", "ถ้าสัญญาซื้อขายมีเงื่อนไข หรือเงื่อนเวลาบังคับไว้ ท่านว่ากรรมสิทธิ์ในทรัพย์สินยังไม่โอนไปจนกว่าการจะได้เป็นไปตามเงื่อนไข หรือถึงกำหนดเงื่อนเวลานั้น"], "ป.พ.พ.|374": ["", "ถ้าคู่สัญญาฝ่ายหนึ่งทำสัญญาตกลงว่าจะชำระหนี้แก่บุคคลภายนอกไซร้ ท่านว่าบุคคลภายนอกมีสิทธิจะเรียกชำระหนี้จากลูกหนี้โดยตรงได้ ในกรณีดังกล่าวมาในวรรคต้นนั้น สิทธิของบุคคลภายนอกย่อมเกิดมีขึ้นตั้งแต่เวลาที่แสดงเจตนาแก่ลูกหนี้ว่าจะถือเอาประโยชน์จากสัญญานั้น"], "ป.พ.พ.|17": ["", "ในกรณีบุคคลหลายคนตายในเหตุภยันตรายร่วมกัน ถ้าเป็นการพ้นวิสัยที่จะกำหนดได้ว่าคนไหนตายก่อนหลัง ให้ถือว่าตายพร้อมกัน"], "ป.พ.พ.|569": ["", "อันสัญญาเช่าอสังหาริมทรัพย์นั้นย่อมไม่ระงับไป เพราะเหตุโอนกรรมสิทธิ์ทรัพย์สินซึ่งให้เช่า ผู้รับโอนย่อมรับไปทั้งสิทธิและหน้าที่ของผู้โอนซึ่งมีต่อผู้เช่านั้นด้วย"], "ป.พ.พ.|1314": ["", "ท่านให้ใช้บทบัญญัติมาตรา 1310 มาตรา 1311 และมาตรา 1313 บังคับตลอดถึงการก่อสร้างใด ๆ ซึ่งติดที่ดินและการเพาะปลูกต้นไม้หรือธัญชาติด้วยโดยอนุโลม แต่ข้าวหรือธัญชาติอย่างอื่นอันจะเก็บเกี่ยวรวงผลได้คราวหนึ่งหรือหลายคราวต่อปี เจ้าของที่ดินต้องยอมให้บุคคลผู้กระทำการโดยสุจริต หรือผู้เป็นเจ้าของที่ดินโดยมีเงื่อนไขซึ่งได้เพาะปลูกลงไว้นั้น คงครองที่ดินจนกว่าจะเสร็จการเก็บเกี่ยวโดยใช้เงินคำนวณตามเกณฑ์ค่าเช่าที่ดินนั้น หรือเจ้าของที่ดินจะเข้าครอบครองในทันทีโดยใช้ค่าทดแทนให้แก่อีกฝ่ายหนึ่งก็ได้"], "ป.พ.พ.|908": ["", "อันว่าตั๋วแลกเงินนั้น คือหนังสือตราสารซึ่งบุคคลคนหนึ่ง เรียกว่าผู้สั่งจ่าย สั่งบุคคลอีกคนหนึ่ง เรียกว่าผู้จ่าย ให้ใช้เงินจำนวนหนึ่งแก่บุคคลคนหนึ่ง หรือให้ใช้ตามคำสั่งของบุคคลคนหนึ่งซึ่งเรียกว่าผู้รับเงิน"], "ป.พ.พ.|861": ["", "อันว่าสัญญาประกันภัยนั้น คือสัญญาซึ่งบุคคลหนึ่งตกลงจะใช้ค่าสินไหมทดแทน หรือใช้เงินจำนวนหนึ่งให้ในกรณีวินาศภัยหากมีขึ้น หรือในเหตุอย่างอื่นในอนาคตดังได้ระบุไว้ในสัญญา และในการนี้บุคคลอีกคนหนึ่งตกลงจะส่งเงินซึ่งเรียกว่า เบี้ยประกันภัย"], "ป.พ.พ.|1329": ["", "สิทธิของบุคคลผู้ได้มาซึ่งทรัพย์สินโดยมีค่าตอบแทนและโดยสุจริตนั้น ท่านว่ามิเสียไป ถึงแม้ว่าผู้โอนทรัพย์สินให้จะได้ทรัพย์สินนั้นมาโดยนิติกรรมอันเป็นโมฆียะ และนิติกรรมนั้นได้ถูกบอกล้างภายหลัง"], "ป.พ.พ.|324": ["", "เมื่อมิได้มีแสดงเจตนาไว้โดยเฉพาะเจาะจงว่าจะพึงชำระหนี้ ณ สถานที่ใดไซร้ หากจะต้องส่งมอบทรัพย์เฉพาะสิ่ง ท่านว่าต้องส่งมอบกัน ณ สถานที่ซึ่งทรัพย์นั้นได้อยู่ในเวลาเมื่อก่อให้เกิดหนี้นั้น ส่วนการชำระหนี้โดยประการอื่น ท่านว่าต้องชำระ ณ สถานที่ซึ่งเป็นภูมิลำเนาปัจจุบันของเจ้าหนี้"], "ป.พ.พ.|624": ["", "ในข้อความรับผิดของผู้ขนส่งในการที่ของสูญหายหรือบุบสลายหรือส่งของชักช้านั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นกำหนดปีหนึ่งนับแต่ส่งมอบ หรือปีหนึ่งนับแต่วันที่ควรจะได้ส่งมอบ เว้นแต่ในกรณีที่มีการทุจริต"], "ป.พ.พ.|513": ["", "เมื่อใดผู้ทอดตลาดเห็นว่าราคาซึ่งมีผู้สู้สูงสุดนั้นยังไม่เพียงพอ ผู้ทอดตลาดอาจถอนทรัพย์สินจากการทอดตลาดได้"], "ป.พ.พ.|1600": ["", "ภายใต้บังคับของบทบัญญัติแห่งประมวลกฎหมายนี้ กองมรดกของผู้ตายได้แก่ทรัพย์สินทุกชนิดของผู้ตาย ตลอดทั้งสิทธิหน้าที่และความรับผิดต่าง ๆ เว้นแต่ตามกฎหมายหรือว่าโดยสภาพแล้ว เป็นการเฉพาะตัวของผู้ตายโดยแท้"], "ป.พ.พ.|1564": ["", "บิดามารดาจำต้องอุปการะเลี้ยงดูและให้การศึกษาตามสมควรแก่บุตรในระหว่างที่เป็นผู้เยาว์ บิดามารดาจำต้องอุปการะเลี้ยงดูบุตรซึ่งบรรลุนิติภาวะแล้วแต่เฉพาะผู้ทุพพลภาพและหาเลี้ยงตนเองมิได้"], "ป.พ.พ.|821": ["", "บุคคลผู้ใดเชิดบุคคลอีกคนหนึ่งออกแสดงเป็นตัวแทนของตนก็ดี รู้แล้วยอมให้บุคคลอีกคนหนึ่งเชิดตัวเขาเองออกแสดงเป็นตัวแทนของตนก็ดี ท่านว่าบุคคลผู้นั้นจะต้องรับผิดต่อบุคคลภายนอกผู้สุจริตเสมือนว่าบุคคลอีกคนหนึ่งนั้นเป็นตัวแทนของตน"], "ป.พ.พ.|370": ["", "ถ้าสัญญาต่างตอบแทนมีวัตถุที่ประสงค์เป็นการก่อให้เกิดหรือโอนทรัพยสิทธิในทรัพย์เฉพาะสิ่ง และทรัพย์นั้นสูญหรือเสียหายไปด้วยเหตุอย่างใดอย่างหนึ่งอันจะโทษลูกหนี้มิได้ไซร้ ท่านว่าการสูญหรือเสียหายนั้นตกเป็นพับแก่เจ้าหนี้ ถ้าไม่ใช่ทรัพย์เฉพาะสิ่ง ท่านให้ใช้บทบัญญัติที่กล่าวมาในวรรคก่อนนี้บังคับแต่เวลาที่ทรัพย์นั้นกลายเป็นทรัพย์เฉพาะสิ่งตามบทบัญญัติแห่งมาตรา 195 วรรคสอง นั้นไป"], "ป.พ.พ.|691": ["", "ในกรณีที่เจ้าหนี้ตกลงกับลูกหนี้ อันมีผลเป็นการลดจำนวนหนี้ที่มีการค้ำประกันรวมทั้งดอกเบี้ย ค่าสินไหมทดแทน หรือค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้น ให้เจ้าหนี้มีหนังสือแจ้งให้ผู้ค้ำประกันทราบถึงข้อตกลงดังกล่าวภายในหกสิบวันนับแต่วันที่ตกลงกันนั้น ถ้าลูกหนี้ได้ชำระหนี้ตามที่ได้ลดแล้วก็ดี ลูกหนี้ชำระหนี้ตามที่ได้ลดไม่ครบถ้วนแต่ผู้ค้ำประกันได้ชำระหนี้ส่วนที่เหลือนั้นแล้วก็ดี หรือลูกหนี้ไม่ชำระหนี้ตามที่ได้ลดแต่ผู้ค้ำประกันได้ชำระหนี้ตามที่ได้ลดนั้นแล้วก็ดี ให้ผู้ค้ำประกันเป็นอันหลุดพ้นจากการค้ำประกัน ในการชำระหนี้ของผู้ค้ำประกันดังกล่าว ผู้ค้ำประกันมีสิทธิชำระหนี้ได้แม้จะล่วงเลยกำหนดเวลาชำระหนี้ตามที่ได้ลดแต่ต้องไม่เกินหกสิบวันนับแต่วันที่ครบกำหนดเวลาชำระหนี้ดังกล่าว ในกรณีที่เจ้าหนี้มีหนังสือแจ้งให้ผู้ค้ำประกันทราบถึงข้อตกลงดังกล่าวเมื่อล่วงเลยกำหนดเวลาชำระหนี้ตามที่ได้ลดแล้ว ให้ผู้ค้ำประกันมีสิทธิชำระหนี้ได้ภายในหกสิบวันนับแต่วันที่เจ้าหนี้มีหนังสือแจ้งให้ผู้ค้ำประกันทราบถึงข้อตกลงนั้น ทั้งนี้ ข้อตกลงที่ทำขึ้นภายหลังที่ลูกหนี้ผิดนัดชำระหนี้แล้ว หากในข้อตกลงนั้นมีการขยายเวลาชำระหนี้ให้แก่ลูกหนี้ มิให้ถือว่าเป็นการผ่อนเวลาตามมาตรา 700 ข้อตกลงใดที่มีผลเป็นการเพิ่มภาระแก่ผู้ค้ำประกันให้มากกว่าที่บัญญัติไว้ในวรรคหนึ่ง ข้อตกลงนั้นเป็นโมฆะ"], "ป.พ.พ.|306": ["", "การโอนหนี้อันจะพึงต้องชำระแก่เจ้าหนี้คนหนึ่งโดยเฉพาะเจาะจงนั้น ถ้าไม่ทำเป็นหนังสือ ท่านว่าไม่สมบูรณ์ อนึ่ง การโอนหนี้นั้นท่านว่าจะยกขึ้นเป็นข้อต่อสู้ลูกหนี้หรือบุคคลภายนอกได้แต่เมื่อได้บอกกล่าวการโอนไปยังลูกหนี้ หรือลูกหนี้จะได้ยินยอมด้วยในการโอนนั้น คำบอกกล่าวหรือความยินยอมเช่นว่านี้ท่านว่าต้องทำเป็นหนังสือ ถ้าลูกหนี้ทำให้พอแก่ใจผู้โอนด้วยการใช้เงิน หรือด้วยประการอื่นเสียแต่ก่อนได้รับบอกกล่าว หรือก่อนได้ตกลงให้โอนไซร้ ลูกหนี้นั้นก็เป็นอันหลุดพ้นจากหนี้"], "ป.พ.พ.|1413": ["", "ถ้าสิทธิเหนือพื้นดินนั้นไม่มีกำหนดเวลาไซร้ ท่านว่าคู่กรณีฝ่ายใดจะบอกเลิกเสียในเวลาใดก็ได้ แต่ต้องบอกล่วงหน้าแก่อีกฝ่ายหนึ่งตามสมควร ถ้ามีค่าเช่าซึ่งจำต้องให้แก่กันไซร้ ท่านว่าต้องบอกล่วงหน้าปีหนึ่ง หรือให้ค่าเช่าปีหนึ่ง"], "ป.พ.พ.|1460": ["", "เมื่อมีพฤติการณ์พิเศษซึ่งไม่อาจทำการจดทะเบียนสมรสต่อนายทะเบียนได้เพราะบุคคลฝ่ายใดฝ่ายหนึ่งหรือทั้งสองฝ่ายตกอยู่ในอันตรายใกล้ความตาย หรืออยู่ในภาวะการรบหรือสงคราม ถ้าบุคคลทั้งสองนั้นได้แสดงเจตนาจะสมรสกันต่อหน้าบุคคลซึ่งบรรลุนิติภาวะที่อยู่ ณ ที่นั้น แล้วให้บุคคลดังกล่าวจดแจ้งการแสดงเจตนาขอทำการสมรสของบุคคลทั้งสองนั้นไว้เป็นหลักฐาน และต่อมาบุคคลทั้งสองได้จดทะเบียนสมรสกันภายในเก้าสิบวันนับแต่วันที่อาจทำการจดทะเบียนต่อนายทะเบียนได้ โดยแสดงหลักฐานต่อนายทะเบียนและให้นายทะเบียนจดแจ้งวัน เดือน ปี สถานที่ที่แสดงเจตนาขอทำการสมรส และพฤติการณ์พิเศษนั้นไว้ในทะเบียนสมรส ให้ถือว่าวันแสดงเจตนาขอทำการสมรสต่อบุคคลดังกล่าวเป็นวันจดทะเบียนสมรสต่อนายทะเบียนแล้ว ความในมาตรานี้มิให้ใช้บังคับถ้าหากจะมีการสมรสในวันแสดงเจตนาขอทำการสมรส การสมรสนั้นจะตกเป็นโมฆะ"], "ป.พ.พ.|688": ["", "เมื่อเจ้าหนี้ทวงให้ผู้ค้ำประกันชำระหนี้ ผู้ค้ำประกันจะขอให้เรียกลูกหนี้ชำระก่อนก็ได้ เว้นแต่ลูกหนี้จะถูกศาลพิพากษาให้เป็นคนล้มละลายเสียแล้ว หรือไม่ปรากฏว่าลูกหนี้ไปอยู่แห่งใดในพระราชอาณาเขต"], "ป.พ.พ.|1658": ["", "พินัยกรรมนั้น จะทำเป็นเอกสารฝ่ายเมืองก็ได้ กล่าวคือ (1) ผู้ทำพินัยกรรมต้องไปแจ้งข้อความที่ตนประสงค์จะให้ใส่ไว้ในพินัยกรรมของตนแก่กรมการอำเภอต่อหน้าพยานอีกอย่างน้อยสองคนพร้อมกัน (2) กรมการอำเภอต้องจดข้อความที่ผู้ทำพินัยกรรมแจ้งให้ทราบนั้นลงไว้ และอ่านข้อความนั้นให้ผู้ทำพินัยกรรมและพยานฟัง (3) เมื่อผู้ทำพินัยกรรมและพยานทราบแน่ชัดว่าข้อความที่กรมการอำเภอจดนั้นเป็นการถูกต้องตรงกันกับที่ผู้ทำพินัยกรรมแจ้งไว้แล้ว ให้ผู้ทำพินัยกรรมและพยานลงลายมือชื่อไว้เป็นสำคัญ (4) ข้อความที่กรมการอำเภอจดไว้นั้น ให้กรมการอำเภอลงลายมือชื่อและลงวัน เดือน ปี ทั้งจดลงไว้ด้วยตนเองเป็นสำคัญว่า พินัยกรรมนั้นได้ทำขึ้นถูกต้องตามบทบัญญัติ (1) ถึง (3) ข้างต้น แล้วประทับตราตำแหน่งไว้เป็นสำคัญ การขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่ผู้ทำพินัยกรรม พยาน และกรมการอำเภอจะได้ลงลายมือชื่อกำกับไว้"], "ป.พ.พ.|1696": ["", "ถ้าผู้ทำพินัยกรรมได้โอนไปโดยสมบูรณ์ซึ่งทรัพย์สินอันเป็นวัตถุแห่งข้อกำหนดพินัยกรรมใดด้วยความตั้งใจ ข้อกำหนดพินัยกรรมนั้นเป็นอันเพิกถอนไป วิธีเดียวกันนี้ให้ใช้บังคับ เมื่อผู้ทำพินัยกรรมได้ทำลายทรัพย์สินนั้นด้วยความตั้งใจ"], "ป.พ.พ.|1383": ["", "ทรัพย์สินอันได้มาโดยการกระทำผิดนั้น ท่านว่าผู้กระทำผิดหรือผู้รับโอนไม่สุจริตจะได้กรรมสิทธิ์โดยอายุความก็แต่เมื่อพ้นกำหนดอายุความอาญา หรือพ้นเวลาที่กำหนดไว้ในมาตราก่อน ถ้ากำหนดไหนยาวกว่า ท่านให้ใช้กำหนดนั้น"], "ป.พ.พ.|1470": ["", "ทรัพย์สินระหว่างคู่สมรส นอกจากที่ได้แยกไว้เป็นสินส่วนตัวย่อมเป็นสินสมรส"], "ป.พ.พ.|1457": ["", "การสมรสตามประมวลกฎหมายนี้จะมีได้เฉพาะเมื่อได้จดทะเบียนแล้วเท่านั้น"], "ป.พ.พ.|1439": ["", "เมื่อมีการหมั้นแล้ว ถ้าฝ่ายใดผิดสัญญาหมั้นอีกฝ่ายหนึ่งมีสิทธิเรียกให้รับผิดใช้ค่าทดแทน ในกรณีที่ฝ่ายผู้รับหมั้นเป็นฝ่ายผิดสัญญาหมั้นให้คืนของหมั้นแก่ฝ่ายผู้หมั้นด้วย"], "ป.พ.พ.|1060": ["", "ในกรณีอย่างใดอย่างหนึ่งซึ่งกล่าวไว้ในมาตรา 1055 อนุมาตรา 4 หรือ อนุมาตรา 5 นั้น ถ้าผู้เป็นหุ้นส่วนที่ยังอยู่รับซื้อหุ้นของผู้ที่ออกจากหุ้นส่วนไปไซร้ ท่านว่าสัญญาหุ้นส่วนนั้นก็ยังคงใช้ได้ต่อไปในระหว่างผู้เป็นหุ้นส่วนที่ยังอยู่ด้วยกัน"], "ป.พ.พ.|1448": ["", "การสมรสจะกระทำได้ต่อเมื่อบุคคลทั้งสองฝ่ายมีอายุสิบแปดปีบริบูรณ์แล้ว แต่ในกรณีมีเหตุอันสมควร ศาลอาจอนุญาตให้ทำการสมรสก่อนนั้นได้"], "ป.พ.พ.|446": ["", "ในกรณีทำให้เขาเสียหายแก่ร่างกายหรืออนามัยก็ดี ในกรณีทำให้เขาเสียเสรีภาพก็ดี ผู้ต้องเสียหายจะเรียกร้องเอาค่าสินไหมทดแทนเพื่อความที่เสียหายอย่างอื่นอันมิใช่ตัวเงินด้วยอีกก็ได้ สิทธิเรียกร้องอันนี้ไม่โอนกันได้ และไม่ตกสืบไปถึงทายาท เว้นแต่สิทธินั้นจะได้รับสภาพกันไว้โดยสัญญาหรือได้เริ่มฟ้องคดีตามสิทธินั้นแล้ว อนึ่ง หญิงที่ต้องเสียหายเพราะผู้ใดทำผิดอาญาเป็นทุรศีลธรรมแก่ตนก็ย่อมมีสิทธิเรียกร้องทำนองเดียวกันนี้"], "ป.พ.พ.|734": ["", "ถ้าจำนองทรัพย์สินหลายสิ่งเพื่อประกันหนี้แต่รายหนึ่งรายเดียวและมิได้ระบุลำดับไว้ไซร้ ท่านว่าผู้รับจำนองจะใช้สิทธิของตนบังคับแก่ทรัพย์สินนั้น ๆ ทั้งหมดหรือแต่เพียงบางสิ่งก็ได้ แต่ท่านห้ามมิให้ทำเช่นนั้นแก่ทรัพย์สินมากสิ่งกว่าที่จำเป็นเพื่อใช้หนี้ตามสิทธิแห่งตน ถ้าผู้รับจำนองใช้สิทธิของตนบังคับแก่ทรัพย์สินทั้งหมดพร้อมกัน ท่านให้แบ่งภาระแห่งหนี้นั้นกระจายไปตามส่วนราคาแห่งทรัพย์สินนั้น ๆ เว้นแต่ในกรณีที่ได้ระบุจำนวนเงินจำนองไว้เฉพาะทรัพย์สินแต่ละสิ่ง ๆ เป็นจำนวนเท่าใด ท่านให้แบ่งกระจายไปตามจำนวนเงินจำนองที่ระบุไว้เฉพาะทรัพย์สิ่งนั้น ๆ แต่ถ้าผู้รับจำนองใช้สิทธิของตนบังคับแก่ทรัพย์สินอันใดอันหนึ่งแต่เพียงสิ่งเดียวไซร้ ผู้รับจำนองจะให้ชำระหนี้อันเป็นส่วนของตนทั้งหมดจากทรัพย์สินอันนั้นก็ได้ ในกรณีเช่นนั้น ท่านให้ถือว่าผู้รับจำนองคนถัดไปโดยลำดับย่อมเข้ารับช่วงสิทธิของผู้รับจำนองคนก่อนและจะเข้าบังคับจำนองแทนที่คนก่อนก็ได้แต่เพียงเท่าจำนวนซึ่งผู้รับจำนองคนก่อนจะพึงได้รับจากทรัพย์สินอื่น ๆ ตามบทบัญญัติดังกล่าวมาในวรรคก่อนนั้น"], "ป.พ.พ.|425": ["", "นายจ้างต้องร่วมกันรับผิดกับลูกจ้างในผลแห่งละเมิดซึ่งลูกจ้างได้กระทำไปในทางการที่จ้างนั้น"], "ป.พ.พ.|207": ["", "ถ้าลูกหนี้ขอปฏิบัติการชำระหนี้ และเจ้าหนี้ไม่รับชำระหนี้นั้นโดยปราศจากมูลเหตุอันจะอ้างกฎหมายได้ไซร้ ท่านว่าเจ้าหนี้ตกเป็นผู้ผิดนัด"], "ป.พ.พ.|1442": ["", "ในกรณีมีเหตุสำคัญอันเกิดแก่ผู้รับหมั้นทำให้ผู้หมั้นไม่สมควรสมรสกับผู้รับหมั้นนั้น ผู้หมั้นมีสิทธิบอกเลิกสัญญาหมั้นได้และให้ผู้รับหมั้นคืนของหมั้นแก่ผู้หมั้น"], "ป.พ.พ.|1599": ["", "เมื่อบุคคลใดตาย มรดกของบุคคลนั้นตกทอดแก่ทายาท ทายาทอาจเสียไปซึ่งสิทธิในมรดกได้แต่โดยบทบัญญัติแห่งประมวลกฎหมายนี้หรือกฎหมายอื่น"], "ป.พ.พ.|1494": ["", "การสมรสจะเป็นโมฆะก็แต่เฉพาะที่บัญญัติไว้ในหมวดนี้"], "ป.พ.พ.|532": ["", "ทายาทของผู้ให้อาจเรียกให้ถอนคืนการให้ได้แต่เฉพาะในเหตุที่ผู้รับได้ฆ่าผู้ให้ตายโดยเจตนาและไม่ชอบด้วยกฎหมาย หรือได้กีดกันผู้ให้ไว้มิให้ถอนคืนการให้ แต่ว่าผู้ให้ได้ฟ้องคดีไว้แล้วอย่างใดโดยชอบ ทายาทของผู้ให้จะว่าคดีอันนั้นต่อไปก็ได้"], "ป.พ.พ.|238": ["", "การเพิกถอนดังกล่าวมาในบทมาตราก่อนนั้นไม่อาจกระทบกระทั่งถึงสิทธิของบุคคลภายนอกอันได้มาโดยสุจริตก่อนเริ่มฟ้องคดีขอเพิกถอน อนึ่ง ความที่กล่าวมาในวรรคก่อนนี้ ท่านมิให้ใช้บังคับ ถ้าสิทธินั้นได้มาโดยเสน่หา"], "ป.พ.พ.|897": ["", "ถ้าผู้เอาประกันภัยได้เอาประกันภัยไว้โดยกำหนดว่า เมื่อตนถึงซึ่งความมรณะให้ใช้เงินแก่ทายาททั้งหลายของตนโดยมิได้เจาะจงระบุชื่อผู้หนึ่งผู้ใดไว้ไซร้ จำนวนเงินอันจะพึงใช้นั้นท่านให้ฟังเอาเป็นสินทรัพย์ส่วนหนึ่งแห่งกองมรดกของผู้เอาประกันภัย ซึ่งเจ้าหนี้จะเอาใช้หนี้ได้ ถ้าได้เอาประกันภัยไว้โดยกำหนดว่าให้ใช้เงินแก่บุคคลคนใดคนหนึ่งโดยเฉพาะเจาะจง ท่านว่าเฉพาะแต่จำนวนเงินเบี้ยประกันภัยซึ่งผู้เอาประกันภัยได้ส่งไปแล้วเท่านั้นจักเป็นสินทรัพย์ส่วนหนึ่งแห่งกองมรดกของผู้เอาประกันภัยอันเจ้าหนี้จะเอาใช้หนี้ได้"], "ป.พ.พ.|410": ["", "บุคคลผู้ใดได้ทำการชำระหนี้โดยมุ่งต่อผลอย่างหนึ่ง แต่มิได้เกิดผลขึ้นเช่นนั้น ถ้าและบุคคลนั้นได้รู้มาแต่แรกว่าการที่จะเกิดผลนั้นเป็นพ้นวิสัยก็ดี หรือได้เข้าป้องปัดขัดขวางเสียมิให้เกิดผลเช่นนั้นโดยอาการอันฝ่าฝืนความสุจริตก็ดี ท่านว่าบุคคลผู้นั้นไม่มีสิทธิจะได้รับคืนทรัพย์"], "ป.พ.พ.|1400": ["", "ถ้าภาระจำยอมหมดประโยชน์แก่สามยทรัพย์ไซร้ ท่านว่าภาระจำยอมนั้นสิ้นไป แต่ถ้าความเป็นไปมีทางให้กลับใช้ภาระจำยอมได้ไซร้ ท่านว่าภาระจำยอมนั้นกลับมีขึ้นอีก แต่ต้องยังไม่พ้นอายุความที่ระบุไว้ในมาตราก่อน ถ้าภาระจำยอมยังเป็นประโยชน์แก่สามยทรัพย์อยู่บ้าง แต่เมื่อเทียบกับภาระอันตกอยู่แก่ภารยทรัพย์แล้ว ประโยชน์นั้นน้อยนักไซร้ ท่านว่าเจ้าของภารยทรัพย์จะขอให้พ้นจากภาระจำยอมทั้งหมด หรือแต่บางส่วนก็ได้ แต่ต้องใช้ค่าทดแทน"], "ป.พ.พ.|853": ["", "อันการพนันหรือขันต่อนั้น ท่านว่าหาก่อให้เกิดหนี้ไม่ สิ่งที่ได้ให้กันไปในการพนันหรือขันต่อก็จะทวงคืนไม่ได้ เพราะเหตุหามูลหนี้อย่างหนึ่งอย่างใดมิได้ ข้อบัญญัติที่กล่าวนี้ ท่านให้ใช้ตลอดถึงข้อตกลงเป็นมูลหนี้อย่างหนึ่งอย่างใดอันฝ่ายข้างเสียพนันขันต่อหากทำให้แก่อีกฝ่ายหนึ่งเพื่อจะใช้หนี้เงินพนันหรือขันต่อนั้นด้วย"], "ป.พ.พ.|656": ["", "ถ้าทำสัญญากู้ยืมเงินกัน และผู้กู้ยืมยอมรับเอาสิ่งของหรือทรัพย์สินอย่างอื่นแทนจำนวนเงินนั้นไซร้ ท่านให้คิดเป็นหนี้ค้างชำระโดยจำนวนเท่ากับราคาท้องตลาดแห่งสิ่งของหรือทรัพย์สินนั้นในเวลาและ ณ สถานที่ส่งมอบ ถ้าทำสัญญากู้ยืมเงินกัน และผู้ให้กู้ยืมยอมรับเอาสิ่งของหรือทรัพย์สินอย่างอื่นเป็นการชำระหนี้แทนเงินที่กู้ยืมไซร้ หนี้อันระงับไปเพราะการชำระเช่นนั้น ท่านให้คิดเป็นจำนวนเท่ากับราคาท้องตลาดแห่งสิ่งของหรือทรัพย์สินนั้นในเวลาและ ณ สถานที่ส่งมอบ ความตกลงกันอย่างใด ๆ ขัดกับข้อความดังกล่าวมานี้ท่านว่าเป็นโมฆะ"], "ป.พ.พ.|1748": ["", "ทายาทคนใดครอบครองทรัพย์มรดกซึ่งยังมิได้แบ่งกัน ทายาทคนนั้นมีสิทธิที่จะเรียกร้องให้แบ่งทรัพย์มรดกนั้นได้ แม้ว่าจะล่วงพ้นกำหนดอายุความตามมาตรา 1754 แล้วก็ดี สิทธิที่จะเรียกให้แบ่งทรัพย์มรดกตามวรรคก่อน จะตัดโดยนิติกรรมเกินคราวละสิบปีไม่ได้"], "ป.พ.พ.|1388": ["", "เจ้าของสามยทรัพย์ไม่มีสิทธิทำการเปลี่ยนแปลงในภารยทรัพย์หรือในสามยทรัพย์ซึ่งทำให้เกิดภาระเพิ่มขึ้นแก่ภารยทรัพย์"], "ป.พ.พ.|1508": ["", "การสมรสที่เป็นโมฆียะเพราะคู่สมรสสำคัญผิดตัวหรือถูกกลฉ้อฉลหรือถูกข่มขู่ เฉพาะแต่คู่สมรสที่สำคัญผิดตัวหรือถูกกลฉ้อฉล หรือถูกข่มขู่เท่านั้นขอเพิกถอนการสมรสได้ ในกรณีที่ผู้มีสิทธิขอเพิกถอนการสมรสเป็นบุคคลที่ถูกศาลสั่งให้เป็นคนไร้ความสามารถ ให้บุคคลซึ่งอาจร้องขอต่อศาลให้สั่งให้บุคคลวิกลจริตเป็นคนไร้ความสามารถตามมาตรา 28 ขอเพิกถอนการสมรสได้ด้วย แต่ถ้าผู้มีสิทธิขอเพิกถอนการสมรสเป็นคนวิกลจริตที่ศาลยังไม่ได้สั่งให้เป็นคนไร้ความสามารถ บุคคลดังกล่าวจะร้องขอเพิกถอนการสมรสก็ได้ แต่ต้องขอให้ศาลสั่งให้คนวิกลจริตเป็นคนไร้ความสามารถพร้อมกันด้วย ในกรณีที่ศาลมีคำสั่งให้ยกคำขอให้ศาลสั่งเป็นคนไร้ความสามารถ ก็ให้ศาลมีคำสั่งยกคำขอเพิกถอนการสมรสของบุคคลดังกล่าวนั้นเสียด้วย คำสั่งศาลให้ยกคำขอเพิกถอนการสมรสของบุคคลตามวรรคสองไม่กระทบกระเทือนสิทธิการขอเพิกถอนการสมรสของคู่สมรส แต่คู่สมรสจะต้องใช้สิทธินั้นภายในกำหนดระยะเวลาที่คู่สมรสมีอยู่ ถ้าระยะเวลาดังกล่าวเหลืออยู่ไม่ถึงหกเดือนนับแต่วันที่ศาลมีคำสั่งให้ยกคำขอเพิกถอนการสมรสของบุคคลดังกล่าวหรือไม่มีเหลืออยู่เลย ก็ให้ขยายระยะเวลานั้นออกไปได้ให้ครบหกเดือนหรืออีกหกเดือนนับแต่วันที่ศาลมีคำสั่งให้ยกคำขอเพิกถอนการสมรสของบุคคลดังกล่าว แล้วแต่กรณี"], "ป.พ.พ.|618": ["", "ถ้าของนั้นได้ส่งไปโดยมีผู้ขนส่งหลายคนหลายทอด ท่านว่าผู้ขนส่งทั้งนั้นจะต้องรับผิดร่วมกันในการสูญหาย บุบสลาย หรือส่งชักช้า"], "ป.พ.พ.|718": ["", "จำนองย่อมครอบไปถึงทรัพย์ทั้งปวงอันติดพันอยู่กับทรัพย์สินซึ่งจำนอง แต่ต้องอยู่ภายในบังคับซึ่งท่านจำกัดไว้ในสามมาตราต่อไปนี้"], "ป.พ.พ.|1377": ["", "ถ้าผู้ครอบครองสละเจตนาครอบครองหรือไม่ยึดถือทรัพย์สินต่อไปไซร้ การครอบครองย่อมสุดสิ้นลง ถ้าเหตุอันมีสภาพเป็นเหตุชั่วคราวมีมาขัดขวางมิให้ผู้ครอบครองยึดถือทรัพย์สินไซร้ ท่านว่าการครอบครองไม่สุดสิ้นลง"], "ป.พ.พ.|1305": ["", "ทรัพย์สินซึ่งเป็นสาธารณสมบัติของแผ่นดินนั้นจะโอนแก่กันมิได้ เว้นแต่อาศัยอำนาจแห่งบทกฎหมายเฉพาะหรือพระราชกฤษฎีกา"], "ป.พ.พ.|143": ["", "ทรัพย์นอกพาณิชย์ หมายความว่า ทรัพย์ที่ไม่สามารถถือเอาได้และทรัพย์ที่โอนแก่กันมิได้โดยชอบด้วยกฎหมาย"], "ป.พ.พ.|648": ["", "อันการยืมใช้คงรูป ย่อมระงับสิ้นไปด้วยมรณะแห่งผู้ยืม"], "ป.พ.พ.|898": ["", "อันตั๋วเงินตามความหมายแห่งประมวลกฎหมายนี้มีสามประเภท ประเภทหนึ่ง คือตั๋วแลกเงิน ประเภทหนึ่ง คือตั๋วสัญญาใช้เงิน ประเภทหนึ่ง คือเช็ค"], "ป.พ.พ.|567": ["", "ถ้าทรัพย์สินซึ่งให้เช่าสูญหายไปทั้งหมดไซร้ ท่านว่าสัญญาเช่าก็ย่อมระงับไปด้วย"], "ป.พ.พ.|601": ["", "ท่านห้ามมิให้ฟ้องผู้รับจ้างเมื่อพ้นปีหนึ่งนับแต่วันการชำรุดบกพร่องได้ปรากฏขึ้น"], "ป.พ.พ.|316": ["", "ถ้าการชำระหนี้นั้นได้ทำให้แก่ผู้ครองตามปรากฏแห่งสิทธิในมูลหนี้ ท่านว่าการชำระหนี้นั้นจะสมบูรณ์ก็แต่เมื่อบุคคลผู้ชำระหนี้ได้กระทำการโดยสุจริต"], "ป.พ.พ.|144": ["", "ส่วนควบของทรัพย์ หมายความว่า ส่วนซึ่งโดยสภาพแห่งทรัพย์หรือโดยจารีตประเพณีแห่งท้องถิ่นเป็นสาระสำคัญในความเป็นอยู่ของทรัพย์นั้น และไม่อาจแยกจากกันได้นอกจากจะทำลาย ทำให้บุบสลาย หรือทำให้ทรัพย์นั้นเปลี่ยนแปลงรูปทรงหรือสภาพไป เจ้าของทรัพย์ย่อมมีกรรมสิทธิ์ในส่วนควบของทรัพย์นั้น"], "ป.พ.พ.|1454": ["", "ผู้เยาว์จะทำการสมรสให้นำความในมาตรา 1436 มาใช้บังคับโดยอนุโลม"], "ป.พ.พ.|544": ["", "ทรัพย์สินซึ่งเช่านั้น ผู้เช่าจะให้เช่าช่วงหรือโอนสิทธิของตนอันมีในทรัพย์สินนั้นไม่ว่าทั้งหมดหรือแต่บางส่วนให้แก่บุคคลภายนอก ท่านว่าหาอาจทำได้ไม่ เว้นแต่จะได้ตกลงกันไว้เป็นอย่างอื่นในสัญญาเช่า ถ้าผู้เช่าประพฤติฝ่าฝืนบทบัญญัติอันนี้ ผู้ให้เช่าจะบอกเลิกสัญญาเสียก็ได้"], "ป.พ.พ.|437": ["", "บุคคลใดครอบครองหรือควบคุมดูแลยานพาหนะอย่างใด ๆ อันเดินด้วยกำลังเครื่องจักรกล บุคคลนั้นจะต้องรับผิดชอบเพื่อการเสียหายอันเกิดแต่ยานพาหนะนั้น เว้นแต่จะพิสูจน์ได้ว่าการเสียหายนั้นเกิดแต่เหตุสุดวิสัย หรือเกิดเพราะความผิดของผู้ต้องเสียหายนั้นเอง ความข้อนี้ให้ใช้บังคับได้ตลอดถึงบุคคลผู้มีไว้ในครอบครองของตนซึ่งทรัพย์อันเป็นของเกิดอันตรายได้โดยสภาพ หรือโดยความมุ่งหมายที่จะใช้ หรือโดยอาการกลไกของทรัพย์นั้นด้วย"], "ป.พ.พ.|461": ["", "ผู้ขายจำต้องส่งมอบทรัพย์สินซึ่งขายนั้นให้แก่ผู้ซื้อ"], "ป.พ.พ.|1449": ["", "การสมรสจะกระทำมิได้ถ้าบุคคลใดบุคคลหนึ่งเป็นบุคคลวิกลจริตหรือเป็นบุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถ"], "ป.พ.พ.|444": ["", "ในกรณีทำให้เสียหายแก่ร่างกายหรืออนามัยนั้น ผู้ต้องเสียหายชอบที่จะได้ชดใช้ค่าใช้จ่ายอันตนต้องเสียไป และค่าเสียหายเพื่อการที่เสียความสามารถประกอบการงานสิ้นเชิงหรือแต่บางส่วน ทั้งในเวลาปัจจุบันนั้นและในเวลาอนาคตด้วย ถ้าในเวลาที่พิพากษาคดี เป็นพ้นวิสัยจะหยั่งรู้ได้แน่ว่าความเสียหายนั้นได้มีแท้จริงเพียงใด ศาลจะกล่าวในคำพิพากษาว่ายังสงวนไว้ซึ่งสิทธิที่จะแก้ไขคำพิพากษานั้นอีกภายในระยะเวลาไม่เกินสองปีก็ได้"], "ป.พ.พ.|574": ["", "ในกรณีผิดนัดไม่ใช้เงินสองคราวติด ๆ กัน หรือกระทำผิดสัญญาในข้อที่เป็นส่วนสำคัญ เจ้าของทรัพย์สินจะบอกเลิกสัญญาเสียก็ได้ ถ้าเช่นนั้นบรรดาเงินที่ได้ใช้มาแล้วแต่ก่อน ให้ริบเป็นของเจ้าของทรัพย์สิน และเจ้าของทรัพย์สินชอบที่จะกลับเข้าครองทรัพย์สินนั้นได้ด้วย อนึ่ง ในกรณีกระทำผิดสัญญาเพราะผิดนัดไม่ใช้เงินซึ่งเป็นคราวที่สุดนั้น ท่านว่าเจ้าของทรัพย์สินชอบที่จะริบบรรดาเงินที่ได้ใช้มาแล้วแต่ก่อนและกลับเข้าครองทรัพย์สินได้ต่อเมื่อระยะเวลาใช้เงินได้พ้นกำหนดไปอีกงวดหนึ่ง"], "ป.พ.พ.|1497": ["", "การสมรสที่เป็นโมฆะ เพราะฝ่าฝืนมาตรา 1452 บุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งจะกล่าวอ้างขึ้น หรือจะร้องขอให้ศาลพิพากษาว่าการสมรสเป็นโมฆะก็ได้"], "ป.พ.พ.|616": ["", "ผู้ขนส่งจะต้องรับผิดในการที่ของอันเขาได้มอบหมายแก่ตนนั้นสูญหายหรือบุบสลายหรือส่งมอบชักช้า เว้นแต่จะพิสูจน์ได้ว่าการสูญหายหรือบุบสลายหรือชักช้านั้นเกิดแต่เหตุสุดวิสัย หรือเกิดแต่สภาพแห่งของนั้นเอง หรือเกิดเพราะความผิดของผู้ส่งหรือผู้รับตราส่ง"], "ป.พ.พ.|1055": ["", "ห้างหุ้นส่วนสามัญย่อมเลิกกันด้วยเหตุดังกล่าวต่อไปนี้ (1) ถ้าในสัญญาทำไว้มีกำหนดกรณีอันใดเป็นเหตุที่จะเลิกกัน เมื่อมีกรณีนั้น (2) ถ้าสัญญาทำไว้เฉพาะกำหนดกาลใด เมื่อสิ้นกำหนดกาลนั้น (3) ถ้าสัญญาทำไว้เฉพาะเพื่อทำกิจการอย่างหนึ่งอย่างใดแต่อย่างเดียว เมื่อเสร็จการนั้น (4) เมื่อผู้เป็นหุ้นส่วนคนใดคนหนึ่งให้คำบอกกล่าวแก่ผู้เป็นหุ้นส่วนคนอื่น ๆ ตามกำหนดดังบัญญัติไว้ในมาตรา 1056 (5) เมื่อผู้เป็นหุ้นส่วนคนใดคนหนึ่งตาย หรือล้มละลาย หรือตกเป็นผู้ไร้ความสามารถ"], "ป.พ.พ.|808": ["", "ตัวแทนต้องทำการด้วยตนเอง เว้นแต่จะมีอำนาจใช้ตัวแทนช่วงทำการได้"], "ป.พ.พ.|1693": ["", "ผู้ทำพินัยกรรมจะเพิกถอนพินัยกรรมของตนเสียทั้งหมด หรือแต่บางส่วนในเวลาใดก็ได้"], "ป.พ.พ.|1653": ["", "ผู้เขียน หรือพยานในพินัยกรรมจะเป็นผู้รับทรัพย์ตามพินัยกรรมนั้นไม่ได้ ให้ใช้บทบัญญัติในวรรคก่อนบังคับแก่คู่สมรสของผู้เขียนหรือพยานในพินัยกรรมด้วย พนักงานเจ้าหน้าที่ซึ่งได้จดข้อความแห่งพินัยกรรมที่พยานนำมาแจ้งตามมาตรา 1663 ให้ถือว่าเป็นผู้เขียนพินัยกรรมตามความหมายแห่งมาตรานี้"], "ป.พ.พ.|386": ["", "ถ้าคู่สัญญาฝ่ายหนึ่งมีสิทธิเลิกสัญญาโดยข้อสัญญาหรือโดยบทบัญญัติแห่งกฎหมาย การเลิกสัญญาเช่นนั้นย่อมทำด้วยแสดงเจตนาแก่อีกฝ่ายหนึ่ง แสดงเจตนาดังกล่าวมาในวรรคก่อนนั้น ท่านว่าหาอาจจะถอนได้ไม่"], "ป.พ.พ.|695": ["", "ผู้ค้ำประกันซึ่งละเลยไม่ยกข้อต่อสู้ของลูกหนี้ขึ้นต่อสู้เจ้าหนี้นั้น ท่านว่าย่อมสิ้นสิทธิที่จะไล่เบี้ยเอาแก่ลูกหนี้เพียงเท่าที่ไม่ยกขึ้นเป็นข้อต่อสู้ เว้นแต่จะพิสูจน์ได้ว่าตนมิได้รู้ว่ามีข้อต่อสู้เช่นนั้น และที่ไม่รู้นั้นมิได้เป็นเพราะความผิดของตนด้วย"], "ป.พ.พ.|1574": ["", "นิติกรรมใดอันเกี่ยวกับทรัพย์สินของผู้เยาว์ดังต่อไปนี้ ผู้ใช้อำนาจปกครองจะกระทำมิได้ เว้นแต่ศาลจะอนุญาต (1) ขาย แลกเปลี่ยน ขายฝาก ให้เช่าซื้อ จำนอง ปลดจำนอง หรือโอนสิทธิจำนอง ซึ่งอสังหาริมทรัพย์หรือสังหาริมทรัพย์ที่อาจจำนองได้ (2) กระทำให้สุดสิ้นลงทั้งหมดหรือบางส่วน ซึ่งทรัพยสิทธิของผู้เยาว์อันเกี่ยวกับอสังหาริมทรัพย์ (3) ก่อตั้งภาระจำยอม สิทธิอาศัย สิทธิเหนือพื้นดิน สิทธิเก็บกิน ภาระติดพันในอสังหาริมทรัพย์ หรือทรัพยสิทธิอื่นใดในอสังหาริมทรัพย์ (4) จำหน่ายไปทั้งหมดหรือบางส่วนซึ่งสิทธิเรียกร้องที่จะให้ได้มาซึ่งทรัพยสิทธิในอสังหาริมทรัพย์ หรือสังหาริมทรัพย์ที่อาจจำนองได้ หรือสิทธิเรียกร้องที่จะให้ทรัพย์สินเช่นว่านั้นของผู้เยาว์ปลอดจากทรัพยสิทธิที่มีอยู่เหนือทรัพย์สินนั้น (5) ให้เช่าอสังหาริมทรัพย์เกินสามปี (6) ก่อข้อผูกพันใด ๆ ที่มุ่งให้เกิดผลตาม (1) (2) หรือ (3) (7) ให้กู้ยืมเงิน (8) ให้โดยเสน่หา เว้นแต่จะเอาเงินได้ของผู้เยาว์ให้แทนผู้เยาว์เพื่อการกุศลสาธารณะ เพื่อการสังคม หรือตามหน้าที่ธรรมจรรยา ทั้งนี้ พอสมควรแก่ฐานานุรูปของผู้เยาว์ (9) รับการให้โดยเสน่หาที่มีเงื่อนไขหรือค่าภาระติดพัน หรือไม่รับการให้โดยเสน่หา (10) ประกันโดยประการใด ๆ อันอาจมีผลให้ผู้เยาว์ต้องถูกบังคับชำระหนี้หรือทำนิติกรรมอื่นที่มีผลให้ผู้เยาว์ต้องรับเป็นผู้รับชำระหนี้ของบุคคลอื่นหรือแทนบุคคลอื่น (11) นำทรัพย์สินไปแสวงหาผลประโยชน์นอกจากในกรณีที่บัญญัติไว้ในมาตรา 1598/4 (1) (2) หรือ (3) (12) ประนีประนอมยอมความ (13) มอบข้อพิพาทให้อนุญาโตตุลาการวินิจฉัย"], "ป.พ.พ.|428": ["", "ผู้ว่าจ้างทำของไม่ต้องรับผิดเพื่อความเสียหายอันผู้รับจ้างได้ก่อให้เกิดขึ้นแก่บุคคลภายนอกในระหว่างทำการงานที่ว่าจ้าง เว้นแต่ผู้ว่าจ้างจะเป็นผู้ผิดในส่วนการงานที่สั่งให้ทำ หรือในคำสั่งที่ตนให้ไว้ หรือในการเลือกหาผู้รับจ้าง"], "ป.พ.พ.|472": ["", "ในกรณีที่ทรัพย์สินซึ่งขายนั้นชำรุดบกพร่องอย่างหนึ่งอย่างใด อันเป็นเหตุให้เสื่อมราคาหรือเสื่อมความเหมาะสมแก่ประโยชน์อันมุ่งจะใช้เป็นปกติก็ดี ประโยชน์ที่มุ่งหมายโดยสัญญาก็ดี ท่านว่าผู้ขายต้องรับผิด ความที่กล่าวมาในมาตรานี้ย่อมใช้ได้ ทั้งที่ผู้ขายรู้อยู่แล้วหรือไม่รู้ว่าความชำรุดบกพร่องมีอยู่"], "ป.พ.พ.|823": ["", "ถ้าตัวแทนกระทำการอันใดอันหนึ่งโดยปราศจากอำนาจก็ดี หรือทำนอกทำเหนือขอบอำนาจก็ดี ท่านว่าย่อมไม่ผูกพันตัวการ เว้นแต่ตัวการจะให้สัตยาบันแก่การนั้น ถ้าตัวการไม่ให้สัตยาบัน ท่านว่าตัวแทนย่อมต้องรับผิดต่อบุคคลภายนอกโดยลำพังตนเอง เว้นแต่จะพิสูจน์ได้ว่าบุคคลภายนอกนั้นได้รู้อยู่ว่าตนทำการโดยปราศจากอำนาจหรือทำนอกเหนือขอบอำนาจ"], "ป.พ.พ.|434": ["", "ถ้าความเสียหายเกิดขึ้นเพราะเหตุที่โรงเรือน หรือสิ่งปลูกสร้างอย่างอื่นก่อสร้างไว้ชำรุดบกพร่องก็ดี หรือบำรุงรักษาไม่เพียงพอก็ดี ท่านว่าผู้ครองโรงเรือนหรือสิ่งปลูกสร้างนั้น ๆ จำต้องใช้ค่าสินไหมทดแทน แต่ถ้าผู้ครองได้ใช้ความระมัดระวังตามสมควรเพื่อปัดป้องมิให้เกิดเสียหายฉะนั้นแล้ว ท่านว่าผู้เป็นเจ้าของจำต้องใช้ค่าสินไหมทดแทน บทบัญญัติที่กล่าวมาในวรรคก่อนนั้นให้ใช้บังคับได้ตลอดถึงความบกพร่องในการปลูกหรือค้ำจุนต้นไม้หรือกอไผ่ด้วย ในกรณีที่กล่าวมาในสองวรรคข้างต้นนั้น ถ้ายังมีผู้อื่นอีกที่ต้องรับผิดชอบในการก่อให้เกิดเสียหายนั้นด้วยไซร้ ท่านว่าผู้ครองหรือเจ้าของจะใช้สิทธิไล่เบี้ยเอาแก่ผู้นั้นก็ได้"], "ป.พ.พ.|1737": ["", "เจ้าหนี้กองมรดกจะบังคับสิทธิเรียกร้องต่อทายาทคนใดก็ได้ แต่ถ้ามีผู้จัดการมรดก ให้เจ้าหนี้เรียกเข้ามาในคดีด้วย"], "ป.พ.พ.|653": ["", "การกู้ยืมเงินกว่าสองพันบาทขึ้นไปนั้น ถ้ามิได้มีหลักฐานแห่งการกู้ยืมเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อผู้ยืมเป็นสำคัญ จะฟ้องร้องให้บังคับคดีหาได้ไม่ ในการกู้ยืมเงินมีหลักฐานเป็นหนังสือนั้น ท่านว่าจะนำสืบการใช้เงินได้ต่อเมื่อมีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อผู้ให้ยืมมาแสดง หรือเอกสารอันเป็นหลักฐานแห่งการกู้ยืมนั้นได้เวนคืนแล้ว หรือได้แทงเพิกถอนลงในเอกสารนั้นแล้ว"], "ป.พ.พ.|28": ["", "บุคคลวิกลจริตผู้ใด ถ้าคู่สมรสก็ดี ผู้บุพการีกล่าวคือ บิดา มารดา ปู่ย่า ตายาย ทวดก็ดี ผู้สืบสันดานกล่าวคือ ลูก หลาน เหลน ลื่อก็ดี ผู้ปกครองหรือผู้พิทักษ์ก็ดี ผู้ซึ่งปกครองดูแลบุคคลนั้นอยู่ก็ดี หรือพนักงานอัยการก็ดี ร้องขอต่อศาลให้สั่งให้บุคคลวิกลจริตผู้นั้นเป็นคนไร้ความสามารถ ศาลจะสั่งให้บุคคลวิกลจริตผู้นั้นเป็นคนไร้ความสามารถก็ได้ บุคคลซึ่งศาลได้สั่งให้เป็นคนไร้ความสามารถตามวรรคหนึ่ง ต้องจัดให้อยู่ในความอนุบาล การแต่งตั้งผู้อนุบาล อำนาจหน้าที่ของผู้อนุบาล และการสิ้นสุดของความเป็นผู้อนุบาล ให้เป็นไปตามบทบัญญัติบรรพ 5 แห่งประมวลกฎหมายนี้ คำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา"], "ป.พ.พ.|1504": ["", "การสมรสที่เป็นโมฆียะเพราะฝ่าฝืนมาตรา 1448 ผู้มีส่วนได้เสียขอให้เพิกถอนการสมรสได้ แต่บิดามารดาหรือผู้ปกครองที่ให้ความยินยอมแล้วจะขอให้เพิกถอนการสมรสไม่ได้ ถ้าศาลมิได้สั่งให้เพิกถอนการสมรสจนบุคคลทั้งสองมีอายุครบตามมาตรา 1448 หรือในกรณีการสมรสระหว่างชายหญิง เมื่อหญิงมีครรภ์ก่อนอายุครบตามมาตรา 1448 ให้ถือว่าการสมรสสมบูรณ์มาตั้งแต่เวลาสมรส"], "ป.พ.พ.|913": ["", "อันวันถึงกำหนดของตั๋วแลกเงินนั้น ท่านว่าย่อมเป็นอย่างใดอย่างหนึ่งดังกล่าวต่อไปนี้ คือ (1) ในวันใดวันหนึ่งที่กำหนดไว้ หรือ (2) เมื่อสิ้นระยะเวลาอันกำหนดไว้นับแต่วันที่ลงในตั๋วนั้น หรือ (3) เมื่อทวงถาม หรือเมื่อได้เห็น หรือ (4) เมื่อสิ้นระยะเวลาอันกำหนดไว้นับแต่ได้เห็น"], "ป.พ.พ.|1453": ["", "หญิงที่ชายผู้เป็นคู่สมรสตายหรือที่การสมรสสิ้นสุดลงด้วยประการอื่นจะทำการสมรสใหม่กับชายได้ต่อเมื่อการสิ้นสุดแห่งการสมรสได้ผ่านพ้นไปแล้วไม่น้อยกว่าสามร้อยสิบวัน เว้นแต่ (1) คลอดบุตรแล้วในระหว่างนั้น (2) สมรสกับคู่สมรสเดิม (3) มีใบรับรองแพทย์ประกาศนียบัตรหรือปริญญาซึ่งเป็นผู้ประกอบการรักษาโรคในสาขาเวชกรรมได้ตามกฎหมายว่ามิได้มีครรภ์ หรือ (4) มีคำสั่งของศาลให้สมรสได้"], "ป.พ.พ.|372": ["", "นอกจากกรณีที่กล่าวไว้ในสองมาตราก่อน ถ้าการชำระหนี้ตกเป็นพ้นวิสัยเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษฝ่ายหนึ่งฝ่ายใดก็ไม่ได้ไซร้ ท่านว่าลูกหนี้หามีสิทธิจะรับชำระหนี้ตอบแทนไม่ ถ้าการชำระหนี้ตกเป็นพ้นวิสัยเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษเจ้าหนี้ได้ ลูกหนี้ก็หาเสียสิทธิที่จะรับชำระหนี้ตอบแทนไม่ แต่ว่าลูกหนี้ได้อะไรไว้เพราะการปลดหนี้ก็ดี หรือใช้คุณวุฒิความสามารถของตนเป็นประการอื่นเป็นเหตุให้ได้อะไรมา หรือแกล้งละเลยเสียไม่ขวนขวายเอาอะไรที่สามารถจะทำได้ก็ดี มากน้อยเท่าไร จะต้องเอามาหักกับจำนวนอันตนจะได้รับชำระหนี้ตอบแทน วิธีเดียวกันนี้ท่านให้ใช้ตลอดถึงกรณีที่การชำระหนี้อันฝ่ายหนึ่งยังค้างชำระอยู่นั้นตกเป็นพ้นวิสัย เพราะพฤติการณ์อันใดอันหนึ่งซึ่งฝ่ายนั้นมิต้องรับผิดชอบ ในเวลาเมื่ออีกฝ่ายหนึ่งผิดนัดไม่รับชำระหนี้"], "ป.พ.พ.|1657": ["", "พินัยกรรมนั้น จะทำเป็นเอกสารเขียนเองทั้งฉบับก็ได้ กล่าวคือผู้ทำพินัยกรรมต้องเขียนด้วยมือตนเองซึ่งข้อความทั้งหมด วัน เดือน ปี และลายมือชื่อของตน การขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่ผู้ทำพินัยกรรมจะได้ทำด้วยมือตนเอง และลงลายมือชื่อกำกับไว้ บทบัญญัติมาตรา 9 แห่งประมวลกฎหมายนี้ มิให้ใช้บังคับแก่พินัยกรรมที่ทำขึ้นตามมาตรานี้"], "ป.พ.พ.|887": ["", "อันว่าประกันภัยค้ำจุนนั้น คือสัญญาประกันภัยซึ่งผู้รับประกันภัยตกลงว่าจะใช้ค่าสินไหมทดแทนในนามของผู้เอาประกันภัย เพื่อความวินาศภัยอันเกิดขึ้นแก่บุคคลอีกคนหนึ่ง และซึ่งผู้เอาประกันภัยจะต้องรับผิดชอบ บุคคลผู้ต้องเสียหายชอบที่จะได้รับค่าสินไหมทดแทนตามที่ตนควรจะได้นั้นจากผู้รับประกันภัยโดยตรง แต่ค่าสินไหมทดแทนเช่นว่านี้หาอาจจะคิดเกินไปกว่าจำนวนอันผู้รับประกันภัยจะพึงต้องใช้ตามสัญญานั้นได้ไม่ ในคดีระหว่างบุคคลผู้ต้องเสียหายกับผู้รับประกันภัยนั้น ท่านให้ผู้ต้องเสียหายเรียกตัวผู้เอาประกันภัยเข้ามาในคดีด้วย อนึ่ง ผู้รับประกันภัยนั้นแม้จะได้ส่งค่าสินไหมทดแทนให้แก่ผู้เอาประกันภัยแล้ว ก็ยังหาหลุดพ้นจากความรับผิดต่อบุคคลผู้ต้องเสียหายนั้นไม่ เว้นแต่ตนจะพิสูจน์ได้ว่าสินไหมทดแทนนั้นผู้เอาประกันภัยได้ใช้แก่ผู้ต้องเสียหายแล้ว"], "ป.พ.พ.|453": ["", "อันว่าซื้อขายนั้น คือสัญญาซึ่งบุคคลฝ่ายหนึ่ง เรียกว่าผู้ขาย โอนกรรมสิทธิ์แห่งทรัพย์สินให้แก่บุคคลอีกฝ่ายหนึ่ง เรียกว่าผู้ซื้อ และผู้ซื้อตกลงว่าจะใช้ราคาทรัพย์สินนั้นให้แก่ผู้ขาย"], "ป.พ.พ.|208": ["", "การชำระหนี้จะให้สำเร็จผลเป็นอย่างใด ลูกหนี้จะต้องขอปฏิบัติการชำระหนี้ต่อเจ้าหนี้เป็นอย่างนั้นโดยตรง แต่ถ้าเจ้าหนี้ได้แสดงแก่ลูกหนี้ว่า จะไม่รับชำระหนี้ก็ดี หรือเพื่อที่จะชำระหนี้จำเป็นที่เจ้าหนี้จะต้องกระทำการอย่างใดอย่างหนึ่งก่อนก็ดี ลูกหนี้จะบอกกล่าวแก่เจ้าหนี้ว่า ได้เตรียมการที่จะชำระหนี้ไว้พร้อมเสร็จแล้ว ให้เจ้าหนี้รับชำระหนี้นั้นเท่านี้ก็นับว่าเป็นการเพียงพอแล้ว ในกรณีเช่นนี้ท่านว่าคำบอกกล่าวของลูกหนี้นั้นก็เสมอกับคำขอปฏิบัติการชำระหนี้"], "ป.พ.พ.|421": ["", "การใช้สิทธิซึ่งมีแต่จะให้เกิดเสียหายแก่บุคคลอื่นนั้น ท่านว่าเป็นการอันมิชอบด้วยกฎหมาย"], "ป.พ.พ.|1495": ["", "การสมรสที่ฝ่าฝืนมาตรา 1449 มาตรา 1450 มาตรา 1452 และมาตรา 1458 เป็นโมฆะ"], "ป.พ.พ.|29": ["", "การใด ๆ อันบุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถได้กระทำลง การนั้นเป็นโมฆียะ"], "ป.พ.พ.|301": ["", "ถ้าบุคคลหลายคนเป็นหนี้อันจะแบ่งกันชำระมิได้ ท่านว่าบุคคลเหล่านั้นต้องรับผิดเช่นอย่างลูกหนี้ร่วมกัน"], "ป.พ.พ.|25": ["", "ผู้เยาว์อาจทำพินัยกรรมได้เมื่อมีอายุสิบห้าปีบริบูรณ์"], "ป.พ.พ.|689": ["", "ถึงแม้จะได้เรียกให้ลูกหนี้ชำระหนี้ดังกล่าวมาในมาตราก่อนนั้นแล้วก็ตาม ถ้าผู้ค้ำประกันพิสูจน์ได้ว่าลูกหนี้นั้นมีทางที่จะชำระหนี้ได้ และการที่จะบังคับให้ลูกหนี้ชำระหนี้นั้นจะไม่เป็นการยากไซร้ ท่านว่าเจ้าหนี้จะต้องบังคับการชำระหนี้รายนั้นเอาจากทรัพย์สินของลูกหนี้ก่อน"], "ป.พ.พ.|442": ["", "ถ้าความเสียหายได้เกิดขึ้นเพราะความผิดอย่างหนึ่งอย่างใดของผู้ต้องเสียหายประกอบด้วยไซร้ ท่านให้นำบทบัญญัติแห่งมาตรา 223 มาใช้บังคับ โดยอนุโลม"], "ป.พ.พ.|1360": ["", "เจ้าของรวมคนหนึ่ง ๆ มีสิทธิใช้ทรัพย์สินได้ แต่การใช้นั้นต้องไม่ขัดต่อสิทธิแห่งเจ้าของรวมคนอื่น ๆ ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าของรวมคนหนึ่ง ๆ มีสิทธิได้ดอกผลตามส่วนของตนที่มีในทรัพย์สินนั้น"], "ป.พ.พ.|1367": ["", "บุคคลใดยึดถือทรัพย์สินโดยเจตนาจะยึดถือเพื่อตน ท่านว่าบุคคลนั้นได้ซึ่งสิทธิครอบครอง"], "ป.พ.พ.|405": ["", "บทบัญญัติทั้งหลายที่กล่าวมาในสิบมาตราก่อนนั้น ท่านมิให้ใช้บังคับแก่กรณีที่บุคคลคนหนึ่งเข้าทำการงานของผู้อื่นโดยสำคัญว่าเป็นการงานของตนเอง ถ้าบุคคลใดถือเอากิจการของผู้อื่นว่าเป็นของตนเองทั้งที่รู้แล้วว่าตนไม่มีสิทธิจะทำเช่นนั้นไซร้ ท่านว่าตัวการจะใช้สิทธิเรียกร้องบังคับโดยมูลดังบัญญัติไว้ในมาตรา 395 มาตรา 396 มาตรา 399 และมาตรา 400 นั้นก็ได้ แต่เมื่อได้ใช้สิทธิดังว่ามานี้แล้ว ตัวการจะต้องรับผิดต่อผู้จัดการดังบัญญัติไว้ในมาตรา 402 วรรคหนึ่ง"], "ป.พ.พ.|1452": ["", "บุคคลจะทำการสมรสในขณะที่ตนมีคู่สมรสอยู่ไม่ได้"], "ป.พ.พ.|433": ["", "ถ้าความเสียหายเกิดขึ้นเพราะสัตว์ ท่านว่าเจ้าของสัตว์หรือบุคคลผู้รับเลี้ยงรับรักษาไว้แทนเจ้าของจำต้องใช้ค่าสินไหมทดแทนให้แก่ฝ่ายที่ต้องเสียหายเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่สัตว์นั้น เว้นแต่จะพิสูจน์ได้ว่าตนได้ใช้ความระมัดระวังอันสมควรแก่การเลี้ยงการรักษาตามชนิดและวิสัยของสัตว์ หรือตามพฤติการณ์อย่างอื่น หรือพิสูจน์ได้ว่าความเสียหายนั้นย่อมจะต้องเกิดมีขึ้นทั้งที่ได้ใช้ความระมัดระวังถึงเพียงนั้น อนึ่ง บุคคลผู้ต้องรับผิดชอบดังกล่าวมาในวรรคต้นนั้น จะใช้สิทธิไล่เบี้ยเอาแก่บุคคลผู้ที่เร้าหรือยั่วสัตว์นั้นโดยละเมิด หรือเอาแก่เจ้าของสัตว์อื่นอันมาเร้าหรือยั่วสัตว์นั้น ๆ ก็ได้"], "ป.พ.พ.|863": ["", "อันสัญญาประกันภัยนั้น ถ้าผู้เอาประกันภัยมิได้มีส่วนได้เสียในเหตุที่ประกันภัยไว้นั้นไซร้ ท่านว่าย่อมไม่ผูกพันคู่สัญญาแต่อย่างหนึ่งอย่างใด"], "ป.พ.พ.|1608": ["", "เจ้ามรดกจะตัดทายาทโดยธรรมของตนคนใดมิให้รับมรดกก็ได้แต่ด้วยแสดงเจตนาชัดแจ้ง (1) โดยพินัยกรรม (2) โดยทำเป็นหนังสือมอบไว้แก่พนักงานเจ้าหน้าที่ ตัวทายาทผู้ถูกตัดมิให้รับมรดกนั้นต้องระบุไว้ให้ชัดเจน แต่เมื่อบุคคลใดได้ทำพินัยกรรมจำหน่ายทรัพย์มรดกเสียทั้งหมดแล้ว ให้ถือว่าบรรดาทายาทโดยธรรมผู้ที่มิได้รับประโยชน์จากพินัยกรรม เป็นผู้ถูกตัดมิให้รับมรดก"], "ป.พ.พ.|147": ["", "อุปกรณ์ หมายความว่า สังหาริมทรัพย์ซึ่งโดยปกตินิยมเฉพาะถิ่นหรือโดยเจตนาชัดแจ้งของเจ้าของทรัพย์ที่เป็นประธาน เป็นของใช้ประจำอยู่กับทรัพย์ที่เป็นประธานเป็นอาจิณเพื่อประโยชน์แก่การจัดดูแล ใช้สอย หรือรักษาทรัพย์ที่เป็นประธาน และเจ้าของทรัพย์ได้นำมาสู่ทรัพย์ที่เป็นประธานโดยการนำมาติดต่อหรือปรับเข้าไว้ หรือทำโดยประการอื่นใดในฐานะเป็นของใช้ประกอบกับทรัพย์ที่เป็นประธานนั้น อุปกรณ์ที่แยกออกจากทรัพย์ที่เป็นประธานเป็นการชั่วคราวก็ยังไม่ขาดจากการเป็นอุปกรณ์ของทรัพย์ที่เป็นประธานนั้น อุปกรณ์ย่อมตกติดไปกับทรัพย์ที่เป็นประธาน เว้นแต่จะมีการกำหนดไว้เป็นอย่างอื่น"], "ป.พ.พ.|195": ["", "เมื่อทรัพย์ซึ่งเป็นวัตถุแห่งหนี้นั้นได้ระบุไว้แต่เพียงเป็นประเภท และถ้าตามสภาพแห่งนิติกรรม หรือตามเจตนาของคู่กรณีไม่อาจจะกำหนดได้ว่าทรัพย์นั้นจะพึงเป็นชนิดอย่างไรไซร้ ท่านว่าลูกหนี้จะต้องส่งมอบทรัพย์ชนิดปานกลาง ถ้าลูกหนี้ได้กระทำการอันตนจะพึงต้องทำเพื่อส่งมอบทรัพย์สิ่งนั้นทุกประการแล้วก็ดี หรือถ้าลูกหนี้ได้เลือกกำหนดทรัพย์ที่จะส่งมอบแล้วด้วยความยินยอมของเจ้าหนี้ก็ดี ท่านว่าทรัพย์นั้นจึงเป็นวัตถุแห่งหนี้จำเดิมแต่เวลานั้นไป"], "ป.พ.พ.|594": ["", "ถ้าในระหว่างเวลาที่ทำการอยู่นั้นเป็นวิสัยจะคาดหมายล่วงหน้าได้แน่นอนว่า การที่ทำนั้นจะสำเร็จอย่างบกพร่องหรือจะเป็นไปในทางอันฝ่าฝืนข้อสัญญาเพราะความผิดของผู้รับจ้างไซร้ ผู้ว่าจ้างจะบอกกล่าวให้ผู้รับจ้างแก้ไขสิ่งที่บกพร่องให้คืนดี หรือทำการให้เป็นไปตามสัญญา ภายในเวลาอันสมควรซึ่งกำหนดให้ในคำบอกกล่าวนั้นก็ได้ ถ้าและคลาดกำหนดนั้นไป ท่านว่าผู้ว่าจ้างชอบที่จะเอาการนั้นให้บุคคลภายนอกซ่อมแซมหรือทำต่อไปได้ ซึ่งผู้รับจ้างจะต้องเสี่ยงความเสียหายและออกค่าใช้จ่ายทั้งสิ้น"], "ป.พ.พ.|1308": ["", "ที่ดินแปลงใดเกิดที่งอกริมตลิ่ง ที่งอกย่อมเป็นทรัพย์สินของเจ้าของที่ดินแปลงนั้น"], "ป.พ.พ.|30": ["", "การใด ๆ อันบุคคลวิกลจริตซึ่งศาลยังมิได้สั่งให้เป็นคนไร้ความสามารถได้กระทำลง การนั้นจะเป็นโมฆียะต่อเมื่อได้กระทำในขณะที่บุคคลนั้นจริตวิกลอยู่ และคู่กรณีอีกฝ่ายหนึ่งได้รู้แล้วด้วยว่าผู้กระทำเป็นคนวิกลจริต"], "ป.พ.พ.|1007": ["", "ถ้าข้อความในตั๋วเงินใด หรือในคำรับรองตั๋วเงินรายใด มีผู้แก้ไขเปลี่ยนแปลงในข้อสำคัญโดยที่คู่สัญญาทั้งปวงผู้ต้องรับผิดตามตั๋วเงินมิได้ยินยอมด้วยหมดทุกคนไซร้ ท่านว่าตั๋วเงินนั้นก็เป็นอันเสีย เว้นแต่ยังคงใช้ได้ต่อคู่สัญญาซึ่งเป็นผู้ทำการแก้ไขเปลี่ยนแปลงนั้น หรือได้ยินยอมด้วยกับการแก้ไขเปลี่ยนแปลงนั้น กับทั้งผู้สลักหลังในภายหลัง แต่หากตั๋วเงินใดได้มีผู้แก้ไขเปลี่ยนแปลงในข้อสำคัญ แต่ความเปลี่ยนแปลงนั้นไม่ประจักษ์ และตั๋วเงินนั้นตกอยู่ในมือผู้ทรงโดยชอบด้วยกฎหมายไซร้ ท่านว่าผู้ทรงคนนั้นจะเอาประโยชน์จากตั๋วเงินนั้นก็ได้เสมือนดังว่ามิได้มีการแก้ไขเปลี่ยนแปลงเลย และจะบังคับการใช้เงินตามเนื้อความเดิมแห่งตั๋วนั้นก็ได้ กล่าวโดยเฉพาะ การแก้ไขเปลี่ยนแปลงเช่นจะกล่าวต่อไปนี้ ท่านถือว่าเป็นการแก้ไขเปลี่ยนแปลงในข้อสำคัญ คือแก้ไขเปลี่ยนแปลงอย่างใด ๆ แก่วันที่ลง จำนวนเงินอันจะพึงใช้ เวลาใช้เงิน สถานที่ใช้เงิน กับทั้งเมื่อตั๋วเงินเขารับรองไว้ทั่วไปไม่เจาะจงสถานที่ใช้เงิน ไปเติมความระบุสถานที่ใช้เงินเข้าโดยที่ผู้รับรองมิได้ยินยอมด้วย"], "ป.พ.พ.|321": ["", "ถ้าเจ้าหนี้ยอมรับการชำระหนี้อย่างอื่นแทนการชำระหนี้ที่ได้ตกลงกันไว้ ท่านว่าหนี้นั้นก็เป็นอันระงับสิ้นไป ถ้าเพื่อที่จะทำให้พอแก่ใจเจ้าหนี้นั้น ลูกหนี้รับภาระเป็นหนี้อย่างใดอย่างหนึ่งขึ้นใหม่ต่อเจ้าหนี้ไซร้ เมื่อกรณีเป็นที่สงสัย ท่านมิให้สันนิษฐานว่าลูกหนี้ได้ก่อหนี้นั้นขึ้นแทนการชำระหนี้ ถ้าชำระหนี้ด้วยออก ด้วยโอน หรือด้วยสลักหลังตั๋วเงิน หรือประทวนสินค้า ท่านว่าหนี้นั้นจะระงับสิ้นไปต่อเมื่อตั๋วเงิน หรือประทวนสินค้านั้นได้ใช้เงินแล้ว"], "ป.พ.พ.|867": ["", "อันสัญญาประกันภัยนั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อฝ่ายที่ต้องรับผิดหรือลายมือชื่อตัวแทนของฝ่ายนั้นเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่ ให้ส่งมอบกรมธรรม์ประกันภัยอันมีเนื้อความต้องตามสัญญานั้นแก่ผู้เอาประกันภัยฉบับหนึ่ง กรมธรรม์ประกันภัย ต้องลงลายมือชื่อของผู้รับประกันภัย และมีรายการดังต่อไปนี้ (1) วัตถุที่เอาประกันภัย (2) ภัยใดซึ่งผู้รับประกันภัยรับเสี่ยง (3) ราคาแห่งมูลประกันภัย ถ้าหากได้กำหนดกันไว้ (4) จำนวนเงินซึ่งเอาประกันภัย (5) จำนวนเบี้ยประกันภัย และวิธีส่งเบี้ยประกันภัย (6) ถ้าหากสัญญาประกันภัยมีกำหนดเวลา ต้องลงเวลาเริ่มต้นและเวลาสิ้นสุดไว้ด้วย (7) ชื่อหรือยี่ห้อของผู้รับประกันภัย (8) ชื่อหรือยี่ห้อของผู้เอาประกันภัย (9) ชื่อของผู้รับประโยชน์ ถ้าจะพึงมี (10) วันทำสัญญาประกันภัย (11) สถานที่และวันที่ได้ทำกรมธรรม์ประกันภัย"], "ป.พ.พ.|1663": ["", "เมื่อมีพฤติการณ์พิเศษซึ่งบุคคลใดไม่สามารถจะทำพินัยกรรมตามแบบอื่นที่กำหนดไว้ได้ เช่น ตกอยู่ในอันตรายใกล้ความตาย หรือเวลามีโรคระบาด หรือสงคราม บุคคลนั้นจะทำพินัยกรรมด้วยวาจาก็ได้ เพื่อการนี้ ผู้ทำพินัยกรรมต้องแสดงเจตนากำหนดข้อพินัยกรรมต่อหน้าพยานอย่างน้อยสองคนซึ่งอยู่พร้อมกัน ณ ที่นั้น พยานสองคนนั้นต้องไปแสดงตนต่อกรมการอำเภอโดยมิชักช้าและแจ้งข้อความที่ผู้ทำพินัยกรรมได้สั่งไว้ด้วยวาจานั้น ทั้งต้องแจ้งวัน เดือน ปี สถานที่ที่ทำพินัยกรรมและพฤติการณ์พิเศษนั้นไว้ด้วย ให้กรมการอำเภอจดข้อความที่พยานแจ้งนั้นไว้ และพยานสองคนนั้นต้องลงลายมือชื่อไว้ หรือมิฉะนั้น จะให้เสมอกับการลงลายมือชื่อได้ก็แต่ด้วยลงลายพิมพ์นิ้วมือ โดยมีพยานลงลายมือชื่อรับรองสองคน"], "ป.พ.พ.|342": ["", "หักกลบลบหนี้นั้น ทำได้ด้วยคู่กรณีฝ่ายหนึ่งแสดงเจตนาแก่อีกฝ่ายหนึ่ง การแสดงเจตนาเช่นนี้ท่านว่าจะมีเงื่อนไขหรือเงื่อนเวลาเริ่มต้นหรือเวลาสิ้นสุดอีกด้วยหาได้ไม่ การแสดงเจตนาดังกล่าวมาในวรรคก่อนนี้ ท่านว่ามีผลย้อนหลังขึ้นไปจนถึงเวลาซึ่งหนี้ทั้งสองฝ่ายนั้นจะอาจหักกลบลบกันได้เป็นครั้งแรก"], "ป.พ.พ.|538": ["", "เช่าอสังหาริมทรัพย์นั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างหนึ่งอย่างใดลงลายมือชื่อฝ่ายที่ต้องรับผิดเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่ ถ้าเช่ามีกำหนดกว่าสามปีขึ้นไป หรือกำหนดตลอดอายุของผู้เช่าหรือผู้ให้เช่าไซร้ หากมิได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ ท่านว่าการเช่านั้นจะฟ้องร้องให้บังคับคดีได้แต่เพียงสามปี"], "ป.พ.พ.|918": ["", "ตั๋วแลกเงินอันสั่งให้ใช้เงินแก่ผู้ถือนั้น ท่านว่าย่อมโอนไปเพียงด้วยส่งมอบให้กัน"], "ป.พ.พ.|475": ["", "หากว่าบุคคลผู้ใดมาก่อการรบกวนขัดสิทธิของผู้ซื้อในอันจะครองทรัพย์สินโดยปกติสุข เพราะบุคคลผู้นั้นมีสิทธิเหนือทรัพย์สินที่ได้ซื้อขายกันนั้นอยู่ในเวลาซื้อขายก็ดี เพราะความผิดของผู้ขายก็ดี ท่านว่าผู้ขายจะต้องรับผิดในผลอันนั้น"], "ป.พ.พ.|1555": ["", "ในคดีฟ้องขอให้รับเด็กเป็นบุตรชอบด้วยกฎหมาย ให้สันนิษฐานไว้ก่อนว่าเด็กเป็นบุตรชอบด้วยกฎหมายของชายเมื่อปรากฏข้อเท็จจริงอย่างหนึ่งอย่างใดดังต่อไปนี้ (1) เมื่อมีการข่มขืนกระทำชำเรา ฉุดคร่า หรือหน่วงเหนี่ยวกักขังหญิงมารดาโดยมิชอบด้วยกฎหมายในระยะเวลาซึ่งหญิงนั้นอาจตั้งครรภ์ได้ (2) เมื่อมีการลักพาหญิงมารดาไปในทางชู้สาวหรือมีการล่อลวงร่วมประเวณีกับหญิงมารดาในระยะเวลาซึ่งหญิงนั้นอาจตั้งครรภ์ได้ (3) เมื่อมีเอกสารของบิดาแสดงว่าเด็กนั้นเป็นบุตรของตน (4) เมื่อปรากฏในทะเบียนคนเกิดว่าเด็กเป็นบุตรโดยมีหลักฐานว่าบิดาเป็นผู้แจ้งการเกิดหรือรู้เห็นยินยอมในการแจ้งนั้น (5) เมื่อบิดามารดาได้อยู่กินด้วยกันอย่างเปิดเผยในระยะเวลาซึ่งหญิงมารดาอาจตั้งครรภ์ได้ (6) เมื่อได้มีการร่วมประเวณีกับหญิงมารดาในระยะเวลาซึ่งหญิงนั้นอาจตั้งครรภ์ได้ และมีเหตุอันควรเชื่อได้ว่าเด็กนั้นมิได้เป็นบุตรของชายอื่น (7) เมื่อมีพฤติการณ์ที่รู้กันทั่วไปตลอดมาว่าเป็นบุตร พฤติการณ์ที่รู้กันทั่วไปตลอดมาว่าเป็นบุตรนั้น ให้พิจารณาข้อเท็จจริงที่แสดงความเกี่ยวข้องฉันบิดากับบุตรซึ่งปรากฏในระหว่างตัวเด็กกับครอบครัวที่เด็กอ้างว่าตนสังกัดอยู่ เช่น บิดาให้การศึกษา ให้ความอุปการะเลี้ยงดูหรือยอมให้เด็กนั้นใช้ชื่อสกุลของตนหรือโดยเหตุประการอื่น ในกรณีใดกรณีหนึ่งดังกล่าวข้างต้น ถ้าปรากฏว่าชายไม่อาจเป็นบิดาของเด็กนั้นได้ ให้ยกฟ้องเสีย"], "ป.พ.พ.|1745": ["", "ถ้ามีทายาทหลายคน ทายาทเหล่านั้นมีสิทธิและหน้าที่เกี่ยวกับทรัพย์มรดกร่วมกันจนกว่าจะได้แบ่งมรดกกันเสร็จแล้ว และให้ใช้มาตรา 1356 ถึงมาตรา 1366 แห่งประมวลกฎหมายนี้บังคับ เพียงเท่าที่ไม่ขัดกับบทบัญญัติแห่งบรรพนี้"], "ป.พ.พ.|1051": ["", "ผู้เป็นหุ้นส่วนซึ่งออกจากหุ้นส่วนไปแล้วยังคงต้องรับผิดในหนี้ซึ่งห้างหุ้นส่วนได้ก่อให้เกิดขึ้นก่อนที่ตนได้ออกจากหุ้นส่วนไป"], "ป.พ.พ.|377": ["", "เมื่อเข้าทำสัญญา ถ้าได้ให้สิ่งใดไว้เป็นมัดจำ ท่านให้ถือว่าการที่ให้มัดจำนั้นย่อมเป็นพยานหลักฐานว่าสัญญานั้นได้ทำกันขึ้นแล้ว อนึ่ง มัดจำนี้ย่อมเป็นประกันการที่จะปฏิบัติตามสัญญานั้นด้วย"], "ป.พ.พ.|373": ["", "ความตกลงทำไว้ล่วงหน้าเป็นข้อความยกเว้นมิให้ลูกหนี้ต้องรับผิดเพื่อกลฉ้อฉลหรือความประมาทเลินเล่ออย่างร้ายแรงของตนนั้น ท่านว่าเป็นโมฆะ"], "ป.พ.พ.|608": ["", "อันว่าผู้ขนส่งภายในความหมายแห่งกฎหมายลักษณะนี้ คือบุคคลผู้รับขนส่งของหรือคนโดยสารเพื่อบำเหน็จเป็นทางค้าปกติของตน"], "ป.พ.พ.|1660": ["", "พินัยกรรมนั้น จะทำเป็นเอกสารลับก็ได้ กล่าวคือ (1) ผู้ทำพินัยกรรมต้องลงลายมือชื่อในพินัยกรรม (2) ผู้ทำพินัยกรรมต้องผนึกพินัยกรรมนั้น แล้วลงลายมือชื่อคาบรอยผนึกนั้น (3) ผู้ทำพินัยกรรมต้องนำพินัยกรรมที่ผนึกนั้นไปแสดงต่อกรมการอำเภอ และพยานอีกอย่างน้อยสองคน และให้ถ้อยคำต่อบุคคลทั้งหมดเหล่านั้นว่าเป็นพินัยกรรมของตน ถ้าพินัยกรรมนั้นผู้ทำพินัยกรรมมิได้เป็นผู้เขียนเองโดยตลอด ผู้ทำพินัยกรรมจะต้องแจ้งนามและภูมิลำเนาของผู้เขียนให้ทราบด้วย (4) เมื่อกรมการอำเภอจดถ้อยคำของผู้ทำพินัยกรรมและวัน เดือน ปี ที่นำพินัยกรรมมาแสดงไว้บนซองนั้นและประทับตราตำแหน่งแล้ว ให้กรมการอำเภอผู้ทำพินัยกรรมและพยานลงลายมือชื่อบนซองนั้น การขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่ผู้ทำพินัยกรรมจะได้ลงลายมือชื่อกำกับไว้"], "ป.พ.พ.|550": ["", "ผู้ให้เช่าย่อมต้องรับผิดในความชำรุดบกพร่องอันเกิดขึ้นในระหว่างเวลาเช่า และผู้ให้เช่าต้องจัดการซ่อมแซมทุกอย่างบรรดาซึ่งเป็นการจำเป็นขึ้น เว้นแต่การซ่อมแซมชนิดซึ่งมีกฎหมายหรือจารีตประเพณีว่าผู้เช่าจะพึงต้องทำเอง"], "ป.พ.พ.|1523": ["", "เมื่อศาลพิพากษาให้หย่ากันเพราะเหตุตามมาตรา 1516 (1) คู่สมรสฝ่ายใดฝ่ายหนึ่งมีสิทธิได้รับค่าทดแทนจากคู่สมรสอีกฝ่ายหนึ่งและจากผู้ซึ่งได้รับการอุปการะเลี้ยงดูหรือยกย่อง หรือผู้ซึ่งเป็นเหตุแห่งการหย่านั้น คู่สมรสฝ่ายใดฝ่ายหนึ่งจะเรียกค่าทดแทนจากผู้ซึ่งล่วงเกินคู่สมรสอีกฝ่ายหนึ่งไปในทำนองชู้ หรือจากผู้ซึ่งแสดงตนโดยเปิดเผยเพื่อแสดงว่าตนมีความสัมพันธ์กับคู่สมรสอีกฝ่ายหนึ่งในทำนองชู้ก็ได้ ถ้าคู่สมรสฝ่ายใดฝ่ายหนึ่งยินยอมหรือรู้เห็นเป็นใจให้อีกฝ่ายหนึ่งกระทำการตามมาตรา 1516 (1) หรือให้ผู้อื่นกระทำการตามวรรคสอง คู่สมรสฝ่ายใดฝ่ายหนึ่งนั้นจะเรียกค่าทดแทนไม่ได้"], "ป.พ.พ.|1077": ["", "อันห้างหุ้นส่วนจำกัดนั้น คือห้างหุ้นส่วนประเภทหนึ่งซึ่งมีผู้เป็นหุ้นส่วนสองจำพวกดังจะกล่าวต่อไปนี้ คือ (1) ผู้เป็นหุ้นส่วนคนเดียวหรือหลายคนซึ่งมีจำกัดความรับผิดเพียงไม่เกินจำนวนเงินที่ตนรับจะลงหุ้นในห้างหุ้นส่วนนั้นจำพวกหนึ่ง และ (2) ผู้เป็นหุ้นส่วนคนเดียวหรือหลายคนซึ่งต้องรับผิดร่วมกันในบรรดาหนี้ของห้างหุ้นส่วนไม่มีจำกัดจำนวนอีกจำพวกหนึ่ง"], "ป.พ.พ.|1379": ["", "ถ้าผู้รับโอนหรือผู้แทนยึดถือทรัพย์สินอยู่แล้ว ท่านว่าการโอนไปซึ่งการครอบครองจะทำเพียงแสดงเจตนาก็ได้"], "ป.พ.พ.|1068": ["", "ความรับผิดของผู้เป็นหุ้นส่วนในห้างหุ้นส่วนจดทะเบียน อันเกี่ยวแก่หนี้ซึ่งห้างหุ้นส่วนได้ก่อให้เกิดขึ้นก่อนที่ตนออกจากหุ้นส่วนนั้น ย่อมมีจำกัดเพียงสองปีนับแต่เมื่อออกจากหุ้นส่วน"], "ป.พ.พ.|1477": ["", "คู่สมรสฝ่ายใดฝ่ายหนึ่งมีสิทธิฟ้อง ต่อสู้ หรือดำเนินคดีเกี่ยวกับการสงวนบำรุงรักษาสินสมรส หรือเพื่อประโยชน์แก่สินสมรส หนี้อันเกิดแต่การฟ้อง ต่อสู้ หรือดำเนินคดีดังกล่าว ให้ถือว่าเป็นหนี้ที่คู่สมรสเป็นลูกหนี้ร่วมกัน"], "ป.พ.พ.|722": ["", "ถ้าทรัพย์สินได้จำนองแล้ว และภายหลังที่จดทะเบียนจำนองมีจดทะเบียนภาระจำยอมหรือทรัพยสิทธิอย่างอื่น โดยผู้รับจำนองมิได้ยินยอมด้วยไซร้ ท่านว่าสิทธิจำนองย่อมเป็นใหญ่กว่าภาระจำยอมหรือทรัพยสิทธิอย่างอื่นนั้น หากว่าเป็นที่เสื่อมเสียแก่สิทธิของผู้รับจำนองในเวลาบังคับจำนอง ก็ให้ลบสิทธิที่กล่าวหลังนั้นเสียจากทะเบียน"], "ป.พ.พ.|70": ["", "นิติบุคคลต้องมีผู้แทนคนหนึ่งหรือหลายคน ทั้งนี้ ตามที่กฎหมาย ข้อบังคับ หรือตราสารจัดตั้งจะได้กำหนดไว้ ความประสงค์ของนิติบุคคลย่อมแสดงออกโดยผู้แทนของนิติบุคคล"], "ป.พ.พ.|1480": ["", "การจัดการสินสมรสซึ่งต้องจัดการร่วมกันหรือต้องได้รับความยินยอมจากอีกฝ่ายหนึ่งตามมาตรา 1476 ถ้าคู่สมรสฝ่ายหนึ่งได้ทำนิติกรรมไปแต่เพียงฝ่ายเดียว หรือโดยปราศจากความยินยอมของคู่สมรสอีกฝ่ายหนึ่ง คู่สมรสอีกฝ่ายหนึ่งอาจฟ้องให้ศาลเพิกถอนนิติกรรมนั้นได้ เว้นแต่คู่สมรสอีกฝ่ายหนึ่งได้ให้สัตยาบันแก่นิติกรรมนั้นแล้ว หรือในขณะที่ทำนิติกรรมนั้นบุคคลภายนอกได้กระทำโดยสุจริตและเสียค่าตอบแทน การฟ้องให้ศาลเพิกถอนนิติกรรมตามวรรคหนึ่ง ห้ามมิให้ฟ้องเมื่อพ้นหนึ่งปี นับแต่วันที่ได้รู้เหตุอันเป็นมูลให้เพิกถอนหรือเมื่อพ้นสิบปีนับแต่วันที่ได้ทำนิติกรรมนั้น"], "ป.พ.พ.|745": ["", "ผู้รับจำนองจะบังคับจำนองแม้เมื่อหนี้ที่ประกันนั้นขาดอายุความแล้วก็ได้ แต่จะบังคับเอาดอกเบี้ยที่ค้างชำระในการจำนองเกินกว่าห้าปีไม่ได้"], "ป.พ.พ.|340": ["", "ถ้าเจ้าหนี้แสดงเจตนาต่อลูกหนี้ว่าจะปลดหนี้ให้ ท่านว่าหนี้นั้นก็เป็นอันระงับสิ้นไป ถ้าหนี้มีหนังสือเป็นหลักฐาน การปลดหนี้ก็ต้องทำเป็นหนังสือด้วย หรือต้องเวนคืนเอกสารอันเป็นหลักฐานแห่งหนี้ให้แก่ลูกหนี้ หรือขีดฆ่าเอกสารนั้นเสีย"], "ป.พ.พ.|1309": ["", "เกาะที่เกิดในทะเลสาบ หรือในทางน้ำหรือในเขตน่านน้ำของประเทศก็ดี และท้องทางน้ำที่เขินขึ้นก็ดี เป็นทรัพย์สินของแผ่นดิน"], "ป.พ.พ.|1412": ["", "สิทธิเหนือพื้นดินนั้นจะก่อให้เกิดโดยมีกำหนดเวลา หรือตลอดชีวิตเจ้าของที่ดิน หรือตลอดชีวิตผู้ทรงสิทธิเหนือพื้นดินนั้นก็ได้ ถ้าก่อให้เกิดสิทธิเหนือพื้นดินโดยมีกำหนดเวลาไซร้ ท่านให้นำบทบัญญัติมาตรา 1403 วรรคสาม มาใช้บังคับโดยอนุโลม"], "ป.พ.พ.|19": ["", "บุคคลย่อมพ้นจากภาวะผู้เยาว์และบรรลุนิติภาวะเมื่อมีอายุยี่สิบปีบริบูรณ์"], "ป.พ.พ.|1648": ["", "พินัยกรรมนั้นต้องทำตามแบบซึ่งระบุไว้ในหมวด 2 แห่งลักษณะนี้"], "ป.พ.พ.|216": ["", "ถ้าโดยเหตุผิดนัด การชำระหนี้กลายเป็นอันไร้ประโยชน์แก่เจ้าหนี้ เจ้าหนี้จะบอกปัดไม่รับชำระหนี้ และจะเรียกเอาค่าสินไหมทดแทนเพื่อการไม่ชำระหนี้ก็ได้"], "ป.พ.พ.|409": ["", "เมื่อบุคคลผู้หนึ่งผู้ใดซึ่งมิได้เป็นลูกหนี้ได้ชำระหนี้ไปโดยสำคัญผิด เป็นเหตุให้เจ้าหนี้ผู้ทำการโดยสุจริตได้ทำลาย หรือลบล้างเสียซึ่งเอกสารอันเป็นพยานหลักฐานแห่งหนี้ก็ดี ยกเลิกหลักประกันเสียก็ดี สิ้นสิทธิไปเพราะขาดอายุความก็ดี ท่านว่าเจ้าหนี้ไม่จำต้องคืนทรัพย์ บทบัญญัติที่กล่าวมาในวรรคก่อนนี้ไม่ขัดขวางต่อการที่บุคคลผู้ได้ชำระหนี้นั้นจะใช้สิทธิไล่เบี้ยเอาแก่ลูกหนี้และผู้ค้ำประกัน ถ้าจะพึงมี"], "ป.พ.พ.|657": ["", "อันว่าฝากทรัพย์นั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้ฝาก ส่งมอบทรัพย์สินให้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับฝาก และผู้รับฝากตกลงว่าจะเก็บรักษาทรัพย์สินนั้นไว้ในอารักขาแห่งตน แล้วจะคืนให้"], "ป.พ.พ.|1499": ["", "การสมรสที่เป็นโมฆะเพราะฝ่าฝืนมาตรา 1449 มาตรา 1450 หรือมาตรา 1458 ไม่ทำให้ผู้สมรสโดยสุจริตเสื่อมสิทธิที่ได้มาเพราะการสมรสก่อนมีคำพิพากษาถึงที่สุดให้เป็นโมฆะ การสมรสที่เป็นโมฆะเพราะฝ่าฝืนมาตรา 1452 ไม่ทำให้ผู้สมรสโดยสุจริตเสื่อมสิทธิที่ได้มาเพราะการสมรสก่อนที่บุคคลใดบุคคลหนึ่งนั้นรู้ถึงเหตุที่ทำให้การสมรสเป็นโมฆะ แต่การสมรสที่เป็นโมฆะดังกล่าว ไม่ทำให้คู่สมรสเกิดสิทธิรับมรดกในฐานะทายาทโดยธรรมของคู่สมรสอีกฝ่ายหนึ่ง การสมรสที่เป็นโมฆะเพราะฝ่าฝืนมาตรา 1449 มาตรา 1450 หรือมาตรา 1458 หรือฝ่าฝืนมาตรา 1452 ถ้าคู่สมรสฝ่ายใดได้สมรสโดยสุจริตฝ่ายนั้นมีสิทธิเรียกค่าทดแทนได้ และถ้าการสมรสที่เป็นโมฆะนั้นทำให้ฝ่ายที่ได้สมรสโดยสุจริตต้องยากจนลงเพราะไม่มีรายได้พอจากทรัพย์สิน หรือจากการงานที่เคยทำอยู่ก่อนมีคำพิพากษาถึงที่สุด หรือก่อนที่จะได้รู้ว่าการสมรสของตนเป็นโมฆะ แล้วแต่กรณี ฝ่ายนั้นมีสิทธิเรียกค่าเลี้ยงชีพได้ด้วย สิทธิเรียกค่าเลี้ยงชีพในกรณีนี้ให้นำมาตรา 1526 วรรคหนึ่ง และมาตรา 1528 มาใช้บังคับโดยอนุโลม สิทธิเรียกร้องค่าทดแทน หรือค่าเลี้ยงชีพตามวรรคสาม มีกำหนดอายุความสองปีนับแต่วันที่มีคำพิพากษาถึงที่สุด สำหรับกรณีการสมรสเป็นโมฆะเพราะฝ่าฝืนมาตรา 1449 มาตรา 1450 หรือมาตรา 1458 หรือนับแต่วันที่รู้ถึงเหตุที่ทำให้การสมรสเป็นโมฆะสำหรับกรณีการสมรสเป็นโมฆะเพราะฝ่าฝืนมาตรา 1452"], "ป.พ.พ.|222": ["", "การเรียกเอาค่าเสียหายนั้น ได้แก่เรียกค่าสินไหมทดแทนเพื่อความเสียหายเช่นที่ตามปกติย่อมเกิดขึ้นแต่การไม่ชำระหนี้นั้น เจ้าหนี้จะเรียกค่าสินไหมทดแทนได้ แม้กระทั่งเพื่อความเสียหายอันเกิดแต่พฤติการณ์พิเศษ หากว่าคู่กรณีที่เกี่ยวข้องได้คาดเห็นหรือควรจะได้คาดเห็นพฤติการณ์เช่นนั้นล่วงหน้าก่อนแล้ว"], "ป.พ.พ.|1713": ["", "ทายาทหรือผู้มีส่วนได้เสียหรือพนักงานอัยการจะร้องต่อศาลขอให้ตั้งผู้จัดการมรดกก็ได้ ในกรณีดังต่อไปนี้ (1) เมื่อเจ้ามรดกตาย ทายาทโดยธรรมหรือผู้รับพินัยกรรมได้สูญหายไป หรืออยู่นอกราชอาณาเขต หรือเป็นผู้เยาว์ (2) เมื่อผู้จัดการมรดกหรือทายาทไม่สามารถ หรือไม่เต็มใจที่จะจัดการ หรือมีเหตุขัดข้องในการจัดการ หรือในการแบ่งปันมรดก (3) เมื่อข้อกำหนดพินัยกรรมซึ่งตั้งผู้จัดการมรดกไว้ไม่มีผลบังคับได้ด้วยประการใด ๆ การตั้งผู้จัดการมรดกนั้น ถ้ามีข้อกำหนดพินัยกรรมก็ให้ศาลตั้งตามข้อกำหนดพินัยกรรม และถ้าไม่มีข้อกำหนดพินัยกรรม ก็ให้ศาลตั้งเพื่อประโยชน์แก่กองมรดกตามพฤติการณ์ และโดยคำนึงถึงเจตนาของเจ้ามรดก แล้วแต่ศาลจะเห็นสมควร"], "ป.พ.พ.|412": ["", "ถ้าทรัพย์สินซึ่งได้รับไว้เป็นลาภมิควรได้นั้นเป็นเงินจำนวนหนึ่ง ท่านว่าต้องคืนเต็มจำนวนนั้น เว้นแต่เมื่อบุคคลได้รับไว้โดยสุจริต จึงต้องคืนลาภมิควรได้เพียงส่วนที่ยังมีอยู่ในขณะเมื่อเรียกคืน"], "ป.พ.พ.|1408": ["", "เมื่อสิทธิอาศัยสิ้นลง ผู้อาศัยต้องส่งทรัพย์สินคืนแก่ผู้ให้อาศัย"], "ป.พ.พ.|553": ["", "ผู้เช่าจำต้องสงวนทรัพย์สินที่เช่านั้นเสมอกับที่วิญญูชนจะพึงสงวนทรัพย์สินของตนเอง และต้องบำรุงรักษาทั้งทำการซ่อมแซมเล็กน้อยด้วย"], "ป.พ.พ.|801": ["", "ถ้าตัวแทนได้รับมอบอำนาจทั่วไป ท่านว่าจะทำกิจใด ๆ ในทางจัดการแทนตัวการก็ย่อมทำได้ทุกอย่าง แต่การเช่นอย่างจะกล่าวต่อไปนี้ ท่านว่าหาอาจจะทำได้ไม่ คือ (1) ขายหรือจำนองอสังหาริมทรัพย์ (2) ให้เช่าอสังหาริมทรัพย์กว่าสามปีขึ้นไป (3) ให้ (4) ประนีประนอมยอมความ (5) ยื่นฟ้องต่อศาล (6) มอบข้อพิพาทให้อนุญาโตตุลาการพิจารณา"], "ป.พ.พ.|1500": ["", "การสมรสที่เป็นโมฆะไม่กระทบถึงสิทธิของบุคคลภายนอกผู้กระทำการโดยสุจริตซึ่งได้มาก่อนมีการบันทึกความเป็นโมฆะไว้ในทะเบียนสมรสตามมาตรา 1497/1"], "ป.พ.พ.|916": ["", "บุคคลทั้งหลายผู้ถูกฟ้องในมูลตั๋วแลกเงิน หาอาจจะต่อสู้ผู้ทรงด้วยข้อต่อสู้อันอาศัยความเกี่ยวพันกันเฉพาะบุคคลระหว่างตนกับผู้สั่งจ่ายหรือกับผู้ทรงคนก่อน ๆ นั้นได้ไม่ เว้นแต่การโอนจะได้มีขึ้นด้วยคบคิดกันฉ้อฉล"], "ป.พ.พ.|531": ["", "อันผู้ให้จะเรียกถอนคืนการให้เพราะเหตุผู้รับประพฤติเนรคุณนั้น ท่านว่าอาจจะเรียกได้แต่เพียงในกรณีดังจะกล่าวต่อไปนี้ (1) ถ้าผู้รับได้ประทุษร้ายต่อผู้ให้เป็นความผิดฐานอาญาอย่างร้ายแรงตามประมวลกฎหมายลักษณะอาญา หรือ (2) ถ้าผู้รับได้ทำให้ผู้ให้เสียชื่อเสียง หรือหมิ่นประมาทผู้ให้อย่างร้ายแรง หรือ (3) ถ้าผู้รับได้บอกปัดไม่ยอมให้สิ่งของจำเป็นเลี้ยงชีวิตแก่ผู้ให้ ในเวลาที่ผู้ให้ยากไร้และผู้รับยังสามารถจะให้ได้"], "ป.พ.พ.|1008": ["", "ภายในบังคับแห่งบทบัญญัติทั้งหลายในประมวลกฎหมายนี้ เมื่อใดลายมือชื่อในตั๋วเงินเป็นลายมือปลอมก็ดี เป็นลายมือชื่อลงไว้โดยที่บุคคลซึ่งอ้างเอาเป็นเจ้าของลายมือชื่อนั้นมิได้มอบอำนาจให้ลงก็ดี ท่านว่าลายมือชื่อปลอมหรือลงปราศจากอำนาจเช่นนั้นเป็นอันใช้ไม่ได้เลย ใครจะอ้างอิงอาศัยแสวงสิทธิอย่างหนึ่งอย่างใดเพื่อยึดหน่วงตั๋วเงินไว้ก็ดี เพื่อทำให้ตั๋วนั้นหลุดพ้นก็ดี หรือเพื่อบังคับการใช้เงินเอาแก่คู่สัญญาแห่งตั๋วนั้นคนใดคนหนึ่งก็ดี ท่านว่าไม่อาจจะทำได้เป็นอันขาด เว้นแต่คู่สัญญาฝ่ายซึ่งจะพึงถูกยึดหน่วงหรือถูกบังคับใช้เงินนั้นจะอยู่ในฐานเป็นผู้ต้องตัดบทมิให้ยกข้อลายมือชื่อปลอม หรือข้อลงลายมือชื่อปราศจากอำนาจนั้นขึ้นเป็นข้อต่อสู้ แต่ข้อความใด ๆ อันกล่าวมาในมาตรานี้ ท่านมิให้กระทบกระทั่งถึงการให้สัตยาบันแก่ลายมือชื่อซึ่งลงไว้โดยปราศจากอำนาจแต่หากไม่ถึงแก่เป็นลายมือปลอม"], "ป.พ.พ.|1754": ["", "ห้ามมิให้ฟ้องคดีมรดกเมื่อพ้นกำหนดหนึ่งปี นับแต่เมื่อเจ้ามรดกตาย หรือนับแต่เมื่อทายาทโดยธรรมได้รู้ หรือควรได้รู้ถึงความตายของเจ้ามรดก คดีฟ้องเรียกตามข้อกำหนดพินัยกรรม มิให้ฟ้องเมื่อพ้นกำหนดหนึ่งปีนับแต่เมื่อผู้รับพินัยกรรมได้รู้หรือควรได้รู้ถึงสิทธิซึ่งตนมีอยู่ตามพินัยกรรม ภายใต้บังคับแห่งมาตรา 193/27 แห่งประมวลกฎหมายนี้ ถ้าสิทธิเรียกร้องของเจ้าหนี้อันมีต่อเจ้ามรดกมีกำหนดอายุความยาวกว่าหนึ่งปี มิให้เจ้าหนี้นั้นฟ้องร้องเมื่อพ้นกำหนดหนึ่งปีนับแต่เมื่อเจ้าหนี้ได้รู้ หรือควรได้รู้ถึงความตายของเจ้ามรดก ถึงอย่างไรก็ดี สิทธิเรียกร้องตามที่ว่ามาในวรรคก่อน ๆ นั้น มิให้ฟ้องร้องเมื่อพ้นกำหนดสิบปีนับแต่เมื่อเจ้ามรดกตาย"], "ป.พ.พ.|880": ["", "ถ้าความวินาศภัยนั้นได้เกิดขึ้นเพราะการกระทำของบุคคลภายนอกไซร้ ผู้รับประกันภัยได้ใช้ค่าสินไหมทดแทนไปเป็นจำนวนเพียงใด ผู้รับประกันภัยย่อมเข้ารับช่วงสิทธิของผู้เอาประกันภัยและของผู้รับประโยชน์ซึ่งมีต่อบุคคลภายนอกเพียงนั้น ถ้าผู้รับประกันภัยได้ใช้ค่าสินไหมทดแทนไปแต่เพียงบางส่วนไซร้ ท่านห้ามมิให้ผู้รับประกันภัยนั้นใช้สิทธิของตนให้เสื่อมเสียสิทธิของผู้เอาประกันภัยหรือผู้รับประโยชน์ ในการที่เขาจะเรียกร้องเอาค่าสินไหมทดแทนจากบุคคลภายนอกเพื่อเศษแห่งจำนวนวินาศนั้น"], "ป.พ.พ.|1002": ["", "ในคดีที่ผู้ทรงตั๋วเงินฟ้องผู้สลักหลังและผู้สั่งจ่าย ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาปีหนึ่งนับแต่วันที่ได้ลงในคำคัดค้านซึ่งได้ทำขึ้นภายในเวลาอันถูกต้องตามกำหนด หรือนับแต่วันตั๋วเงินถึงกำหนด ในกรณีที่มีข้อกำหนดไว้ว่า “ไม่จำต้องมีคำคัดค้าน”"], "ป.พ.พ.|940": ["", "ผู้รับอาวัลย่อมต้องผูกพันเป็นอย่างเดียวกันกับบุคคลซึ่งตนประกัน แม้ถึงว่าความรับผิดใช้เงินอันผู้รับอาวัลได้ประกันอยู่นั้น จะตกเป็นใช้ไม่ได้ด้วยเหตุใด ๆ นอกจากเพราะทำผิดแบบระเบียบ ท่านว่าข้อที่สัญญารับอาวัลนั้นก็ยังคงสมบูรณ์ เมื่อผู้รับอาวัลได้ใช้เงินไปตามตั๋วแลกเงินแล้ว ย่อมได้สิทธิในอันจะไล่เบี้ยเอาแก่บุคคลซึ่งตนได้ประกันไว้ กับทั้งบุคคลทั้งหลายผู้รับผิดแทนตัวผู้นั้น"], "ป.พ.พ.|679": ["", "เจ้าสำนักชอบที่จะยึดหน่วงเครื่องเดินทางหรือทรัพย์สินอย่างอื่นของคนเดินทางหรือแขกอาศัยอันเอาไว้ในโรงแรม โฮเต็ล หรือสถานที่เช่นนั้นได้จนกว่าจะได้รับใช้เงินบรรดาที่ค้างชำระแก่ตน เพื่อการพักอาศัยและการอื่น ๆ อันได้ทำให้แก่คนเดินทางหรือแขกอาศัยตามที่เขาพึงต้องการนั้น รวมทั้งการชดใช้เงินทั้งหลายที่ได้ออกแทนไปด้วย เจ้าสำนักจะเอาทรัพย์สินที่ได้ยึดหน่วงไว้เช่นว่านั้นออกขายทอดตลาด แล้วหักเอาเงินใช้จำนวนที่ค้างชำระแก่ตน รวมทั้งค่าฤชาธรรมเนียมและค่าใช้จ่ายในการขายทอดตลาดนั้นจากเงินที่ขายทรัพย์สินนั้นก็ได้ แต่ท่านมิให้เจ้าสำนักใช้สิทธิดังว่านี้ จนเมื่อ (1) ทรัพย์สินนั้นตกอยู่แก่ตนเป็นเวลานานถึงหกสัปดาห์ยังมิได้รับชำระหนี้สิน และ (2) อย่างน้อยเดือนหนึ่งก่อนวันขายทอดตลาด ตนได้ประกาศโฆษณาในหนังสือพิมพ์ประจำท้องถิ่นฉบับหนึ่งแจ้งความจำนงที่จะขายทรัพย์สิน บอกลักษณะแห่งทรัพย์สินที่จะขายโดยย่อ กับถ้ารู้ชื่อเจ้าของ ก็บอกด้วย เมื่อขายทอดตลาดหักใช้หนี้ดังกล่าวแล้ว มีเงินเหลืออยู่อีกเท่าใดต้องคืนให้แก่เจ้าของ หรือฝากไว้ ณ สำนักงานฝากทรัพย์ตามบทบัญญัติในมาตรา 331 และมาตรา 333"], "ป.พ.พ.|458": ["", "กรรมสิทธิ์ในทรัพย์สินที่ขายนั้น ย่อมโอนไปยังผู้ซื้อตั้งแต่ขณะเมื่อได้ทำสัญญาซื้อขายกัน"], "ป.พ.พ.|699": ["", "การค้ำประกันเพื่อกิจการเนื่องกันไปหลายคราวไม่มีจำกัดเวลาเป็นคุณแก่เจ้าหนี้นั้น ท่านว่าผู้ค้ำประกันอาจเลิกเสียเพื่อคราวอันเป็นอนาคตได้ โดยบอกกล่าวความประสงค์นั้นแก่เจ้าหนี้ ในกรณีเช่นนี้ ท่านว่าผู้ค้ำประกันไม่ต้องรับผิดในกิจการที่ลูกหนี้กระทำลงภายหลังคำบอกกล่าวนั้นได้ไปถึงเจ้าหนี้"], "ป.พ.พ.|1312": [
