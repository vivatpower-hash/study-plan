  return 'ท่อง '+parts.join(' และ ')+' <span class=muted>('+t.n+' มาตรา รวมมาตราย่อย ทวิ, /1 ฯลฯ ในช่วงนี้)</span>';
}
const txt=(t,s)=>t.k===2?secText(t):(light(s)?t.l:t.f);
const dateOf=t=>st.moved[t.id]||t.date;
function taskHTML(t,s,carry){const done=st.done[t.id];
  return `<div class="task ${done?'done':''} ${carry?'carry':''}"><div class=n>${'๑๒๓'[t.k-1]}</div><div class=txt>${carry?'<span class=muted>ค้างจาก '+thd(dateOf(t))+'</span><br>':''}${txt(t,s)}</div><div class=btns>
  <button class="${done?'':'ok'}" onclick="tg(${t.id})">${done?'ยกเลิก':'เสร็จ'}</button>${done?'':`<button onclick="mv(${t.id})">ย้าย</button>`}</div></div>`}
function dayHTML(s,extra=''){const ts=st.tasks.filter(t=>dateOf(t)===s).sort((a,b)=>a.k-b.k);const L=light(s);const duty=st.duty.includes(s);
  const mock=ts.some(t=>t.mock)&&!L;
  return `<div class="day ${L?'light':''} ${mock?'mock':''} ${s===todayISO()?'today':''}" id="d${s}"><div class=dh><span>${thd(s)}</span><span><span class="tag ${duty?'duty':''}" onclick="dt('${s}')">${duty?'เวร':[0,6].includes(P(s).getUTCDay())?'เสาร์-อาทิตย์ (ดูลูก)':'วันว่าง'} ✎</span></span></div>
  <div class=muted>${L?'เน้นท่องมาตรา + ทำข้อสอบ':'ทบทวนเนื้อหา + ท่อง + เขียนตอบ'}</div>${extra}${ts.map(t=>taskHTML(t,s)).join('')||'<div class=muted>ไม่มีงาน</div>'}</div>`}
function view(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));const M=document.getElementById('main');const td=todayISO();
  const tot=st.tasks.length,dn=Object.keys(st.done).length;document.getElementById('hsub').textContent=`เสร็จแล้ว ${dn}/${tot} งาน · อีก ${Math.max(0,Math.round((P(st.exam)-P(td))/864e5))} วันถึงวันสอบ (${thd(st.exam)})`;document.getElementById('hbar').style.width=(100*dn/tot)+'%';
  if(v==='today'){const day=td<st.start?st.start:td;const carry=st.tasks.filter(t=>dateOf(t)<day&&!st.done[t.id]).sort((a,b)=>dateOf(a)<dateOf(b)?-1:1);
    const ch=carry.length?`<div class=sec>งานค้าง (ทำก่อน)</div>`+carry.map(t=>taskHTML(t,day,1)).join('')+`<div class=sec>งานของวันนี้</div>`:'';
    M.innerHTML=(td<st.start?'<div class=muted>แผนเริ่ม '+thd(st.start)+'</div>':'')+dayHTML(day,ch)+'<div class=sec>พรุ่งนี้</div>'+dayHTML(add(day,1))}
  else if(v==='all'){let h='';for(let s=st.start;s<st.exam;s=add(s,1))h+=dayHTML(s);M.innerHTML=h;const e=document.getElementById('d'+td);if(e)e.scrollIntoView()}
  else{M.innerHTML=`<div class=day><b>วันเข้าเวร</b><p class=muted>แตะป้ายวันในหน้า "ทั้งแผน" เพื่อสลับเป็นวันเวร งานของวันนั้นจะเปลี่ยนเป็นแบบเบา (ท่อง + ข้อสอบ 1 ข้อ) โดยเนื้อหายังล็อกเหมือนเดิม</p>
  <input type=date id=dd> <button class=pri onclick="dt(document.getElementById('dd').value)">สลับวันเวร</button><p class=muted>วันเวรตอนนี้: ${st.duty.sort().map(thd).join(', ')||'ยังไม่ได้ใส่'}</p></div>
  <div class=day><b>สำรองข้อมูล</b><p class=muted>ข้อมูลเก็บในเครื่องนี้เท่านั้น กดคัดลอกไว้เป็นระยะ</p><button onclick="navigator.clipboard.writeText(JSON.stringify({duty:st.duty,done:st.done,moved:st.moved}));alert('คัดลอกแล้ว')">คัดลอกข้อมูล</button> <button onclick="imp()">นำเข้าข้อมูล</button></div>
  <div class=day><b>ที่มาของ ★</b><p class=muted>ผช. = จำนวนปีที่ออกข้อสอบผู้ช่วยผู้พิพากษา (สถิติ Suthep 2541–2561 และ LawSiam 2541–2564) · อก. = จำนวนปีที่ออกข้อสอบอัยการผู้ช่วย (MUJI 2557–2565) · รายการ ๒ ท่องเฉพาะมาตราสำคัญของเรื่องเดียวกับรายการ ๑ ในวันนั้น · ช่วงท้ายท่องซ้ำ ★ ทุกประมวล</p></div>`}
  window._v=v}
function tg(id){if(st.done[id])delete st.done[id];else st.done[id]=todayISO();save();view(_v)}
function dt(s){if(!s)return;const i=st.duty.indexOf(s);i<0?st.duty.push(s):st.duty.splice(i,1);save();view(_v)}
function mv(id){const D=document.getElementById('dlg');document.getElementById('dlgb').innerHTML=`<b>ย้ายงานนี้ไป</b><p><button class=pri onclick="mvTo(${id},'${add(st.exam,-3)}')">ท้ายแผน (${thd(add(st.exam,-3))})</button></p><p>หรือวันที่ <input type=date id=md value="${add(todayISO(),1)}"> <button class=pri onclick="mvTo(${id},document.getElementById('md').value)">ย้าย</button></p><p><button onclick="document.getElementById('dlg').close()">ยกเลิก</button></p>`;D.showModal()}
function mvTo(id,s){if(s){st.moved[id]=s;save()}document.getElementById('dlg').close();view(_v)}
function imp(){const s=prompt('วางข้อมูลที่คัดลอกไว้');if(!s)return;try{const o=JSON.parse(s);Object.assign(st,{duty:o.duty||[],done:o.done||{},moved:o.moved||{}});save();view(_v)}catch(e){alert('ข้อมูลไม่ถูกต้อง')}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));view('today');
</script></body></html>
