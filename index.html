"", "บุคคลใดสร้างโรงเรือนรุกล้ำเข้าไปในที่ดินของผู้อื่นโดยสุจริตไซร้ ท่านว่าบุคคลนั้นเป็นเจ้าของโรงเรือนที่สร้างขึ้น แต่ต้องเสียเงินให้แก่เจ้าของที่ดินเป็นค่าใช้ที่ดินนั้น และจดทะเบียนสิทธิเป็นภาระจำยอม ต่อภายหลังถ้าโรงเรือนนั้นสลายไปทั้งหมด เจ้าของที่ดินจะเรียกให้เพิกถอนการจดทะเบียนเสียก็ได้ ถ้าบุคคลผู้สร้างโรงเรือนนั้นกระทำการโดยไม่สุจริต ท่านว่าเจ้าของที่ดินจะเรียกให้ผู้สร้างรื้อถอนไป และทำที่ดินให้เป็นตามเดิมโดยผู้สร้างเป็นผู้ออกค่าใช้จ่ายก็ได้"], "ป.พ.พ.|419": ["", "ในเรื่องลาภมิควรได้นั้น ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นกำหนดปีหนึ่งนับแต่เวลาที่ฝ่ายผู้เสียหายรู้ว่าตนมีสิทธิเรียกคืน หรือเมื่อพ้นสิบปีนับแต่เวลาที่สิทธินั้นได้มีขึ้น"], "ป.พ.พ.|643": ["", "ทรัพย์สินซึ่งยืมนั้น ถ้าผู้ยืมเอาไปใช้การอย่างอื่นนอกจากการอันเป็นปกติแก่ทรัพย์สินนั้น หรือนอกจากการอันปรากฏในสัญญาก็ดี เอาไปให้บุคคลภายนอกใช้สอยก็ดี เอาไปไว้นานกว่าที่ควรจะเอาไว้ก็ดี ท่านว่าผู้ยืมจะต้องรับผิดในเหตุทรัพย์สินนั้นสูญหายหรือบุบสลายไปอย่างหนึ่งอย่างใด แม้ถึงจะเป็นเพราะเหตุสุดวิสัย เว้นแต่จะพิสูจน์ได้ว่าถึงอย่างไร ๆ ทรัพย์สินนั้นก็คงจะต้องสูญหายหรือบุบสลายอยู่นั่นเอง"], "ป.พ.พ.|671": ["", "ในข้อความรับผิดเพื่อใช้เงินบำเหน็จค่าฝากทรัพย์ก็ดี ชดใช้เงินค่าใช้จ่ายก็ดี ใช้ค่าสินไหมทดแทนเกี่ยวแก่การฝากทรัพย์ก็ดี ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาหกเดือนนับแต่วันสิ้นสัญญา"], "ป.พ.พ.|1151": ["", "อันผู้เป็นกรรมการนั้น เฉพาะแต่ที่ประชุมใหญ่เท่านั้นอาจจะตั้งหรือถอนได้"], "ป.พ.พ.|8": ["", "คำว่า “เหตุสุดวิสัย” หมายความว่า เหตุใด ๆ อันจะเกิดขึ้นก็ดี จะให้ผลพิบัติก็ดี เป็นเหตุที่ไม่อาจป้องกันได้แม้ทั้งบุคคลผู้ต้องประสบหรือใกล้จะต้องประสบเหตุนั้น จะได้จัดการระมัดระวังตามสมควรอันพึงคาดหมายได้จากบุคคลในฐานะและภาวะเช่นนั้น"], "ป.พ.พ.|851": ["", "อันสัญญาประนีประนอมยอมความนั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อฝ่ายที่ต้องรับผิด หรือลายมือชื่อตัวแทนของฝ่ายนั้นเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่"], "ป.พ.พ.|205": ["", "ตราบใดการชำระหนี้นั้นยังมิได้กระทำลงเพราะพฤติการณ์อันใดอันหนึ่งซึ่งลูกหนี้ไม่ต้องรับผิดชอบ ตราบนั้นลูกหนี้ยังหาได้ชื่อว่าผิดนัดไม่"], "ป.พ.พ.|675": ["", "เจ้าสำนักต้องรับผิดในการที่ทรัพย์สินของคนเดินทางหรือแขกอาศัยสูญหายหรือบุบสลายไปอย่างใด ๆ แม้ถึงว่าความสูญหายหรือบุบสลายนั้นจะเกิดขึ้นเพราะผู้คนไปมาเข้าออก ณ โรงแรม โฮเต็ล หรือสถานที่เช่นนั้น ก็คงต้องรับผิด ความรับผิดนี้ ถ้าเกี่ยวด้วยเงินทองตรา ธนบัตร ตั๋วเงิน พันธบัตร ใบหุ้น ใบหุ้นกู้ ประทวนสินค้า อัญมณี หรือของมีค่าอื่น ๆ ให้จำกัดไว้เพียงห้าพันบาท เว้นแต่จะได้ฝากของมีค่าเช่นนี้ไว้แก่เจ้าสำนักและได้บอกราคาแห่งของนั้นชัดแจ้ง แต่เจ้าสำนักไม่ต้องรับผิดเพื่อความสูญหายหรือบุบสลายอันเกิดแต่เหตุสุดวิสัย หรือแต่สภาพแห่งทรัพย์สินนั้น หรือแต่ความผิดของคนเดินทาง หรือแขกอาศัยผู้นั้นเอง หรือบริวารของเขา หรือบุคคลซึ่งเขาได้ต้อนรับ"], "ป.พ.พ.|519": ["", "บทบัญญัติทั้งหลายในลักษณะซื้อขายนั้น ท่านให้ใช้ถึงการแลกเปลี่ยนด้วย โดยให้ถือว่าผู้เป็นคู่สัญญาแลกเปลี่ยนเป็นผู้ขายในส่วนทรัพย์สินซึ่งตนได้ส่งมอบ และเป็นผู้ซื้อในส่วนทรัพย์สินซึ่งตนได้รับในการแลกเปลี่ยนนั้น"], "ป.พ.พ.|1390": ["", "ท่านมิให้เจ้าของภารยทรัพย์ประกอบกรรมใด ๆ อันจะเป็นเหตุให้ประโยชน์แห่งภาระจำยอมลดไปหรือเสื่อมความสะดวก"], "ป.พ.พ.|1468": ["", "ข้อความในสัญญาก่อนสมรสไม่มีผลกระทบกระเทือนถึงสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริตไม่ว่าจะได้เปลี่ยนแปลงเพิกถอนโดยคำสั่งของศาลหรือไม่ก็ตาม"], "ป.พ.พ.|7": ["", "ถ้าจะต้องเสียดอกเบี้ยแก่กันและมิได้กำหนดอัตราดอกเบี้ยไว้โดยนิติกรรมหรือโดยบทกฎหมายอันชัดแจ้ง ให้ใช้อัตราร้อยละสามต่อปี อัตราตามวรรคหนึ่งอาจปรับเปลี่ยนให้ลดลงหรือเพิ่มขึ้นเพื่อให้สอดคล้องกับสภาพเศรษฐกิจของประเทศได้โดยตราเป็นพระราชกฤษฎีกา โดยปกติให้กระทรวงการคลังพิจารณาทบทวนทุกสามปีให้ใกล้เคียงกับอัตราเฉลี่ยระหว่างอัตราดอกเบี้ยเงินฝากกับอัตราดอกเบี้ยเงินให้กู้ยืมของธนาคารพาณิชย์"], "ป.พ.พ.|1375": ["", "ถ้าผู้ครอบครองถูกแย่งการครอบครองโดยมิชอบด้วยกฎหมายไซร้ ท่านว่าผู้ครอบครองมีสิทธิจะได้คืนซึ่งการครอบครอง เว้นแต่อีกฝ่ายหนึ่งมีสิทธิเหนือทรัพย์สินดีกว่าซึ่งจะเป็นเหตุให้เรียกคืนจากผู้ครอบครองได้ การฟ้องคดีเพื่อเอาคืนซึ่งการครอบครองนั้น ท่านว่าต้องฟ้องภายในปีหนึ่งนับแต่เวลาถูกแย่งการครอบครอง"], "ป.พ.พ.|36": ["", "ถ้าเหตุที่ศาลได้สั่งให้เป็นคนเสมือนไร้ความสามารถได้สิ้นสุดไปแล้ว ให้นำบทบัญญัติมาตรา 31 มาใช้บังคับโดยอนุโลม"], "ป.พ.พ.|1546": ["", "เด็กเกิดจากหญิงที่มิได้มีการสมรสกับชาย ให้ถือว่าเป็นบุตรชอบด้วยกฎหมายของหญิงนั้น เว้นแต่จะมีกฎหมายบัญญัติไว้เป็นอย่างอื่น"], "ป.พ.พ.|865": ["", "ถ้าในเวลาทำสัญญาประกันภัย ผู้เอาประกันภัยก็ดี หรือในกรณีประกันชีวิต บุคคลอันการใช้เงินย่อมอาศัยความทรงชีพหรือมรณะของเขานั้นก็ดี รู้อยู่แล้วละเว้นเสียไม่เปิดเผยข้อความจริงซึ่งอาจจะได้จูงใจผู้รับประกันภัยให้เรียกเบี้ยประกันภัยสูงขึ้นอีกหรือให้บอกปัดไม่ยอมทำสัญญา หรือว่ารู้อยู่แล้วแถลงข้อความนั้นเป็นความเท็จไซร้ ท่านว่าสัญญานั้นเป็นโมฆียะ ถ้ามิได้ใช้สิทธิบอกล้างภายในกำหนดเดือนหนึ่งนับแต่วันที่ผู้รับประกันภัยทราบมูลอันจะบอกล้างได้ก็ดี หรือมิได้ใช้สิทธินั้นภายในกำหนดห้าปีนับแต่วันทำสัญญาก็ดี ท่านว่าสิทธินั้นเป็นอันระงับสิ้นไป"], "ป.พ.พ.|1185": ["", "ผู้ถือหุ้นคนใดมีส่วนได้เสียเป็นพิเศษในข้ออันใดซึ่งที่ประชุมจะลงมติ ท่านห้ามมิให้ผู้ถือหุ้นคนนั้นออกเสียงลงคะแนนด้วยในข้อนั้น"], "ป.พ.พ.|989": ["", "บทบัญญัติทั้งหลายในหมวด 2 อันว่าด้วยตั๋วแลกเงินดังจะกล่าวต่อไปนี้ ท่านให้ยกมาบังคับในเรื่องเช็คเพียงเท่าที่ไม่ขัดกับสภาพแห่งตราสารชนิดนี้ คือบทมาตรา 910 มาตรา 914 ถึงมาตรา 923 มาตรา 925 มาตรา 926 มาตรา 938 ถึงมาตรา 940 มาตรา 945 มาตรา 946 มาตรา 959 มาตรา 967 มาตรา 971 ถ้าเป็นเช็คที่ออกมาแต่ต่างประเทศ ท่านให้นำบทบัญญัติดังต่อไปนี้มาใช้บังคับด้วย คือบทมาตรา 924 มาตรา 960 ถึงมาตรา 964 มาตรา 973 ถึงมาตรา 977 มาตรา 980"], "ป.พ.พ.|488": ["", "ถ้าผู้ซื้อพบเห็นความชำรุดบกพร่องในทรัพย์สินซึ่งตนได้รับซื้อ ผู้ซื้อชอบที่จะยึดหน่วงราคาที่ยังไม่ได้ชำระไว้ได้ทั้งหมดหรือแต่บางส่วน เว้นแต่ผู้ขายจะหาประกันที่สมควรให้ได้"], "ป.พ.พ.|148": ["", "ดอกผลของทรัพย์ ได้แก่ ดอกผลธรรมดาและดอกผลนิตินัย ดอกผลธรรมดา หมายความว่า สิ่งที่เกิดขึ้นตามธรรมชาติของทรัพย์ ซึ่งได้มาจากตัวทรัพย์ โดยการมีหรือใช้ทรัพย์นั้นตามปกตินิยม และสามารถถือเอาได้เมื่อขาดจากทรัพย์นั้น ดอกผลนิตินัย หมายความว่า ทรัพย์หรือประโยชน์อย่างอื่นที่ได้มาเป็นครั้งคราวแก่เจ้าของทรัพย์จากผู้อื่นเพื่อการที่ได้ใช้ทรัพย์นั้น และสามารถคำนวณและถือเอาได้เป็นรายวันหรือตามระยะเวลาที่กำหนดไว้"], "ป.พ.พ.|1704": ["", "พินัยกรรมซึ่งบุคคลผู้ถูกศาลสั่งให้เป็นคนไร้ความสามารถทำขึ้นนั้น เป็นโมฆะ พินัยกรรมซึ่งบุคคลผู้ถูกอ้างว่าเป็นคนวิกลจริต แต่ศาลยังไม่ได้สั่งให้เป็นคนไร้ความสามารถทำขึ้นนั้น จะเป็นอันเสียเปล่าก็แต่เมื่อพิสูจน์ได้ว่าในเวลาที่ทำพินัยกรรมนั้นผู้ทำจริตวิกลอยู่"], "ป.พ.พ.|651": ["", "ค่าฤชาธรรมเนียมในการทำสัญญาก็ดี ค่าส่งมอบและส่งคืนทรัพย์สินซึ่งยืมก็ดี ย่อมตกแก่ผู้ยืมเป็นผู้เสีย"], "ป.พ.พ.|1331": ["", "สิทธิของบุคคลผู้ได้เงินตรามาโดยสุจริตนั้น ท่านว่ามิเสียไป ถึงแม้ภายหลังจะพิสูจน์ได้ว่าเงินนั้นมิใช่ของบุคคลซึ่งได้โอนให้มา"], "ป.พ.พ.|203": ["", "ถ้าเวลาอันจะพึงชำระหนี้นั้นมิได้กำหนดลงไว้ หรือจะอนุมานจากพฤติการณ์ทั้งปวงก็ไม่ได้ไซร้ ท่านว่าเจ้าหนี้ย่อมจะเรียกให้ชำระหนี้ได้โดยพลัน และฝ่ายลูกหนี้ก็ย่อมจะชำระหนี้ของตนได้โดยพลันดุจกัน ถ้าได้กำหนดเวลาไว้ แต่หากกรณีเป็นที่สงสัย ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าหนี้จะเรียกให้ชำระหนี้ก่อนถึงเวลานั้นหาได้ไม่ แต่ฝ่ายลูกหนี้จะชำระหนี้ก่อนกำหนดนั้นก็ได้"], "ป.พ.พ.|1529": ["", "สิทธิฟ้องร้องโดยอาศัยเหตุในมาตรา 1516 (1) (2) (3) หรือ (6) หรือมาตรา 1523 ย่อมระงับไปเมื่อพ้นกำหนดหนึ่งปีนับแต่วันผู้กล่าวอ้างรู้หรือควรรู้ความจริงซึ่งตนอาจยกขึ้นกล่าวอ้าง เหตุอันจะยกขึ้นฟ้องหย่าไม่ได้แล้วนั้น อาจนำสืบสนับสนุนคดีฟ้องหย่าซึ่งอาศัยเหตุอย่างอื่น"], "ป.พ.พ.|1469": ["", "สัญญาที่เกี่ยวกับทรัพย์สินใดที่คู่สมรสได้ทำไว้ต่อกันในระหว่างเป็นคู่สมรสกันนั้น ฝ่ายใดฝ่ายหนึ่งจะบอกล้างเสียในเวลาใดที่เป็นคู่สมรสกันอยู่หรือภายในกำหนดหนึ่งปีนับแต่วันที่ขาดจากการเป็นคู่สมรสกันก็ได้ แต่ไม่กระทบกระเทือนถึงสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริต"], "ป.พ.พ.|1337": ["", "บุคคลใดใช้สิทธิของตนเป็นเหตุให้เจ้าของอสังหาริมทรัพย์ได้รับความเสียหาย หรือเดือดร้อนเกินที่ควรคิดหรือคาดหมายได้ว่าจะเป็นไปตามปกติและเหตุอันควรในเมื่อเอาสภาพและตำแหน่งที่อยู่แห่งทรัพย์สินนั้นมาคำนึงประกอบไซร้ ท่านว่าเจ้าของอสังหาริมทรัพย์มีสิทธิจะปฏิบัติการเพื่อยังความเสียหายหรือเดือนร้อนนั้นให้สิ้นไป ทั้งนี้ ไม่ลบล้างสิทธิที่จะเรียกเอาค่าทดแทน"], "ป.พ.พ.|140": ["", "สังหาริมทรัพย์ หมายความว่า ทรัพย์สินอื่นนอกจากอสังหาริมทรัพย์ และหมายความรวมถึงสิทธิอันเกี่ยวกับทรัพย์สินนั้นด้วย"], "ป.พ.พ.|939": ["", "อันการรับอาวัลย่อมทำให้กันด้วยเขียนลงในตั๋วเงินนั้นเอง หรือที่ใบประจำต่อ ในการนี้พึงใช้ถ้อยคำสำนวนว่า “ใช้ได้เป็นอาวัล” หรือสำนวนอื่นใดทำนองเดียวกันนั้น และลงลายมือชื่อผู้รับอาวัล อนึ่ง เพียงแต่ลงลายมือชื่อของผู้รับอาวัลในด้านหน้าแห่งตั๋วเงิน ท่านก็จัดว่าเป็นคำรับอาวัลแล้ว เว้นแต่ในกรณีที่เป็นลายมือชื่อของผู้จ่ายหรือผู้สั่งจ่าย ในคำรับอาวัลต้องระบุว่ารับประกันผู้ใด หากมิได้ระบุ ท่านให้ถือว่ารับประกันผู้สั่งจ่าย"], "ป.พ.พ.|523": ["", "การให้นั้น ท่านว่าย่อมสมบูรณ์ต่อเมื่อส่งมอบทรัพย์สินที่ให้"], "ป.พ.พ.|381": ["", "ถ้าลูกหนี้ได้สัญญาไว้ว่าจะให้เบี้ยปรับเมื่อตนไม่ชำระหนี้ให้ถูกต้องสมควร เช่นว่าไม่ชำระหนี้ตรงตามเวลาที่กำหนดไว้เป็นต้น นอกจากเรียกให้ชำระหนี้ เจ้าหนี้จะเรียกเอาเบี้ยปรับอันจะพึงริบนั้นอีกด้วยก็ได้ ถ้าเจ้าหนี้มีสิทธิเรียกร้องค่าสินไหมทดแทนในมูลชำระหนี้ไม่ถูกต้องสมควร ท่านให้บังคับตามบทบัญญัติแห่งมาตรา 380 วรรคสอง ถ้าเจ้าหนี้ยอมรับชำระหนี้แล้ว จะเรียกเอาเบี้ยปรับได้ต่อเมื่อได้บอกสงวนสิทธิไว้เช่นนั้นในเวลารับชำระหนี้"], "ป.พ.พ.|5": ["", "ในการใช้สิทธิแห่งตนก็ดี ในการชำระหนี้ก็ดี บุคคลทุกคนต้องกระทำโดยสุจริต"], "ป.พ.พ.|1340": ["", "เจ้าของที่ดินจำต้องรับน้ำซึ่งไหลเพราะระบายจากที่ดินสูงมาในที่ดินของตน ถ้าก่อนที่ระบายนั้นน้ำได้ไหลเข้ามาในที่ดินของตนตามธรรมดาอยู่แล้ว ถ้าได้รับความเสียหายเพราะการระบายน้ำ ท่านว่าเจ้าของที่ดินต่ำอาจเรียกร้องให้เจ้าของที่ดินสูงทำทางระบายน้ำและออกค่าใช้จ่ายในการนั้น เพื่อระบายน้ำไปให้ตลอดที่ดินต่ำจนถึงทางน้ำ หรือท่อน้ำสาธารณะ ทั้งนี้ ไม่ลบล้างสิทธิแห่งเจ้าของที่ดินต่ำในอันจะเรียกเอาค่าทดแทน"], "ป.พ.พ.|677": ["", "ถ้ามีคำแจ้งความปิดไว้ในโรงแรม โฮเต็ล หรือสถานที่อื่นทำนองเช่นว่านี้ เป็นข้อความยกเว้นหรือจำกัดความรับผิดของเจ้าสำนักไซร้ ท่านว่าความนั้นเป็นโมฆะ เว้นแต่คนเดินทางหรือแขกอาศัยจะได้ตกลงด้วยชัดแจ้งในการยกเว้นหรือจำกัดความรับผิดดังว่านั้น"], "ป.พ.พ.|494": ["", "ท่านห้ามมิให้ใช้สิทธิไถ่ทรัพย์สินซึ่งขายฝากเมื่อพ้นเวลาดังจะกล่าวต่อไปนี้ (1) ถ้าเป็นอสังหาริมทรัพย์ กำหนดสิบปีนับแต่เวลาซื้อขาย (2) ถ้าเป็นสังหาริมทรัพย์ กำหนดสามปีนับแต่เวลาซื้อขาย"], "ป.พ.พ.|650": ["", "อันว่ายืมใช้สิ้นเปลืองนั้น คือสัญญาซึ่งผู้ให้ยืมโอนกรรมสิทธิ์ในทรัพย์สินชนิดใช้ไปสิ้นไปนั้นเป็นปริมาณมีกำหนดให้ไปแก่ผู้ยืม และผู้ยืมตกลงว่าจะคืนทรัพย์สินเป็นประเภท ชนิด และปริมาณเช่นเดียวกันให้แทนทรัพย์สินซึ่งให้ยืมนั้น สัญญานี้ย่อมบริบูรณ์ต่อเมื่อส่งมอบทรัพย์สินที่ยืม"], "ป.พ.พ.|1001": ["", "ในคดีฟ้องผู้รับรองตั๋วแลกเงินก็ดี ผู้ออกตั๋วสัญญาใช้เงินก็ดี ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาสามปีนับแต่วันตั๋วนั้น ๆ ถึงกำหนดใช้เงิน"], "ป.พ.พ.|1620": ["", "ถ้าผู้ใดตายโดยไม่ได้ทำพินัยกรรมไว้หรือทำพินัยกรรมไว้แต่ไม่มีผลบังคับได้ ให้ปันทรัพย์มรดกทั้งหมดแก่ทายาทโดยธรรมของผู้ตายนั้นตามกฎหมาย ถ้าผู้ใดตายโดยได้ทำพินัยกรรมไว้ แต่พินัยกรรมนั้นจำหน่ายทรัพย์หรือมีผลบังคับได้แต่เพียงบางส่วนแห่งทรัพย์มรดก ให้ปันส่วนที่มิได้จำหน่ายโดยพินัยกรรม หรือส่วนที่พินัยกรรมไม่มีผลบังคับให้แก่ทายาทโดยธรรมตามกฎหมาย"], "ป.พ.พ.|474": ["", "ในข้อรับผิดเพื่อชำรุดบกพร่องนั้น ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นเวลาปีหนึ่งนับแต่เวลาที่ได้พบเห็นความชำรุดบกพร่อง"], "ป.พ.พ.|1350": ["", "ถ้าที่ดินแบ่งแยกหรือแบ่งโอนกันเป็นเหตุให้แปลงหนึ่งไม่มีทางออกไปสู่ทางสาธารณะไซร้ ท่านว่าเจ้าของที่ดินแปลงนั้นมีสิทธิเรียกร้องเอาทางเดินตามมาตราก่อนได้เฉพาะบนที่ดินแปลงที่ได้แบ่งแยกหรือแบ่งโอนกันและไม่ต้องเสียค่าทดแทน"], "ป.พ.พ.|479": ["", "ถ้าทรัพย์สินซึ่งซื้อขายกันหลุดไปจากผู้ซื้อทั้งหมดหรือแต่บางส่วน เพราะเหตุการรอนสิทธิก็ดี หรือว่าทรัพย์สินนั้นตกอยู่ในบังคับแห่งสิทธิอย่างหนึ่งอย่างใดซึ่งเป็นเหตุให้เสื่อมราคา หรือเสื่อมความเหมาะสมแก่การที่จะใช้ หรือเสื่อมความสะดวกในการใช้สอย หรือเสื่อมประโยชน์อันจะพึงได้แต่ทรัพย์สินนั้น และซึ่งผู้ซื้อหาได้รู้ในเวลาซื้อขายไม่ก็ดี ท่านว่าผู้ขายต้องรับผิด"], "ป.พ.พ.|473": ["", "ผู้ขายย่อมไม่ต้องรับผิดในกรณีดังจะกล่าวต่อไปนี้ คือ (1) ถ้าผู้ซื้อได้รู้อยู่แล้วแต่ในเวลาซื้อขายว่ามีความชำรุดบกพร่อง หรือควรจะได้รู้เช่นนั้นหากได้ใช้ความระมัดระวังอันจะพึงคาดหมายได้แต่วิญญูชน (2) ถ้าความชำรุดบกพร่องนั้นเป็นอันเห็นประจักษ์แล้วในเวลาส่งมอบ และผู้ซื้อรับเอาทรัพย์สินนั้นไว้โดยมิได้อิดเอื้อน (3) ถ้าทรัพย์สินนั้นได้ขายทอดตลาด"], "ป.พ.พ.|137": ["", "ทรัพย์ หมายความว่า วัตถุมีรูปร่าง"], "ป.พ.พ.|417": ["", "ในส่วนค่าใช้จ่ายอย่างอื่นนอกจากที่กล่าวมาในวรรคต้นแห่งมาตราก่อนนั้น บุคคลผู้คืนทรัพย์สินจะเรียกให้ชดใช้ได้แต่เฉพาะที่เสียไปในระหว่างที่ตนทำการโดยสุจริต และเมื่อทรัพย์สินนั้นได้มีราคาเพิ่มสูงขึ้นเพราะค่าใช้จ่ายนั้นในเวลาที่คืน และจะเรียกได้ก็แต่เพียงเท่าราคาที่เพิ่มขึ้นเท่านั้น อนึ่ง บทบัญญัติแห่งมาตรา 415 วรรคสอง นั้น ท่านให้นำมาใช้บังคับด้วย แล้วแต่กรณี"], "ป.พ.พ.|877": ["", "ผู้รับประกันภัยจำต้องใช้ค่าสินไหมทดแทนดังจะกล่าวต่อไปนี้ คือ (1) เพื่อจำนวนวินาศภัยอันแท้จริง (2) เพื่อความบุบสลายอันเกิดแก่ทรัพย์สินซึ่งได้เอาประกันภัยไว้เพราะได้จัดการตามสมควรเพื่อป้องปัดความวินาศภัย (3) เพื่อบรรดาค่าใช้จ่ายอันสมควรซึ่งได้เสียไปเพื่อรักษาทรัพย์สินซึ่งเอาประกันภัยไว้นั้นมิให้วินาศ อันจำนวนวินาศจริงนั้น ท่านให้ตีราคา ณ สถานที่และในเวลาซึ่งเหตุวินาศภัยนั้นได้เกิดขึ้น อนึ่ง จำนวนเงินซึ่งได้เอาประกันภัยไว้นั้น ท่านให้สันนิษฐานไว้ก่อนว่าเป็นหลักประมาณอันถูกต้องในการตีราคาเช่นว่านั้น ท่านห้ามมิให้คิดค่าสินไหมทดแทนเกินไปกว่าจำนวนเงินซึ่งเอาประกันภัยไว้"], "ป.พ.พ.|563": ["", "คดีอันผู้ให้เช่าจะฟ้องผู้เช่าเกี่ยวแก่สัญญาเช่านั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นกำหนดหกเดือนนับแต่วันส่งคืนทรัพย์สินที่เช่า"], "ป.พ.พ.|1489": ["", "ถ้าคู่สมรสเป็นลูกหนี้ร่วมกัน ให้ชำระหนี้นั้นจากสินสมรสและสินส่วนตัวของทั้งสองฝ่าย"], "ป.พ.พ.|388": ["", "ถ้าวัตถุที่ประสงค์แห่งสัญญานั้น ว่าโดยสภาพหรือโดยเจตนาที่คู่สัญญาได้แสดงไว้ จะเป็นผลสำเร็จได้ก็แต่ด้วยการชำระหนี้ ณ เวลามีกำหนดก็ดี หรือภายในระยะเวลาอันใดอันหนึ่งซึ่งกำหนดไว้ก็ดี และกำหนดเวลาหรือระยะเวลานั้นได้ล่วงพ้นไปโดยฝ่ายใดฝ่ายหนึ่งมิได้ชำระหนี้ไซร้ ท่านว่าอีกฝ่ายหนึ่งจะเลิกสัญญานั้นเสียก็ได้ มิพักต้องบอกกล่าวดังว่าไว้ในมาตราก่อนนั้นเลย"]};
const GK='judgeplan_game_v1';let G=JSON.parse(localStorage.getItem(GK)||'{"m":"y","p":{}}'),gCur=null,gLast=null;
const thn=x=>String(x).replace(/\d/g,d=>'๐๑๒๓๔๕๖๗๘๙'[d]);
function gParse(){const C='(ป\\.วิ\\.พ\\.|ป\\.วิ\\.อ\\.|ป\\.พ\\.พ\\.|ป\\.อ\\.|ธรรมนูญ)',N='\\d+(?:/\\d+)?(?:ทวิ|ตรี|จัตวา|เบญจ)?';
  const days=[];for(const r of DATA.plan.rows){const t=r[5]||'';if(!t.includes('ท่อง'))continue;
    const [body,tail='']=t.split('ออกบ่อย');const b=body.split(' = ')[0];const re=new RegExp(C+'|เซต([^:|]+):|ม\\.\\s*('+N+')|,\\s*('+N+')|([|+·])','g');
    let code=null,set='',inm=0,m;const out=[];
    while(m=re.exec(b)){if(m[1]){code=m[1];inm=0}else if(m[2]){set=m[2].trim();inm=0}else if(m[3]){inm=1;code&&out.push({c:code,n:m[3],set})}else if(m[4]&&inm){code&&out.push({c:code,n:m[4],set})}else inm=0}
    const def=out[0]&&out[0].c,stars=new Set();const r2=new RegExp('★'+C+'?\\s*ม\\.\\s*('+N+')','g');while(m=r2.exec(tail))stars.add((m[1]||def)+'|'+m[2]);
    if(out.length)days.push({d:r[0],it:out.map(o=>Object.assign(o,{k:o.c+'|'+o.n,star:stars.has(o.c+'|'+o.n)}))});}
  return days}
const gDays=gParse();
function gPool(){const td=todayISO();let L=[];
  if(G.m==='y'){const prev=gDays.filter(x=>x.d<td);L=(prev.length?prev[prev.length-1]:gDays.find(x=>x.d>=td)||gDays[0]).it}
  else{const u={};const ds=gDays.filter(x=>x.d<=td);for(const x of(ds.length?ds:gDays.slice(0,1)))for(const o of x.it)if(!u[o.k]||o.star)u[o.k]=o;L=Object.values(u)}
  const u={};for(const o of L)if(!u[o.k]||o.star)u[o.k]=o;return Object.values(u)}
const gW=o=>Math.max(1,(G.p[o.k]||{}).w||1)+(o.star?2:0);
function gPick(){let L=gPool();if(L.length>1)L=L.filter(o=>o.k!==gLast);let t=L.reduce((a,o)=>a+gW(o),0),r=Math.random()*t;for(const o of L){r-=gW(o);if(r<=0)return o}return L[0]}
function gSave(){localStorage.setItem(GK,JSON.stringify(G))}
function gMode(m){G.m=m;gSave();gCur=null;gameView()}
function gAns(ok){const p=G.p[gCur.k]||(G.p[gCur.k]={w:1,ok:0,ng:0});ok?(p.ok++,p.w=Math.max(1,p.w-1)):(p.ng++,p.w+=3);gSave();gLast=gCur.k;gCur=null;gameView()}
function gameView(rev){const M=document.getElementById('main');if(!gCur)gCur=gPick();const o=gCur,L=gPool();
  const known=L.filter(x=>{const p=G.p[x.k];return p&&p.ok>p.ng}).length;const T=(typeof LAWTXT!=='undefined'&&LAWTXT[o.k])||null;
  const tb=(m,l)=>`<button class="${G.m===m?'pri':''}" onclick="gMode('${m}')">${l}</button>`;
  M.innerHTML=`<div class=day style="text-align:center"><div style="display:flex;gap:6px;justify-content:center">${tb('y','ชุดเมื่อวาน')}${tb('a','สุ่มทั้งหมด')}</div>
  <div class=muted style="margin-top:6px">จำได้ ${thn(known)}/${thn(L.length)} มาตรา</div>
  <div style="font-size:15px;color:#667;margin-top:22px">${o.c}${o.star?' <span class=star>★ ออกบ่อย</span>':''}</div>
  <div style="font-size:44px;font-weight:800;margin:6px 0 22px">มาตรา ${thn(o.n)}</div>
  ${rev?`<div style="text-align:left;background:#f7f9fc;border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.6">${T?`<b>${T[0]||o.set||''}</b><br>${thn(T[1]).replace(/\n/g,'<br>')}`:'<span class=muted>ยังไม่มีตัวบท</span>'}</div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><button class=ok style="font-size:16px;padding:10px 16px" onclick="gAns(1)">✅ จำได้</button><button style="font-size:16px;padding:10px 16px;background:#d9534f;color:#fff" onclick="gAns(0)">❌ ยังไม่แม่น</button></div>`
  :`<button class=pri style="font-size:16px;padding:10px 22px" onclick="gameView(1)">เฉลย</button>`}</div>`}

// ===== ข้อสอบเก่า (โจทย์จริงจากหน้าเว็บสาธารณะ · ไม่มีธงคำตอบ) =====
const QS=DATA.qs||[];const QSUB=['วิแพ่ง','วิอาญา','วิแขวง','พยาน','รัฐธรรมนูญ','พระธรรมนูญ','ปกครอง','องค์กรอัยการ','อังกฤษ','วิชาเลือก','ล้มละลาย','แพ่ง','อาญา'];
const qLab=q=>`${q.exam==='ผช.'?'ผู้ช่วยผู้พิพากษา':'อัยการผู้ช่วย'} ปี ${q.year} · ${q.subject}${q.no?' ข้อ '+q.no:''}`;
function qSubOf(x){if(/อัยการ/.test(x.replace(/อก\./g,''))&&/องค์กร|พ\.ร\.บ\.อัยการ|พรบ อัยการ/.test(x))return 'องค์กรอัยการ';if(/อังกฤษ/.test(x))return 'อังกฤษ';for(const k of QSUB)if(x.includes(k))return k;return ''}
function qSegs(text){const tx=String(text).replace(/<[^>]+>/g,'');const parts=[];let d=0,cur='';
  for(let i=0;i<tx.length;i++){const c=tx[i];if(c==='(')d++;if(c===')')d=Math.max(0,d-1);if(d===0&&c==='+'&&tx[i-1]===' '&&tx[i+1]===' '){parts.push(cur);cur=''}else cur+=c}parts.push(cur);
  const out=[];for(const seg of parts){const head=seg.split(/[(:]/)[0];const sub=qSubOf(head)||qSubOf(seg.split('(')[0])||'';const want=[];let m;
    const re=/(ผช|อก)\.\s*ปี\s*([\d,\s]+)/g;while(m=re.exec(seg))for(const y of m[2].split(/[,\s]+/).filter(Boolean))want.push({exam:m[1]+'.',year:+y});
    const re2=/(ผู้ช่วยฯ|อัยการ)\s*ปี\s*(\d{4})/g;while(m=re2.exec(seg))want.push({exam:m[1]==='อัยการ'?'อก.':'ผช.',year:+m[2],all:1});
    const tp=(seg.match(/\(([^;)]*)/)||seg.match(/เทียบธง:\s*([^;]*)/)||[])[1]||'';const g={seg,sub,want,topic:tp.split('/').map(s=>s.trim()).filter(s=>s.length>1)};
    if(!sub&&want.length&&out.length&&!want.some(w=>w.all))out[out.length-1].want.push(...want);else if(sub||want.length)out.push(g)}
  return out}
function qAlt(sub,topic,skip){const base=sub==='วิชาเลือก'?QS.filter(q=>q.subject==='ล้มละลาย'):QS.filter(q=>q.subject===sub);
  const sc=q=>topic.reduce((a,k)=>a+((q.topic||'').includes(k)?3:0)+(q.text.includes(k)?1:0),0);
  return base.filter(q=>!skip.has(q.id)).map(q=>[sc(q),q]).sort((a,b)=>b[0]-a[0]||b[1].year-a[1].year).map(x=>x[1])}
function qOpen(tid){const t=st.tasks[tid];const S=qSegs(t.l||t.f);let h=`<b>📄 โจทย์สำหรับงาน ๓ · ${thd(dateOf(t))}</b>`;
  if(!S.length)h+='<p class=miss>งานนี้ไม่ได้ระบุวิชา/ปีของข้อสอบ · เลือกเองได้ที่แท็บ 📄 ข้อสอบ</p>';
  for(const g of S){const got=new Set();h+=`<div class=qi><b>${esc(g.sub||'?')}</b>${g.topic.length?' <span class=muted>('+esc(g.topic.join('/'))+')</span>':''}`;
    for(const w of g.want){const L=QS.filter(q=>q.exam===w.exam&&q.year===w.year&&(w.all||!g.sub||q.subject===g.sub||(g.sub==='วิชาเลือก'&&q.subject==='ล้มละลาย')));L.forEach(q=>got.add(q.id));
      h+=L.length?`<div>✅ ${w.exam} ปี ${w.year}: ${L.map(q=>`<button class=pri onclick="qShow('${q.id}')">${q.no?'ข้อ '+q.no:'เปิด'}</button>`).join('')}</div>`
       :`<div class=miss>⛔ ${w.exam} ปี ${w.year} ${w.all?'(ทั้งชุด)':esc(g.sub)}: ยังไม่มีโจทย์ปีนี้ (ไม่พบตัวโจทย์บนหน้าเว็บสาธารณะ ฉบับเต็มอยู่หลังล็อกอิน/ในหนังสือ)</div>`}
    if(!g.want.length)h+=`<div class=miss>แผนไม่ได้ระบุปี</div>`;
    const A2=g.sub?qAlt(g.sub,g.topic,got).slice(0,4):[];
    if(A2.length)h+=`<div class=muted style="margin-top:4px">โจทย์จริงปีอื่น เรื่องใกล้เคียง (ไม่ใช่ปีที่แผนระบุ):</div>`+A2.map(q=>`<div><button onclick="qShow('${q.id}')">${esc(qLab(q))}</button></div>`).join('');
    else if(!got.size)h+=`<div class=miss>${g.sub?'ยังไม่มีโจทย์จริงของวิชานี้ในแอป':'ชุดเต็มปีนี้ยังไม่มี · ดูโจทย์จริงปีอื่นที่แท็บ 📄 ข้อสอบ'}</div>`;
    h+='</div>'}
  h+=`<p class=muted>แอปไม่แสดงธงคำตอบ · เขียนตอบแล้วถ่ายรูปส่งโค้ชตรวจ</p><div class=row><button onclick="qClose()">ปิด</button></div>`;qDlg(h)}
let qT=null,qEnd=0,qLeft=1500;
function qDlg(h){const D=document.getElementById('dlg');D.classList.add('qd');aDlg(h);D.onclose=()=>{clearInterval(qT);qT=null;D.classList.remove('qd')}}
function qClose(){document.getElementById('dlg').close()}
function qShow(id){const q=QS.find(x=>x.id===id);if(!q)return;clearInterval(qT);qT=null;qLeft=1500;
  qDlg(`<b>${esc(qLab(q))}</b>${q.note?'<div class=muted>'+esc(q.note)+'</div>':''}<div id=qtm class=tmr>25:00</div>
  <div class=row style="justify-content:center"><button class=ok id=qtb onclick="qTgl()">▶ เริ่มจับเวลา 25 นาที</button><button onclick="qRst()">รีเซ็ต</button></div>
  <div class=qt>${esc(q.text)}</div>
  <p class=muted>ที่มา: <a href="${esc(q.src)}" target=_blank rel=noopener>LawSiam (หน้าโจทย์สาธารณะ)</a> · ไม่มีธงคำตอบในแอป · เขียนตอบลงกระดาษ ถ่ายรูปส่งโค้ช</p>
  <div class=row><button onclick="qClose()">ปิด</button></div>`)}
const qFmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function qTick(){const e=document.getElementById('qtm');const s=Math.max(0,Math.round((qEnd-Date.now())/1000));qLeft=s;if(e){e.textContent=qFmt(s);e.classList.toggle('end',s===0)}
  if(s===0){clearInterval(qT);qT=null;const b=document.getElementById('qtb');if(b)b.textContent='หมดเวลา';if(navigator.vibrate)navigator.vibrate([300,150,300]);setTimeout(()=>alert('หมดเวลา 25 นาที วางปากกา'),50)}}
function qTgl(){const b=document.getElementById('qtb');if(qT){clearInterval(qT);qT=null;b.textContent='▶ ทำต่อ'}else if(qLeft>0){qEnd=Date.now()+qLeft*1000;qT=setInterval(qTick,500);qTick();b.textContent='⏸ พัก'}}
function qRst(){clearInterval(qT);qT=null;qLeft=1500;const e=document.getElementById('qtm');e.textContent='25:00';e.classList.remove('end');document.getElementById('qtb').textContent='▶ เริ่มจับเวลา 25 นาที'}
let qF={s:'',y:''};
function qView(){const M=document.getElementById('main');const subs=[...new Set(QS.map(q=>q.subject))],yrs=[...new Set(QS.map(q=>q.year))].sort((a,b)=>b-a);
  const L=QS.filter(q=>(!qF.s||q.subject===qF.s)&&(!qF.y||q.year===+qF.y)).sort((a,b)=>b.year-a.year||a.subject.localeCompare(b.subject)||(a.no||0)-(b.no||0));
  M.innerHTML=`<div class=day><b>📄 ข้อสอบเก่า (โจทย์จริง)</b><p class=muted>เฉพาะตัวโจทย์ที่เปิดอ่านได้ฟรีบนหน้าเว็บสาธารณะ พร้อมลิงก์ที่มา · ไม่มีธงคำตอบ · ปีที่ไม่มีในนี้ = ยังหาตัวโจทย์สาธารณะไม่ได้</p>
  <div class=row><select onchange="qF.s=this.value;qView()"><option value="">ทุกวิชา</option>${subs.map(x=>`<option ${qF.s===x?'selected':''}>${x}</option>`).join('')}</select>
  <select onchange="qF.y=this.value;qView()"><option value="">ทุกปี</option>${yrs.map(x=>`<option ${+qF.y===x?'selected':''}>${x}</option>`).join('')}</select> <span class=muted>${L.length} ข้อ</span></div></div>
  ${L.map(q=>`<div class=day><div class=dh><span>${esc(qLab(q))}</span><button class=pri onclick="qShow('${q.id}')">เปิด + จับเวลา</button></div>${q.note?'<div class=muted>'+esc(q.note)+'</div>':''}<div class=muted style="margin-top:4px">${esc(q.text.replace(/\s+/g,' ').slice(0,110))}…</div></div>`).join('')}`}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));view('today');
</script></body></html>
