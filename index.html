"id": "L98", "exam": "อก.", "year": 2548, "subject": "อาญา", "no": 2, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายอาญา (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\nข้อ 2 \n นายโทนประสงค์จะฆ่านายฉิ่ง แต่ไม่กล้าที่จะทำด้วยตนเอง และรู้ว่านายฉาบเป็นคน โมโหร้ายและหึงหวงภรรยา นายโทนจึงไปหานายฉาบและกล่าวเท็จว่าภรรยานายฉาบเป็นชู้กับนาย ฉิ่ง โดยหวังว่านายฉาบคงจะโกรธแล้วไปฆ่านายฉิ่ง เมื่อนายฉาบรู้เรื่องเท็จที่นายโทนเล่าให้ฟังจึงโกรธนายฉิ่งและต้องการฆ่านายฉิ่ง แต่นายฉาบไม่มีอาวุธปืนจึงไปเล่าเจตนาที่จะฆ่านายฉิ่งให้นายกลองฟังและขอยืมอาวุธปืนของนายกลอง นายกลองต้องการให้นายฉิ่งตกใจกลัวจึงมอบอาวุธปืนและ กระสุนปืนปลอมให้นายฉาบไป โดยไม่ได้บอกเรื่องกระสุนปืนปลอมให้นายฉาบรู้ นายฉาบเข้าใจว่าเป็นอาวุธปืนและกระสุนปืนจริง จึงนำอาวุธปืนและกระสุนปืนปลอมดังกล่าวไปยิงนายฉิ่ง กระสุนปืนถูกนายฉิ่ง แต่นายฉิ่งไม่ได้รับอันตรายแก่กายและจิตใจแต่อย่างใด เพียงแต่ตกใจและรู้สึกกลัว\n ดังนี้ ให้วินิจฉัยว่านายโทน นายฉาบ นายกลอง จะมีความผิดฐานใดหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=98&name=Judge-Exam"}, {"id": "L99", "exam": "อก.", "year": 2548, "subject": "อาญา", "no": 3, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายอาญา (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\n ข้อ 3 \n ธนาคารกรุงสยามได้ออกบัตรเครดิตที่มีแถบแม่เหล็กบันทึกข้อมูลให้แก่นายเก่งเพื่อใช้เป็นบัตรที่สามารถซื้อสินค้าโดยใช้เครื่องรูดบัตรอัตโนมัติบันทึกรายการซื้อสินค้าโดยไม่ต้องจ่ายเงินสดหรือใช้เบิกเงินสดจากเครื่องถอนเงินอัตโนมัติหรือจากธนาคารได้ ต่อมานายกาจพี่ชายของนายเก่ง ต้องการมีบัตรเครดิตใช้ โดยต้องการให้นายเก่งรับผิดชอบค่าใช้จ่ายจึงไปแจ้งต่อพนักงานธนาคาร กรุงสยามว่าตนเองคือนายเก่ง ทำบัตรเครดิตดังกล่าวหายไปเกรงว่าผู้อื่นจะนำไปใช้จึงขอยกเลิกการใช้บัตรเครดิตฉบับเดิม และขอให้ธนาคารออกบัตรเครดิตฉบับใหม่แทน พนักงานธนาคารกรุงสยาม หลงเชื่อจึงดำเนินการยกเลิกบัตรเครดิตฉบับเดิมและออกบัตรเครดิตฉบับใหม่ในชื่อของนายเก่งให้แก่นายกาจไป เป็นเหตุให้นายเก่งไม่สามารถใช้บัตรเครดิตฉบับเดิมได้ตามปกติ\n ดังนี้ ให้วินิจฉัยว่านายกาจและพนักงานธนาคารกรุงสยามจะมีความผิดฐานใดหรือไม่เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=99&name=Judge-Exam"}, {"id": "L101", "exam": "อก.", "year": 2548, "subject": "อาญา", "no": 4, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายอาญา (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\n ข้อ 4 \n ร้อยตำรวจตรีแดงไปที่บ้านของนายดำซึ่งเป็นผู้ต้องหาในคดีฉ้อโกง เพื่อจับนายดำตามหมายจับในคดีดังกล่าว นายดำได้หลบหนีออกจากบ้านไปทางทิศใต้ นายขาวบิดาของนายดำต้องการช่วยเหลือนายดำจึงบอกร้อยตำรวจตรีแดงว่านายดำหลบหนีไปทางทิศเหนือ ร้อยตำรวจตรีแดงไม่เชื่อได้ติดตามไปทางทิศใต้แล้วจับกุมนายดำได้\n ดังนี้ ให้วินิจฉัยว่านายขาวมีความผิดฐานใดหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=101&name=Judge-Exam"}, {"id": "L102", "exam": "อก.", "year": 2548, "subject": "อาญา", "no": 5, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายอาญา (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\n ข้อ 5 \n นายสมบัติและนางสมศรีเคยอยู่กินฉันท์สามีภรรยากันมาก่อน แต่ปัจจุบันทั้งสองได้แยกทางกัน นายสมบัติต้องการเงินจำนวน 20,000 บาท จึงโทรศัพท์ไปหานางสมศรีและพูดขู่ให้ นางสมศรีส่งมอบเงินจำนวน 20,000 บาทให้ มิฉะนั้นจะฆ่านางสาวสำรวยและขู่ว่าจะเปิดเผยข้อมูลความสัมพันธ์ของนางสาวสำรวยกับนายกำธรว่าได้เสียกันอย่างลับๆ นางสาวสำรวยเป็นบุตรสาวของนางสมศรีที่เกิดกับนายสมคิดสามีเดิมที่เสียชีวิตไปแล้ว นางสมศรีกลัวจึงตกลงจะมอบเงินจำนวน 20,000 บาทให้ แต่ขอผ่อนชำระเป็นจำนวน 2 งวด ๆ ละ 10,000 บาท โดยงวดแรกจะชำระให้ในอีกเจ็ดวันข้างหน้า ครั้นถึงกำหนดตามนัดนางสมศรีได้นำเงินจำนวน 10,000 บาทมาให้นายสมบัติ เมื่อพบกับนายสมบัติ นางสมศรีได้ต่อรองจำนวนเงินลดลงเหลือ 5,000 บาท ทำให้นายสมบัติโกรธ จึงใช้มือจับแขนของ นางสมศรีไว้ไม่ให้ขัดขืน แล้วล้วงเอาเงินจำนวน 10,000 บาทของนางสมศรีที่อยู่ในกระเป๋า กางเกงไป\n ดังนี้ ให้วินิจฉัยว่านายสมบัติจะมีความผิดฐานใดหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=102&name=Judge-Exam"}, {"id": "L109", "exam": "อก.", "year": 2548, "subject": "อาญา", "no": 6, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายอาญา (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\nข้อ 6 \n นางอรจดทะเบียนสมรสแล้วตั้งครรภ์กับสามีได้ 6 เดือน นายแพทย์เดชตรวจครรภ์โดยละเอียดแล้วพบว่าทารกในครรภ์นางอรมีความพิการ ตาบอด 2 ข้าง แขนด้วน 2 ข้าง และระบบการทำงานของหัวใจผิดปกติ ไม่อาจรักษาได้ หากคลอดออกมาไม่สามารถดำรงชีวิตอยู่ได้ด้วยตนเอง และจะมีชีวิตรอดไม่เกิน 1 ปี ประกอบกับนางอรมีฐานะยากจน จึงขอร้องให้นายแพทย์เดชทำแท้งให้ เมื่อนายแพทย์เดชทำแท้งให้นางอรแล้ว ทำให้นางอรไม่สามารถมีบุตรได้อีกตลอดชีวิต\n ดังนี้ ให้วินิจฉัยว่านางอรและนายแพทย์เดชจะมีความผิดฐานใดหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=109&name=Judge-Exam"}, {"id": "L110", "exam": "อก.", "year": 2548, "subject": "แพ่ง", "no": 7, "topic": "หนี้/จำนอง/ค้ำประกัน/แปลงหนี้", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายแพ่ง (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\nข้อ 7\n บริษัท ตองเอ จำกัด ทำสัญญากู้ยืมเงินจากธนาคารทองไทย จำนวน 5,000,000 บาท โดยมีนางสมศรี กรรมการบริษัท จำนองที่ดินของตนเองเป็นประกัน และมีนายสมชายทำสัญญาค้ำประกันไว้ หลังจากทำสัญญาได้หนึ่งปี บริษัท ตองเอ จำกัด ได้ตกลงกับธนาคารทองไทย ทำสัญญาแปลงหนี้เงินกู้ยืมดังกล่าวบางส่วนจำนวน 4,000,000 บาทเป็นหนี้ตั๋วสัญญาใช้เงินจำนวน 4,000,000 บาท ในการแปลงหนี้ดังกล่าวธนาคารทองไทยได้มีหนังสือแจ้งให้นางสมศรีและนายสมชายทราบแล้ว นางสมศรีได้ทำบันทึกข้อตกลงยินยอมให้ถือเอาการจำนองที่ดินเดิมเป็นการจำนองประกันหนี้ตั๋วสัญญาใช้เงินด้วย โดย มิได้ไปจดทะเบียนจำนองกันใหม่ ต่อมาธนาคารทองไทยได้โอนสิทธิเรียกร้องในหนี้เงินกู้และหนี้ตั๋วสัญญาใช้เงินให้แก่บริษัท เร่งรัดรวย จำกัด โดยทำเป็นหนังสือและทำหนังสือบอกกล่าวการโอนไปยังบริษัท ตองเอ จำกัด ให้ทราบแล้ว เมื่อหนี้ถึงกำหนดชำระ บริษัท ตองเอ จำกัด ไม่\n ชำระหนี้ให้แก่บริษัท เร่งรัดรวย จำกัด\n ดังนี้ ให้วินิจฉัยว่าบริษัท เร่งรัดรวย จำกัด สามารถใช้สิทธิเรียกร้องให้นางสมศรีและนายสมชายชำระหนี้ได้หรือไม่อย่างไร เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=110&name=Judge-Exam"}, {"id": "L111", "exam": "อก.", "year": 2548, "subject": "แพ่ง", "no": 8, "topic": "ซื้อขาย/สัญญา/เบี้ยปรับ", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายแพ่ง (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\nข้อ 8 \n บริษัท เพชรแมชชีน จำกัด ได้ทำสัญญาขายเครื่องจักรตัดกระจกให้แก่กรมอาชีวศึกษา โดยในสัญญา กำหนดว่าเครื่องจักรต้องสามารถตัดแผ่นกระจกที่มีความหนาถึง 15 มิลลิเมตรได้ กำหนดส่งมอบเครื่องจักรในวันที่ 11 มกราคม 2547 หากผิดสัญญาต้องชำระค่าปรับรายวันให้แก่กรมอาชีวศึกษาจนกว่าจะส่งมอบเครื่องจักรได้ ในวันที่ 11 มกราคม 2547 บริษัท เพชรแมชชีน จำกัด ได้นำเครื่องจักรมาส่งมอบให้ โดยนำแผ่นกระจกขนาดความหนา10 มิลลิเมตร มาทดลองใช้เครื่องจักรตัดซึ่งสามารถตัดได้ กรมอาชีวศึกษาจึงได้รับเครื่องจักรดังกล่าวไว้พิจารณา ต่อมาในวันที่ 11 กุมภาพันธ์ 2547 กรมอาชีวศึกษาพบว่าเครื่องจักรที่ส่งมอบให้นั้นไม่สามารถตัดแผ่นกระจกที่ มีความหนา 15 มิลลิเมตร ได้ กรมอาชีวศึกษาจึงได้แจ้งให้บริษัท เพชรแมชชีน จำกัด นำเครื่องจักรเครื่องใหม่มา ส่งมอบให้แทนเครื่องเดิม แต่บริษัท เพชรแมชชีน จำกัด ไม่นำมาเปลี่ยนให้และเรียกให้กรมอาชีวศึกษาชำระค่าเครื่อง\n จักร ดังกล่าวตามสัญญา กรมอาชีวศึกษาจึงบอกเลิกสัญญาเมื่อวันที่ 11 มีนาคม 2547 และเรียกค่าปรับ นับแต่วันที่ 12 มกราคม 2547 จนถึงวันบอกเลิกสัญญา บริษัท เพชรแมชชีน จำกัด ไม่ยอมชำระค่าปรับให้ กรมอาชีวศึกษาจึงยื่นฟ้องต่อศาลในวันที่ 11 ธันวาคม 2548 บริษัท เพชรแมชชีน จำกัด ยื่นคำให้การ ต่อสู้ในประเด็นดังต่อไปนี้\n (ก) กรมอาชีวศึกษาไม่มีสิทธิบอกเลิกสัญญา เนื่องจากกรมอาชีวศึกษาได้ตรวจรับเครื่องจักรไว้โดยชอบ แล้ว\n (ข) กรมอาชีวศึกษาไม่มีสิทธิเรียกค่าปรับ เนื่องจากได้ส่งมอบเครื่องจักรตามกำหนดในสัญญาและกรมอาชีวศึกษารับไว้แล้ว\n (ค) การฟ้องเรียกค่าปรับเป็นการฟ้องเรียกให้รับผิดความชำรุดบกพร่องมีกำหนดอายุความ 1 ปี คดีจึงขาด\n อายุความ\n ดังนี้ ให้วินิจฉัยว่าข้อต่อสู้ดังกล่าวฟังขึ้นหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=111&name=Judge-Exam"}, {"id": "L112", "exam": "อก.", "year": 2548, "subject": "แพ่ง", "no": 9, "topic": "ครอบครัว/บุตร/มรดก", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายแพ่ง (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\nข้อ 9 \n นายสมบูรณ์จดทะเบียนสมรสกับนางสมศรีและมีบุตร 1 คน คือ นายสมเดช ซึ่งได้สมรสและแยกไปอยู่กับภรรยาที่ชอบด้วยกฎหมายที่ต่างจังหวัด นายสมบูรณ์แอบไปได้เสียกับนางสาวสมสวาท มีบุตรด้วยกัน 1 คน คือ เด็กชายสมพงษ์ และนายสมบูรณ์เป็นผู้แจ้งการเกิดของเด็กชายสมพงษ์ ว่าตนเป็นบิดาและให้ใช้นามสกุลของตน ต่อมาขณะที่นายโตซึ่งเป็นลูกจ้างของนายเบิ้มขับรถไปส่งสินค้าให้นายเบิ้ม นายโตได้ขับรถโดยประมาทชนนายสมบูรณ์ได้รับบาดเจ็บและสลบไป นายโตกลัวความผิดจึงนำนายสมบูรณ์ไปทิ้งไว้ในคูน้ำเป็นเหตุให้นายสมบูรณ์ถึงแก่ความตาย นายสมเดชและเด็กชายสมพงษ์ทราบว่าบิดาเสียชีวิตจึงได้ร่วมกับนางสมศรีจัดงานศพของนายสมบูรณ์\n ดังนี้ ให้วินิจฉัยว่านางสมศรี นายสมเดช และเด็กชายสมพงษ์ มีสิทธิฟ้องเรียกค่าสินไหมทดแทนเป็นค่าปลงศพและค่าขาดไร้อุปการะจากนายโตได้หรือไม่ เพียงใด และนายเบิ้มจะต้องรับผิดชดใช้ค่าสินไหมทดแทนดังกล่าวร่วมกับนายโตหรือไม่ หรือต้องรับผิดอย่างใดต่อบุคคลทั้งสาม เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=112&name=Judge-Exam"}, {"id": "L113", "exam": "อก.", "year": 2548, "subject": "แพ่ง", "no": 10, "topic": "มรดก/ผู้จัดการมรดก", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชากฎหมายแพ่ง (สนามใหญ่)\n วันอาทิตย์ ที่ 11 ธันวาคม 2548\nข้อ 10 \n ผู้ตายมีบุตรโดยชอบด้วยกฎหมายสามคน คือ นายดำ นายแดง และนายขาว หลังจากผู้ตายถึงแก่ความตายแล้ว นายชมพูได้เป็นผู้จัดการมรดกของผู้ตาย แต่นายชมพูได้ยักยอกทรัพย์มรดกไปใช้ส่วนตัว นายดำ นายแดงและนายขาวจึงปรึกษาหารือทำบันทึกข้อตกลงกันในรายงานประจำวันเกี่ยวกับคดีต่อหน้าพนักงานสอบสวนมีข้อความชัดแจ้งว่า นายดำและนายแดงขอสละกรรมสิทธิ์ในทรัพย์มรดกให้แก่นายขาวและยอมให้นายขาวเป็นผู้ดำเนินการเกี่ยวกับทรัพย์มรดกแต่เพียงผู้เดียว และลงชื่อไว้ หลังจากนั้นนายขาวได้ร้องขอต่อศาลให้ถอดถอนนายชมพูออกจากการเป็นผู้จัดการมรดกของผู้ตายตามคำร้องขอของนายขาว คดีถึงที่สุด หลังจากนั้นนายดำยื่นคำร้องขอต่อศาลให้มีคำสั่งตั้งนายแดงเป็นผู้จัดการมรดกของผู้ตาย นายขาวยื่นคำร้องคัดค้าน\n ดังนี้ ให้วินิจฉัยว่านายดำมีสิทธิยื่นคำร้องขอต่อศาลให้ตั้งนายแดงเป็นผู้จัดการมรดกของผู้ตายได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=113&name=Judge-Exam"}, {"id": "L79", "exam": "อก.", "year": 2548, "subject": "วิอาญา", "no": 1, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วยปี 2548\nกฎหมายวิธีพิจารณาความอาญา (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\n ข้อ 1 \n นายลอยร้องทุกข์ต่อพันตำรวจตรีเลื่อน พนักงานสอบสวนให้ดำเนินคดีนายลั่นในข้อหายักยอก และแจ้งให้ดำเนินคดีในข้อหามีอาวุธปืนไว้ในความครอบครองโดยไม่ได้รับอนุญาตตามพระราชบัญญัติอาวุธปืนฯ พนักงานสอบสวนมีความเห็นควรสั่งฟ้องนายลั่นทั้งสองข้อหาดังกล่าว และส่งสำนวนพร้อมตัวนายลั่นไปยังพนักงานอัยการ พนักงานอัยการพิจารณาแล้วมีคำสั่งเด็ดขาดไม่ฟ้องนายลั่นในข้อหามีอาวุธปืนไว้ในความครอบครองโดยไม่รับอนุญาต และเห็นว่าการกระทำของนายลั่นเป็นความผิดข้อหาลักทรัพย์มิใช่ข้อหายักยอก จึงสั่งฟ้องนายลั่นในข้อหาลักทรัพย์และได้ยื่นฟ้องนายลั่นต่อศาลในข้อหาดังกล่าว คดีอยู่ระหว่างพิจารณาของศาลต่อมาพันตำรวจตรีเลื่อนเห็นว่าการกระทำของนายลั่นเป็นความผิดข้อหามีอาวุธปืนไว้ในความครอบครองโดยไม่ได้รับอนุญาต และเห็นว่าตนเป็นเจ้าพนักงานของรัฐ จึงได้ยื่นฟ้องนายลั่นต่อศาลในข้อหามีอาวุธปืนไว้ในความครอบครองโดยไม่ได้รับอนุญาต ส่วนนายลอยเห็นว่าการกระทำของนายลั่นเป็นความผิดข้อหายักยอก จึงได้ยื่นฟ้องนายลั่นต่อศาลในข้อหายักยอก ต่อมาศาลสั่งให้จำหน่ายคดีที่นายลอยเป็นโจทก์ฟ้องเนื่องจากนายลอยถอนคำร้องทุกข์ และ คดีถึงที่สุดแล้ว โดยคดีที่พนักงานอัยการฟ้องนายลั่นอยู่ในระหว่างพิจารณาของศาล\n ดังนี้ ให้วินิจฉัยว่าการฟ้องคดีของพันตำรวจตรีเลื่อน ชอบด้วยกฎหมายหรือไม่ และพนักงานอัยการมีอำนาจดำเนินคดีกับนายลั่นต่อไปได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=79&name=Judge-Exam"}, {"id": "L80", "exam": "อก.", "year": 2548, "subject": "วิอาญา", "no": 2, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วยปี 2548\nกฎหมายวิธีพิจารณาความอาญา (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\n ข้อ 2 \n นายสำราญผู้เสียหายเป็นโจทก์ฟ้องว่านายสมควรจำเลยกับพวกบุกรุกที่ดินของนายสำราญโจทก์ ขอให้ลงโทษตามประมวลกฎหมายอาญา มาตรา 365 และขอให้ขับไล่จำเลยและบริวาร ศาลชั้นต้นไต่สวนมูลฟ้องแล้ว เห็นว่าคดีมีมูล สั่งประทับฟ้อง นายสมควรจำเลยให้การปฏิเสธ คดีอยู่ระหว่างการพิจารณาดังนี้ หากปรากฏว่า\n (ก) ถ้านายสมควรจำเลยตายในระหว่างการพิจารณาของศาลชั้นต้น ศาลชั้นต้นจะมีคำสั่งจำหน่ายคดีได้หรือไม่ เพราะเหตุใด\n (ข) ถ้านายสำราญโจทก์ตายในระหว่างการพิจารณาของศาลชั้นต้น นายสมชายบุตรของ นายสำราญกับนางสมศรี ซึ่งมิได้จดทะเบียนสมรสกัน จะดำเนินคดีต่อไปได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=80&name=Judge-Exam"}, {"id": "L82", "exam": "อก.", "year": 2548, "subject": "วิอาญา", "no": 3, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความอาญา (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\nข้อ 3 \n เมื่อวันที่ 30 มิถุนายน 2548 นายสายผู้เสียหายร้องทุกข์ต่อพนักงานสอบสวนให้ ดำเนินคดีกับบริษัท แสง จำกัด และผู้ดำรงตำแหน่งกรรมการของบริษัท แสง จำกัด ในข้อหาร่วมกัน ยักยอก ซึ่งเกิดเหตุเมื่อวันที่ 30 เมษายน 2548 โดยนายสาย ยืนยันให้พนักงานสอบสวนดำเนินคดีกับบริษัท แสง จำกัด และกรรมการของบริษัท ให้ถึงที่สุด แต่นายสายมิได้ระบุชื่อกรรมการของบริษัทที่จะให้พนักงานสอบสวนดำเนินคดีไว้ เพราะนายสายยังไม่ทราบชื่อกรรมการของบริษัท โดยขณะนั้นกรรมการของบริษัทมี 2 คน คือ นายสี และนายเสียง ต่อมานายสายได้ทราบว่านายสีเป็นกรรมการคนหนึ่งของบริษัทดังกล่าวในวันที่ 1 สิงหาคม 2548 นายสายจึงได้แจ้งยืนยันให้พนักงานสอบสวนดำเนินคดีกับบริษัท แสง จำกัด ต่อไป และขอให้ดำเนินคดีกับนายสีด้วย ในชั้นสอบสวนปรากฏข้อเท็จจริงว่านายเสียงเป็นกรรมการของบริษัท แสง จำกัด ด้วย หลังจากนั้นพนักงานสอบสวนได้ทำการสอบสวนบริษัท แสง จำกัด นายสี และนายเสียง ไว้ในฐานะเป็นผู้ต้องหา นายสีและนายเสียงให้การปฏิเสธ และโต้แย้งว่าการแจ้งความของนายสายเมื่อวันที่ 30 มิถุนายน 2548 เป็นการร้องทุกข์ให้ดำเนินคดีกับบริษัท แสง จำกัด ไม่ได้ประสงค์ให้ดำเนินคดีกับนายสีและนายเสียง และคดีนี้ขาดอายุความร้องทุกข์แล้ว พนักงานสอบสวน ทำการสอบสวนแล้วมีความเห็นควรสั่งฟ้องบริษัท แสง จำกัด นายสี และนายเสียง ในข้อหาร่วมกันยักยอก และส่งสำนวนไปยังพนักงานอัยการ\n ดังนี้ ให้วินิจฉัยว่าการสอบสวนของพนักงานสอบสวนดังกล่าวชอบด้วยกฎหมายหรือไม่ และพนักงาน อัยการมีอำนาจฟ้องบริษัท แสง จำกัด นายสี และนายเสียง หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=82&name=Judge-Exam"}, {"id": "L83", "exam": "อก.", "year": 2548, "subject": "วิอาญา", "no": 4, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความอาญา (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\nข้อ 4 \n นายหนึ่ง ผู้เสียหายร้องทุกข์ต่อพนักงานสอบสวนกล่าวหาว่านายสองกระทำความผิดฐาน บุกรุก พนักงานสอบสวนทำการสอบสวนแล้วเห็นว่าการกระทำของนายสองไม่เป็นความผิดทางอาญา จึงสรุปสำนวนการสอบสวนโดยมีความเห็นควรสั่งไม่ฟ้องนายสองเสนอต่อพนักงานอัยการ ทั้ง ๆ ที่สามารถเรียกตัวนายสองมาทำการสอบสวนได้ พนักงานอัยการพิจารณาแล้วเห็นว่า พยานหลักฐานในสำนวนการสอบสวนยังไม่พอที่จะพิจารณาสั่งฟ้องหรือไม่ฟ้อง และผู้ต้องหาก็มีตัวอยู่ พนักงานสอบสวนสามารถเรียกตัวมาทำการสอบสวนได้ จึงสั่งให้พนักงานสอบสวนนำตัวนายสองผู้ต้องหามาให้พนักงานอัยการซักถาม เมื่อพนักงานสอบสวนนำตัวนาย\n สองมาให้พนักงานอัยการซักถามแล้ว นายสองอ้างว่าตามวันเวลาที่ถูกกล่าวหาดังกล่าวได้อยู่กับนางสามภรรยาของตน พนักงานอัยการจึงสั่งให้พนักงานสอบสวน นำตัวนางสามมาให้พนักงานอัยการซักถามอีก โดยพนักงานสอบสวนไม่เคยสอบสวนนางสามไว้ในฐานะพยานเลย\n ดังนี้ ให้วินิจฉัยว่าคำสั่งของพนักงานอัยการที่สั่งให้พนักงานสอบสวนส่งตัวนายสองและนางสามมาให้ซักถามนั้น เป็นคำสั่งที่ชอบหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=83&name=Judge-Exam"}, {"id": "L84", "exam": "อก.", "year": 2548, "subject": "วิอาญา", "no": 5, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความอาญา (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\n ข้อ 5 \n พนักงานอัยการเป็นโจทก์ฟ้องจำเลยในความผิดตามพระราชบัญญัติว่าด้วยความผิดอันเกิดจากการใช้เช็ค พ.ศ.2534 อันเป็นความผิดต่อส่วนตัว และศาลกำหนดวันนัดสืบพยานโจทก์แล้ว ในระหว่างนั้นผู้เสียหายได้เป็นโจทก์ฟ้องจำเลยคนเดียวกันนั้นตามข้อหาดังกล่าว ศาลนัดไต่สวนมูลฟ้องแล้ว แต่ผู้เสียหายโจทก์ไม่ไปศาลตามกำหนดนัด ศาลจึงพิพากษายกฟ้อง ผู้เสียหายโจทก์ยื่นคำร้องขอให้ยกคดีของตนขึ้นไต่สวนมูลฟ้องใหม่ และต่อมาได้ถอนคำร้องนั้นแล้วยื่นคำร้องขอเข้าเป็นโจทก์ร่วมกับพนักงานอัยการในคดีที่พนักงานอัยการฟ้อง ในวันเดียวกันนั้นจำเลยให้การรับสารภาพว่าได้กระทำผิดจริง\n ดังนี้ ให้วินิจฉัยว่า ผู้เสียหายจะร้องขอเข้าร่วมเป็นโจทก์กับพนักงานอัยการได้หรือไม่ และศาลควรพิพากษาหรือมีคำสั่งในคดีนี้อย่างไร เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=84&name=Judge-Exam"}, {"id": "L85", "exam": "อก.", "year": 2548, "subject": "วิอาญา", "no": 6, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความอาญา (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\nข้อ 6 \n โจทก์ฟ้องจำเลยฐานมีอาวุธปืนและวัตถุระเบิดไว้ในความครอบครองโดยไม่ได้รับอนุญาต ขอให้ลงโทษจำเลยและริบอาวุธปืนและวัตถุระเบิดของกลาง ศาลชั้นต้นพิพากษาลงโทษจำเลย แต่ไม่ริบอาวุธปืนของกลาง เพราะยังไม่สมควรจะริบ ส่วนวัตถุระเบิดศาลไม่ได้มีคำสั่งไว้แต่อย่างใด โจทก์ไม่อุทธรณ์ แต่จำเลยอุทธรณ์ขอให้ลงโทษสถานเบาหรือรอการลงโทษ ศาลอุทธรณ์พิพากษาให้ลงโทษจำเลยตาม ศาลชั้นต้น แต่อาวุธปืนและวัตถุระเบิดของกลางนั้นให้ริบเสีย โจทก์ไม่ฎีกา แต่จำเลยฎีกาขอให้ลดโทษและขอไม่ให้ริบอาวุธปืนและวัตถุระเบิดของกลาง เพราะคดีนี้โจทก์ไม่ได้อุทธรณ์ขอให้ริบ และการที่ศาลอุทธรณ์พิพากษาริบอาวุธปืนและวัตถุระเบิดของกลางเป็นการเพิ่มโทษจำเลย ศาลฎีกาพิพากษาลงโทษจำเลยและริบอาวุธปืนและวัตถุระเบิดของ\n กลาง ยืนตามศาลอุทธรณ์\n ดังนี้ ให้วินิจฉัยว่าคำพิพากษาศาลฎีกาที่ให้ริบอาวุธปืนและวัตถุระเบิดของกลางชอบหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=85&name=Judge-Exam"}, {"id": "L86", "exam": "อก.", "year": 2548, "subject": "วิแพ่ง", "no": 7, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความแพ่ง (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\n ข้อ 7 \n โจทก์ฟ้องจำเลยที่ 1 ให้รับผิดชำระหนี้ในฐานะผู้กู้ และจำเลยที่ 2 ให้รับผิดในฐานะ ผู้ค้ำประกันจำเลยที่ 1 ยื่นคำให้การปฏิเสธว่าสิทธิเรียกร้องตามสัญญากู้ขาดอายุความแล้ว ส่วนจำเลยที่ 2 ยื่นคำให้การปฏิเสธว่าไม่ได้ค้ำประกัน สัญญาค้ำประกันเป็นสัญญาปลอม\n ดังนี้ ให้วินิจฉัยว่า\n (ก) หากการพิจารณาคดีได้ความว่าจำเลยที่ 1 ได้กู้ยืมเงิน และจำเลยที่ 2 ได้ค้ำประกันและทำสัญญาค้ำประกันหนี้ตามฟ้องจริง แต่หนี้เงินกู้ขาดอายุความแล้ว เมื่อศาลมีคำพิพากษายกฟ้องจำเลยที่ 1 ศาลจะพิพากษายกฟ้องจำเลยที่ 2 ด้วยได้หรือไม่\n (ข) คำพิพากษาในส่วนของจำเลยที่ 2 จะเปลี่ยนแปลงหรือไม่ หากก่อนศาลพิพากษา โจทก์ได้ยื่นคำร้องขอถอนฟ้องจำเลยที่ 1 เมื่อศาลสอบถามจำเลยทั้งสองแล้ว จำเลยทั้งสองไม่คัดค้าน ศาลจึงสั่งจำหน่ายคดีในส่วนของจำเลยที่ 1 ออกจากสารบบความ", "src": "https://www.lawsiam.com/?file=filedetail&max=86&name=Judge-Exam"}, {"id": "L87", "exam": "อก.", "year": 2548, "subject": "วิแพ่ง", "no": 8, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความแพ่ง (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\n ข้อ 8 \n นายดำ ยื่นฟ้องนายแดง นายขาว และนางสาวเหลือง ให้ร่วมกันชำระหนี้ตามสัญญากู้เบิกเงินเกินบัญชีพร้อมดอกเบี้ย หากไม่ชำระให้ยึดทรัพย์จำนองของนางสาวเหลืองขายทอดตลาด หากได้เงินไม่พอชำระหนี้ให้บุคคลทั้งสามร่วมกันรับผิดชดใช้หนี้ส่วนที่ขาดจนครบ นายแดงและนายขาวยื่นคำให้การขอให้ยกฟ้อง นางสาวเหลืองได้รับหมายเรียกและสำเนาคำฟ้องโดยวิธีปิดหมายเมื่อวันที่ 1 กันยายน 2547 เมื่อครบกำหนดนางสาวเหลืองไม่ยื่นคำให้การ ศาลนัดพร้อมเพื่อกำหนดวันนัดสืบพยานในวันที่ 15 ธันวาคม 2547 ครั้นถึงกำหนดนัด นายดำ นายขาว นายแดง และนางสาวเหลืองไปศาล ศาลได้สอบถามคู่ความ นายแดง นายขาว และนางสาวเหลืองยอมรับว่าเป็นหนี้โจทก์ตามฟ้องจริง คู่ความแถลงไม่ติดใจสืบพยาน ศาลได้จดรายงานกระบวนพิจารณาว่าบุคคลทั้งสามยอมรับว่าเป็นหนี้โจทก์ตามคำฟ้องจริง และให้นายแดง นายขาว และนางสาวเหลืองลงลายมือชื่อในรายงานกระบวนพิจารณา ศาลสั่งงดสืบพยานแล้วมี คำสั่งว่าโจทก์ไม่ได้มีคำขอให้ศาลมีคำสั่งให้นางสาวเหลืองขาดนัดยื่นคำให้การ จึงให้จำหน่ายคดีของโจทก์สำหรับนางสาวเหลืองออกจากสารบบความและพิพากษาให้นายแดง นายขาว ร่วมกันชดใช้เงินให้แก่โจทก์ตามฟ้อง โจทก์อุทธรณ์เฉพาะข้อกฎหมายโดยตรงต่อศาลฎีกาว่าคดีนี้นางสาวเหลืองได้แถลงรับว่าเป็นหนี้โจทก์และลงลายมือชื่อในรายงานกระบวนพิจารณา เท่ากับยื่นคำให้การต่อศาลแล้ว ขอให้ศาลฎีกาพิพากษาแก้คำพิพากษาศาลชั้นต้นให้นางสาวเหลืองชดใช้เงินตามฟ้องแก่โจทก์\n ดังนี้ ให้วินิจฉัยว่าอุทธรณ์ของโจทก์ฟังขึ้นหรือไม่", "src": "https://www.lawsiam.com/?file=filedetail&max=87&name=Judge-Exam"}, {"id": "L88", "exam": "อก.", "year": 2548, "subject": "วิแพ่ง", "no": 9, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความแพ่ง (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\nข้อ 9\n โจทก์ฟ้องขอให้เพิกถอนการโอนที่ดิน ราคา 180,000 บาท ระหว่างจำเลยที่ 1 และจำเลยที่ 2 ซึ่งจำเลยที่ 1 ทำลงโดยรู้ว่าทำให้โจทก์เสียเปรียบ และขอให้จำเลยที่ 1 จดทะเบียนโอนที่ดินให้แก่โจทก์ตามสัญญาจะซื้อจะขาย จำเลยทั้งสองให้การปฏิเสธฟ้องโจทก์ ศาลชั้นต้นวินิจฉัยว่าข้อเท็จจริงฟังไม่ได้ว่าจำเลยที่ 1 โอนที่ดินให้แก่จำเลยที่ 2 โดยรู้อยู่ว่าทำให้โจทก์เสียเปรียบ จึงพิพากษายกฟ้องโจทก์ โจทก์อุทธรณ์ว่าการที่ศาลรับฟังคำเบิกความของจำเลยทั้งสองแล้ววินิจฉัยว่าจำเลยทั้งสองไม่รู้ว่าทำให้โจทก์เสียเปรียบนั้นไม่ชอบ ขอให้ศาลอุทธรณ์พิพากษากลับคำพิพากษาของศาลชั้นต้นและบังคับตามฟ้อง ศาลอุทธรณ์พิพากษายืนตามคำพิพากษาศาลชั้นต้น และให้โจทก์ใช้ค่าฤชาธรรมเนียมแทนจำเลยทั้งสอง โจทก์ฎีกาในปัญหาดังกล่าว ศาลชั้นต้นตรวจ\n ฎีกาโจทก์แล้วมีคำสั่งไม่รับฎีกา เนื่องจากเห็นว่าฎีกาโจทก์เป็นการฎีกาในปัญหาข้อเท็จจริง และทุนทรัพย์ที่พิพาทในชั้นฎีกาต้องห้ามไม่ให้ฎีกาในปัญหาข้อเท็จจริง\n ดังนี้ ให้วินิจฉัยว่าคำสั่งศาลที่ไม่รับฎีกาโจทก์ชอบด้วยกฎหมายหรือไม่ และจะให้คำแนะนำแก่โจทก์เพื่อดำเนินคดีนี้ต่อไปอย่างไร", "src": "https://www.lawsiam.com/?file=filedetail&max=88&name=Judge-Exam"}, {"id": "L89", "exam": "อก.", "year": 2548, "subject": "วิแพ่ง", "no": 10, "topic": "บังคับคดี/วิธีการชั่วคราว", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nกฎหมายวิธีพิจารณาความแพ่ง (สนามใหญ่)\n วันที่ 12 ธันวาคม 2548\nข้อ 10 \n จำเลยมีที่ดินแปลงหนึ่งราคา 1,500,000 บาท กับรถยนต์อีก 1 คัน ราคา 600,000 บาท โจทก์ฟ้อง จำเลยเมื่อวันที่ 4 มกราคม 2548 ให้ชำระค่าสินไหมทดแทนจากการทำละเมิด ครั้นถึงวันที่ 1 กุมภาพันธ์ 2548 จำเลยนำรถยนต์ไปจำนำไว้กับนายอดุลย์เป็นเงิน 600,000 บาท ครบกำหนดชำระหนี้จำนำในวันที่ 15 มีนาคม 2548 และเมื่อถึงวันครบกำหนดชำระหนี้จำนำ จำเลยยังมิได้ชำระหนี้แก่นายอดุลย์แต่อย่างใด ต่อมาวันที่ 1 มีนาคม 2548 ศาลมีคำสั่งห้ามจำเลยจำหน่าย โอน หรือเปลี่ยนแปลงสิทธิทางทะเบียนทรัพย์สินทั้งสองรายการตามที่โจทก์ยื่นคำร้องขอคุ้มครองชั่วคราว แต่ในวันที่ 1 เมษายน 2548 จำเลยก็ยังนำที่ดินดังกล่าวไปจดทะเบียนจำนองกับนายดำเกิงไว้อีกเป็นเงิน 200,000 บาท โดยนายดำเกิงรู้อยู่แล้วตั้งแต่แรกว่าโจทก์กำลังดำเนินการร้อง\n ขอให้ศาลมีคำสั่งคุ้มครองชั่วคราว\n ศาลมีคำพิพากษาให้จำเลยชำระหนี้และค่าฤชาธรรมเนียมทั้งปวงเป็นเงิน 1,000,000 บาทแก่โจทก์ คดีถึงที่สุด โจทก์จึงนำเจ้าพนักงานบังคับคดียึดรถยนต์ก่อน และเมื่อได้ทราบภายหลังว่าจำเลยมีที่ดินด้วย จึงได้นำยึดที่ดินเพื่อขายทอดตลาดทั้งสองรายการ\n นายอดุลย์คัดค้านการยึดรถยนต์ โดยให้เหตุผลว่าเป็นรถยนต์ที่จำนำไว้แก่ตนเพื่อประกันหนี้ จึงไม่สามารถบังคับยึดรถยนต์คันนี้ได้ ส่วนนายดำเกิงคัดค้านว่าที่ดินดังกล่าวติดจำนองอยู่เป็นเงิน 200,000 บาท และราคาที่ดินสูงเกินกว่าหนี้ตามคำพิพากษามาก โจทก์ไม่มีสิทธินำยึดที่ดินไปขายทอดตลาด\n ดังนี้ ให้วินิจฉัยว่าคำคัดค้านของนายอดุลย์และนายดำเกิงรับฟังได้หรือไม่ และเจ้าพนักงานบังคับคดีจะมีอำนาจยึดรถยนต์และที่ดินได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=89&name=Judge-Exam"}, {"id": "L95", "exam": "อก.", "year": 2548, "subject": "อังกฤษ", "no": 9, "topic": "แปลอังกฤษเป็นไทย", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชาภาษาอังกฤษ (สนามใหญ่)\n วันอาทิตย์ ที่ 18 ธันวาคม 2548\n ข้อ 9\n จงแปลเป็นภาษาไทย\n The Office of the Attorney General is the principal agency reonsible for prosecuting criminal cases, providing legal advice to state agencies, representing the government in court and cooperating with foreign countries in criminal matters. It is also the duty of the Office of the Attorney General to protect civil rights and provide legal aid to the needy. The Office of the Attorney General is an independent agency, not under the control of any ministry, but reports directly to the Minister of Justice. The purpose of its independent status is to ensure justice and prevent political influence from interfering with prosecutorial functions. In order to guarantee the independence of public prosecutors, the Public Prosecutor Commission is established to take the sole re onsibility of the\n personnel management of public prosecutors. The Commission is chaired by a retired senior government official or retired high-ranking public prosecutor elected by public prosecutorsnationwide.", "src": "https://www.lawsiam.com/?file=filedetail&max=95&name=Judge-Exam"}, {"id": "L96", "exam": "อก.", "year": 2548, "subject": "อังกฤษ", "no": 10, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\nวิชาภาษาอังกฤษ (สนามใหญ่)\n วันอาทิตย์ ที่ 18 ธันวาคม 2548\nข้อ 10 \n จงแปลเป็นภาษาอังกฤษ\n คดีอาญาใดซึ่งพนักงานอัยการยื่นฟ้องต่อศาลแล้ว ผู้เสียหายจะยื่นคำร้องขอเข้าร่วมเป็นโจทก์ในระยะใดระหว่างพิจารณาก่อนศาลชั้นต้นพิพากษาคดีนั้นก็ได้\n เมื่อพนักงานอัยการและผู้เสียหายเป็นโจทก์ร่วมกัน ถ้าพนักงานอัยการเห็นว่าผู้เสียหายจะกระทำให้คดีของอัยการเสียหาย โดยกระทำหรือละเว้นกระทำการใด ๆ ในกระบวนพิจารณา พนักงานอัยการมีอำนาจร้องต่อศาลให้สั่งผู้เสียหายกระทำหรือละเว้นกระทำการนั้น ๆ ได้", "src": "https://www.lawsiam.com/?file=filedetail&max=96&name=Judge-Exam"}, {"id": "L71", "exam": "อก.", "year": 2548, "subject": "ล้มละลาย", "no": 3, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย\nกฎหมายล้มละลาย ปี 2548\n วันอาทิตย์ที่ 18 ธันวาคม 2548\nข้อ 3 \n นายแสงได้ทำสัญญาค้ำประกันหนี้ตามสัญญาที่บริษัท มุ่งหมาย จำกัด มีต่อธนาคารทรัพย์เจริญ จำกัด (มหาชน) จำนวน 5,000,000 บาท ปรากฏว่าบริษัท มุ่งหมาย จำกัด ไม่มีเงินชำระหนี้ให้แก่ธนาคาร ทรัพย์เจริญ จำกัด (มหาชน) และนายแสงได้ถึงแก่ความตาย ธนาคารทรัพย์เจริญ จำกัด (มหาชน) จึงได้ฟ้องบริษัท มุ่งหมาย จำกัด และนายแสงในฐานะผู้ค้ำประกันโดยนายขันซึ่งเป็นบุตรโดยชอบด้วยกฎหมายของนายแสงในฐานะทายาทโดยธรรมต่อศาลแพ่ง ขอให้พิพากษาให้บริษัท มุ่งหมาย จำกัด และนายแสงโดยนายขันในฐานะทายาทโดยธรรมร่วมรับผิดชำระหนี้ให้แก่ธนาคารทรัพย์เจริญ จำกัด (มหาชน) ระหว่างดำเนินคดีดัง\n กล่าว นายสาได้ฟ้องนายขันให้ตกเป็นบุคคลล้มละลาย และศาลมีคำสั่งพิทักษ์ทรัพย์เด็ดขาดนายขันแล้ว เจ้า พนักงานพิทักษ์ทรัพย์จึงได้ยื่นคำร้องขอเข้าดำเนินคดีนี้แทนนายขันต่อศาลแพ่ง\n ดังนี้ ให้วินิจฉัยว่าศาลจะสั่งคำร้องขอเข้าดำเนินคดีแทนของเจ้าพนักงานพิทักษ์ทรัพย์อย่างไร เพราะ เหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=71&name=Judge-Exam"}, {"id": "L72", "exam": "อก.", "year": 2548, "subject": "รัฐธรรมนูญ", "no": 4, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2548\n กฎหมายรัฐธรรมนูญ \n วันอาทิตย์ที่ 18 ธันวาคม 2548\n ข้อ 4 \n พนักงานสอบสวนได้จับกุมและสอบสวนนายสมโดยกล่าวหาว่ากระทำผิดฐานฆ่าผู้อื่น นายสมให้การปฏิเสธ ต่อมาพนักงานอัยการได้ฟ้องนายสมในความผิดดังกล่าว ในชั้นศาลนายสมให้การปฏิเสธว่ามิได้กระทำผิดและโต้แย้งว่าในชั้นสอบสวน พนักงานสอบสวนได้ทำการสอบสวนด้วยวิธีการ มิชอบด้วยบทบัญญัติในรัฐธรรมนูญหลายประการ จึงเป็นการสอบสวนที่ไม่ชอบด้วยกฎหมาย พนักงานอัยการไม่มีอำนาจฟ้องคดีนี้ จึงขอให้ศาลรอการพิจารณาพิพากษาคดีไว้ชั่วคราว และส่งข้อโต้แย้งของตนไปให้ศาลรัฐธรรมนูญพิจารณาวินิจฉัยต่อไป\n ดังนี้ ให้วินิจฉัยว่านายสมมีสิทธิขอให้ศาลส่งข้อโต้แย้งของตนดังกล่าวข้างต้นไปให้ศาลรัฐธรรมนูญพิจารณาวินิจฉัยหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=72&name=Judge-Exam"}, {"id": "L114", "exam": "อก.", "year": 2541, "subject": "ล้มละลาย", "no": 1, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชากฎหมายล้มละลาย (สนามใหญ่)\nข้อ 1.\n เมื่อวันที่ 1 พฤศจิกายน 2540 นายแจงซึ่งมีร้านขายทองอยู่ที่จังหวัดเชียงใหม่ได้ทำสัญญากู้เงินนายจำที่บ้านของนายจำที่จังหวัดสุพรรณบุรี จำนวน 455,000 บาทดอกเบี้ยร้อยละ 10 ต่อปี มีกำหนด 1 ปี โดยมีที่ดินของนายแจงจำนองไว้เป็นประกัน ครั้นถึงกำหนดแล้วไม่ชำระ นายจำจึงมีหนังสือทวงถามถึงนายแจงให้ชำระหนี้มาแล้ว 2 ครั้ง ซึ่งมีระยะเวลาห่างกัน 15 วัน แต่ไม่ยอมชำระ\n ดังนี้ นายจำจะฟ้องนายแจงเป็นบุคคลล้มละลาย และจะฟ้องที่ศาลจังหวัดสุพรรณบุรีได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=114&name=Judge-Exam"}, {"id": "L115", "exam": "อก.", "year": 2541, "subject": "ล้มละลาย", "no": 2, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชากฎหมายล้มละลาย (สนามใหญ่)\n ข้อ 2.\n เมื่อวันที่ 15 ตุลาคม 2541 นายสมชายเบิกเงินเกินบัญชีตามสัญญา เงินกู้จากธนาคารนครไทย จำกัด (มหาชน) โดยมีนายสมศักดิ์ เป็นผู้ค้ำประกันและต้องชำระหนี้เงินกู้ภายในวันที่ 15 ตุลาคม 2542 ต่อมาวันที่ 1 ธันวาคม 2541 นายสมชายถูกศาลสั่งพิทักษ์ทรัพย์เด็ดขาด เนื่องจากเป็นผู้มีหนี้สินล้นพ้นตัว และนายสมชายได้ทำการขอประนอมหนี้ก่อน ล้มละลายในวันที่ 15 ธันวาคม 2541 ซึ่งที่ประชมเจ้าหนีได้มีมติพิเศษยอมรับคำขอประนอมหนี้ของนายสมชาย และศาลมีคำสั่งเห็นชอบ\n ข้อเท็จจริงปรากฏต่อมาว่า ในวันที่ 5 มกราคม 2542 นายสมศักดิ์ถูกศาลสั่งพิทักษ์ทรัพย์เด็ดขาด เนื่องจากเป็นผู้มีหนี้ลนล้นพ้นตัว ธนาคารนครไทย จำกัด (มหาชน) ในฐานะเจ้าหนี้ของนายสมชาย ได้ยื่นคำขอรับชำระหนี้ในคดีของนายสมศักดิ์ต่อเจ้าพนักงานพิทักษ์ทรัพย์ใน ฐานะนายสมศักดิ์ เป็นผู้ค้ำประกันหนี้นายสมชายในวันที่ 15 มกราคม 2542 เจ้าพนักงานพิทักษ์ทรัพย์ปฏิเสธคำขอรับชำระหนี้ของธนาคารนครไทย จำกัด (มหาชน) โดยอ้างว่า นายสมชายยื่นคำขอประนอมหนี้ก่อนล้มละลาย และศาลมีคำสั่งเห็นชอบแล้ว ทำให้นายสมศักดิ์ผู้ค้ำประกันหลุดพ้นจากความรับผิด จึงไม่มีหนี้ตามสัญญาค้ำประกันที่นายสมศักดิ์ต้อง\n ชำระ เพราะนายสมชายยังไม่ผิดนัดชำระหนี้\n ดังนี้ ท่านเห็นว่าข้ออ้างของเจ้าพนักงานพิทักษ์ทรัพย์ดังกล่าวข้างต้นฟังไม่ขึ้น หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=115&name=Judge-Exam"}, {"id": "L116", "exam": "อก.", "year": 2541, "subject": "ล้มละลาย", "no": 3, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชากฎหมายล้มละลาย (สนามใหญ่)\n ข้อ 3.\n นายแดงทำสัญญาเช่าซื้อตึกแถวจากบริษัท ก. และเปิดใช้เป็นสำนักงานในชื่อของนายแดง ในระหว่างการผ่อนชำระเงินค่าเช่าซื้อ นายแดงผิดนัดไม่ชำระเงินค่าเช่าซื้อ เกินสองคราวติด ๆ กัน ต่อมามีเจ้าหนี้ฟ้องนายแดงเป็นคดีล้มละลายและศาลมีคำสั่งพิทักษ์ทรัพย์เด็ดขาดนายแดงเจ้าพนักงานพิทักษ์ทรัพย์ได้จัดการรวบรวมเอาตึกแถวที่เช่าซื้อไว้ในกองทรัพย์สินในคดีล้มละลาย เพราะตึกแถวอยู่ในความครอบครองของนายแดง บริษัท ก. จึงฟ้องเป็นคดีแพ่งขับไล่นายแดงให้ออกจากตึกแถวดังกล่าว\n ดังนี้ เจ้าพนักงานพิทักษ์ทรัพย์มีอำนาจจัดการรวบรวมเอาตึกแถวที่เช่าซื้อไว้ในกองทรัพย์สินในคดีล้มละลายได้หรือไม่ และบริษัท ก.มีอำนาจฟ้องเป็นคดีแพ่งขับไล่นายแดงได้ หรือไม่", "src": "https://www.lawsiam.com/?file=filedetail&max=116&name=Judge-Exam"}, {"id": "L117", "exam": "อก.", "year": 2541, "subject": "พระธรรมนูญ", "no": 4, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชาพระธรรมนูญศาลยุติธรรม (สนามใหญ่)\n ข้อ 4.\n พนักงานอัยการเป็นโจทก์ฟ้องจำเลยต่อศาลแขวงขอให้ลงโทษจำเลยฐานลักทรัพย์ ตามประมวลกฎหมายอาญา มาตรา 334 ซึ่งมีอัตราโทษจำคุกไม่เกิน 3 ปี และปรับไม่เกิน 6,000 บาท กับขอให้ศาลพิพากษากักกันจำเลยด้วย เนื่องจากจำเลยเป็นผู้กระทำผิดติดนิสัย นายโท ผู้พิพากษานายเดียวนั่งพิจารณาคดี จำเลยให้การรับสารภาพตามฟ้อง นายโท พิพากษาลงโทษจำคุกจำเลยฐานลักทรัพย์ 1 ปี รับสารภาพลดโทษลงกึ่งหนึ่ง คงจำคุก 6 เดือน และให้กักกันจำเลยไว้มีกำหนด 5 ปี แต่นายเอกผู้พิพากษาหัวหน้าศาลแขวงซึ่งไม่ได้นั่งพิจารณาได้ร่วมตรวจสำนวนและไม่เห็นพ้องด้วยกับคำพิพากษา โดยเห็นว่าควรลงโทษจำคุกจำเลย 1 ปี จึงทำความเห็นแย้งไว้ นายโทได้อ่านคำพิพากษาและความเห็นแย้งให้จำเลยฟัง\n ดังนี้ คำพิพากษาดังกล่าวชอบด้วยกฎหมายหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=117&name=Judge-Exam"}, {"id": "L118", "exam": "อก.", "year": 2541, "subject": "วิแขวง", "no": 5, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชา กฎหมายว่าด้วยการจัดตั้งศาลแขวงและวิธีพิจารณาความอาญาในศาลแขวง (สนามใหญ่)\nข้อ 5.\n เมื่อวันที่ 4 มกราคม 2542 เวลา 13.00 นาฬิกา นายเอกและนายโท ถูกเจ้าหน้าที่ตำรวจสถานีตำรวจนครบาลหัวหมากจับกุมในข้อหาร่วมกันเล่นการพนันสลากกินรวบพนันเอาทรัพย์สินกันโดยไม่รับอนุญาต นำตัวส่งพนักงานสอบสวนดำเนินคดี ในวันเดียวกันนายเอกได้รับการปล่อยตัวชั่วคราว โดยมีประกันตัวในชั้นพนักงานสอบสวน ส่วนนายโทถูกควบคุมตัวตามอำนาจของพนักงานสอบสวน ต่อมาในวันที่ 6 มกราคม 2542 เวลา 10.00 นาฬิกา นายประกันได้ส่งตัวนายเอกให้กับพนักงานสอบสวนตามกำหนดนัดในสัญญาประกัน พนักงานสอบสวนจึงได้นำตัวนายเอกและนายโทผู้ต้องหาทั้งสองซึ่งให้การรับสารภาพ ส่งให้พนักงานอัยการยื่นฟ้องด้วยวาจาต่อศาล ปรากฏว่าขณะที่พนักงานอัยการได้นำตัวนายเอก และนายโทไปยื่นฟ้องด้วยวาจาต่อศาล นายเอกและนายโทได้หลบหนีไป จนต่อมาในวันที่ 11 มกราคม 2542 เวลา 11.00 นาฬิกา พนักงานสอบสวนติดตามจับกุมตัวนายเอกและนายโทได้ แล้วนำตัวมามอบให้กับพนักงานอัยการเพื่อยื่นฟ้องด้วยวาจาต่อศาล ในวันเดียวกันเวลา 11.30 นาฬิกา พนักงานอัยการได้ยื่นฟ้องนายเอกและนายโทเป็นจำเลยต่อศาลด้วยวาจา นายเอกและนายโท จำเลยต่างให้การรับสารภาพ ศาลแขวงได้พิจารณาแล้วพิพากษาให้ยกฟ้องโจทก์ เนื่องจากฟ้อง คดีนี้เกินกว่า 48 ชั่วโมง นับแต่เวลาที่จำเลยทั้งสองถูกจับ โดยมิได้มีการยื่นคำร้องขอผัดฟ้องจำเลยภายในกำหนดเวลาผัดฟ้องตามกฎหมาย\n ดังนี้ คำพิพากษาของศาลแขวงดังกล่าวชอบหรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=118&name=Judge-Exam"}, {"id": "L119", "exam": "อก.", "year": 2541, "subject": "วิแขวง", "no": 6, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชา กฎหมายว่าด้วยการจัดตั้งศาลแขวงและวิธีพิจารณาความอาญาในศาลแขวง (สนามใหญ่)\nข้อ 6.\n เมื่อวันที่ 30 ธันวาคม 2540 ผู้ต้องหาถูกจับกุมดำเนินคดีในข้อหาฉ้อโกง ปลอมและใช้เอกสารสิทธิอันเป็นเอกสารของทางราชการ ในเขตท้องที่ของสถานีตำรวจภูธรอำเภอบางบัวทอง ระหว่างสอบสวนผู้ต้องหาถูกขังอยู่ตามอำนาจของศาลจังหวัดนนทบุรี ต่อมาวันที่ 28 เมษายน 2541 พนักงานสอบสวนสถานีตำรวจภูธรอำเภอบางกรวยได้ทำหนังสืออายัดตัวผู้ต้องหาต่อผู้บัญชาการเรือนจำจังหวัดนนทบุรี เพื่อสอบสวนในข้อหาฉ้อโกงเป็นอีกคดีหนึ่ง แต่พนักงานสอบสวนสถานีตำรวจภูธรบางกรวยไม่ได้ยื่นคำร้องขอผัดฟ้องผู้ต้องหาต่อศาลแขวงนนทบุรีไว้ โดยพนักงานสอบสวนสถานีตำรวจภูธรอำเภอบางกรวยได้ไปทำการสอบสวนและแจ้ง\n ข้อหาแก่ผู้ต้องหาที่เรือนจำจังหวัดนนทบุรี เมื่อวันที่ 6 กรกฎาคม 2541 แล้วส่งสำนวนไปให้พนักงานอัยการโดยมิได้ยื่นคำร้องขอผัดฟ้องไว้ต่อศาลแขวงนนทบุรี\n ดังนี้ พนักงานอัยการศาลแขวงนนทบุรีจะฟ้องผู้ต้องหาต่อศาลแขวงนนทบุรี ได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=119&name=Judge-Exam"}, {"id": "L120", "exam": "อก.", "year": 2541, "subject": "วิแขวง", "no": 7, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชา กฎหมายว่าด้วยการจัดตั้งศาลแขวงและวิธีพิจารณาความอาญาในศาลแขวง (สนามใหญ่)\nข้อ 7.\n ในคดีอาญาของศาลจังหวัดลพบุรีเรื่องหนึ่งอยู่ระหว่างพิจารณาสืบพยานจำเลยทนายจำเลยแถลงขอส่งประเด็นไปสืบพยานจำเลยที่ศาลจังหวัดราชบุรี ทนายจำเลยจะตามประเด็นไป ถ้าไม่ไปถือว่าไม่ติดใจสืบพยาน นาย ก. พนักงานอัยการผู้ดำเนินคดีนี้แถลงว่า พนักงานอัยการโจทก์จะตามประเด็นไปถ้าไม่ไปขอให้พนักงานอัยการจังหวัดราชบุรีดำเนินคดีแทนศาลจังหวัดลพบุรีอนุญาตให้ส่งประเด็นไปสืบพยานจำเลยที่ศาลจังหวัดราชบุรี เมื่อถึงวันนัด ศาลจังหวัดราชบุรีออกนั่งพิจารณาสืบพยานประเด็นจำเลย ทนายจำเลยมาศาล แต่พนักงานอัยการ จังหวัดราชบุรีและนาย ก. พนักงานอัยการจังหวัดลพบุรีไม่มาศาล ศาลจึงให้ทนายจำเลย นำพยานเข้าสืบ ขณะนั้น นาย ข. พนักงานอัยการจังหวัดลพบุรีได้ตามประเด็นดำเนินคดีเรื่องอื่น ที่ศาลจังหวัดราฯบุรี จึงเข้ามาถามค้านพยานจำเลยในคดีดังกล่าว ทนายจำเลยแถลงศาลว่า นาย ข. ไม่มีอำนาจดำเนินคดีนี้เพราะไม่ใช่ผู้ดำเนินคดีนี้มาแต่ต้น และไม่ใช่พนักงานอัยการ จังหวัดราชบุรี\n ดังนี้ คำแถลงของทนายจำเลยรับฟังได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=120&name=Judge-Exam"}, {"id": "L121", "exam": "อก.", "year": 2541, "subject": "วิแขวง", "no": 8, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2541\nวิชา กฎหมายว่าด้วยการจัดตั้งศาลแขวงและวิธีพิจารณาความอาญาในศาลแขวง (สนามใหญ่)\nข้อ 8.\n ในคดีอาญาระหว่างพนักงานอัยการสำนักงานอัยการสูงสุดโจทก์นายจอห์นจำเลย ข้อหามียาเสพติดให้โทษ (กัญชา) ในครอบครองโดยไม่ได้รับอนุญาต ศาลชั้นต้นอนุญาตให้ปล่อยชั่วคราวนายจอห์น จำเลย โดยนายแดงผู้ประกันได้วางหลักประกันเป็นเงินสดจำนวน 60,000 บาท และทำสัญญาประกันไว้ต่อศาล ต่อมาศาลชั้นต้นพิพากษาลงโทษจำคุกนายจอห์น 1 เดือน คดีถึงที่สุด หลังจากนั้นสองเดือน นายแดงมาร้องขอหลักประกันคืน แต่เจ้าหน้าที่ศาลชั้นต้นรายงานว่า น่าเชื่อว่าเงินสดที่ใช้เป็นหลักประกันเป็นของนายจอห์น จำเลย ศาลชั้นต้น สั่งให้นายแดงนำตัวนายจอห์น จำเลยมาสอบสวนถาม แต่นายแดงไม่สามารถนำตัวจำเลยมาศาล\n ได้ เพราะเดินทางกลับประเทศออสเตรเลียแล้ว ศาลชั้นต้นพิจารณาแล้วมีคำสั่งว่า กรณียังไม่แน่ชัดว่าเงินหลักประกันเป็นของนายแดงหรือของจำเลย ให้ยกคำร้องของนายแดง นายแดง อุทธรณ์ ศาลอุทธรณ์พิพากษากลับให้คืนหลักประกันให้แก่นายแดง\n ดังนี้ พนักงานอัยการจะยื่นฎีกาคัดค้านคำสั่งศาลอุทธรณ์เพื่อให้ยกคำร้องของนายแดง ตามคำสั่งศาลชั้นต้นได้หรือไม่ เพราะเหตุใด", "src": "https://www.lawsiam.com/?file=filedetail&max=121&name=Judge-Exam"}, {"id": "L280", "exam": "อก.", "year": 2551, "subject": "อาญา", "no": 5, "topic": "", "note": "", "text": "ข้อสอบอัยการผู้ช่วย (สนามใหญ่) สอบวันที่ ๒๗ เมษายน ๒๕๕๑ ดังนี้ \nข้อ ๕ \n นางสาวงาม อายุ ๑๗ ปี ได้ทะเลาะกับบิดามารดา และออกจากบ้านบิดามารดาไปอยู่กับเพื่อนที่หอพัก บิดามารดาไปติดตามให้กลับบ้านแต่ไม่พบตัว นายเก่งนำรถยนต์มารับนางสาวงามจากหอพักไปเที่ยว แล้วนำไปที่ห้องพักของเพื่อน ตนเอง และนายเก่งกับนางสาวงามได้ใช้ห้องพักดังกล่าวในการร่วมประเวณีกัน ต่อมา นายเก่งได้ชวนนางสาวงามไปร่วมประเวณีอีก นางสาวงามเพียงผู้เดียวรู้ว่าตนเอง ตั้งครรภ์ได้ ๑ เดือน จึงปฏิเสธนายเก่ง ทำให้นายเก่งโกรธ นายเก่งจึงทำร้ายร่างกาย นางสาวงามทำให้นางสาวงามแท้งลูกและได้รับบาดเจ็บใช้เวลารักษา ๑๕ วัน \n ให้วินิจฉัยว่า นายเก่งมีความผิดฐานใดหรือไม่", "src": "https://www.lawsiam.com/?file=filedetail&max=280&name=Judge-Exam"}, {"id": "L762", "exam": "อก.", "year": 2564, "subject": "อาญา", "no": 3, "topic": "หลักทั่วไป/ความรับผิดเด็ดขาด", "note": "สนามเล็ก", "text": "ข้อสอบอัยการผู้ช่วย พ.ศ. ๒๕๖๔ (สนามเล็ก) \nวิชากฎหมายอาญา สอบวันที่ ๒๐ พ.ย. ๖๔ ข้อ ๓. \n ข้อ ๓ หลัก “ความรับผิดเด็ดขาด” (Strict Liability) คืออะไร กฎหมายอาญา มีหลักในเรื่องนี้หรือไม่อย่างไรและประมวลกฎหมายอาญามีบทบัญญัติที่กําหนดความรับผิดเด็ดขาดไว้หรือไม่ อย่างไร", "src": "https://www.lawsiam.com/?file=filedetail&max=762&name=Judge-Exam"}, {"id": "L354", "exam": "ผช.", "year": 2559, "subject": "พยาน", "no": 1, "topic": "ภาระการพิสูจน์", "note": "", "text": "ข้อสอบผู้ช่วยผู้พิพากษา \nวิชาพยาหลักฐาน ปี 2559\n ข้อ 1\n โจทก์ฟ้องว่า โจทก์เป็นเจ้าของผู้มีชื่อถือกรรมสิทธิ์ในโฉนดที่ดินแปลงหนึ่ง ตามสำเนาโฉนดที่ดินท้ายฟ้อง จำเลยที่ 1 บุกรุกเข้าไปปลูกสร้างโรงงานในที่ดินนั้นทางด้านทิศเหนือ เนื้อที่ 1 ไร่ และจำเลยที่ 2 บุกรุกเข้าไปปลูกสร้างบ้านอยู่อาศัยในที่ดินนั้นทางด้านทิศใต้เนื้อที่ 1 ไร่ อันเป็นการละเมิด ขอให้ขับไล่รื้อถอนและชดใช้ค่าเสียหายคนละ 200,000 บาท แก่โจทก์ จำเลยที่ 1 ให้การว่า ที่ดินพิพาทด้านทิศเหนืออยู่ในเขตที่ดิน น.ส. 3 ของจำเลยที่ 1 ตามสำเนา น.ส. 3. ท้ายคำให้การ โฉนดที่ดินของโจทก์ออกทับที่ดินของจำเลยที่ 1 เนื้อที่ 1 ไร่ โฉนดที่ดินดังกล่าวจึงไม่ชอบด้วยกฎหมาย จำเลยที่ 1 มิได้บุกรุกเข้าไปในที่ดินของโจทก์ ขอให้ยกฟ้อง ส่วนจำเลยที่ 2 ให้การว่า ที่ดินพิพาท ด้านทิศใต้อยู่ในเขตที่ดิน ส.ค. 1 ของจำเลยที่ 2 ตามสำเนา ส.ค. 1 ท้ายคำให้การ มิใช่ของโจทก์ โจทก์ขอออกโฉนดที่ดินโดยไม่สุจริต หากศาลสั่งว่าที่ดินพิพาทด้านทิศใต้เป็นของโจทก์ จำเลยที่ 2 ก็ได้ แย่งการครอบครองมาโดยความสงบและโดยเปิดเผยด้วยเจตนาเป็นเจ้าของเกินกว่าสิบปีแล้ว โจทก์จึงไม่มี อำนาจฟ้อง ขอให้ยกฟ้อง\n ให้วินิจฉัยว่า\n (ก) คดีมีประเด็นข้อพิพาทว่าอย่างไร\n (ข) ภาระการพิสูจน์ในแต่ละประเด็นตกอยู่แก่ฝ่ายใด\n (ค) จำเลยที่ 2 นำสืบพยานหลักฐานว่าได้ครอบครองปรปักษ์ที่ดินพิพาทด้านทิศใต้มาเกินกว่าสิบปีแล้วได้หรือไม่", "src": "https://www.lawsiam.com/?file=filedetail&max=354&name=Judge-Exam"}, {"id": "L270", "exam": "ผช.", "year": 2550, "subject": "รัฐธรรมนูญ", "no": null, "topic": "หลักความเสมอภาค", "note": "สนามใหญ่ (เลขข้อไม่ระบุในแหล่ง)", "text": "ตัวอย่างข้อสอบผู้ช่วยผู้พิพากษา สนามใหญ่ ปี ๒๕๕๐\nคำถาม \n นายแดงตกลงกับนายดำและชาวบ้านหลายสิบครอบครัวให้ใช้ที่ดินของนายแดงเป็นทางเดินออกสู่ทางสาธารณะได้ เพราะเห็นว่านับถือศาสนาเดียวกัน หลังจากนั้น นายแดงทราบว่านายดำไม่ได้นับถือศาสนาเดียวกันกับนายแดง จึงนำแผ่นป้ายไปปักไว้ริมทางเดินดังกล่าว มีข้อความห้ามคนที่ไม่ได้นับถือศาสนาเดียวกันกับนายแดงเดินผ่าน นายดำทราบดีว่านายแดงหมายถึงตน แต่ก็ยังคงใช้ที่ดินของนายแดงเป็นทางออกสู่ถนนสาธารณะเช่นเดิม นายแดงจึงไปร้องทุกข์ต่อเจ้าพนักงานตำรวจให้ดำเนินคดีกับนายดำในข้อหาบุกรุก ต่อมาพนักงานอัยการเป็นโจทก์ฟ้องนายดำข้อหาบุกรุก นายดำให้การต่อสู้คดีว่า การที่นายแดงห้ามนายดำไม่ให้เดินผ่านทางพิพาทเพราะไม่ได้นับถือศาสนาเดียวกันกับนายแดง เป็นการเลือกปฏิบัติโดยไม่เป็นธรรมเพราะเหตุแห่งความแตกต่างในเรื่องความเชื่อทางศาสนา ขัดต่อหลักความเสมอภาคตามรัฐธรรมนูญ นายแดงจะยกเลิกข้อตกลงเพราะเหตุดังกล่าวไม่ได้ ให้วินิจฉัยว่า ข้อต่อสู้ของนายดำดังกล่าว ฟังขึ้นหรือไม่", "src": "https://www.lawsiam.com/?file=filedetail&max=270&name=Judge-Exam"}, {"id": "L765", "exam": "ผช.", "year": 2565, "subject": "อาญา", "no": null, "topic": "ปลอมเอกสาร/พินัยกรรม", "note": "แหล่งระบุว่า \"บางส่วน\"", "text": "ข้อสอบผู้ช่วยผู้พิพากษา ปี ๒๕๖๕ (บางส่วน)\n นายดําทําพินัยกรรมยกที่ดินให้แก่นางดวงกับนายแดงซึ่งเป็นบุตรคนละแปลง ต่อมานายดําป่วยเป็นอัมพาตเคลื่อนไหวร่างกายไม่ได้ นางดวงเป็นผู้ดูแลและออกค่า ใช้จ่ายในการรักษานายดําทั้งหมดส่วนนายแดงแยกไปมีครอบครัวอยู่ต่างหาก นางดวง ทราบว่านายดําทําพินัยกรรมและเก็บไว้ในห้องนอนจึงแอบเปิดดูและเห็นว่านายแดง ไม่สมควรได้รับมรดกเนื่องจากไม่เคยดูแลรักษานายดํา จึงเอาพินัยกรรมดังกล่าวไปซ่อน ไม่นําออกมาเปิดเผย จากนั้นได้ทําพินัยกรรมขึ้นใหม่ระบุว่านายดํายกที่ดินทั้งสองแปลง ให้แก่นางดวงแต่ผู้เดียว แล้วจับมือนายดําขณะนอนหลับกดพิมพ์ลายนิ้วมือในช่องผู้ทําพินัยกรรมโดยบุตรนางดวงสองคนซึ่งอยู่ด้วยในขณะนั้นลงลายมือชื่อรับรอง แล้วเก็บพินัยกรรมฉบับใหม่ไว้ในห้องนอนของนายดําแทนที่ฉบับเดิม วันต่อมาขณะที่นางดวงออกไปทําธุระนอกบ้าน นายแดงแวะมาเยี่ยมนายดําและเห็นพินัยกรรมดังกล่าว จึงแก้ไขข้อความในพินัยกรรมเป็นว่านายดํายกที่ดินทั้งหมดให้แก่นายแดง ให้วินิจฉัยว่า นางดวง และนายแดงมีความผิดตามประมวลกฎหมายอาญาฐานใดหรือไม่", "src": "https://www.lawsiam.com/?file=filedetail&max=765&name=Judge-Exam"}, {"id": "L1137", "exam": "ผช.", "year": 2556, "subject": "อังกฤษ", "no": null, "topic": "แปล", "note": "", "text": "ข้อสอบผู้ช่วยฯ สอบวันเสาร์ที่ ๑๕ มิถุนายน ๒๕๕๖ \nคำถาม ให้แปลเป็นภาษาอังกฤษ \n มาตรฐานการพิสูจน์ที่กําหนดในคดีแพ่งต่ำกว่ามาตรฐานการพิสูจน์ที่กําหนดใน คดีอาญาเป็นอย่างมาก ในคดีอาญา โจทก์ต้องพิสูจน์โดยปราศจากเหตุอันควรสงสัยว่า จําเลยกระทําความผิดนั้น ส่วนในคดีแพ่ง หากคู่ความฝ่ายที่มีภาระการพิสูจน์สามารถนําพยานหลักฐานมาสืบให้เห็นว่าข้ออ้างของตนมีความน่าจะเป็นมากกว่าอย่างอื่น หรือมีความน่าจะเป็นเกินกว่าร้อยละห้าสิบว่าข้ออ้างของตนเป็นความจริง ก็ได้มาตรฐานแล้ว", "src": "https://www.lawsiam.com/?file=filedetail&max=1137&name=Judge-Exam"}, {"id": "L1138", "exam": "ผช.", "year": 2565, "subject": "อังกฤษ", "no": null, "topic": "แปล", "note": "สนามใหญ่ 12 ก.พ. 65", "text": "คำถาม ให้แปลเป็นภาษาไทย ข้อผู้ช่วยฯ สนามใหญ่\nสอบวันที่ ๑๒ กุมภาพันธ์ ๒๕๖๕\n Eighty percent of more than ๓o๐,๐๐๐ inmates in the Thai penitentiary system are currently detained on drug related charges.", "src": "https://www.lawsiam.com/?file=filedetail&max=1138&name=Judge-Exam"}, {"id": "L1139", "exam": "ผช.", "year": 2565, "subject": "อังกฤษ", "no": null, "topic": "แปล", "note": "สนามเล็ก 26 มิ.ย. 65", "text": "คำถาม ให้แปลเป็นภาษาไทย ข้อผู้ช่วยฯ สนามเล็ก \nสอบวันที่ ๒๖ มิถุนายน ๒๕๖๕\n Interests, information about past purchases, health, and online behavior is also considered personal data as it could identify a person.", "src": "https://www.lawsiam.com/?file=filedetail&max=1139&name=Judge-Exam"}, {"id": "L133", "exam": "อก.", "year": 2519, "subject": "อังกฤษ", "no": 1, "topic": "แปล", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2519\nวิชา ภาษาอังกฤษ (สนามใหญ่)\nจงแปลอังกฤษเป็นไทย\n ข้อ 1. \n The Road to Justice\n When you set out on this road you must remember that there are two great objects to be achieved : one is to see that the laws are just; the other that they are justly administered- Both are important; but of the two, the more\nimportant; is that the law should be justly administered It is no use having just laws if they are administered unfairly by bad judges or corrupt lawyers.A country can put up with laws that are harsh or unjust so long as they are\nadministered by just judges who can mitigate their harshness or alleviate their unfairness but a country cannot long tolerate a legal system with dose not give a fair trial. (From \"The Road to Justice\" by Sir Alfred Denning)\n Why people obey the law? The people of England do not obey the Law simply because they are commanded to do so nor because they are afraid of sanctions or of being punished. They obey the law because they know it is\na thing they ought to do. There are of course some wicked persons who do not recognize it as their duty to obey the law : and for them sanctions and punishments must be infected. But this does not altos the fact that the great\nmajority of the people obey the law simply because they recognize it to be obligatory on them. They recognize that they are under a duty to obey it", "src": "https://www.lawsiam.com/?file=filedetail&max=133&name=Judge-Exam"}, {"id": "L134", "exam": "อก.", "year": 2519, "subject": "อังกฤษ", "no": 2, "topic": "แปล", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี 2519\nวิชา ภาษาอังกฤษ (สนามใหญ่)\nข้อ 2.\n จงแปลไทยเป็นอังกฤษ\n กล่าวโดยทั่วไปแล้วผู้ที่ถูกชกด้วยมือเปล่าย่อมไม่อาจยกขึ้นเป็นข้อแก้ตัวโดยชอบด้วยกฎหมายว่าเป็นการป้องกันตนเองด้วยการใช้มีดหรือปืน ยิ่งกว่านั้น ในบางกรณี โดยเฉพาะอย่างยิ่งในเมื่อคู่กรณีมีส่วนพัวพันเกี่ยวข้องในการต่อสู้กันซึ่งทั้งคู่จะต้องตกเป็นผู้ผิดด้วยกันอาจเป็นสิ่งจำเป็นสำหรับจำเลยที่จะต้องแสดงให้เห็นว่าตนได้ล่าถอยไปจนไกลเท่าที่สามารถจะทำได้ก่อนที่จะทำให้เขาถึงตาย", "src": "https://www.lawsiam.com/?file=filedetail&max=134&name=Judge-Exam"}, {"id": "K1183", "exam": "ผช.", "year": 2545, "subject": "อังกฤษ", "no": null, "topic": "แปล", "note": "", "text": "ข้อสอบผู้ช่วยผู้พิพากษา แปลภาษาอังกฤษ พ.ศ.2545\nให้แปลเป็นภาษาไทย (ไม่ต้องแปลข้อความในวงเล็บ)\nI still have another suggestion to offer. It is above and Beyond man-made law just mentioned. It is “the Law of Karma” which is one of the fundamental precepts of Buddhism. Perhaps we may call it “a divine law”. It is the law of cause and effect, perfect in its outworking throughout all human life.No one can take away from you whatever good you do. You will always be rewarded for that. Neither can any one help you out of your bad deeds.You will have บo pay for each of them. My money that is ill earned, or an advantage that is ill gained will somehow some day disappear without trace.Whenever another man has done you harm or injustice. you need not stand for your rights. The harm or in justice done to you will be knighted by this exact Law of Karma. This is the way the divine law works for you and for everyone.(Excerpt from The Good Lawyer, a lecture delivered by His Excellency Mr. Tanin Kraivixien, privy councilor and professor of Law)", "src": "https://www.lawsiam.com/?file=readknowledge&max=1183&name=knowledge"}, {"id": "K1184", "exam": "ผช.", "year": 2545, "subject": "วิแพ่ง", "no": null, "topic": "เขตอำนาจศาล ม.4 ทวิ/4 ตรี", "note": "", "text": "ข้อสอบผู้ช่วยผู้พิพากษา พ.ศ.2545 ปวิพ.ม.4 ตรี,4 ทวิ\nนายยอดคนสัญชาติไทยมีภูมิลำเนาอยู่ที่จังหวัดลำพูน ได้พบกับนายเยี่ยมคนสัญชาติไทยซึ่งย้ายไปมีภูมิลำเนาอยู่ที่มลรัฐนิวยอร์ก ประเทศสหรัฐอเมริกานาน 3 ปีแล้ว ขณะอยู่ที่มลรัฐนิวยอร์กนายยอดได้ทำสัญญาจะซื้อที่ดิน 1 แปลง ของนายเยี่ยมในราคา 5,000,000 บาท ซึ่งตั้งอยู่ที่อำเภอเมืองเชียงใหม่ จังหวัดเชียงใหม่ โดยนายยอดได้วางเงินมัดจำไว้แล้ว 500,000 บาท ต่อมานายเยี่ยมผิดสัญญาไม่ยอมโอนที่ดินให้แก่นายยอดภายในกำหนด และนายยอดได้บอกเลิกสัญญาแล้ว\nให้วินิจฉัยว่า นายยอดจะฟ้องนายเยี่ยมให้คืนเงินมัดจำและเรียกค่าเสียหายอีก 100,000 บาท ต่อศาลใดได้บ้าง", "src": "https://www.lawsiam.com/?file=readknowledge&max=1184&name=knowledge"}, {"id": "K1438", "exam": "ผช.", "year": 2557, "subject": "วิอาญา", "no": 2, "topic": "สอบสวน/คำสั่งไม่ฟ้อง", "note": "สนามใหญ่ สอบ ก.พ. 2557", "text": "ข้อสอบผู้ช่วยผู้พิพากษา ข้อ ๒. (สนามใหญ่) ก.พ. ๒๕๕๗ \nข้อ ๒. นายสมบัติร้องทุกข์ต่อพนักงานสอบสวนให้ดำเนินคดีแก่นางสาวมะลิลูกจ้างของตนในข้อหายักยอก หลังจากถูกแจ้งข้อหายักยอกแล้วนางสาวมะลิให้การปฏิบัติ พนักงานสอบสวนสรุปสำนวนเสนอต่อพนักงานอัยการว่า ปรากฏจากถ้อยคำของนายสมบัติเองว่านายสมบัติร้องทุกข์เกินกำหนด ๓ เดือน นับแต่วันที่รู้เรื่องความและรู้ตัวผู้กระทำความผิด คดีจึงขาดอายุความตามกฎหมายเห็นควรสั่งไมฟ้อง แต่พนักงานอัยการเห็นว่าการกระทำของนางสาวมะลิเป็นความผิดฐานลักทรัพย์นายจ้าง นายสมบัติไม่ต้องร้องทุกข์ภายในกำหนดดังกล่าวและสั่งให้พนักงานสอบสวนดำเนินคดีแก่นางสาวมะลิในข้อหาลักทรัพย์นายจ้าง และสอบสวนเพิ่มเติมกับสอบปากคำนางสาวมังคุดผู้รู้เห็นการที่นางสาวมะลิเอาทรัพย์ของนายสมบัติไป พนักงานสอบสวนดำเนินการสอบสวนเพิ่มเติมตามคำสั่งของพนักงานอัยการโดยไม่ได้แจ้งข้อหาใหม่ และไม่สามารถสอบปากคำนางสาวมังคุดได้เพราะนางสาวมังคุดไปทำงานต่างประเทศไม่มีกำหนดกลับ พนักงานอัยการเห็นว่าพยานหลักฐานในสำนวนไม่พอฟ้อง จึงมีคำสั่งไม่ฟ้องนางสาวมะลิ คำสั่งนี้เด็ดขาดแล้ว ต่อมานางสาวมังคุดกลับจากต่างประเทศ นายสมบัติพานางสาวมังคุดเข้าให้ถ้อยคำต่อพนักงานสอบสวน วันถัดมานายสมบัติเกิดความสงสารนางสาวมะลิจึงขอถอนคำร้องทุกข์ต่อพนักงานสอบสวน พนักงานสอบสวน สรุปความเห็นใหม่เสนอสำนวนต่อพนักงานอัยการเป็นควรสั่งฟ้องนางสาวมะลิในข้อหาลักทรัพย์นายจ้าง ในที่สุดพนักงานสอบสวนเป็นโจทก์ยื่นฟ้อง นางสาวมะลิต่อศาลในข้อหาลักทรัพย์นายจ้าง\nนางสาวมะลิให้การต่อสู้ว่า โจทก์ไม่มีอำนาจฟ้องเพราะ \nก) ไม่มีการแจ้งข้อหาลักทรัพย์นายจ้างถือว่าคดีไม่มีการสอบสวน\nข) นายสมบัติถอนคำร้องทุกข์แล้ว \nค) พนักงานอัยการมีคำสั่งเด็ดขาดไม่ฟ้องคดี จะนำคดีมาฟ้องไม่ได้ \nให้วินิจฉัยว่าข้อต่อสู้ของนางสาวมะลิฟังขึ้นหรือไม่", "src": "https://www.lawsiam.com/?file=readknowledge&max=1438&name=knowledge"}, {"id": "K1447", "exam": "ผช.", "year": 2554, "subject": "วิอาญา", "no": 1, "topic": "ค้น/จับ/ปล่อยตัว", "note": "สนามใหญ่ 7 ส.ค. 2554 · แหล่งแสดงเฉพาะข้อเท็จจริง แล้วแตกเป็นคำถามย่อยของผู้เรียบเรียง (ไม่ได้นำมาใส่) จึงไม่มีประโยคคำถามต้นฉบับ: ให้วินิจฉัยประเด็นการค้น การจับ และคำร้องขอปล่อย", "text": "ข้อสอบผู้ช่วยผู้พิพากษา วันที่ ๗ สิงหาคม ๒๕๕๔ ข้อ ๑ (สนามใหญ่)\nนายกาย เจ้าพนักงานป่าไม้ซึ่งเป็นเจ้าพนักงานฝ่ายปกครองหรือตำรวจตาม ป.วิ.อ. สืบทราบว่าที่บ้านนางเวทนามีไม้กระยาเลยไม่มีรอยตราค่าภาคหลวงอันเป็นไม้ผิดกฎหมายหลายท่อนไว้ในครอบครอง ในวันเกิดเหตุ เวลากลางวัน นายกายเดินผ่านบ้านของนางเวทนาซึ่งมีรั้วลวดหนามล้อมรอบ จึงกดกริ่งเรียกเจ้าของบ้าน แต่ไม่มีผู้ใดมาเปิดประตูรั้ว และเนื่องจากประตูรั้วแง้มอยู่ นายกายจึงเปิดประตูรั้วเข้าไปแล้วค้นบริเวณบ้านของนางเวทนาโดยไม่มีหมายค้นหรือคำสั่งของศาล และพบไม้ ๓๕ ท่อน กองอยู่หลังบ้าน เมื่อนางเวทนาเดินออกมา นายกายแสดงตัวเป็นเป็นเจ้าพนักงานป่าไม้ นางเวทนารับว่ามีไม้หวงห้ามไว้จริง นายกายจึงจับนางเวทนาในข้อหาดังกล่าว โดยไม่มีหมายจับ จากนั้นนำตัวนางเทนาพร้อมของกลางส่งร้อยตำรวจเอกจิตพนักงานสอบสวนดำเนินคดี นางเวทนาถูกควบคุมตัว ในวันรุ่งขึ้นนายธรรมสามีของนางเวทนายื่นคำร้องต่อศาลขอให้มีคำสั่งปล่อยตัวนางเวทนาอ้างว่าถูกคุมขังโดยไม่ชอบด้วยกฎหมายและสั่งให้พนักงานสอบสวนคืนไม้ของกลาง", "src": "https://www.lawsiam.com/?file=readknowledge&max=1447&name=knowledge"}, {"id": "K1449", "exam": "อก.", "year": 2546, "subject": "วิอาญา", "no": 1, "topic": "ผู้เสียหาย/ร่วมเป็นโจทก์", "note": "", "text": "ข้อสอบอัยการผู้ช่วย ปี พ.ศ. ๒๕๔๖ \nข้อ ๑ พนักงานอัยการเป็นโจทก์ฟ้องจำเลยฐานข่มขืนกระทำชำเรานางสาวสมศรี ผู้เยาว์ซึ่งมีอายุ ๑๖ ปี ในวันนัดพิจารณา นางสาวสมศรียื่นคำร้องขอเข้าร่วมเป็นโจทก์กับพนักงานอัยการ ดังนี้ ศาลจะสั่งคำร้องขอเข้าร่วมเป็นโจทก์กับพนักงานอัยการอย่างไร และถ้านายสมพงษ์บิดาไม่ชอบด้วยกฎหมายจะขอเข้าร่วมเป็นโจทก์กับพนักงานอัยการได้หรือไม่", "src": "https://www.lawsiam.com/?file=readknowledge&max=1449&name=knowledge"}, {"id": "K1759", "exam": "ผช.", "year": 2531, "subject": "แพ่ง", "no": 6, "topic": "นิติกรรมสัญญา/สัญญาเพื่อประโยชน์บุคคลภายนอก", "note": "20 เม.ย. 2531", "text": "ข้อสอบผู้ช่วยผู้พิพากษา ๒๐ เมษายน ๒๕๓๑ ข้อ ๖\n บริษัท มหาชัย จำกัด ทำสัญญาจ้างนายสมุทรให้ก่อสร้างอาคารที่ทำการของ บริษัท มหาชัย จำกัด โดยมีข้อสัญญาข้อหนึ่งว่า นายสมุทรจะต้องจ่ายเงินค่าจ้างให้แก่ลูกจ้างของนายสมุทรตามอัตราค่าจ้างและกำหนดเวลา ถ้านายสมุทรไม่จ่ายเงินค่าจ้างให้แก่ลูกจ้างเช่นนั้น บริษัท มหาชัย จำกัด ต้องนำเงินค่าจ้างที่บริษัท มหาชัย จำกัด จะต้องจ่ายให้นายสมุทร ไปจ่ายให้แก่ลูกจ้างของนายสมุทร และให้ถือว่าเงินจำนวนที่ไปเป็นเงินค่าจ้างที่นายสมุทรรับไปจาก บริษัท มหาชัย จำกัด แล้ว หลังจากนายสมุทรก่อสร้างอาคารดังกล่าวไปได้ระยะหนึ่ง นายสมุทรซึ่งเคยกระทำความผิดอาญาทราบว่าเจ้าพนักงานตำรวจจะมาจับกุมตัวไปดำเนินคดี จึงทิ้งงานก่อสร้างอาคารดังกล่าว และ หลบหนีไปโดยยังไม่ได้รับเงินค่าจ้างสำหรับงานส่วนที่ทำไปแล้วจากบริษัท มหาชัย จำกัด ทั้งยังไม่ได้จ่ายเงินค่าจ้างให้แก่ลูกจ้างของนายสมุทรด้วย นายสาครและพวกซึ่งเป็นลูกจ้างของนายสมุทรขอให้ บริษัท มหาชัย จำกัด ชำระค่าจ้างที่นายสมุทรค้างชำระให้แก่นายสาครและพวก แต่บริษัท มหาชัย จำกัด เพิกเฉย นายสาครและพวกจึงฟ้อง บริษัท มหาชัย จำกัด ให้ชำระค่าจ้างที่นายสมุทรค้างชำระให้แก่นายสาครและพวก บริษัท มหาชัย จำกัด ให้การว่านายสาครและพวกไม่มีนิติสัมพันธ์กับบริษัท มหาชัย จำกัด ไม่มีสิทธิเรียกร้องเงินค่าจ้างจากบริษัท มหาชัย จำกัด ขอให้ยกฟ้อง\n ดังนี้ ถ้าท่านเป็นศาลจะพิพากษาคดีนี้อย่างไร", "src": "https://www.lawsiam.com/?file=readknowledge&max=1759&name=knowledge"}], "exam2s": ["2027-02-13", "2027-02-20", "2027-02-27"], "exam2last": "2027-02-27", "exam2lab": {"2027-02-13": "สอบอัยการ วันที่ 1 (อาญา+แพ่งพาณิชย์)", "2027-02-20": "สอบอัยการ วันที่ 2 (วิอาญา+วิแพ่ง)", "2027-02-27": "สอบอัยการ วันที่ 3 (พยาน+กฎหมายเฉพาะ+อังกฤษ)"}};
const KEY='judgeplan_v2';const TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const iso=d=>d.toISOString().slice(0,10);const P=s=>new Date(s+'T00:00:00Z');const add=(s,n)=>iso(new Date(P(s).getTime()+n*864e5));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const thd=s=>{const d=P(s);return TH[d.getUTCDay()]+' '+d.getUTCDate()+'/'+(d.getUTCMonth()+1)+'/'+String(d.getUTCFullYear()+543).slice(2)};
const isoWeek=s=>{const d=P(s);const t=new Date(d);t.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};

function build(start,exam){
  const tasks=[];let id=0;
  for(const r of DATA.plan.rows){const [s,wd,typ,ph,i1,i2,i3]=r;const mock=typ.includes('จำลอง')?1:0;

const LAWTXT={"ป.พ.พ.|150": ["วัตถุประสงค์ต้องห้าม", "การใดมีวัตถุประสงค์เป็นการต้องห้ามชัดแจ้งโดยกฎหมายเป็นการพ้นวิสัยหรือเป็นการขัดต่อความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชน การนั้นเป็นโมฆะ"], "ป.พ.พ.|151": ["แตกต่างจากกฎหมาย", "การใดเป็นการแตกต่างกับบทบัญญัติของกฎหมาย ถ้ามิใช่กฎหมายอันเกี่ยวกับความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชน การนั้นไม่เป็นโมฆะ"], "ป.พ.พ.|152": ["ไม่ถูกแบบ", "การใดมิได้ทำให้ถูกต้องตามแบบที่กฎหมายบังคับไว้ การนั้นเป็นโมฆะ"], "ป.พ.พ.|153": ["ความสามารถของบุคคล", "การใดมิได้เป็นไปตามบทบัญญัติของกฎหมายว่าด้วยความสามารถของบุคคล การนั้นเป็นโมฆียะ"], "ป.พ.พ.|154": ["เจตนาซ่อนเร้น", "การแสดงเจตนาใดแม้ในใจจริงผู้แสดงจะมิได้เจตนาให้ตนต้องผูกพันตามที่ได้แสดงออกมาก็ตาม หาเป็นมูลเหตุให้การแสดงเจตนานั้นเป็นโมฆะไม่ เว้นแต่คู่กรณีอีกฝ่ายหนึ่งจะได้รู้ถึงเจตนาอันซ่อนอยู่ในใจของผู้แสดงนั้น"], "ป.พ.พ.|155": ["เจตนาลวง / นิติกรรมอำพราง", "การแสดงเจตนาลวงโดยสมรู้กับคู่กรณีอีกฝ่ายหนึ่งเป็นโมฆะ แต่จะยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต และต้องเสียหายจากการแสดงเจตนาลวงนั้นมิได้ ถ้าการแสดงเจตนาลวงตามวรรคหนึ่งทำขึ้นเพื่ออำพรางนิติกรรมอื่น ให้นำบทบัญญัติของกฎหมายอันเกี่ยวกับนิติกรรมที่ถูกอำพรางมาใช้บังคับ"], "ป.พ.พ.|156": ["สำคัญผิดในสาระสำคัญ", "การแสดงเจตนาโดยสำคัญผิดในสิ่งซึ่งเป็นสาระสำคัญแห่งนิติกรรมเป็นโมฆะ ความสำคัญผิดในสิ่งซึ่งเป็นสาระสำคัญแห่งนิติกรรมตามวรรคหนึ่ง ได้แก่ ความสำคัญผิดในลักษณะของนิติกรรม ความสำคัญผิดในตัวบุคคลซึ่งเป็นคู่กรณีแห่งนิติกรรมและความสำคัญผิดในทรัพย์สินซึ่งเป็นวัตถุแห่งนิติกรรม เป็นต้น"], "ป.พ.พ.|157": ["สำคัญผิดในคุณสมบัติ", "การแสดงเจตนาโดยสำคัญผิดในคุณสมบัติของบุคคลหรือทรัพย์สินเป็นโมฆียะ ความสำคัญผิดตามวรรคหนึ่ง ต้องเป็นความสำคัญผิดในคุณสมบัติซึ่งตามปกติถือว่าเป็นสาระสำคัญ ซึ่งหากมิได้มีความสำคัญผิดดังกล่าวการอันเป็นโมฆียะนั้นคงจะมิได้กระทำขึ้น"], "ป.พ.พ.|158": ["สำคัญผิดโดยประมาทร้ายแรง", "ความสำคัญผิดตามมาตรา ๑๕๖ หรือมาตรา ๑๕๗ ซึ่งเกิดขึ้นโดยความประมาทเลินเล่ออย่างร้ายแรงของบุคคลผู้แสดงเจตนา บุคคลนั้นจะถือเอาความสำคัญผิดนั้นมาใช้เป็นประโยชน์แก่ตนไม่ได้"], "ป.พ.พ.|159": ["กลฉ้อฉล", "การแสดงเจตนาเพราะถูกกลฉ้อฉลเป็นโมฆียะ การถูกกลฉ้อฉลที่จะเป็นโมฆียะตามวรรคหนึ่ง จะต้องถึงขนาดซึ่งถ้ามิได้มีกลฉ้อฉลดังกล่าว การอันเป็นโมฆียะนั้นคงจะมิได้กระทำขึ้น ถ้าคู่กรณีฝ่ายหนึ่งแสดงเจตนาเพราะถูกกลฉ้อฉลโดยบุคคลภายนอก การแสดงเจตนานั้นจะเป็นโมฆียะต่อเมื่อคู่กรณีอีกฝ่ายหนึ่งได้รู้หรือควรจะได้รู้ถึงกลฉ้อฉลนั้น"], "ป.พ.พ.|160": ["กลฉ้อฉลกับบุคคลภายนอก", "การบอกล้างโมฆียะกรรมเพราะถูกกลฉ้อฉลตามมาตรา ๑๕๙ ห้ามมิให้ยกเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต"], "ป.พ.พ.|161": ["กลฉ้อฉลเพื่อเหตุ", "ถ้ากลฉ้อฉลเป็นแต่เพียงเหตุจูงใจให้คู่กรณีฝ่ายหนึ่งยอมรับข้อกำหนดอันหนักยิ่งกว่าที่คู่กรณีฝ่ายนั้นจะยอมรับโดยปกติ คู่กรณีฝ่ายนั้นจะบอกล้างการนั้นหาได้ไม่ แต่ชอบที่จะเรียกเอาค่าสินไหมทดแทนเพื่อความเสียหายอันเกิดจากกลฉ้อฉลนั้นได้"], "ป.พ.พ.|162": ["การนิ่งเป็นกลฉ้อฉล", "ในนิติกรรมสองฝ่าย การที่คู่กรณีฝ่ายหนึ่งจงใจนิ่งเสียไม่แจ้งข้อความจริงหรือคุณสมบัติอันคู่กรณีอีกฝ่ายหนึ่งมิได้รู้ การนั้นจะเป็นกลฉ้อฉล หากพิสูจน์ได้ว่าถ้ามิได้นิ่งเสียเช่นนั้น นิติกรรมนั้นก็คงจะมิได้กระทำขึ้น"], "ป.พ.พ.|163": ["กลฉ้อฉลทั้งสองฝ่าย", "ถ้าคู่กรณีต่างได้กระทำการโดยกลฉ้อฉลด้วยกันทั้งสองฝ่าย ฝ่ายหนึ่งฝ่ายใดจะกล่าวอ้างกลฉ้อฉลของอีกฝ่ายหนึ่ง เพื่อบอกล้างการนั้นหรือเรียกค่าสินไหมทดแทนมิได้"], "ป.พ.พ.|164": ["การข่มขู่", "การแสดงเจตนาเพราะถูกข่มขู่เป็นโมฆียะ การข่มขู่ที่จะทำให้การใดตกเป็นโมฆียะนั้น จะต้องเป็นการข่มขู่ที่จะให้เกิดภัยอันใกล้จะถึงและร้ายแรงถึงขนาดที่จะจูงใจให้ผู้ถูกข่มขู่มีมูลต้องกลัว ซึ่งถ้ามิได้มีการข่มขู่เช่นนั้น การนั้นก็คงจะมิได้กระทำขึ้น"], "ป.พ.พ.|165": ["ใช้สิทธิตามปกติ / นับถือยำเกรง", "การขู่ว่าจะใช้สิทธิตามปกตินิยม ไม่ถือว่าเป็นการข่มขู่ การใดที่กระทำไปเพราะนับถือยำเกรง ไม่ถือว่าการนั้นได้กระทำเพราะถูกข่มขู่"], "ป.พ.พ.|166": ["ข่มขู่โดยบุคคลภายนอก", "การข่มขู่ย่อมทำให้การแสดงเจตนาเป็นโมฆียะแม้บุคคลภายนอกจะเป็นผู้ข่มขู่"], "ป.พ.พ.|167": ["การวินิจฉัยความสำคัญผิด ฉ้อฉล ข่มขู่", "ในการวินิจฉัยกรณีความสำคัญผิด กลฉ้อฉล หรือการข่มขู่ให้พิเคราะห์ถึง เพศ อายุ ฐานะ สุขภาพอนามัย และภาวะแห่งจิตของผู้แสดงเจตนาตลอดจนพฤติการณ์และสภาพแวดล้อมอื่น ๆ อันเกี่ยวกับการนั้นด้วย"], "ป.พ.พ.|168": ["แสดงเจตนาต่อผู้อยู่เฉพาะหน้า", "การแสดงเจตนาที่กระทำต่อบุคคลซึ่งอยู่เฉพาะหน้าให้ถือว่ามีผลนับแต่ผู้รับการแสดงเจตนาได้ทราบการแสดงเจตนานั้น ความข้อนี้ให้ใช้ตลอดถึงการที่บุคคลหนึ่งแสดงเจตนาไปยังบุคคลอีกคนหนึ่งโดยทางโทรศัพท์ หรือโดยเครื่องมือสื่อสารอย่างอื่น หรือโดยวิธีอื่นซึ่งสามารถติดต่อถึงกันได้ทำนองเดียวกัน"], "ป.พ.พ.|169": ["แสดงเจตนาต่อผู้ไม่อยู่เฉพาะหน้า", "การแสดงเจตนาที่กระทำต่อบุคคลซึ่งมิได้อยู่เฉพาะหน้าให้ถือว่ามีผลนับแต่เวลาที่การแสดงเจตนานั้นไปถึงผู้รับการแสดงเจตนา แต่ถ้าได้บอกถอนไปถึงผู้รับการแสดงเจตนานั้นก่อนหรือพร้อมกันกับที่การแสดงเจตนานั้นไปถึงผู้รับการแสดงเจตนา การแสดงเจตนานั้นตกเป็นอันไร้ผล การแสดงเจตนาที่ได้ส่งออกไปแล้วย่อมไม่เสื่อมเสียไป แม้ภายหลังการแสดงเจตนานั้นผู้แสดงเจตนาจะถึงแก่ความตาย หรือถูกศาลสั่งให้เป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถ"], "ป.พ.พ.|170": ["แสดงเจตนาต่อผู้เยาว์ / ผู้ไร้ความสามารถ", "การแสดงเจตนาซึ่งกระทำต่อผู้เยาว์หรือผู้ที่ศาลสั่งให้เป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถ จะยกขึ้นเป็นข้อต่อสู้ผู้รับการแสดงเจตนาไม่ได้ เว้นแต่ผู้แทนโดยชอบธรรม ผู้อนุบาล หรือผู้พิทักษ์ แล้วแต่กรณี ของผู้รับการแสดงเจตนานั้นได้รู้ด้วย หรือได้ให้ความยินยอมไว้ก่อนแล้ว ความในวรรคหนึ่งมิให้ใช้บังคับ ถ้าการแสดงเจตนานั้นเกี่ยวกับการที่กฎหมายบัญญัติให้ผู้เยาว์หรือคนเสมือนไร้ความสามารถกระทำได้เองโดยลำพัง"], "ป.พ.พ.|171": ["การตีความการแสดงเจตนา", "ในการตีความการแสดงเจตนานั้น ให้เพ่งเล็งถึงเจตนาอันแท้จริงยิ่งกว่าถ้อยคำสำนวนหรือตัวอักษร"], "ป.พ.พ.|172": ["โมฆะกรรม", "โมฆะกรรมนั้นไม่อาจให้สัตยาบันแก่กันได้ และผู้มีส่วนได้เสียคนหนึ่งคนใดจะยกความเสียเปล่าแห่งโมฆะกรรมขึ้นกล่าวอ้างก็ได้ ถ้าจะต้องคืนทรัพย์สินอันเกิดจากโมฆะกรรม ให้นำบทบัญญัติว่าด้วยลาภมิควรได้แห่งประมวลกฎหมายนี้มาใช้บังคับ"], "ป.พ.พ.|173": ["โมฆะบางส่วน", "ถ้าส่วนหนึ่งส่วนใดของนิติกรรมเป็นโมฆะ นิติกรรมนั้นย่อมตกเป็นโมฆะทั้งสิ้น เว้นแต่จะพึงสันนิษฐานได้โดยพฤติการณ์แห่งกรณีว่า คู่กรณีเจตนาจะให้ส่วนที่ไม่เป็นโมฆะนั้นแยกออกจากส่วนที่เป็นโมฆะได้"], "ป.พ.พ.|174": ["แปลงนิติกรรมที่เป็นโมฆะ", "การใดเป็นโมฆะแต่เข้าลักษณะเป็นนิติกรรมอย่างอื่นซึ่งไม่เป็นโมฆะ ให้ถือตามนิติกรรมซึ่งไม่เป็นโมฆะ ถ้าสันนิษฐานได้โดยพฤติการณ์แห่งกรณีว่า หากคู่กรณีได้รู้ว่าการนั้นเป็นโมฆะแล้ว ก็คงจะได้ตั้งใจมาตั้งแต่แรกที่จะทำนิติกรรมอย่างอื่นซึ่งไม่เป็นโมฆะนั้น"], "ป.พ.พ.|175": ["ผู้มีสิทธิบอกล้างโมฆียะกรรม", "โมฆียะกรรมนั้น บุคคลต่อไปนี้จะบอกล้างเสียก็ได้\n(๑) ผู้แทนโดยชอบธรรมหรือผู้เยาว์ซึ่งบรรลุนิติภาวะแล้ว แต่ผู้เยาว์จะบอกล้างก่อนที่ตนบรรลุนิติภาวะก็ได้ถ้าได้รับความยินยอมของผู้แทนโดยชอบธรรม\n(๒) บุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถเมื่อบุคคลนั้นพ้นจากการเป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถแล้ว หรือผู้อนุบาล หรือผู้พิทักษ์ แล้วแต่กรณี แต่คนเสมือนไร้ความสามารถจะบอกล้างก่อนที่ตนจะพ้นจากการเป็นคนเสมือนไร้ความสามารถก็ได้ถ้าได้รับความยินยอมของผู้พิทักษ์\n(๓) บุคคลผู้แสดงเจตนาเพราะสำคัญผิด หรือถูกกลฉ้อฉล หรือถูกข่มขู่\n(๔) บุคคลวิกลจริตผู้กระทำนิติกรรมอันเป็นโมฆียะตามมาตรา ๓๐ ในขณะที่จริตของบุคคลนั้นไม่วิกลแล้ว ถ้าบุคคลผู้ทำนิติกรรมอันเป็นโมฆียะถึงแก่ความตายก่อนมีการบอกล้างโมฆียะกรรม ทายาทของบุคคลดังกล่าวอาจบอกล้างโมฆียะกรรมนั้นได้"], "ป.พ.พ.|176": ["ผลของการบอกล้าง", "โมฆียะกรรมเมื่อบอกล้างแล้ว ให้ถือว่าเป็นโมฆะมาแต่เริ่มแรก และให้ผู้เป็นคู่กรณีกลับคืนสู่ฐานะเดิม ถ้าเป็นการพ้นวิสัยจะให้กลับคืนเช่นนั้นได้ ก็ให้ได้รับค่าเสียหายชดใช้ให้แทน ถ้าบุคคลใดได้รู้หรือควรจะได้รู้ว่าการใดเป็นโมฆียะ เมื่อบอกล้างแล้ว ให้ถือว่าบุคคลนั้นได้รู้ว่าการนั้นเป็นโมฆะ นับแต่วันที่ได้รู้หรือควรจะได้รู้ว่าเป็นโมฆียะ ห้ามมิให้ใช้สิทธิเรียกร้องอันเกิดแต่การกลับคืนสู่ฐานะเดิมตามวรรคหนึ่ง เมื่อพ้นหนึ่งปีนับแต่วันบอกล้างโมฆียะกรรม"], "ป.พ.พ.|177": ["การให้สัตยาบัน", "ถ้าบุคคลผู้มีสิทธิบอกล้างโมฆียะกรรมตามมาตรา ๑๗๕ ผู้หนึ่งผู้ใด ได้ให้สัตยาบันแก่โมฆียะกรรม ให้ถือว่าการนั้นเป็นอันสมบูรณ์มาแต่เริ่มแรก แต่ทั้งนี้ย่อมไม่กระทบกระเทือนถึงสิทธิของบุคคลภายนอก"], "ป.พ.พ.|178": ["วิธีบอกล้าง / ให้สัตยาบัน", "การบอกล้างหรือให้สัตยาบันแก่โมฆียะกรรม ย่อมกระทำได้โดยการแสดงเจตนาแก่คู่กรณีอีกฝ่ายหนึ่งซึ่งเป็นบุคคลที่มีตัวกำหนดได้แน่นอน"], "ป.พ.พ.|179": ["เวลาที่ให้สัตยาบันได้", "การให้สัตยาบันแก่โมฆียะกรรมนั้น จะสมบูรณ์ต่อเมื่อได้กระทำภายหลังเวลาที่มูลเหตุให้เป็นโมฆียะกรรมนั้นหมดสิ้นไปแล้ว บุคคลซึ่งศาลได้สั่งให้เป็นคนไร้ความสามารถ คนเสมือนไร้ความสามารถหรือบุคคลวิกลจริต ผู้กระทำนิติกรรมอันเป็นโมฆียะตามมาตรา ๓๐ จะให้สัตยาบันแก่โมฆียะกรรมได้ต่อเมื่อได้รู้เห็นซึ่งโมฆียะกรรมนั้นภายหลังที่บุคคลนั้นพ้นจากการเป็นคนไร้ความสามารถ คนเสมือนไร้ความสามารถหรือในขณะที่จริตของบุคคลนั้นไม่วิกล แล้วแต่กรณี ทายาทของบุคคลผู้ทำนิติกรรมอันเป็นโมฆียะ จะให้สัตยาบันแก่โมฆียะกรรมได้นับแต่เวลาที่ผู้ทำนิติกรรมนั้นถึงแก่ความตาย เว้นแต่สิทธิที่จะบอกล้างโมฆียะกรรมของผู้ตายนั้นได้สิ้นสุดลงแล้ว บทบัญญัติวรรคหนึ่งและวรรคสองมิให้ใช้บังคับ ถ้าการให้สัตยาบันแก่โมฆียะกรรมกระทำโดยผู้แทนโดยชอบธรรม ผู้อนุบาลหรือผู้พิทักษ์"], "ป.พ.พ.|180": ["สัตยาบันโดยปริยาย", "ภายหลังเวลาอันพึงให้สัตยาบันได้ตามมาตรา ๑๗๙ ถ้ามีพฤติการณ์อย่างหนึ่งอย่างใดดังต่อไปนี้เกิดขึ้นเกี่ยวด้วยโมฆียะกรรมโดยการกระทำของบุคคลซึ่งมีสิทธิบอกล้างโมฆียะกรรมตามมาตรา ๑๗๕ ถ้ามิได้สงวนสิทธิไว้แจ้งชัดประการใดให้ถือว่าเป็นการให้สัตยาบัน\n(๑) ได้ปฏิบัติการชำระหนี้แล้วทั้งหมดหรือแต่บางส่วน\n(๒) ได้มีการเรียกให้ชำระหนี้นั้นแล้ว\n(๓) ได้มีการแปลงหนี้ใหม่\n(๔) ได้มีการให้ประกันเพื่อหนี้นั้น\n(๕) ได้มีการโอนสิทธิหรือความรับผิดทั้งหมดหรือแต่บางส่วน\n(๖) ได้มีการกระทำอย่างอื่นอันแสดงได้ว่าเป็นการให้สัตยาบัน"], "ป.พ.พ.|181": ["ระยะเวลาบอกล้าง", "โมฆียะกรรมนั้นจะบอกล้างมิได้เมื่อพ้นเวลาหนึ่งปีนับแต่เวลาที่อาจให้สัตยาบันได้ หรือเมื่อพ้นเวลาสิบปีนับแต่ได้ทำนิติกรรมอันเป็นโมฆียะนั้น"], "ป.พ.พ.|354": ["คำเสนอบ่งระยะเวลา", "คำเสนอจะทำสัญญาอันบ่งระยะเวลาให้ทำคำสนองนั้น ท่านว่าไม่อาจจะถอนได้ภายในระยะเวลาที่บ่งไว้"], "ป.พ.พ.|355": ["คำเสนอต่อผู้อยู่ห่างโดยระยะทาง", "บุคคลทำคำเสนอไปยังผู้อื่นซึ่งอยู่ห่างกันโดยระยะทาง และมิได้บ่งระยะเวลาให้ทำคำสนอง จะถอนคำเสนอของตนเสียภายในเวลาอันควรคาดหมายว่าจะได้รับคำบอกกล่าวสนองนั้น ท่านว่าหาอาจจะถอนได้ไม่"], "ป.พ.พ.|356": ["คำเสนอต่อผู้อยู่เฉพาะหน้า", "คำเสนอทำแก่บุคคลผู้อยู่เฉพาะหน้า โดยมิได้บ่งระยะเวลาให้ทำคำสนองนั้น เสนอ ณ ที่ใดเวลาใดก็ย่อมจะสนองรับได้แต่ ณ ที่นั้นเวลานั้น ความข้อนี้ท่านให้ใช้ตลอดถึงการที่บุคคลคนหนึ่งทำคำเสนอไปยังบุคคลอีกคนหนึ่งทางโทรศัพท์ด้วย"], "ป.พ.พ.|357": ["คำเสนอสิ้นความผูกพัน", "คำเสนอใดเขาบอกปัดไปยังผู้เสนอแล้วก็ดี หรือมิได้สนองรับภายในเวลากำหนดดังกล่าวมาในมาตราทั้งสามก่อนนี้ก็ดี คำเสนอนั้นท่านว่าเป็นอันสิ้นความผูกพันแต่นั้นไป"], "ป.พ.พ.|358": ["คำสนองมาถึงล่วงเวลา (ส่งทันเวลา)", "ถ้าคำบอกกล่าวสนองมาถึงล่วงเวลา แต่เป็นที่เห็นประจักษ์ว่าคำบอกกล่าวนั้นได้ส่งโดยทางการซึ่งตามปกติควรจะมาถึงภายในเวลากำหนดไซร้ ผู้เสนอต้องบอกกล่าวแก่คู่กรณีอีกฝ่ายหนึ่งโดยพลันว่าคำสนองนั้นมาถึงเนิ่นช้า เว้นแต่จะได้บอกกล่าวเช่นนั้นก่อนแล้ว ถ้าผู้เสนอละเลยไม่บอกกล่าวดังว่ามาในวรรคต้น ท่านให้ถือว่าคำบอกกล่าวสนองนั้นมิได้ล่วงเวลา"], "ป.พ.พ.|359": ["คำสนองล่วงเวลา / สนองมีข้อแก้ไข", "ถ้าคำสนองมาถึงล่วงเวลา ท่านให้ถือว่าคำสนองนั้นกลายเป็นคำเสนอขึ้นใหม่ คำสนองอันมีข้อความเพิ่มเติม มีข้อจำกัด หรือมีข้อแก้ไขอย่างอื่นประกอบด้วยนั้น ท่านให้ถือว่าเป็นคำบอกปัดไม่รับทั้งเป็นคำเสนอขึ้นใหม่ด้วยในตัว"], "ป.พ.พ.|360": ["ผู้เสนอตายหรือไร้ความสามารถ", "บทบัญญัติแห่งมาตรา ๑๖๙ วรรคสอง นั้น ท่านมิให้ใช้บังคับ ถ้าหากว่าขัดกับเจตนาอันผู้เสนอได้แสดง หรือหากว่าก่อนจะสนองรับนั้น คู่กรณีอีกฝ่ายหนึ่งได้รู้อยู่แล้วว่าผู้เสนอตายหรือตกเป็นผู้ไร้ความสามารถ"], "ป.พ.พ.|361": ["สัญญาเกิดเมื่อใด", "อันสัญญาระหว่างบุคคลซึ่งอยู่ห่างกันโดยระยะทางนั้น ย่อมเกิดเป็นสัญญาขึ้นแต่เวลาเมื่อคำบอกกล่าวสนองไปถึงผู้เสนอ ถ้าตามเจตนาอันผู้เสนอได้แสดง หรือตามปกติประเพณีไม่จำเป็นจะต้องมีคำบอกกล่าวสนองไซร้ ท่านว่าสัญญานั้นเกิดเป็นสัญญาขึ้นในเวลาเมื่อมีการอันใดอันหนึ่งขึ้น อันจะพึงสันนิษฐานได้ว่าเป็นการแสดงเจตนาสนองรับ"], "ป.พ.พ.|362": ["คำมั่นจะให้รางวัล", "บุคคลออกโฆษณาให้คำมั่นว่าจะให้รางวัลแก่ผู้ซึ่งกระทำการอันใด ท่านว่าจำต้องให้รางวัลแก่บุคคลใด ๆ ผู้ได้กระทำการอันนั้น แม้ถึงมิใช่ว่าผู้นั้นจะได้กระทำเพราะเห็นแก่รางวัล"], "ป.พ.พ.|363": ["การถอนคำมั่นจะให้รางวัล", "ในกรณีที่กล่าวมาในมาตราก่อนนี้ เมื่อยังไม่มีใครทำการสำเร็จดังบ่งไว้นั้นอยู่ตราบใด ผู้ให้คำมั่นจะถอนคำมั่นของตนเสียโดยวิธีเดียวกับที่โฆษณานั้นก็ได้ เว้นแต่จะได้แสดงไว้ในโฆษณานั้นว่าจะไม่ถอน ถ้าคำมั่นนั้นไม่อาจจะถอนโดยวิธีดังกล่าวมาก่อน จะถอนโดยวิธีอื่นก็ได้ แต่ถ้าเช่นนั้นการถอนจะเป็นอันสมบูรณ์ใช้ได้เพียงเฉพาะต่อบุคคลที่รู้ ถ้าผู้ให้คำมั่นได้กำหนดระยะเวลาให้ด้วยเพื่อทำการอันบ่งนั้นไซร้ ท่านให้สันนิษฐานไว้ก่อนว่าผู้ให้คำมั่นได้สละสิทธิที่จะถอนคำมั่นนั้นเสียแล้ว"], "ป.พ.พ.|364": ["ผู้ทำการหลายคน", "ถ้าบุคคลหลายคนกระทำการอันบ่งไว้ในโฆษณา ท่านว่าเฉพาะแต่คนที่ทำได้ก่อนใครหมดเท่านั้นมีสิทธิจะได้รับรางวัล ถ้าบุคคลหลายคนกระทำการอันนั้นได้พร้อมกัน ท่านว่าแต่ละคนมีสิทธิจะได้รับรางวัลเป็นส่วนแบ่งเท่า ๆ กัน แต่ถ้ารางวัลนั้นมีสภาพแบ่งไม่ได้ก็ดี หรือถ้าตามข้อความแห่งคำมั่นนั้น บุคคลแต่คนเดียวจะพึงรับรางวัลก็ดี ท่านให้วินิจฉัยด้วยวิธีจับสลาก บทบัญญัติดังกล่าวมาในวรรคทั้งสองข้างต้นนั้นท่านมิให้ใช้บังคับ ถ้าในโฆษณานั้นแสดงเจตนาไว้เป็นอย่างอื่น"], "ป.พ.พ.|365": ["การประกวดชิงรางวัล", "คำมั่นจะให้รางวัลอันมีความประสงค์เป็นการประกวดชิงรางวัลนั้น จะสมบูรณ์ก็ต่อเมื่อได้กำหนดระยะเวลาไว้ในคำโฆษณาด้วย การที่จะตัดสินว่าผู้ประกวดคนไหนได้กระทำสำเร็จตามเงื่อนไขในคำมั่นภายในเวลากำหนดหรือไม่ก็ดี หรือตัดสินในระหว่างผู้ประกวดหลายคนนั้นว่าคนไหนดีกว่ากันอย่างไรก็ดี ให้ผู้ชี้ขาดซึ่งได้ระบุชื่อไว้ในโฆษณานั้นเป็นผู้ตัดสิน หรือถ้ามิได้ระบุชื่อผู้ชี้ขาดไว้ ก็ให้ผู้ให้คำมั่นเป็นผู้ตัดสิน คำตัดสินอันนี้ย่อมผูกพันผู้ที่เกี่ยวข้องด้วยทุกฝ่าย ถ้าได้คะแนนทำดีเสมอกัน ท่านให้นำบทบัญญัติแห่งมาตรา ๓๖๔ วรรคสอง มาใช้บังคับ แล้วแต่กรณี การโอนกรรมสิทธิ์ในทรัพย์ที่ทำขึ้นประกวดนั้น ผู้ให้คำมั่นจะเรียกให้โอนแก่ตนได้ต่อเมื่อได้ระบุไว้ในโฆษณาว่าจะพึงโอนเช่นนั้น"], "ป.พ.พ.|366": ["สัญญายังไม่ตกลงทุกข้อ", "ข้อความใด ๆ แห่งสัญญาอันคู่สัญญาแม้เพียงฝ่ายเดียวได้แสดงไว้ว่าเป็นสาระสำคัญอันจะต้องตกลงกันหมดทุกข้อนั้น หากคู่สัญญายังไม่ตกลงกันได้หมดทุกข้ออยู่ตราบใด เมื่อกรณีเป็นที่สงสัย ท่านนับว่ายังมิได้มีสัญญาต่อกัน การที่ได้ทำความเข้าใจกันไว้เฉพาะบางสิ่งบางอย่าง ถึงแม้ว่าจะได้จดลงไว้ก็หาเป็นการผูกพันไม่ ถ้าได้ตกลงกันว่าสัญญาอันมุ่งจะทำนั้นจะต้องทำเป็นหนังสือไซร้ เมื่อกรณีเป็นที่สงสัย ท่านนับว่ายังมิได้มีสัญญาต่อกันจนกว่าจะได้ทำขึ้นเป็นหนังสือ"], "ป.พ.พ.|413": ["", "เมื่อทรัพย์สินอันจะต้องคืนนั้นเป็นอย่างอื่นนอกจากจำนวนเงิน และบุคคลได้รับไว้โดยสุจริต ท่านว่าบุคคลเช่นนั้นจำต้องคืนทรัพย์สินเพียงตามสภาพที่เป็นอยู่ และมิต้องรับผิดชอบในการที่ทรัพย์นั้นสูญหายหรือบุบสลาย แต่ถ้าได้อะไรมาเป็นค่าสินไหมทดแทนเพื่อการสูญหายหรือบุบสลายเช่นนั้นก็ต้องให้ไปด้วย ถ้าบุคคลได้รับทรัพย์สินไว้โดยทุจริต ท่านว่าจะต้องรับผิดชอบในการสูญหายหรือบุบสลายนั้นเต็มภูมิ แม้กระทั่งการสูญหายหรือบุบสลายจะเกิดเพราะเหตุสุดวิสัย เว้นแต่จะพิสูจน์ได้ว่าถึงอย่างไรทรัพย์สินนั้นก็คงต้องสูญหายหรือบุบสลายอยู่นั่นเอง"], "ป.พ.พ.|983": ["", "ตั๋วสัญญาใช้เงินนั้น ต้องมีรายการดังจะกล่าวต่อไปนี้ คือ (1) คำบอกชื่อว่าเป็นตั๋วสัญญาใช้เงิน (2) คำมั่นสัญญาอันปราศจากเงื่อนไขว่าจะใช้เงินเป็นจำนวนแน่นอน (3) วันถึงกำหนดใช้เงิน (4) สถานที่ใช้เงิน (5) ชื่อ หรือยี่ห้อของผู้รับเงิน (6) วันและสถานที่ออกตั๋วสัญญาใช้เงิน (7) ลายมือชื่อผู้ออกตั๋ว"], "ป.พ.พ.|436": ["", "บุคคลผู้อยู่ในโรงเรือนต้องรับผิดชอบในความเสียหายอันเกิดเพราะของตกหล่นจากโรงเรือนนั้น หรือเพราะทิ้งขว้างของไปตกในที่อันมิควร"], "ป.พ.พ.|575": ["", "อันว่าจ้างแรงงานนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าลูกจ้าง ตกลงจะทำงานให้แก่บุคคลอีกคนหนึ่ง เรียกว่านายจ้าง และนายจ้างตกลงจะให้สินจ้างตลอดเวลาที่ทำงานให้"], "ป.พ.พ.|1298": ["", "ทรัพยสิทธิทั้งหลายนั้น ท่านว่าจะก่อตั้งขึ้นได้แต่ด้วยอาศัยอำนาจในประมวลกฎหมายนี้หรือกฎหมายอื่น"], "ป.พ.พ.|1382": ["", "บุคคลใดครอบครองทรัพย์สินของผู้อื่นไว้โดยความสงบและโดยเปิดเผยด้วยเจตนาเป็นเจ้าของ ถ้าเป็นอสังหาริมทรัพย์ได้ครอบครองติดต่อกันเป็นเวลาสิบปี ถ้าเป็นสังหาริมทรัพย์ได้ครอบครองติดต่อกันเป็นเวลาห้าปีไซร้ ท่านว่าบุคคลนั้นได้กรรมสิทธิ์"], "ป.พ.พ.|767": ["", "เมื่อบังคับจำนำได้เงินจำนวนสุทธิเท่าใด ท่านว่าผู้รับจำนำต้องจัดสรรชำระหนี้และอุปกรณ์เพื่อให้เสร็จสิ้นไป และถ้ายังมีเงินเหลือก็ต้องส่งคืนให้แก่ผู้จำนำ หรือแก่บุคคลผู้ควรจะได้เงินนั้น ถ้าได้เงินน้อยกว่าจำนวนค้างชำระ ท่านว่าลูกหนี้ก็ยังคงต้องรับใช้ในส่วนที่ขาดอยู่นั้น"], "ป.พ.พ.|1349": ["", "ที่ดินแปลงใดมีที่ดินแปลงอื่นล้อมอยู่จนไม่มีทางออกถึงทางสาธารณะได้ไซร้ ท่านว่าเจ้าของที่ดินแปลงนั้นจะผ่านที่ดินซึ่งล้อมอยู่ไปสู่ทางสาธารณะได้ ที่ดินแปลงใดมีทางออกได้แต่เมื่อต้องข้ามสระ บึง หรือทะเล หรือมีที่ชันอันระดับที่ดินกับทางสาธารณะสูงกว่ากันมากไซร้ ท่านว่าให้ใช้ความในวรรคต้นบังคับ ที่และวิธีทำทางผ่านนั้นต้องเลือกให้พอควรแก่ความจำเป็นของผู้มีสิทธิจะผ่าน กับทั้งให้คำนึงถึงที่ดินที่ล้อมอยู่ให้เสียหายแต่น้อยที่สุดที่จะเป็นได้ ถ้าจำเป็น ผู้มีสิทธิจะผ่านจะสร้างถนนเป็นทางผ่านก็ได้ ผู้มีสิทธิจะผ่านต้องใช้ค่าทดแทนให้แก่เจ้าของที่ดินที่ล้อมอยู่เพื่อความเสียหายอันเกิดแต่เหตุที่มีทางผ่านนั้น ค่าทดแทนนั้นนอกจากค่าเสียหายเพราะสร้างถนน ท่านว่าจะกำหนดเป็นเงินรายปีก็ได้"], "ป.พ.พ.|682": ["", "ท่านว่าบุคคลจะยอมเข้าเป็นผู้รับเรือน คือเป็นประกันของผู้ค้ำประกันอีกชั้นหนึ่ง ก็เป็นได้ ถ้าบุคคลหลายคนยอมตนเข้าเป็นผู้ค้ำประกันในหนี้รายเดียวกันไซร้ ท่านว่าผู้ค้ำประกันเหล่านั้นมีความรับผิดอย่างลูกหนี้ร่วมกัน แม้ถึงว่าจะมิได้เข้ารับค้ำประกันรวมกัน"], "ป.พ.พ.|439": ["", "บุคคลผู้จำต้องคืนทรัพย์อันผู้อื่นต้องเสียไปเพราะละเมิดแห่งตนนั้น ยังต้องรับผิดชอบตลอดถึงการที่ทรัพย์นั้นทำลายลงโดยอุบัติเหตุ หรือการคืนทรัพย์ตกเป็นพ้นวิสัยเพราะเหตุอย่างอื่นโดยอุบัติเหตุ หรือทรัพย์นั้นเสื่อมเสียลงโดยอุบัติเหตุนั้นด้วย เว้นแต่เมื่อการที่ทรัพย์สินทำลาย หรือตกเป็นพ้นวิสัยจะคืน หรือเสื่อมเสียนั้น ถึงแม้ว่าจะมิได้มีการทำละเมิด ก็คงจะต้องตกไปเป็นไปอย่างนั้นอยู่เอง"], "ป.พ.พ.|303": ["", "สิทธิเรียกร้องนั้นท่านว่าจะพึงโอนกันได้ เว้นไว้แต่สภาพแห่งสิทธินั้นเองจะไม่เปิดช่องให้โอนกันได้ ความที่กล่าวมานี้ย่อมไม่ใช้บังคับ หากคู่กรณีได้แสดงเจตนาเป็นอย่างอื่น การแสดงเจตนาเช่นว่านี้ ท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต"], "ป.พ.พ.|1304": ["", "สาธารณสมบัติของแผ่นดินนั้น รวมทรัพย์สินทุกชนิดของแผ่นดินซึ่งใช้เพื่อสาธารณประโยชน์หรือสงวนไว้เพื่อประโยชน์ร่วมกัน เช่น (1) ที่ดินรกร้างว่างเปล่า และที่ดินซึ่งมีผู้เวนคืนหรือทอดทิ้งหรือกลับมาเป็นของแผ่นดินโดยประการอื่น ตามกฎหมายที่ดิน (2) ทรัพย์สินสำหรับพลเมืองใช้ร่วมกัน เป็นต้นว่า ที่ชายตลิ่ง ทางน้ำ ทางหลวง ทะเลสาบ (3) ทรัพย์สินใช้เพื่อประโยชน์ของแผ่นดินโดยเฉพาะ เป็นต้นว่า ป้อมและโรงทหาร สำนักราชการบ้านเมือง เรือรบ อาวุธยุทธภัณฑ์"], "ป.พ.พ.|868": ["", "อันสัญญาประกันภัยทะเล ท่านให้บังคับตามบทบัญญัติแห่งกฎหมายทะเล"], "ป.พ.พ.|820": ["", "ตัวการย่อมมีความผูกพันต่อบุคคลภายนอกในกิจการทั้งหลายอันตัวแทนหรือตัวแทนช่วงได้ทำไปภายในขอบอำนาจแห่งฐานตัวแทน"], "ป.พ.พ.|607": ["", "ผู้รับจ้างจะเอาการที่รับจ้างทั้งหมดหรือแบ่งการแต่บางส่วนไปให้ผู้รับจ้างช่วงทำอีกทอดหนึ่งก็ได้ เว้นแต่สาระสำคัญแห่งสัญญานั้นจะอยู่ที่ความรู้ความสามารถของตัวผู้รับจ้าง แต่ผู้รับจ้างคงต้องรับผิดเพื่อความประพฤติหรือความผิดอย่างใด ๆ ของผู้รับจ้างช่วง"], "ป.พ.พ.|380": ["", "ถ้าลูกหนี้ได้สัญญาไว้ว่าจะให้เบี้ยปรับเมื่อตนไม่ชำระหนี้ เจ้าหนี้จะเรียกเอาเบี้ยปรับอันจะพึงริบนั้นแทนการชำระหนี้ก็ได้ แต่ถ้าเจ้าหนี้แสดงต่อลูกหนี้ว่าจะเรียกเอาเบี้ยปรับฉะนั้นแล้ว ก็เป็นอันขาดสิทธิเรียกร้องชำระหนี้อีกต่อไป ถ้าเจ้าหนี้มีสิทธิเรียกร้องค่าสินไหมทดแทนเพื่อการไม่ชำระหนี้ จะเรียกเอาเบี้ยปรับอันจะพึงริบนั้นในฐานเป็นจำนวนน้อยที่สุดแห่งค่าเสียหายก็ได้ การพิสูจน์ค่าเสียหายยิ่งกว่านั้น ท่านก็อนุญาตให้พิสูจน์ได้"], "ป.พ.พ.|320": ["", "อันจะบังคับให้เจ้าหนี้รับชำระหนี้แต่เพียงบางส่วน หรือให้รับชำระหนี้เป็นอย่างอื่นผิดไปจากที่จะต้องชำระแก่เจ้าหนี้นั้น ท่านว่าหาอาจจะบังคับได้ไม่"], "ป.พ.พ.|1520": ["", "ในกรณีหย่าโดยความยินยอม ให้คู่สมรสทำความตกลงเป็นหนังสือว่าฝ่ายใดจะเป็นผู้ใช้อำนาจปกครองบุตรคนใด ถ้ามิได้ตกลงกันหรือตกลงกันไม่ได้ ให้ศาลเป็นผู้ชี้ขาด ในกรณีหย่าโดยคำพิพากษาของศาล ให้ศาลซึ่งพิจารณาคดีฟ้องหย่านั้นชี้ขาดด้วยว่าฝ่ายใดจะเป็นผู้ใช้อำนาจปกครองบุตรคนใด ในการพิจารณาชี้ขาดถ้าศาลเห็นว่ามีเหตุที่จะถอนอำนาจปกครองของคู่สมรสนั้นได้ตามมาตรา 1582 ศาลจะถอนอำนาจปกครองของคู่สมรสและสั่งให้บุคคลภายนอกเป็นผู้ปกครองก็ได้ ทั้งนี้ ให้ศาลคำนึงถึงความผาสุกและประโยชน์ของบุตรนั้นเป็นสำคัญ"], "ป.พ.พ.|4": ["", "กฎหมายนั้น ต้องใช้ในบรรดากรณีซึ่งต้องด้วยบทบัญญัติใด ๆ แห่งกฎหมายตามตัวอักษร หรือตามความมุ่งหมายของบทบัญญัตินั้น ๆ เมื่อไม่มีบทกฎหมายที่จะยกมาปรับคดีได้ ให้วินิจฉัยคดีนั้นตามจารีตประเพณีแห่งท้องถิ่น ถ้าไม่มีจารีตประเพณีเช่นว่านั้น ให้วินิจฉัยคดีอาศัยเทียบบทกฎหมายที่ใกล้เคียงอย่างยิ่ง และถ้าบทกฎหมายเช่นนั้นก็ไม่มีด้วย ให้วินิจฉัยตามหลักกฎหมายทั่วไป"], "ป.พ.พ.|402": ["", "ถ้าเงื่อนไขดังว่ามาในมาตราก่อนนั้นมิได้มี ท่านว่าตัวการจำต้องคืนสิ่งทั้งหลายบรรดาที่ได้มาเพราะเขาเข้าจัดการงานนั้นให้แก่ผู้จัดการ ตามบทบัญญัติว่าด้วยการคืนลาภมิควรได้ ถ้าตัวการให้สัตยาบันแก่การที่จัดทำนั้น ท่านให้นำบทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้ว่าด้วยตัวแทนมาใช้บังคับ แล้วแต่กรณี"], "ป.พ.พ.|866": ["", "ถ้าผู้รับประกันภัยได้รู้ข้อความจริงดังกล่าวในมาตรา 865 นั้นก็ดี หรือรู้ว่าข้อแถลงความเป็นความเท็จก็ดี หรือควรจะได้รู้เช่นนั้นหากใช้ความระมัดระวังดังจะพึงคาดหมายได้แต่วิญญูชนก็ดี ท่านให้ฟังว่าสัญญานั้นเป็นอันสมบูรณ์"], "ป.พ.พ.|1699": ["", "ถ้าพินัยกรรม หรือข้อกำหนดในพินัยกรรม เกี่ยวกับทรัพย์สินรายใดเป็นอันไร้ผลด้วยประการใด ๆ ทรัพย์สินรายนั้นตกทอดแก่ทายาทโดยธรรมหรือได้แก่แผ่นดิน แล้วแต่กรณี"], "ป.พ.พ.|1397": ["", "ถ้าภารยทรัพย์หรือสามยทรัพย์สลายไปทั้งหมด ท่านว่าภาระจำยอมสิ้นไป"], "ป.พ.พ.|341": ["", "ถ้าบุคคลสองคนต่างมีความผูกพันซึ่งกันและกัน โดยมูลหนี้อันมีวัตถุเป็นอย่างเดียวกัน และหนี้ทั้งสองรายนั้นถึงกำหนดจะชำระไซร้ ท่านว่าลูกหนี้ฝ่ายใดฝ่ายหนึ่งย่อมจะหลุดพ้นจากหนี้ของตนด้วยหักกลบลบกันได้เพียงเท่าจำนวนที่ตรงกันในมูลหนี้ทั้งสองฝ่ายนั้น เว้นแต่สภาพแห่งหนี้ฝ่ายหนึ่งจะไม่เปิดช่องให้หักกลบลบกันได้ บทบัญญัติดังกล่าวมาในวรรคก่อนนี้ท่านมิให้ใช้บังคับ หากเป็นการขัดกับเจตนาอันคู่กรณีได้แสดงไว้ แต่เจตนาเช่นนี้ท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต"], "ป.พ.พ.|587": ["", "อันว่าจ้างทำของนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้รับจ้าง ตกลงรับจะทำการงานสิ่งใดสิ่งหนึ่งจนสำเร็จให้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้ว่าจ้าง และผู้ว่าจ้างตกลงจะให้สินจ้างเพื่อผลสำเร็จแห่งการที่ทำนั้น"], "ป.พ.พ.|800": ["", "ถ้าตัวแทนได้รับมอบอำนาจแต่เฉพาะการ ท่านว่าจะทำการแทนตัวการได้แต่เพียงในสิ่งที่จำเป็นเพื่อให้กิจอันเขาได้มอบหมายแก่ตนนั้นสำเร็จลุล่วงไป"], "ป.พ.พ.|764": ["", "เมื่อจะบังคับจำนำ ผู้รับจำนำต้องบอกกล่าวเป็นหนังสือไปยังลูกหนี้ก่อนว่า ให้ชำระหนี้และอุปกรณ์ภายในเวลาอันควรซึ่งกำหนดให้ในคำบอกกล่าวนั้น ถ้าลูกหนี้ละเลยไม่ปฏิบัติตามคำบอกกล่าว ผู้รับจำนำชอบที่จะเอาทรัพย์สินซึ่งจำนำออกขายได้ แต่ต้องขายทอดตลาด อนึ่ง ผู้รับจำนำต้องมีจดหมายบอกกล่าวไปยังผู้จำนำบอกเวลาและสถานที่ซึ่งจะขายทอดตลาดด้วย"], "ป.พ.พ.|1533": ["", "เมื่อหย่ากันให้แบ่งสินสมรสให้คู่สมรสแต่ละฝ่ายได้ส่วนเท่ากัน"], "ป.พ.พ.|1697": ["", "ถ้าผู้ทำพินัยกรรมมิได้แสดงเจตนาไว้ในพินัยกรรมเป็นอย่างอื่น และปรากฏว่าพินัยกรรมฉบับก่อนกับฉบับหลังขัดกัน ให้ถือว่าพินัยกรรมฉบับก่อนเป็นอันเพิกถอนโดยพินัยกรรมฉบับหลัง เฉพาะในส่วนที่มีข้อความขัดกันนั้นเท่านั้น"], "ป.พ.พ.|728": ["", "เมื่อจะบังคับจำนองนั้น ผู้รับจำนองต้องมีหนังสือบอกกล่าวไปยังลูกหนี้ก่อนว่าให้ชำระหนี้ภายในเวลาอันสมควรซึ่งต้องไม่น้อยกว่าหกสิบวันนับแต่วันที่ลูกหนี้ได้รับคำบอกกล่าวนั้น ถ้าและลูกหนี้ละเลยเสียไม่ปฏิบัติตามคำบอกกล่าว ผู้รับจำนองจะฟ้องคดีต่อศาลเพื่อให้พิพากษาสั่งให้ยึดทรัพย์สินซึ่งจำนองและให้ขายทอดตลาดก็ได้ ในกรณีตามวรรคหนึ่ง ถ้าเป็นกรณีผู้จำนองซึ่งจำนองทรัพย์สินของตนไว้เพื่อประกันหนี้อันบุคคลอื่นต้องชำระ ผู้รับจำนองต้องส่งหนังสือบอกกล่าวดังกล่าวให้ผู้จำนองทราบภายในสิบห้าวันนับแต่วันที่ส่งหนังสือแจ้งให้ลูกหนี้ทราบ ถ้าผู้รับจำนองมิได้ดำเนินการภายในกำหนดเวลาสิบห้าวันนั้น ให้ผู้จำนองเช่นว่านั้นหลุดพ้นจากความรับผิดในดอกเบี้ยและค่าสินไหมทดแทนซึ่งลูกหนี้ค้างชำระ ตลอดจนค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้นบรรดาที่เกิดขึ้นนับแต่วันที่พ้นกำหนดเวลาสิบห้าวันดังกล่าว"], "ป.พ.พ.|827": ["", "ตัวการจะถอนตัวแทน และตัวแทนจะบอกเลิกเป็นตัวแทนเสียในเวลาใด ๆ ก็ได้ทุกเมื่อ คู่สัญญาฝ่ายซึ่งถอนตัวแทนหรือบอกเลิกเป็นตัวแทนในเวลาที่ไม่สะดวกแก่อีกฝ่ายหนึ่ง จะต้องรับผิดต่อคู่สัญญาฝ่ายนั้นในความเสียหายอย่างใด ๆ อันเกิดแต่การนั้น เว้นแต่ในกรณีที่เป็นความจำเป็นอันมิอาจจะก้าวล่วงเสียได้"], "ป.พ.พ.|1361": ["", "เจ้าของรวมคนหนึ่ง ๆ จะจำหน่ายส่วนของตน หรือจำนอง หรือก่อให้เกิดภาระติดพันก็ได้ แต่ตัวทรัพย์สินนั้นจะจำหน่าย จำนำ จำนอง หรือก่อให้เกิดภาระติดพันได้ ก็แต่ด้วยความยินยอมแห่งเจ้าของรวมทุกคน ถ้าเจ้าของรวมคนใดจำหน่าย จำนำ จำนอง หรือก่อให้เกิดภาระติดพันทรัพย์สินโดยมิได้รับความยินยอมแห่งเจ้าของรวมทุกคน แต่ภายหลังเจ้าของรวมคนนั้นได้เป็นเจ้าของทรัพย์สินแต่ผู้เดียวไซร้ ท่านว่านิติกรรมนั้นเป็นอันสมบูรณ์"], "ป.พ.พ.|496": ["", "กำหนดเวลาไถ่นั้น อาจทำสัญญาขยายกำหนดเวลาไถ่ได้ แต่กำหนดเวลาไถ่รวมกันทั้งหมด ถ้าเกินกำหนดเวลาตามมาตรา 494 ให้ลดลงมาเป็นกำหนดเวลาตามมาตรา 494 การขยายกำหนดเวลาไถ่ตามวรรคหนึ่งอย่างน้อยต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้รับไถ่ ถ้าเป็นทรัพย์สินซึ่งการซื้อขายกันจะต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ ห้ามมิให้ยกการขยายเวลาขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้ได้สิทธิมาโดยเสียค่าตอบแทนและโดยสุจริต และได้จดทะเบียนสิทธิโดยสุจริตแล้ว เว้นแต่จะได้นำหนังสือหรือหลักฐานเป็นหนังสือดังกล่าวไปจดทะเบียนหรือจดแจ้งต่อพนักงานเจ้าหน้าที่"], "ป.พ.พ.|938": ["", "ตั๋วแลกเงินจะมีผู้ค้ำประกันรับประกันการใช้เงินทั้งจำนวนหรือแต่บางส่วนก็ได้ ซึ่งท่านเรียกว่า “อาวัล” อันอาวัลนั้นบุคคลภายนอกคนใดคนหนึ่งจะเป็นผู้รับ หรือแม้คู่สัญญาแห่งตั๋วเงินนั้นฝ่ายใดฝ่ายหนึ่งจะเป็นผู้รับก็ได้"], "ป.พ.พ.|1635": ["", "ลำดับและส่วนแบ่งของคู่สมรสที่ยังมีชีวิตอยู่ในการรับมรดกของผู้ตายนั้น ให้เป็นไปดังต่อไปนี้ (1) ถ้ามีทายาทตามมาตรา 1629 (1) ซึ่งยังมีชีวิตอยู่หรือมีผู้รับมรดกแทนที่ แล้วแต่กรณี คู่สมรสที่ยังมีชีวิตอยู่นั้น มีสิทธิได้ส่วนแบ่งเสมือนหนึ่งว่าตนเป็นทายาทชั้นบุตร (2) ถ้ามีทายาทตามมาตรา 1629 (3) และทายาทนั้นยังมีชีวิตอยู่หรือมีผู้รับมรดกแทนที่ หรือถ้าไม่มีทายาทตามมาตรา 1629 (1) แต่มีทายาทตามมาตรา 1629 (2) แล้วแต่กรณี คู่สมรสที่ยังมีชีวิตอยู่นั้นมีสิทธิได้รับมรดกกึ่งหนึ่ง (3) ถ้ามีทายาทตามมาตรา 1629 (4) หรือ (6) และทายาทนั้นยังมีชีวิตอยู่ หรือมีผู้รับมรดกแทนที่ หรือมีทายาทตามมาตรา 1629 (5) แล้วแต่กรณี คู่สมรสที่ยังมีชีวิตอยู่ มีสิทธิได้มรดกสองส่วนในสาม (4) ถ้าไม่มีทายาทดังที่ระบุไว้ในมาตรา 1629 คู่สมรสที่ยังมีชีวิตอยู่นั้นมีสิทธิได้รับมรดกทั้งหมด"], "ป.พ.พ.|20": ["", "ผู้เยาว์ย่อมบรรลุนิติภาวะเมื่อทำการสมรส หากการสมรสนั้นได้ทำตามบทบัญญัติมาตรา 1448"], "ป.พ.พ.|1715": ["", "ผู้ทำพินัยกรรมจะตั้งบุคคลคนเดียวหรือหลายคนให้เป็นผู้จัดการมรดกก็ได้ เว้นแต่จะมีข้อกำหนดไว้ในพินัยกรรมเป็นอย่างอื่น ถ้ามีผู้จัดการมรดกหลายคน แต่ผู้จัดการเหล่านั้นบางคนไม่สามารถ หรือไม่เต็มใจที่จะจัดการ และยังมีผู้จัดการมรดกเหลืออยู่แต่คนเดียว ผู้นั้นมีสิทธิที่จะจัดการมรดกได้โดยลำพัง แต่ถ้ามีผู้จัดการมรดกเหลืออยู่หลายคน ให้สันนิษฐานไว้ก่อนว่า ผู้จัดการเหล่านั้นแต่ละคนจะจัดการโดยลำพังไม่ได้"], "ป.พ.พ.|209": ["", "ถ้าได้กำหนดเวลาไว้เป็นแน่นอนเพื่อให้เจ้าหนี้กระทำการอันใด ท่านว่าที่จะขอปฏิบัติการชำระหนี้นั้น จะต้องทำก็แต่เมื่อเจ้าหนี้ทำการอันนั้นภายในเวลากำหนด"], "ป.พ.พ.|229": ["", "การรับช่วงสิทธิย่อมมีขึ้นด้วยอำนาจกฎหมายและย่อมสำเร็จเป็นประโยชน์แก่บุคคลดังจะกล่าวต่อไปนี้ คือ (1) บุคคลซึ่งเป็นเจ้าหนี้อยู่เอง และมาใช้หนี้ให้แก่เจ้าหนี้อีกคนหนึ่งผู้มีสิทธิจะได้รับใช้หนี้ก่อนตน เพราะเขามีบุริมสิทธิ หรือมีสิทธิจำนำจำนอง (2) บุคคลผู้ได้
