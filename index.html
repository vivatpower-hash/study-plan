ไปซึ่งอสังหาริมทรัพย์ใด และเอาเงินราคาค่าซื้อใช้ให้แก่ผู้รับจำนองทรัพย์นั้นเสร็จไป (3) บุคคลผู้มีความผูกพันร่วมกับผู้อื่น หรือเพื่อผู้อื่นในอันจะต้องใช้หนี้ มีส่วนได้เสียด้วยในการใช้หนี้นั้น และเข้าใช้หนี้นั้น"], "ป.พ.พ.|1622": ["", "พระภิกษุนั้น จะเรียกร้องเอาทรัพย์มรดกในฐานะที่เป็นทายาทโดยธรรมไม่ได้ เว้นแต่จะได้สึกจากสมณเพศมาเรียกร้องภายในกำหนดอายุความตามมาตรา 1754 แต่พระภิกษุนั้น อาจเป็นผู้รับพินัยกรรมได้"], "ป.พ.พ.|1339": ["", "เจ้าของที่ดินจำต้องรับน้ำซึ่งไหลตามธรรมดาจากที่ดินสูงมาในที่ดินของตน น้ำไหลตามธรรมดามายังที่ดินต่ำ และจำเป็นแก่ที่ดินนั้นไซร้ ท่านว่าเจ้าของที่ดินซึ่งอยู่สูงกว่าจะกันเอาไว้ได้เพียงที่จำเป็นแก่ที่ดินของตน"], "ป.พ.พ.|1381": ["", "บุคคลใดยึดถือทรัพย์สินอยู่ในฐานะเป็นผู้แทนผู้ครอบครอง บุคคลนั้นจะเปลี่ยนลักษณะแห่งการยึดถือได้ ก็แต่โดยบอกกล่าวไปยังผู้ครอบครองว่าไม่เจตนาจะยึดถือทรัพย์สินแทนผู้ครอบครองต่อไป หรือตนเองเป็นผู้ครอบครองโดยสุจริต อาศัยอำนาจใหม่อันได้จากบุคคลภายนอก"], "ป.พ.พ.|680": ["", "อันว่าค้ำประกันนั้น คือสัญญาซึ่งบุคคลภายนอกคนหนึ่ง เรียกว่าผู้ค้ำประกัน ผูกพันตนต่อเจ้าหนี้คนหนึ่งเพื่อชำระหนี้ในเมื่อลูกหนี้ไม่ชำระหนี้นั้น อนึ่ง สัญญาค้ำประกันนั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อผู้ค้ำประกันเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่"], "ป.พ.พ.|423": ["", "ผู้ใดกล่าวหรือไขข่าวแพร่หลายซึ่งข้อความอันฝ่าฝืนต่อความจริง เป็นที่เสียหายแก่ชื่อเสียงหรือเกียรติคุณของบุคคลอื่นก็ดี หรือเป็นที่เสียหายแก่ทางทำมาหาได้หรือทางเจริญของเขาโดยประการอื่นก็ดี ท่านว่าผู้นั้นจะต้องใช้ค่าสินไหมทดแทนให้แก่เขาเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่การนั้น แม้ทั้งเมื่อตนมิได้รู้ว่าข้อความนั้นไม่จริง แต่หากควรจะรู้ได้ ผู้ใดส่งข่าวสารอันตนมิได้รู้ว่าเป็นความไม่จริง หากว่าตนเองหรือผู้รับข่าวสารนั้นมีทางได้เสียโดยชอบในการนั้นด้วยแล้ว ท่านว่าเพียงที่ส่งข่าวสารเช่นนั้นหาทำให้ผู้นั้นต้องรับผิดใช้ค่าสินไหมทดแทนไม่"], "ป.พ.พ.|1437": ["", "การหมั้นจะสมบูรณ์เมื่อฝ่ายผู้หมั้นได้ส่งมอบหรือโอนทรัพย์สินอันเป็นของหมั้นให้แก่ผู้รับหมั้นเพื่อเป็นหลักฐานว่าจะสมรสกับผู้รับหมั้นนั้น เมื่อหมั้นแล้วให้ของหมั้นตกเป็นสิทธิแก่ผู้รับหมั้น สินสอด เป็นทรัพย์สินซึ่งฝ่ายผู้หมั้นให้แก่บิดามารดา ผู้รับบุตรบุญธรรมหรือผู้ปกครองฝ่ายผู้รับหมั้น แล้วแต่กรณี เพื่อตอบแทนการที่ผู้รับหมั้นยอมสมรส ถ้าไม่มีการสมรสโดยมีเหตุสำคัญอันเกิดแก่ผู้รับหมั้นหรือโดยมีพฤติการณ์ซึ่งฝ่ายผู้รับหมั้นต้องรับผิดชอบ ทำให้ผู้หมั้นไม่สมควรหรือไม่อาจสมรสกับผู้รับหมั้นนั้น ฝ่ายผู้หมั้นเรียกสินสอดคืนได้ ถ้าจะต้องคืนของหมั้นหรือสินสอดตามหมวดนี้ ให้นำบทบัญญัติมาตรา 412 ถึงมาตรา 418 แห่งประมวลกฎหมายนี้ว่าด้วยลาภมิควรได้มาใช้บังคับโดยอนุโลม"], "ป.พ.พ.|921": ["", "การสลักหลังตั๋วแลกเงินซึ่งสั่งให้ใช้เงินแก่ผู้ถือนั้น ย่อมเป็นเพียงประกัน (อาวัล) สำหรับผู้สั่งจ่าย"], "ป.พ.พ.|850": ["", "อันว่าประนีประนอมยอมความนั้น คือสัญญาซึ่งผู้เป็นคู่สัญญาทั้งสองฝ่ายระงับข้อพิพาทอันใดอันหนึ่งซึ่งมีอยู่หรือจะมีขึ้นนั้นให้เสร็จไปด้วยต่างยอมผ่อนผันให้แก่กัน"], "ป.พ.พ.|1506": ["", "ถ้าคู่สมรสได้ทำการสมรสโดยถูกกลฉ้อฉลอันถึงขนาดซึ่งถ้ามิได้มีกลฉ้อฉลนั้นจะไม่ทำการสมรส การสมรสนั้นเป็นโมฆียะ ความในวรรคหนึ่ง ไม่ใช้บังคับในกรณีที่กลฉ้อฉลนั้นเกิดขึ้นโดยบุคคลที่สามโดยคู่สมรสอีกฝ่ายหนึ่งมิได้รู้เห็นด้วย สิทธิขอเพิกถอนการสมรสเพราะถูกกลฉ้อฉลเป็นอันระงับเมื่อเวลาได้ผ่านพ้นไปแล้วเก้าสิบวันนับแต่วันที่รู้หรือควรได้รู้ถึงกลฉ้อฉล หรือเมื่อเวลาได้ผ่านพ้นไปแล้วหนึ่งปี นับแต่วันสมรส"], "ป.พ.พ.|330": ["", "เมื่อขอปฏิบัติการชำระหนี้โดยชอบแล้ว บรรดาความรับผิดชอบอันเกิดแต่การไม่ชำระหนี้ ก็เป็นอันปลดเปลื้องไป นับแต่เวลาที่ขอปฏิบัติการชำระหนี้นั้น"], "ป.พ.พ.|600": ["", "ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในสัญญาไซร้ ท่านว่าผู้รับจ้างจะต้องรับผิดเพื่อการที่ทำชำรุดบกพร่องเพียงแต่ที่ปรากฏขึ้นภายในปีหนึ่งนับแต่วันส่งมอบ หรือที่ปรากฏขึ้นภายในห้าปี ถ้าการที่ทำนั้นเป็นสิ่งปลูกสร้างกับพื้นดิน นอกจากเรือนโรงทำด้วยเครื่องไม้ แต่ข้อจำกัดนี้ท่านมิให้ใช้บังคับเมื่อปรากฏว่าผู้รับจ้างได้ปิดบังความชำรุดบกพร่องนั้น"], "ป.พ.พ.|406": ["", "บุคคลใดได้มาซึ่งทรัพย์สิ่งใดเพราะการที่บุคคลอีกคนหนึ่งกระทำเพื่อชำระหนี้ก็ดี หรือได้มาด้วยประการอื่นก็ดี โดยปราศจากมูลอันจะอ้างกฎหมายได้ และเป็นทางให้บุคคลอีกคนหนึ่งนั้นเสียเปรียบไซร้ ท่านว่าบุคคลนั้นจำต้องคืนทรัพย์ให้แก่เขา อนึ่ง การรับสภาพหนี้สินว่ามีอยู่หรือหาไม่นั้น ท่านก็ให้ถือว่าเป็นการกระทำเพื่อชำระหนี้ด้วย บทบัญญัติอันนี้ท่านให้ใช้บังคับตลอดถึงกรณีที่ได้ทรัพย์มาเพราะเหตุอย่างใดอย่างหนึ่งซึ่งมิได้มีได้เป็นขึ้น หรือเป็นเหตุที่ได้สิ้นสุดไปเสียก่อนแล้วนั้นด้วย"], "ป.พ.พ.|687": ["", "ผู้ค้ำประกันไม่จำต้องชำระหนี้ก่อนถึงเวลากำหนดที่จะชำระ แม้ถึงว่าลูกหนี้จะไม่อาจถือเอาซึ่งประโยชน์แห่งเงื่อนเวลาเริ่มต้นหรือเวลาสุดสิ้นได้ต่อไปแล้ว"], "ป.พ.พ.|1536": ["", "เด็กเกิดแต่หญิงขณะเป็นคู่สมรสกับชายหรือภายในสามร้อยสิบวันนับแต่วันที่การสมรสสิ้นสุดลง ให้สันนิษฐานไว้ก่อนว่าเป็นบุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรส หรือเคยเป็นคู่สมรส แล้วแต่กรณี ให้นำความในวรรคหนึ่งมาใช้บังคับแก่บุตรที่เกิดจากหญิงก่อนที่ได้มีคำพิพากษาถึงที่สุดของศาลแสดงว่าการสมรสเป็นโมฆะ หรือภายในระยะเวลาสามร้อยสิบวันนับแต่วันนั้น"], "ป.พ.พ.|408": ["", "บุคคลดังจะกล่าวต่อไปนี้ไม่มีสิทธิจะได้รับคืนทรัพย์ คือ (1) บุคคลผู้ชำระหนี้อันมีเงื่อนเวลาบังคับเมื่อก่อนถึงกำหนดเวลานั้น (2) บุคคลผู้ชำระหนี้ซึ่งขาดอายุความแล้ว (3) บุคคลผู้ชำระหนี้ตามหน้าที่ศีลธรรม หรือตามควรแก่อัธยาศัยในสมาคม"], "ป.พ.พ.|1659": ["", "การทำพินัยกรรมแบบเอกสารฝ่ายเมืองนั้น จะทำนอกที่ว่าการอำเภอก็ได้ เมื่อมีการร้องขอเช่นนั้น"], "ป.พ.พ.|562": ["", "ผู้เช่าจะต้องรับผิดในความสูญหายหรือบุบสลายอย่างใด ๆ อันเกิดขึ้นแก่ทรัพย์สินที่เช่า เพราะความผิดของผู้เช่าเอง หรือของบุคคลซึ่งอยู่กับผู้เช่า หรือของผู้เช่าช่วง แต่ผู้เช่าไม่ต้องรับผิดในความสูญหายหรือบุบสลายอันเกิดแต่การใช้ทรัพย์สินนั้นโดยชอบ"], "ป.พ.พ.|576": ["", "ถ้าตามพฤติการณ์ไม่อาจจะคาดหมายได้ว่างานนั้นจะพึงทำให้เปล่าไซร้ ท่านย่อมถือเอาโดยปริยายว่ามีคำมั่นจะให้สินจ้าง"], "ป.พ.พ.|605": ["", "ถ้าการที่จ้างยังทำไม่แล้วเสร็จอยู่ตราบใด ผู้ว่าจ้างอาจบอกเลิกสัญญาได้ เมื่อเสียค่าสินไหมทดแทนให้แก่ผู้รับจ้างเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่การเลิกสัญญานั้น"], "ป.พ.พ.|1716": ["", "หน้าที่ผู้จัดการมรดกที่ศาลตั้ง ให้เริ่มนับแต่วันที่ได้ฟังหรือถือว่าได้ฟังคำสั่งศาลแล้ว"], "ป.พ.พ.|711": ["", "การที่จะตกลงกันไว้เสียแต่ก่อนเวลาหนี้ถึงกำหนดชำระเป็นข้อความอย่างใดอย่างหนึ่งว่า ถ้าไม่ชำระหนี้ ให้ผู้รับจำนองเข้าเป็นเจ้าของทรัพย์สินซึ่งจำนอง หรือว่าให้จัดการแก่ทรัพย์สินนั้นเป็นประการอื่นอย่างใด นอกจากตามบทบัญญัติทั้งหลายว่าด้วยการบังคับจำนองนั้นไซร้ ข้อตกลงเช่นนั้นท่านว่าไม่สมบูรณ์"], "ป.พ.พ.|422": ["", "ถ้าความเสียหายเกิดแต่การฝ่าฝืนบทบังคับแห่งกฎหมายใดอันมีที่ประสงค์ เพื่อจะปกป้องบุคคลอื่น ๆ ผู้ใดทำการฝ่าฝืนเช่นนั้น ท่านให้สันนิษฐานไว้ก่อนว่าผู้นั้นเป็นผู้ผิด"], "ป.พ.พ.|694": ["", "นอกจากข้อต่อสู้ซึ่งผู้ค้ำประกันมีต่อเจ้าหนี้นั้น ท่านว่าผู้ค้ำประกันยังอาจยกข้อต่อสู้ทั้งหลายซึ่งลูกหนี้มีต่อเจ้าหนี้ขึ้นต่อสู้ได้ด้วย"], "ป.พ.พ.|427": ["", "บทบัญญัติในมาตราทั้งสองก่อนนั้น ท่านให้ใช้บังคับแก่ตัวการและตัวแทนด้วย โดยอนุโลม"], "ป.พ.พ.|146": ["", "ทรัพย์ซึ่งติดกับที่ดินหรือติดกับโรงเรือนเพียงชั่วคราวไม่ถือว่าเป็นส่วนควบกับที่ดินหรือโรงเรือนนั้น ความข้อนี้ให้ใช้บังคับแก่โรงเรือนหรือสิ่งปลูกสร้างอย่างอื่น ซึ่งผู้มีสิทธิในที่ดินของผู้อื่นใช้สิทธินั้นปลูกสร้างไว้ในที่ดินนั้นด้วย"], "ป.พ.พ.|1301": ["", "บทบัญญัติแห่งสองมาตราก่อนนี้ ท่านให้ใช้บังคับถึงการเปลี่ยนแปลง ระงับ และกลับคืนมาแห่งทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์นั้นด้วยโดยอนุโลม"], "ป.พ.พ.|1547": ["", "เด็กเกิดจากบิดามารดาที่มิได้สมรสกัน จะเป็นบุตรชอบด้วยกฎหมายต่อเมื่อบิดามารดาได้สมรสกันในภายหลังหรือบิดาได้จดทะเบียนว่าเป็นบุตรหรือศาลพิพากษาว่าเป็นบุตร"], "ป.พ.พ.|492": ["", "ในกรณีที่มีการไถ่ทรัพย์สินซึ่งขายฝากภายในเวลาที่กำหนดไว้ในสัญญาหรือภายในเวลาที่กฎหมายกำหนด หรือผู้ไถ่ได้วางทรัพย์อันเป็นสินไถ่ต่อสำนักงานวางทรัพย์ภายในกำหนดเวลาไถ่โดยสละสิทธิถอนทรัพย์ที่ได้วางไว้ ให้ทรัพย์สินซึ่งขายฝากตกเป็นกรรมสิทธิ์ของผู้ไถ่ตั้งแต่เวลาที่ผู้ไถ่ได้ชำระสินไถ่หรือวางทรัพย์อันเป็นสินไถ่ แล้วแต่กรณี ในกรณีที่ได้วางทรัพย์ตามวรรคหนึ่ง ให้เจ้าพนักงานของสำนักงานวางทรัพย์แจ้งให้ผู้รับไถ่ทราบถึงการวางทรัพย์โดยพลัน โดยผู้ไถ่ไม่ต้องปฏิบัติตามมาตรา 333 วรรคสาม"], "ป.พ.พ.|1374": ["", "ถ้าผู้ครอบครองถูกรบกวนในการครอบครองทรัพย์สิน เพราะมีผู้สอดเข้าเกี่ยวข้องโดยมิชอบด้วยกฎหมายไซร้ ท่านว่าผู้ครอบครองมีสิทธิจะให้ปลดเปลื้องการรบกวนนั้นได้ ถ้าเป็นที่น่าวิตกว่าจะยังมีการรบกวนอีก ผู้ครอบครองจะขอต่อศาลให้สั่งห้ามก็ได้ การฟ้องคดีเพื่อปลดเปลื้องการรบกวนนั้น ท่านว่าต้องฟ้องภายในปีหนึ่งนับแต่เวลาถูกรบกวน"], "ป.พ.พ.|240": ["", "การเรียกร้องขอเพิกถอนนั้น ท่านห้ามมิให้ฟ้องร้องเมื่อพ้นปีหนึ่งนับแต่เวลาที่เจ้าหนี้ได้รู้ต้นเหตุอันเป็นมูลให้เพิกถอน หรือพ้นสิบปีนับแต่ได้ทำนิติกรรมนั้น"], "ป.พ.พ.|879": ["", "ผู้รับประกันภัยไม่ต้องรับผิดในเมื่อความวินาศภัยหรือเหตุอื่นซึ่งได้ระบุไว้ในสัญญานั้นได้เกิดขึ้นเพราะความทุจริต หรือความประมาทเลินเล่ออย่างร้ายแรงของผู้เอาประกันภัยหรือผู้รับประโยชน์ ผู้รับประกันภัยไม่ต้องรับผิดในความวินาศภัยอันเป็นผลโดยตรงมาแต่ความไม่สมประกอบในเนื้อแห่งวัตถุที่เอาประกันภัย เว้นแต่จะได้ตกลงกันเป็นอย่างอื่น"], "ป.พ.พ.|758": ["", "ผู้รับจำนำชอบที่จะยึดของจำนำไว้ได้ทั้งหมดจนกว่าจะได้รับชำระหนี้และค่าอุปกรณ์ครบถ้วน"], "ป.พ.พ.|76": ["", "ถ้าการกระทำตามหน้าที่ของผู้แทนของนิติบุคคลหรือผู้มีอำนาจทำการแทนนิติบุคคล เป็นเหตุให้เกิดความเสียหายแก่บุคคลอื่น นิติบุคคลนั้นต้องรับผิดชดใช้ค่าสินไหมทดแทนเพื่อความเสียหายนั้น แต่ไม่สูญเสียสิทธิที่จะไล่เบี้ยเอาแก่ผู้ก่อความเสียหาย ถ้าความเสียหายแก่บุคคลอื่นเกิดจากการกระทำที่ไม่อยู่ในขอบวัตถุประสงค์หรืออำนาจหน้าที่ของนิติบุคคล บรรดาบุคคลดังกล่าวตามวรรคหนึ่งที่ได้เห็นชอบให้กระทำการนั้นหรือได้เป็นผู้กระทำการดังกล่าว ต้องร่วมกันรับผิดชดใช้ค่าสินไหมทดแทนแก่ผู้ที่ได้รับความเสียหายนั้น"], "ป.พ.พ.|1026": ["", "ผู้เป็นหุ้นส่วนทุกคนต้องมีสิ่งหนึ่งสิ่งใดมาลงหุ้นด้วยในห้างหุ้นส่วน สิ่งที่นำมาลงหุ้นด้วยนั้น จะเป็นเงินหรือทรัพย์สินสิ่งอื่นหรือลงแรงงานก็ได้"], "ป.พ.พ.|1619": ["", "ผู้ใดจะสละหรือจำหน่ายจ่ายโอนโดยประการใด ซึ่งสิทธิอันหากจะมีในภายหน้าในการสืบมรดกผู้ที่ยังมีชีวิตอยู่นั้นไม่ได้"], "ป.พ.พ.|43": ["", "ภูมิลำเนาของคู่สมรส ได้แก่ถิ่นที่อยู่ที่คู่สมรสอยู่กินด้วยกันฉันคู่สมรส เว้นแต่คู่สมรสฝ่ายใดได้แสดงเจตนาให้ปรากฏว่ามีภูมิลำเนาแยกต่างหากจากกัน"], "ป.พ.พ.|1694": ["", "ถ้าจะเพิกถอนพินัยกรรมฉบับก่อนเสียทั้งหมด หรือแต่บางส่วนด้วยพินัยกรรมฉบับหลัง การเพิกถอนจะสมบูรณ์ต่อเมื่อพินัยกรรมฉบับหลังนั้นได้ทำตามแบบใดแบบหนึ่งที่กฎหมายบัญญัติไว้"], "ป.พ.พ.|429": ["", "บุคคลใดแม้ไร้ความสามารถเพราะเหตุเป็นผู้เยาว์หรือวิกลจริตก็ยังต้องรับผิดในผลที่ตนทำละเมิด บิดามารดาหรือผู้อนุบาลของบุคคลเช่นว่านี้ย่อมต้องรับผิดร่วมกับเขาด้วย เว้นแต่จะพิสูจน์ได้ว่าตนได้ใช้ความระมัดระวังตามสมควรแก่หน้าที่ดูแลซึ่งทำอยู่นั้น"], "ป.พ.พ.|466": ["", "ในการซื้อขายอสังหาริมทรัพย์นั้น หากว่าได้ระบุจำนวนเนื้อที่ทั้งหมดไว้ และผู้ขายส่งมอบทรัพย์สินน้อยหรือมากไปกว่าที่ได้สัญญาไซร้ ท่านว่าผู้ซื้อจะปัดเสีย หรือจะรับเอาไว้และใช้ราคาตามส่วนก็ได้ ตามแต่จะเลือก อนึ่ง ถ้าขาดตกบกพร่องหรือล้ำจำนวนไม่เกินกว่าร้อยละห้าแห่งเนื้อที่ทั้งหมดอันได้ระบุไว้นั้นไซร้ ท่านว่าผู้ซื้อจำต้องรับเอาและใช้ราคาตามส่วน แต่ว่าผู้ซื้ออาจจะเลิกสัญญาเสียได้ในเมื่อขาดตกบกพร่องหรือล้ำจำนวนถึงขนาดซึ่งหากผู้ซื้อได้ทราบก่อนแล้วคงจะมิได้เข้าทำสัญญานั้น"], "ป.พ.พ.|659": ["", "ถ้าการรับฝากทรัพย์เป็นการทำให้เปล่าไม่มีบำเหน็จไซร้ ท่านว่าผู้รับฝากจำต้องใช้ความระมัดระวังสงวนทรัพย์สินซึ่งฝากนั้นเหมือนเช่นเคยประพฤติในกิจการของตนเอง ถ้าการรับฝากทรัพย์นั้นมีบำเหน็จค่าฝาก ท่านว่าผู้รับฝากจำต้องใช้ความระมัดระวังและใช้ฝีมือเพื่อสงวนทรัพย์สินนั้นเหมือนเช่นวิญญูชนจะพึงประพฤติโดยพฤติการณ์ดังนั้น ทั้งนี้ ย่อมรวมทั้งการใช้ฝีมืออันพิเศษเฉพาะการในที่จะพึงใช้ฝีมือเช่นนั้นด้วย ถ้าและผู้รับฝากเป็นผู้มีวิชาชีพเฉพาะกิจการค้าขาย หรืออาชีวะอย่างหนึ่งอย่างใด ก็จำต้องใช้ความระมัดระวังและใช้ฝีมือเท่าที่เป็นธรรมดาจะต้องใช้และสมควรจะต้องใช้ในกิจการค้าขายหรืออาชีวะอย่างนั้น"], "ป.พ.พ.|454": ["", "การที่คู่กรณีฝ่ายหนึ่งให้คำมั่นไว้ก่อนว่าจะซื้อหรือขายนั้น จะมีผลเป็นการซื้อขายต่อเมื่ออีกฝ่ายหนึ่งได้บอกกล่าวความจำนงว่าจะทำการซื้อขายนั้นให้สำเร็จตลอดไป และคำบอกกล่าวเช่นนั้นได้ไปถึงบุคคลผู้ให้คำมั่นแล้ว ถ้าในคำมั่นมิได้กำหนดเวลาไว้เพื่อการบอกกล่าวเช่นนั้นไซร้ ท่านว่าบุคคลผู้ให้คำมั่นจะกำหนดเวลาพอสมควร และบอกกล่าวไปยังคู่กรณีอีกฝ่ายหนึ่งให้ตอบมาเป็นแน่นอนภายในเวลากำหนดนั้นก็ได้ ว่าจะทำการซื้อขายให้สำเร็จตลอดไปหรือไม่ ถ้าและไม่ตอบเป็นแน่นอนภายในกำหนดเวลานั้นไซร้ คำมั่นซึ่งได้ให้ไว้ก่อนนั้นก็เป็นอันไร้ผล"], "ป.พ.พ.|1516": ["", "เหตุฟ้องหย่ามีดังต่อไปนี้ (1) คู่สมรสฝ่ายใดฝ่ายหนึ่งอุปการะเลี้ยงดูหรือยกย่องผู้อื่นฉันคู่สมรส เป็นชู้หรือมีชู้ ร่วมประเวณีกับผู้อื่นเป็นอาจิณ หรือกระทำกับผู้อื่นหรือยอมรับการกระทำของผู้อื่นเพื่อสนองความใคร่ของตนหรือผู้อื่นเป็นอาจิณ อีกฝ่ายหนึ่งฟ้องหย่าได้ (2) คู่สมรสฝ่ายใดฝ่ายหนึ่งประพฤติชั่ว ไม่ว่าความประพฤติชั่วนั้นจะเป็นความผิดอาญาหรือไม่ ถ้าเป็นเหตุให้อีกฝ่ายหนึ่ง (ก) ได้รับความอับอายขายหน้าอย่างร้ายแรง (ข) ได้รับความดูถูกเกลียดชังเพราะเหตุที่คงเป็นคู่สมรสของฝ่ายที่ประพฤติชั่วอยู่ต่อไป หรือ (ค) ได้รับความเสียหายหรือเดือดร้อนเกินควร ในเมื่อเอาสภาพ ฐานะและความเป็นอยู่ร่วมกันฉันคู่สมรสมาคำนึงประกอบ อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้ (3) คู่สมรสฝ่ายใดฝ่ายหนึ่งทำร้าย หรือทรมานร่างกายหรือจิตใจ หรือหมิ่นประมาทหรือเหยียดหยามอีกฝ่ายหนึ่งหรือบุพการีของอีกฝ่ายหนึ่ง ทั้งนี้ ถ้าเป็นการร้ายแรง อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้ (4) คู่สมรสฝ่ายใดฝ่ายหนึ่งจงใจละทิ้งร้างอีกฝ่ายหนึ่งไปเกินหนึ่งปี อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้ (4/1) คู่สมรสฝ่ายใดฝ่ายหนึ่งต้องคำพิพากษาถึงที่สุดให้จำคุก และได้ถูกจำคุกเกินหนึ่งปีในความผิดที่อีกฝ่ายหนึ่งมิได้มีส่วนก่อให้เกิดการกระทำความผิดหรือยินยอมหรือรู้เห็นเป็นใจในการกระทำความผิดนั้นด้วย และการเป็นคู่สมรสกันต่อไปจะเป็นเหตุให้อีกฝ่ายหนึ่งได้รับความเสียหายหรือเดือดร้อนเกินควร อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้ (4/2) คู่สมรสสมัครใจแยกกันอยู่เพราะเหตุที่ไม่อาจอยู่ร่วมกันฉันคู่สมรสได้โดยปกติสุขตลอดมาเกินสามปี หรือแยกกันอยู่ตามคำสั่งของศาลเป็นเวลาเกินสามปี ฝ่ายใดฝ่ายหนึ่งฟ้องหย่าได้ (5) คู่สมรสฝ่ายใดฝ่ายหนึ่งถูกศาลสั่งให้เป็นคนสาบสูญ หรือไปจากภูมิลำเนาหรือถิ่นที่อยู่เป็นเวลาเกินสามปีโดยไม่มีใครทราบแน่ว่าเป็นตายร้ายดีอย่างไร อีกฝ่ายหนึ่งฟ้องหย่าได้ (6) คู่สมรสฝ่ายใดฝ่ายหนึ่งไม่ให้ความช่วยเหลืออุปการะเลี้ยงดูอีกฝ่ายหนึ่งตามสมควร หรือทำการเป็นปฏิปักษ์ต่อการที่เป็นคู่สมรสอย่างร้ายแรง ทั้งนี้ ถ้าการกระทำนั้นถึงขนาดที่อีกฝ่ายหนึ่งเดือดร้อนเกินควรในเมื่อเอาสภาพ ฐานะและความเป็นอยู่ร่วมกันฉันคู่สมรสมาคำนึงประกอบ อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้ (7) คู่สมรสฝ่ายใดฝ่ายหนึ่งวิกลจริตตลอดมาเกินสามปี และความวิกลจริตนั้นมีลักษณะยากจะหายได้ กับทั้งความวิกลจริตถึงขนาดที่จะทนอยู่ร่วมกันฉันคู่สมรสต่อไปไม่ได้ อีกฝ่ายหนึ่งฟ้องหย่าได้ (8) คู่สมรสฝ่ายใดฝ่ายหนึ่งผิดทัณฑ์บนที่ทำให้ไว้เป็นหนังสือในเรื่องความประพฤติ อีกฝ่ายหนึ่งฟ้องหย่าได้ (9) คู่สมรสฝ่ายใดฝ่ายหนึ่งเป็นโรคติดต่ออย่างร้ายแรงอันอาจเป็นภัยแก่อีกฝ่ายหนึ่งและโรคมีลักษณะเรื้อรังไม่มีทางที่จะหายได้ อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้ (10) คู่สมรสฝ่ายใดฝ่ายหนึ่งมีสภาพแห่งกายทำให้ไม่อาจร่วมประเวณี หรือไม่อาจกระทำการหรือยอมรับการกระทำเพื่อสนองความใคร่ของอีกฝ่ายได้ตลอดกาล อีกฝ่ายหนึ่งฟ้องหย่าได้"], "ป.พ.พ.|213": ["", "ถ้าลูกหนี้ละเลยเสียไม่ชำระหนี้ของตน เจ้าหนี้จะร้องขอต่อศาลให้สั่งบังคับชำระหนี้ก็ได้ เว้นแต่สภาพแห่งหนี้จะไม่เปิดช่องให้ทำเช่นนั้นได้ เมื่อสภาพแห่งหนี้ไม่เปิดช่องให้บังคับชำระหนี้ได้ ถ้าวัตถุแห่งหนี้เป็นอันให้กระทำการอันหนึ่งอันใด เจ้าหนี้จะร้องขอต่อศาลให้สั่งบังคับให้บุคคลภายนอกกระทำการอันนั้นโดยให้ลูกหนี้เสียค่าใช้จ่ายให้ก็ได้ แต่ถ้าวัตถุแห่งหนี้เป็นอันให้กระทำนิติกรรมอย่างใดอย่างหนึ่งไซร้ ศาลจะสั่งให้ถือเอาตามคำพิพากษาแทนการแสดงเจตนาของลูกหนี้ก็ได้ ส่วนหนี้ซึ่งมีวัตถุเป็นอันจะให้งดเว้นการอันใด เจ้าหนี้จะเรียกร้องให้รื้อถอนการที่ได้กระทำลงแล้วนั้นโดยให้ลูกหนี้เสียค่าใช้จ่าย และให้จัดการอันควรเพื่อกาลภายหน้าด้วยก็ได้ อนึ่ง บทบัญญัติในวรรคทั้งหลายที่กล่าวมาก่อนนี้ หากระทบกระทั่งถึงสิทธิที่จะเรียกเอาค่าเสียหายไม่"], "ป.พ.พ.|34": ["", "คนเสมือนไร้ความสามารถนั้น ต้องได้รับความยินยอมของผู้พิทักษ์ก่อนแล้วจึงจะทำการอย่างหนึ่งอย่างใดดังต่อไปนี้ได้ (1) นำทรัพย์สินไปลงทุน (2) รับคืนทรัพย์สินที่ไปลงทุน ต้นเงินหรือทุนอย่างอื่น (3) กู้ยืมหรือให้กู้ยืมเงิน ยืมหรือให้ยืมสังหาริมทรัพย์อันมีค่า (4) รับประกันโดยประการใด ๆ อันมีผลให้ตนต้องถูกบังคับชำระหนี้ (5) เช่าหรือให้เช่าสังหาริมทรัพย์มีกำหนดระยะเวลาเกินกว่าหกเดือน หรืออสังหาริมทรัพย์มีกำหนดระยะเวลาเกินกว่าสามปี (6) ให้โดยเสน่หา เว้นแต่การให้ที่พอควรแก่ฐานานุรูป เพื่อการกุศล การสังคมหรือตามหน้าที่ธรรมจรรยา (7) รับการให้โดยเสน่หาที่มีเงื่อนไขหรือค่าภาระติดพัน หรือไม่รับการให้โดยเสน่หา (8) ทำการอย่างหนึ่งอย่างใดเพื่อจะได้มาหรือปล่อยไปซึ่งสิทธิในอสังหาริมทรัพย์ หรือในสังหาริมทรัพย์อันมีค่า (9) ก่อสร้างหรือดัดแปลงโรงเรือนหรือสิ่งปลูกสร้างอย่างอื่น หรือซ่อมแซมอย่างใหญ่ (10) เสนอคดีต่อศาลหรือดำเนินกระบวนพิจารณาใด ๆ เว้นแต่การร้องขอตามมาตรา 35 หรือการร้องขอถอนผู้พิทักษ์ (11) ประนีประนอมยอมความหรือมอบข้อพิพาทให้อนุญาโตตุลาการวินิจฉัย ถ้ามีกรณีอื่นใดนอกจากที่กล่าวในวรรคหนึ่ง ซึ่งคนเสมือนไร้ความสามารถอาจจัดการไปในทางเสื่อมเสียแก่ทรัพย์สินของตนเองหรือครอบครัว ในการสั่งให้บุคคลใดเป็นคนเสมือนไร้ความสามารถ หรือเมื่อผู้พิทักษ์ร้องขอในภายหลัง ศาลมีอำนาจสั่งให้คนเสมือนไร้ความสามารถนั้นต้องได้รับความยินยอมของผู้พิทักษ์ก่อนจึงจะทำการนั้นได้ ในกรณีที่คนเสมือนไร้ความสามารถไม่สามารถจะทำการอย่างหนึ่งอย่างใดที่กล่าวมาในวรรคหนึ่งหรือวรรคสองได้ด้วยตนเอง เพราะเหตุมีกายพิการหรือมีจิตฟั่นเฟือนไม่สมประกอบ ศาลจะสั่งให้ผู้พิทักษ์เป็นผู้มีอำนาจกระทำการนั้นแทนคนเสมือนไร้ความสามารถก็ได้ ในกรณีเช่นนี้ ให้นำบทบัญญัติที่เกี่ยวกับผู้อนุบาลมาใช้บังคับแก่ผู้พิทักษ์โดยอนุโลม คำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา การใดกระทำลงโดยฝ่าฝืนบทบัญญัติมาตรานี้ การนั้นเป็นโมฆียะ"], "ป.พ.พ.|1436": ["", "ผู้เยาว์จะทำการหมั้นได้ต้องได้รับความยินยอมของบุคคลดังต่อไปนี้ (1) บิดาและมารดา ในกรณีที่มีทั้งบิดามารดา (2) บิดาหรือมารดา ในกรณีที่มารดาหรือบิดาตายหรือถูกถอนอำนาจปกครองหรือไม่อยู่ในสภาพหรือฐานะที่อาจให้ความยินยอม หรือโดยพฤติการณ์ผู้เยาว์ไม่อาจขอความยินยอมจากมารดาหรือบิดาได้ (3) ผู้รับบุตรบุญธรรม ในกรณีที่ผู้เยาว์เป็นบุตรบุญธรรม (4) ผู้ปกครอง ในกรณีที่ไม่มีบุคคลซึ่งอาจให้ความยินยอมตาม (1) (2) และ (3) หรือมีแต่บุคคลดังกล่าวถูกถอนอำนาจปกครอง การหมั้นที่ผู้เยาว์ทำโดยปราศจากความยินยอมดังกล่าวเป็นโมฆียะ"], "ป.พ.พ.|315": ["", "อันการชำระหนี้นั้นต้องทำให้แก่ตัวเจ้าหนี้หรือแก่บุคคลผู้มีอำนาจรับชำระหนี้แทนเจ้าหนี้ การชำระหนี้ทำให้แก่บุคคลผู้ไม่มีอำนาจรับชำระหนี้นั้น ถ้าเจ้าหนี้ให้สัตยาบันก็นับว่าสมบูรณ์"], "ป.พ.พ.|1392": ["", "ถ้าภาระจำยอมแตะต้องเพียงส่วนหนึ่งแห่งภารยทรัพย์ เจ้าของทรัพย์นั้นอาจเรียกให้ย้ายไปยังส่วนอื่นก็ได้ แต่ต้องแสดงได้ว่าการย้ายนั้นเป็นประโยชน์แก่ตนและรับเสียค่าใช้จ่าย ทั้งนี้ ต้องไม่ทำให้ความสะดวกของเจ้าของสามยทรัพย์ลดน้อยลง"], "ป.พ.พ.|748": ["", "การจำนำนั้นย่อมเป็นประกันเพื่อการชำระหนี้ กับทั้งค่าอุปกรณ์ต่อไปนี้ด้วย คือ (1) ดอกเบี้ย (2) ค่าสินไหมทดแทนในการไม่ชำระหนี้ (3) ค่าฤชาธรรมเนียมในการบังคับจำนำ (4) ค่าใช้จ่ายเพื่อรักษาทรัพย์สินซึ่งจำนำ (5) ค่าสินไหมทดแทนเพื่อความเสียหายอันเกิดแต่ความชำรุดบกพร่องแห่งทรัพย์สินจำนำซึ่งไม่เห็นประจักษ์"], "ป.พ.พ.|237": ["", "เจ้าหนี้ชอบที่จะร้องขอให้ศาลเพิกถอนเสียได้ซึ่งนิติกรรมใด ๆ อันลูกหนี้ได้กระทำลงทั้งรู้อยู่ว่าจะเป็นทางให้เจ้าหนี้เสียเปรียบ แต่ความข้อนี้ท่านมิให้ใช้บังคับ ถ้าปรากฏว่าในขณะที่ทำนิติกรรมนั้น บุคคลซึ่งเป็นผู้ได้ลาภงอกแต่การนั้นมิได้รู้เท่าถึงข้อความจริงอันเป็นทางให้เจ้าหนี้ต้องเสียเปรียบนั้นด้วย แต่หากกรณีเป็นการทำให้โดยเสน่หา ท่านว่าเพียงแต่ลูกหนี้เป็นผู้รู้ฝ่ายเดียวเท่านั้นก็พอแล้วที่จะขอเพิกถอนได้ บทบัญญัติดังกล่าวมาในวรรคก่อนนี้ ท่านมิให้ใช้บังคับแก่นิติกรรมใดอันมิได้มีวัตถุเป็นสิทธิในทรัพย์สิน"], "ป.พ.พ.|1733": ["", "การให้อนุมัติ การปลดเปลื้องความรับผิด หรือข้อตกลงอื่น ๆ อันเกี่ยวกับรายงานแสดงบัญชีการจัดการมรดกดังที่บัญญัติไว้ในมาตรา 1732 นั้น จะสมบูรณ์ต่อเมื่อรายงานแสดงบัญชีนั้นได้ส่งมอบล่วงหน้าแก่ทายาทพร้อมด้วยเอกสารอันเกี่ยวกับการนั้นไม่น้อยกว่าสิบวันก่อนแล้ว คดีเกี่ยวกับการจัดการมรดกนั้น มิให้ทายาทฟ้องเกินกว่าห้าปีนับแต่การจัดการมรดกสิ้นสุดลง"], "ป.พ.พ.|987": ["", "อันว่าเช็คนั้น คือหนังสือตราสารซึ่งบุคคลคนหนึ่ง เรียกว่าผู้สั่งจ่าย สั่งธนาคารให้ใช้เงินจำนวนหนึ่งเมื่อทวงถามให้แก่บุคคลอีกคนหนึ่ง หรือให้ใช้ตามคำสั่งของบุคคลอีกคนหนึ่ง อันเรียกว่าผู้รับเงิน"], "ป.พ.พ.|1526": ["", "ในคดีหย่า ถ้าเหตุแห่งการหย่าเป็นความผิดของคู่สมรสฝ่ายใดฝ่ายหนึ่งแต่ฝ่ายเดียว และการหย่านั้นจะทำให้อีกฝ่ายหนึ่งยากจนลง เพราะไม่มีรายได้พอจากทรัพย์สินหรือจากการงานตามที่เคยทำอยู่ระหว่างสมรส อีกฝ่ายหนึ่งนั้นจะขอให้ฝ่ายที่ต้องรับผิดจ่ายค่าเลี้ยงชีพให้ได้ ค่าเลี้ยงชีพนี้ศาลอาจให้เพียงใดหรือไม่ให้ก็ได้ โดยคำนึงถึงความสามารถของผู้ให้และฐานะของผู้รับและให้นำบทบัญญัติมาตรา 1598/39 มาตรา 1598/40 และมาตรา 1598/41 มาใช้บังคับโดยอนุโลม สิทธิเรียกร้องค่าเลี้ยงชีพเป็นอันสิ้นสุด ถ้ามิได้ฟ้องหรือฟ้องแย้งในคดีหย่านั้น"], "ป.พ.พ.|746": ["", "การชำระหนี้ไม่ว่าครั้งใด ๆ สิ้นเชิงหรือแต่บางส่วนก็ดี การระงับหนี้อย่างใด ๆ ก็ดี การตกลงกันแก้ไขเปลี่ยนแปลงจำนองหรือหนี้อันจำนองเป็นประกันนั้นเป็นประการใดก็ดี ท่านว่าต้องนำความไปจดทะเบียนต่อพนักงานเจ้าหน้าที่ในเมื่อมีคำร้องของผู้มีส่วนได้เสีย มิฉะนั้นท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอก"], "ป.พ.พ.|1522": ["", "ถ้าคู่สมรสหย่าโดยความยินยอม ให้ทำความตกลงกันไว้ในสัญญาหย่าว่าคู่สมรสทั้งสองฝ่าย หรือคู่สมรสฝ่ายใดฝ่ายหนึ่งจะออกเงินค่าอุปการะเลี้ยงดูบุตรเป็นจำนวนเงินเท่าใด ถ้าหย่าโดยคำพิพากษาของศาลหรือในกรณีที่สัญญาหย่ามิได้กำหนดเรื่องค่าอุปการะเลี้ยงดูบุตรไว้ ให้ศาลเป็นผู้กำหนด"], "ป.พ.พ.|31": ["", "ถ้าเหตุที่ทำให้เป็นคนไร้ความสามารถได้สิ้นสุดไปแล้ว และเมื่อบุคคลผู้นั้นเองหรือบุคคลใด ๆ ดังกล่าวมาในมาตรา 28 ร้องขอต่อศาลก็ให้ศาลสั่งเพิกถอนคำสั่งที่ให้เป็นคนไร้ความสามารถนั้น คำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา"], "ป.พ.พ.|564": ["", "อันสัญญาเช่านั้น ท่านว่าย่อมระงับไปเมื่อสิ้นกำหนดเวลาที่ได้ตกลงกันไว้ มิพักต้องบอกกล่าวก่อน"], "ป.พ.พ.|690": ["", "ถ้าเจ้าหนี้มีทรัพย์ของลูกหนี้ยึดถือไว้เป็นประกันไซร้ เมื่อผู้ค้ำประกันร้องขอ ท่านว่าเจ้าหนี้จะต้องให้ชำระหนี้เอาจากทรัพย์ซึ่งเป็นประกันนั้นก่อน"], "ป.พ.พ.|139": ["", "อสังหาริมทรัพย์ หมายความว่า ที่ดินและทรัพย์อันติดอยู่กับที่ดินมีลักษณะเป็นการถาวรหรือประกอบเป็นอันเดียวกับที่ดินนั้น และหมายความรวมถึงทรัพยสิทธิอันเกี่ยวกับที่ดินหรือทรัพย์อันติดอยู่กับที่ดินหรือประกอบเป็นอันเดียวกับที่ดินนั้นด้วย"], "ป.พ.พ.|1606": ["", "บุคคลดังต่อไปนี้ต้องถูกกำจัดมิให้รับมรดกฐานเป็นผู้ไม่สมควร คือ (1) ผู้ที่ต้องคำพิพากษาถึงที่สุดว่าได้เจตนากระทำ หรือพยายามกระทำให้เจ้ามรดกหรือผู้มีสิทธิได้รับมรดกก่อนตนถึงแก่ความตายโดยมิชอบด้วยกฎหมาย (2) ผู้ที่ได้ฟ้องเจ้ามรดกหาว่าทำความผิดโทษประหารชีวิตและตนเองกลับต้องคำพิพากษาถึงที่สุดว่า มีความผิดฐานฟ้องเท็จหรือทำพยานเท็จ (3) ผู้ที่รู้แล้วว่า เจ้ามรดกถูกฆ่าโดยเจตนา แต่มิได้นำข้อความนั้นขึ้นร้องเรียนเพื่อเป็นทางที่จะเอาตัวผู้กระทำผิดมาลงโทษ แต่ข้อนี้มิให้ใช้บังคับถ้าบุคคลนั้นมีอายุยังไม่ครบสิบหกปีบริบูรณ์ หรือเป็นคนวิกลจริตไม่สามารถรู้ผิดชอบ หรือถ้าผู้ที่ฆ่านั้นเป็นคู่สมรสหรือผู้บุพการีหรือผู้สืบสันดานของตนโดยตรง (4) ผู้ที่ฉ้อฉลหรือข่มขู่ให้เจ้ามรดกทำ หรือเพิกถอนหรือเปลี่ยนแปลงพินัยกรรมแต่บางส่วนหรือทั้งหมดซึ่งเกี่ยวกับทรัพย์มรดก หรือไม่ให้กระทำการดังกล่าวนั้น (5) ผู้ที่ปลอม ทำลาย หรือปิดบังพินัยกรรมแต่บางส่วนหรือทั้งหมด เจ้ามรดกอาจถอนข้อกำจัดฐานเป็นผู้ไม่สมควรเสียก็ได้โดยให้อภัยไว้เป็นลายลักษณ์อักษร"], "ป.พ.พ.|914": ["", "บุคคลผู้สั่งจ่ายหรือสลักหลังตั๋วแลกเงินย่อมเป็นอันสัญญาว่า เมื่อตั๋วนั้นได้นำยื่นโดยชอบแล้วจะมีผู้รับรองและใช้เงินตามเนื้อความแห่งตั๋ว ถ้าและตั๋วแลกเงินนั้นเขาไม่เชื่อถือโดยไม่ยอมรับรองก็ดี หรือไม่ยอมจ่ายเงินก็ดี ผู้สั่งจ่ายหรือผู้สลักหลังก็จะใช้เงินแก่ผู้ทรง หรือแก่ผู้สลักหลังคนหลังซึ่งต้องถูกบังคับให้ใช้เงินตามตั๋วนั้น ถ้าหากว่าได้ทำถูกต้องตามวิธีการในข้อไม่รับรองหรือไม่จ่ายเงินนั้นแล้ว"], "ป.พ.พ.|1451": ["", "ผู้รับบุตรบุญธรรมและบุตรบุญธรรมจะสมรสกันไม่ได้"], "ป.พ.พ.|432": ["", "ถ้าบุคคลหลายคนก่อให้เกิดเสียหายแก่บุคคลอื่นโดยร่วมกันทำละเมิด ท่านว่าบุคคลเหล่านั้นจะต้องร่วมกันรับผิดใช้ค่าสินไหมทดแทนเพื่อความเสียหายนั้น ความข้อนี้ท่านให้ใช้ตลอดถึงกรณีที่ไม่สามารถสืบรู้ตัวได้แน่ว่าในจำพวกที่ทำละเมิดร่วมกันนั้น คนไหนเป็นผู้ก่อให้เกิดเสียหายนั้นด้วย อนึ่ง บุคคลผู้ยุยงส่งเสริมหรือช่วยเหลือในการทำละเมิด ท่านก็ให้ถือว่าเป็นผู้กระทำละเมิดร่วมกันด้วย ในระหว่างบุคคลทั้งหลายซึ่งต้องรับผิดร่วมกันใช้ค่าสินไหมทดแทนนั้น ท่านว่าต่างต้องรับผิดเป็นส่วนเท่า ๆ กัน เว้นแต่โดยพฤติการณ์ ศาลจะวินิจฉัยเป็นประการอื่น"], "ป.พ.พ.|401": ["", "ถ้าการที่เข้าจัดการงานนั้นเป็นการสมประโยชน์ของตัวการ และต้องตามความประสงค์อันแท้จริงของตัวการหรือความประสงค์ตามที่จะพึงสันนิษฐานได้นั้นไซร้ ท่านว่าผู้จัดการจะเรียกให้ชดใช้เงินอันตนได้ออกไปคืนแก่ตนเช่นอย่างตัวแทนก็ได้ และบทบัญญัติมาตรา 816 วรรคสอง นั้น ท่านก็ให้นำมาใช้บังคับด้วย โดยอนุโลม อนึ่ง ในกรณีที่กล่าวมาในมาตรา 397 นั้น แม้ถึงว่าที่เข้าจัดการงานนั้นจะเป็นการขัดกับความประสงค์ของตัวการก็ดี ผู้จัดการก็ยังคงมีสิทธิเรียกร้องเช่นนั้นอยู่"], "ป.พ.พ.|824": ["", "ตัวแทนคนใดทำสัญญาแทนตัวการซึ่งอยู่ต่างประเทศและมีภูมิลำเนาในต่างประเทศ ท่านว่าตัวแทนคนนั้นจะต้องรับผิดตามสัญญานั้นแต่ลำพังตนเอง แม้ทั้งชื่อและตัวการจะได้เปิดเผยแล้ว เว้นแต่ข้อความแห่งสัญญาจะแย้งกันกับความรับผิดของตัวแทน"], "ป.พ.พ.|1649": ["", "ผู้จัดการมรดกซึ่งผู้ตายตั้งไว้ย่อมมีอำนาจและหน้าที่ในอันที่จะจัดการทำศพของผู้ตาย เว้นแต่ผู้ตายจะได้ตั้งบุคคลอื่นไว้โดยเฉพาะให้จัดการดังว่านั้น ถ้าผู้ตายมิได้ตั้งผู้จัดการมรดกหรือบุคคลใดไว้ให้เป็นผู้จัดการทำศพ หรือทายาทมิได้มอบหมายตั้งให้บุคคลใดเป็นผู้จัดการทำศพ บุคคลผู้ได้รับทรัพย์มรดกโดยพินัยกรรมหรือโดยสิทธิโดยธรรมเป็นจำนวนมากที่สุด เป็นผู้มีอำนาจและตกอยู่ในหน้าที่ต้องจัดการทำศพ เว้นแต่ศาลจะเห็นเป็นการสมควรตั้งบุคคลอื่นให้จัดการเช่นนั้น ในเมื่อบุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งร้องขอขึ้น"], "ป.พ.พ.|1734": ["", "เจ้าหนี้กองมรดกชอบแต่จะได้รับการชำระหนี้จากทรัพย์สินในกองมรดกเท่านั้น"], "ป.พ.พ.|572": ["", "อันว่าเช่าซื้อนั้น คือสัญญาซึ่งเจ้าของเอาทรัพย์สินออกให้เช่า และให้คำมั่นว่าจะขายทรัพย์สินนั้นหรือว่าจะให้ทรัพย์สินนั้นตกเป็นสิทธิแก่ผู้เช่า โดยเงื่อนไขที่ผู้เช่าได้ใช้เงินเป็นจำนวนเท่านั้นเท่านี้คราว สัญญาเช่าซื้อนั้นถ้าไม่ทำเป็นหนังสือ ท่านว่าเป็นโมฆะ"], "ป.พ.พ.|1363": ["", "เจ้าของรวมคนหนึ่ง ๆ มีสิทธิเรียกให้แบ่งทรัพย์สินได้ เว้นแต่จะมีนิติกรรมขัดอยู่ หรือถ้าวัตถุที่ประสงค์ที่เป็นเจ้าของรวมกันนั้นมีลักษณะเป็นการถาวร ก็เรียกให้แบ่งไม่ได้ สิทธิเรียกให้แบ่งทรัพย์สินนั้น ท่านว่าจะตัดโดยนิติกรรมเกินคราวละสิบปีไม่ได้ ท่านว่าเจ้าของรวมจะเรียกให้แบ่งทรัพย์สินในเวลาที่ไม่เป็นโอกาสอันควรไม่ได้"], "ป.พ.พ.|1502": ["", "การสมรสที่เป็นโมฆียะสิ้นสุดลงเมื่อศาลพิพากษาให้เพิกถอน"], "ป.พ.พ.|1481": ["", "คู่สมรสฝ่ายใดฝ่ายหนึ่งไม่มีอำนาจทำพินัยกรรมยกสินสมรสที่เกินกว่าส่วนของตนให้แก่บุคคลใดได้"], "ป.พ.พ.|233": ["", "ถ้าลูกหนี้ขัดขืนไม่ยอมใช้สิทธิเรียกร้องหรือเพิกเฉยเสียไม่ใช้สิทธิเรียกร้อง เป็นเหตุให้เจ้าหนี้ต้องเสียประโยชน์ไซร้ ท่านว่าเจ้าหนี้จะใช้สิทธิเรียกร้องนั้นในนามของตนเองแทนลูกหนี้เพื่อป้องกันสิทธิของตนในมูลหนี้นั้นก็ได้ เว้นแต่ในข้อที่เป็นการของลูกหนี้ส่วนตัวโดยแท้"], "ป.พ.พ.|1503": ["", "เหตุที่จะขอให้ศาลพิพากษาเพิกถอนการสมรส เพราะเหตุว่าเป็นโมฆียะ มีเฉพาะในกรณีที่คู่สมรสทำการฝ่าฝืนมาตรา 1448 มาตรา 1505 มาตรา 1506 มาตรา 1507 และมาตรา 1509"], "ป.พ.พ.|1601": ["", "ทายาทไม่จำต้องรับผิดเกินกว่าทรัพย์มรดกที่ตกทอดได้แก่ตน"], "ป.พ.พ.|997": ["", "เช็คขีดคร่อมเฉพาะให้แก่ธนาคารกว่าธนาคารหนึ่งขึ้นไปเมื่อนำเบิกเอาแก่ธนาคารใด ท่านให้ธนาคารนั้นบอกปัดเสียอย่าใช้เงินให้ เว้นแต่ที่ขีดคร่อมให้แก่ธนาคารในฐานเป็นตัวแทนเรียกเก็บเงิน ธนาคารใดซึ่งเขานำเช็คเบิกขืนใช้เงินไปตามเช็คที่ขีดคร่อมอย่างว่ามานั้นก็ดี ใช้เงินตามเช็คอันเขาขีดคร่อมทั่วไปเป็นประการอื่นนอกจากใช้ให้แก่ธนาคารอันใดอันหนึ่งก็ดี ใช้เงินตามเช็คอันเขาขีดคร่อมเฉพาะเป็นประการอื่นนอกจากใช้ให้แก่ธนาคารซึ่งเขาเจาะจงขีดคร่อมให้โดยเฉพาะ หรือแก่ธนาคารตัวแทนเรียกเก็บเงินของธนาคารนั้นก็ดี ท่านว่าธนาคารซึ่งใช้เงินไปดังกล่าวนี้จะต้องรับผิดต่อผู้เป็นเจ้าของอันแท้จริงแห่งเช็คนั้น ในการที่เขาจะต้องเสียหายอย่างใด ๆ เพราะการที่ตนใช้เงินไปตามเช็คดังนั้น แต่หากเช็คใดเขานำยื่นเพื่อให้ใช้เงิน และเมื่อยื่นไม่ปรากฏว่าเป็นเช็คขีดคร่อมก็ดี หรือไม่ปรากฏว่ามีรอยขีดคร่อมอันได้ลบล้างหรือแก้ไขเปลี่ยนแปลงเพิ่มเติมเป็นประการอื่นนอกจากที่อนุญาตไว้โดยกฎหมายก็ดี เช็คเช่นนี้ถ้าธนาคารใดใช้เงินไปโดยสุจริตและปราศจากประมาทเลินเล่อ ท่านว่าธนาคารนั้นไม่ต้องรับผิดหรือต้องมีหน้าที่รับใช้เงินอย่างใด ๆ"], "ป.พ.พ.|426": ["", "นายจ้างซึ่งได้ใช้ค่าสินไหมทดแทนให้แก่บุคคลภายนอกเพื่อละเมิดอันลูกจ้างได้ทำนั้น ชอบที่จะได้ชดใช้จากลูกจ้างนั้น"], "ป.พ.พ.|862": ["", "ตามข้อความในลักษณะนี้ คำว่า “ผู้รับประกันภัย” ท่านหมายความว่า คู่สัญญาฝ่ายซึ่งตกลงจะใช้ค่าสินไหมทดแทน หรือใช้เงินจำนวนหนึ่งให้ คำว่า “ผู้เอาประกันภัย” ท่านหมายความว่า คู่สัญญาฝ่ายซึ่งตกลงจะส่งเบี้ยประกันภัย คำว่า “ผู้รับประโยชน์” ท่านหมายความว่า บุคคลผู้จะพึงได้รับค่าสินไหมทดแทน หรือรับจำนวนเงินใช้ให้ อนึ่ง ผู้เอาประกันภัยและผู้รับประโยชน์นั้น จะเป็นบุคคลคนหนึ่งคนเดียวกันก็ได้"], "ป.พ.พ.|537": ["", "อันว่าเช่าทรัพย์สินนั้น คือสัญญาซึ่งบุคคลคนหนึ่งเรียกว่า ผู้ให้เช่า ตกลงให้บุคคลอีกคนหนึ่งเรียกว่า ผู้เช่า ได้ใช้หรือได้รับประโยชน์ในทรัพย์สินอย่างใดอย่างหนึ่งชั่วระยะเวลาอันมีจำกัด และผู้เช่าตกลงจะให้ค่าเช่าเพื่อการนั้น"], "ป.พ.พ.|693": ["", "ผู้ค้ำประกันซึ่งได้ชำระหนี้แล้ว ย่อมมีสิทธิที่จะไล่เบี้ยเอาจากลูกหนี้ เพื่อต้นเงินกับดอกเบี้ยและเพื่อการที่ต้องสูญหายหรือเสียหายไปอย่างใด ๆ เพราะการค้ำประกันนั้น อนึ่ง ผู้ค้ำประกันย่อมเข้ารับช่วงสิทธิของเจ้าหนี้บรรดามีเหนือลูกหนี้ด้วย"], "ป.พ.พ.|378": ["", "มัดจำนั้น ถ้ามิได้ตกลงกันไว้เป็นอย่างอื่น ท่านให้เป็นไปดังจะกล่าวต่อไปนี้ คือ (1) ให้ส่งคืน หรือจัดเอาเป็นการใช้เงินบางส่วนในเมื่อชำระหนี้ (2) ให้ริบ ถ้าฝ่ายที่วางมัดจำละเลยไม่ชำระหนี้ หรือการชำระหนี้ตกเป็นพ้นวิสัยเพราะพฤติการณ์อันใดอันหนึ่งซึ่งฝ่ายนั้นต้องรับผิดชอบ หรือถ้ามีการเลิกสัญญาเพราะความผิดของฝ่ายนั้น (3) ให้ส่งคืน ถ้าฝ่ายที่รับมัดจำละเลยไม่ชำระหนี้ หรือการชำระหนี้ตกเป็นพ้นวิสัยเพราะพฤติการณ์อันใดอันหนึ่งซึ่งฝ่ายนี้ต้องรับผิดชอบ"], "ป.พ.พ.|1655": ["", "พินัยกรรมนั้น จะทำได้ก็แต่ตามแบบใดแบบหนึ่งดังที่บัญญัติไว้ในหมวดนี้"], "ป.พ.พ.|1330": ["", "สิทธิของบุคคลผู้ซื้อทรัพย์สินโดยสุจริตในการขายทอดตลาดตามคำสั่งศาล หรือคำสั่งเจ้าพนักงานรักษาทรัพย์ในคดีล้มละลายนั้น ท่านว่ามิเสียไป ถึงแม้ภายหลังจะพิสูจน์ได้ว่าทรัพย์สินนั้นมิใช่ของจำเลย หรือลูกหนี้โดยคำพิพากษา หรือผู้ล้มละลาย"], "ป.พ.พ.|1169": ["", "ถ้ากรรมการทำให้เกิดเสียหายแก่บริษัท บริษัทจะฟ้องร้องเรียกเอาสินไหมทดแทนแก่กรรมการก็ได้ หรือในกรณีที่บริษัทไม่ยอมฟ้องร้อง ผู้ถือหุ้นคนหนึ่งคนใดจะเอาคดีนั้นขึ้นว่าก็ได้ อนึ่ง การเรียกร้องเช่นนี้ เจ้าหนี้ของบริษัทจะเป็นผู้เรียกบังคับก็ได้ เท่าที่เจ้าหนี้ยังคงสิทธิเรียกร้องแก่บริษัทอยู่"], "ป.พ.พ.|329": ["", "ถ้านอกจากการชำระหนี้อันเป็นประธาน ลูกหนี้ยังจะต้องชำระดอกเบี้ยและเสียค่าฤชาธรรมเนียมอีกด้วยไซร้ หากการชำระหนี้ในครั้งหนึ่ง ๆ ไม่ได้ราคาเพียงพอจะเปลื้องหนี้สินได้ทั้งหมด ท่านให้เอาจัดใช้เป็นค่าฤชาธรรมเนียมเสียก่อนแล้วจึงใช้ดอกเบี้ย และในที่สุดจึงให้ใช้ในการชำระหนี้อันเป็นประธาน ถ้าลูกหนี้ระบุให้จัดใช้เป็นประการอื่น ท่านว่าเจ้าหนี้จะบอกปัดไม่ยอมรับชำระหนี้ก็ได้"], "ป.พ.พ.|1612": ["", "การสละมรดกนั้น ต้องแสดงเจตนาชัดแจ้งเป็นหนังสือมอบไว้แก่พนักงานเจ้าหน้าที่ หรือทำเป็นสัญญาประนีประนอมยอมความ"], "ป.พ.พ.|194": ["", "ด้วยอำนาจแห่งมูลหนี้ เจ้าหนี้ย่อมมีสิทธิจะเรียกให้ลูกหนี้ชำระหนี้ได้ อนึ่ง การชำระหนี้ด้วยงดเว้นการอันใดอันหนึ่งก็ย่อมมีได้"], "ป.พ.พ.|1646": ["", "บุคคลใดจะแสดงเจตนาโดยพินัยกรรม กำหนดการเผื่อตายในเรื่องทรัพย์สินของตนเอง หรือในการต่าง ๆ อันจะให้เกิดเป็นผลบังคับได้ตามกฎหมายเมื่อตนตายก็ได้"], "ป.พ.พ.|533": ["", "เมื่อผู้ให้ได้ให้อภัยแก่ผู้รับในเหตุประพฤติเนรคุณนั้นแล้วก็ดี หรือเมื่อเวลาได้ล่วงไปแล้วหกเดือนนับแต่เหตุเช่นนั้นได้ทราบถึงบุคคลผู้ชอบที่จะเรียกถอนคืนการให้ได้นั้นก็ดี ท่านว่าหาอาจจะถอนคืนการให้ได้ไม่ อนึ่ง ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นเวลาสิบปีภายหลังเหตุการณ์เช่นว่านั้น"], "ป.พ.พ.|215": ["", "เมื่อลูกหนี้ไม่ชำระหนี้ให้ต้องตามความประสงค์อันแท้จริงแห่งมูลหนี้ไซร้ เจ้าหนี้จะเรียกเอาค่าสินไหมทดแทนเพื่อความเสียหายอันเกิดแต่การนั้นก็ได้"], "ป.พ.พ.|655": ["", "ท่านห้ามมิให้คิดดอกเบี้ยในดอกเบี้ยที่ค้างชำระ แต่ทว่าเมื่อดอกเบี้ยค้างชำระไม่น้อยกว่าปีหนึ่ง คู่สัญญากู้ยืมจะตกลงกันให้เอาดอกเบี้ยนั้นทบเข้ากับต้นเงินแล้วให้คิดดอกเบี้ยในจำนวนเงินที่ทบเข้ากันนั้นก็ได้ แต่การตกลงเช่นนั้นต้องทำเป็นหนังสือ ส่วนประเพณีการค้าขายที่คำนวณดอกทบต้นในบัญชีเดินสะพัดก็ดี ในการค้าขายอย่างอื่นทำนองเช่นว่านี้ก็ดี หาอยู่ในบังคับแห่งบทบัญญัติซึ่งกล่าวมาในวรรคก่อนนั้นไม่"], "ป.พ.พ.|1310": ["", "บุคคลใดสร้างโรงเรือนในที่ดินของผู้อื่นโดยสุจริตไซร้ ท่านว่าเจ้าของที่ดินเป็นเจ้าของโรงเรือนนั้น ๆ แต่ต้องใช้ค่าแห่งที่ดินเพียงที่เพิ่มขึ้นเพราะสร้างโรงเรือนนั้นให้แก่ผู้สร้าง แต่ถ้าเจ้าของที่ดินสามารถแสดงได้ว่า มิได้มีความประมาทเลินเล่อ จะบอกปัดไม่ยอมรับโรงเรือนนั้นและเรียกให้ผู้สร้างรื้อถอนไป และทำที่ดินให้เป็นตามเดิมก็ได้ เว้นไว้แต่ถ้าการนี้จะทำไม่ได้โดยใช้เงินพอสมควรไซร้ ท่านว่าเจ้าของที่ดินจะเรียกให้ผู้สร้างซื้อที่ดินทั้งหมดหรือแต่บางส่วนตามราคาตลาดก็ได้"], "ป.พ.พ.|802": ["", "ในเหตุฉุกเฉิน เพื่อจะป้องกันมิให้ตัวการต้องเสียหาย ท่านให้สันนิษฐานไว้ก่อนว่าตัวแทนจะทำการใด ๆ เช่นอย่างวิญญูชนจะพึงกระทำ ก็ย่อมมีอำนาจจะทำได้ทั้งสิ้น"], "ป.พ.พ.|1750": ["", "การแบ่งปันทรัพย์มรดกนั้น อาจทำได้โดยทายาทต่างเข้าครอบครองทรัพย์สินเป็นส่วนสัด หรือโดยการขายทรัพย์มรดกแล้วเอาเงินที่ขายได้มาแบ่งปันกันระหว่างทายาท ถ้าการแบ่งปันมิได้เป็นไปตามวรรคก่อน แต่ได้ทำโดยสัญญา จะฟ้องร้องให้บังคับคดีหาได้ไม่ เว้นแต่จะมีหลักฐานเป็นหนังสืออย่างหนึ่งอย่างใด ลงลายมือชื่อฝ่ายที่รับผิดหรือตัวแทนของฝ่ายนั้นเป็นสำคัญ ในกรณีเช่นนี้ให้นำมาตรา 850 มาตรา 852 แห่งประมวลกฎหมายนี้ว่าด้วยประนีประนอมยอมความมาใช้บังคับโดยอนุโลม"], "ป.พ.พ.|1052": ["", "บุคคลผู้เข้าเป็นหุ้นส่วนในห้างหุ้นส่วนย่อมต้องรับผิดในหนี้ใด ๆ ซึ่งห้างหุ้นส่วนได้ก่อให้เกิดขึ้นก่อนที่ตนเข้ามาเป็นหุ้นส่วนด้วย"], "ป.พ.พ.|917": ["", "อันตั๋วแลกเงินทุกฉบับ ถึงแม้ว่าจะมิใช่สั่งจ่ายให้แก่บุคคลเพื่อเขาสั่งก็ตาม ท่านว่าย่อมโอนให้กันได้ด้วยสลักหลังและส่งมอบ เมื่อผู้สั่งจ่ายเขียนลงในด้านหน้าแห่งตั๋วแลกเงินว่า “เปลี่ยนมือไม่ได้” ดังนี้ก็ดี หรือเขียนคำอื่นอันได้ความเป็นทำนองเช่นเดียวกันนั้นก็ดี ท่านว่าตั๋วเงินนั้นย่อมจะโอนให้กันได้แต่โดยรูปการและด้วยผลอย่างการโอนสามัญ อนึ่ง ตั๋วเงินจะสลักหลังให้แก่ผู้จ่ายก็ได้ ไม่ว่าผู้จ่ายจะได้รับรองตั๋วนั้นหรือไม่ หรือจะสลักหลังให้แก่ผู้สั่งจ่าย หรือให้แก่คู่สัญญาฝ่ายอื่นใดแห่งตั๋วเงินนั้นก็ได้ ส่วนบุคคลทั้งหลายเหล่านี้ก็ย่อมจะสลักหลังตั๋วเงินนั้นต่อไปอีกได้"], "ป.พ.พ.|1609": ["", "การแสดงเจตนาตัดมิให้รับมรดกนั้นจะถอนเสียก็ได้ ถ้าการตัดมิให้รับมรดกนั้นได้ทำโดยพินัยกรรม จะถอนเสียได้ก็แต่โดยพินัยกรรมเท่านั้น แต่ถ้าการตัดมิให้รับมรดกได้ทำเป็นหนังสือมอบไว้แก่พนักงานเจ้าหน้าที่ การถอนจะทำตามแบบใดแบบหนึ่งดังบัญญัติไว้ในมาตรา 1608 (1) หรือ (2) ก็ได้"], "ป.พ.พ.|892": ["", "ในกรณีบอกล้างสัญญาตามความในมาตรา 865 ผู้รับประกันภัยต้องคืนค่าไถ่ถอนกรมธรรม์ประกันภัยให้แก่ผู้เอาประกันภัยหรือทายาทของผู้นั้น"], "ป.พ.พ.|747": ["", "อันว่าจำนำนั้น คือสัญญาซึ่งบุคคลหนึ่ง เรียกว่าผู้จำนำ ส่งมอบสังหาริมทรัพย์สิ่งหนึ่งให้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับจำนำ เพื่อเป็นประกันการชำระหนี้"], "ป.พ.พ.|714": ["", "อันสัญญาจำนองนั้น ท่านว่าต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่"], "ป.พ.พ.|1455": ["", "การให้ความยินยอมให้ทำการสมรสจะกระทำได้แต่โดย (1) ลงลายมือชื่อในทะเบียนขณะจดทะเบียนสมรส (2) ทำเป็นหนังสือแสดงความยินยอม โดยระบุชื่อผู้จะสมรสทั้งสองฝ่ายและลงลายมือชื่อของผู้ให้ความยินยอม (3) ถ้ามีเหตุจำเป็น จะให้ความยินยอมด้วยวาจาต่อหน้าพยานอย่างน้อยสองคนก็ได้ ความยินยอมนั้น เมื่อให้แล้วถอนไม่ได้"], "ป.พ.พ.|445": ["", "ในกรณีทำให้เขาถึงตาย หรือให้เสียหายแก่ร่างกายหรืออนามัยก็ดี ในกรณีทำให้เขาเสียเสรีภาพก็ดี ถ้าผู้ต้องเสียหายมีความผูกพันตามกฎหมายจะต้องทำการงานให้เป็นคุณแก่บุคคลภายนอกในครัวเรือน หรืออุตสาหกรรมของบุคคลภายนอกนั้นไซร้ ท่านว่าบุคคลผู้จำต้องใช้ค่าสินไหมทดแทนนั้นจะต้องใช้ค่าสินไหมทดแทนให้แก่บุคคลภายนอกเพื่อที่เขาต้องขาดแรงงานอันนั้นไปด้วย"], "ป.พ.พ.|1398": ["", "ถ้าภารยทรัพย์และสามยทรัพย์ตกเป็นของเจ้าของคนเดียวกัน ท่านว่าเจ้าของจะให้เพิกถอนการจดทะเบียนภาระจำยอมก็ได้ แต่ถ้ายังมิได้เพิกถอนทะเบียนไซร้ ภาระจำยอมยังคงมีอยู่ในส่วนบุคคลภายนอก"], "ป.พ.พ.|491": ["", "อันว่าขายฝากนั้น คือสัญญาซื้อขายซึ่งกรรมสิทธิ์ในทรัพย์สินตกไปยังผู้ซื้อ โดยมีข้อตกลงกันว่าผู้ขายอาจไถ่ทรัพย์นั้นคืนได้"], "ป.พ.พ.|559": ["", "ถ้าไม่มีกำหนดโดยสัญญาหรือโดยจารีตประเพณีว่าจะพึงชำระค่าเช่า ณ เวลาใด ท่านให้ชำระเมื่อสิ้นระยะเวลาอันได้ตกลงกำหนดกันไว้ทุกคราวไป กล่าวคือว่าถ้าเช่ากันเป็นรายปีก็พึงชำระค่าเช่าเมื่อสิ้นปี ถ้าเช่ากันเป็นรายเดือนก็พึงชำระค่าเช่าเมื่อสิ้นเดือน"], "ป.พ.พ.|1050": ["", "การใด ๆ อันผู้เป็นหุ้นส่วนคนใดคนหนึ่งได้จัดทำไปในทางที่เป็นธรรมดาการค้าขายของห้างหุ้นส่วนนั้น ท่านว่าผู้เป็นหุ้นส่วนหมดทุกคนย่อมมีความผูกพันในการนั้น ๆ ด้วย และจะต้องรับผิดร่วมกันโดยไม่จำกัดจำนวนในการชำระหนี้ อันได้ก่อให้เกิดขึ้นเพราะจัดการไปเช่นนั้น"], "ป.พ.พ.|1336": ["", "ภายในบังคับแห่งกฎหมาย เจ้าของทรัพย์สินมีสิทธิใช้สอยและจำหน่ายทรัพย์สินของตนและได้ซึ่งดอกผลแห่งทรัพย์สินนั้น กับทั้งมีสิทธิติดตามและเอาคืนซึ่งทรัพย์สินของตนจากบุคคลผู้ไม่มีสิทธิจะยึดถือไว้ และมีสิทธิขัดขวางมิให้ผู้อื่นสอดเข้าเกี่ยวข้องกับทรัพย์สินนั้นโดยมิชอบด้วยกฎหมาย"], "ป.พ.พ.|709": ["", "บุคคลหนึ่งจะจำนองทรัพย์สินของตนไว้เพื่อประกันหนี้อันบุคคลอื่นจะต้องชำระ ก็ให้ทำได้"], "ป.พ.พ.|1566": ["", "บุตรซึ่งยังไม่บรรลุนิติภาวะต้องอยู่ใต้อำนาจปกครองของบิดามารดา อำนาจปกครองอยู่กับบิดาหรือมารดาในกรณีดังต่อไปนี้ (1) มารดาหรือบิดาตาย (2) ไม่แน่นอนว่ามารดาหรือบิดามีชีวิตอยู่หรือตาย (3) มารดาหรือบิดาถูกศาลสั่งให้เป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถ (4) มารดาหรือบิดาต้องเข้ารักษาตัวในโรงพยาบาลเพราะจิตฟั่นเฟือน (5) ศาลสั่งให้อำนาจปกครองอยู่กับบิดาหรือมารดา (6) บิดาและมารดาตกลงกันตามที่มีกฎหมายบัญญัติไว้ให้ตกลงกันได้"], "ป.พ.พ.|369": ["", "ในสัญญาต่างตอบแทนนั้น คู่สัญญาฝ่ายหนึ่งจะไม่ยอมชำระหนี้จนกว่าอีกฝ่ายหนึ่งจะชำระหนี้หรือขอปฏิบัติการชำระหนี้ก็ได้ แต่ความข้อนี้ท่านมิให้ใช้บังคับ ถ้าหนี้ของคู่สัญญาอีกฝ่ายหนึ่งยังไม่ถึงกำหนด"], "ป.พ.พ.|72": ["", "การเปลี่ยนตัวผู้แทนของนิติบุคคล หรือการจำกัดหรือแก้ไข เปลี่ยนแปลงอำนาจของผู้แทนของนิติบุคคล ให้มีผลต่อเมื่อได้ปฏิบัติตามกฎหมาย ข้อบังคับหรือตราสารจัดตั้งแล้ว แต่จะยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริตมิได้"], "ป.พ.พ.|1474": ["", "สินสมรสได้แก่ทรัพย์สิน (1) ที่คู่สมรสได้มาระหว่างสมรส (2) ที่ฝ่ายใดฝ่ายหนึ่งได้มาระหว่างสมรสโดยพินัยกรรมหรือโดยการให้เป็นหนังสือเมื่อพินัยกรรมหรือหนังสือยกให้ระบุว่าเป็นสินสมรส (3) ที่เป็นดอกผลของสินส่วนตัว ถ้ากรณีเป็นที่สงสัยว่าทรัพย์สินอย่างหนึ่งเป็นสินสมรสหรือมิใช่ ให้สันนิษฐานไว้ก่อนว่าเป็นสินสมรส"], "ป.พ.พ.|1630": ["", "ตราบใดที่มีทายาทซึ่งยังมีชีวิตอยู่ หรือมีผู้รับมรดกแทนที่ยังไม่ขาดสาย แล้วแต่กรณี ในลำดับหนึ่ง ๆ ที่ระบุไว้ในมาตรา 1629 ทายาทผู้ที่อยู่ในลำดับถัดลงไปไม่มีสิทธิในทรัพย์มรดกของผู้ตายเลย แต่ความในวรรคก่อนนี้มิให้ใช้บังคับในกรณีเฉพาะที่มีผู้สืบสันดานคนใดยังมีชีวิตอยู่หรือมีผู้รับมรดกแทนที่กัน แล้วแต่กรณี และมีบิดามารดายังมีชีวิตอยู่ ในกรณีเช่นนั้นให้บิดามารดาได้ส่วนแบ่งเสมือนหนึ่งว่าเป็นทายาทชั้นบุตร"], "ป.พ.พ.|910": ["", "ตราสารอันมีรายการขาดตกบกพร่องไปจากที่ท่านระบุบังคับไว้ในมาตราก่อนนี้ ย่อมไม่สมบูรณ์เป็นตั๋วแลกเงิน เว้นแต่ในกรณีดังจะกล่าวต่อไปนี้ คือ ตั๋วแลกเงินซึ่งไม่ระบุเวลาใช้เงิน ท่านให้ถือว่าพึงใช้เงินเมื่อได้เห็น ถ้าสถานที่ใช้เงินมิได้แถลงไว้ในตั๋วแลกเงิน ท่านให้ถือเอาภูมิลำเนาของผู้จ่ายเป็นสถานที่ใช้เงิน ถ้าตั๋วแลกเงินไม่แสดงให้ปรากฏสถานที่ออกตั๋ว ท่านให้ถือว่าตั๋วเงินนั้นได้ออก ณ ภูมิลำเนาของผู้สั่งจ่าย ถ้ามิได้ลงวันออกตั๋ว ท่านว่าผู้ทรงโดยชอบด้วยกฎหมายคนหนึ่งคนใดทำการโดยสุจริตจะจดวันตามที่ถูกต้องแท้จริงลงก็ได้"], "ป.พ.พ.|1603": ["", "กองมรดกย่อมตกทอดแก่ทายาทโดยสิทธิตามกฎหมายหรือโดยพินัยกรรม ทายาทที่มีสิทธิตามกฎหมาย เรียกว่า “ทายาทโดยธรรม” ทายาทที่มีสิทธิตามพินัยกรรม เรียกว่า “ผู้รับพินัยกรรม”"], "ป.พ.พ.|1006": ["", "การที่ลายมือชื่ออันหนึ่งในตั๋วเงินเป็นลายมือปลอม ย่อมไม่กระทบกระทั่งถึงความสมบูรณ์แห่งลายมือชื่ออื่น ๆ ในตั๋วเงินนั้น"], "ป.พ.พ.|1466": ["", "สัญญาก่อนสมรสเป็นโมฆะ ถ้ามิได้จดแจ้งข้อตกลงกันเป็นสัญญาก่อนสมรสนั้นไว้ในทะเบียนสมรสพร้อมกับการจดทะเบียนสมรส หรือมิได้ทำเป็นหนังสือลงลายมือชื่อคู่สมรสและพยานอย่างน้อยสองคนแนบไว้ท้ายทะเบียนสมรส และได้จดไว้ในทะเบียนสมรสพร้อมกับการจดทะเบียนสมรสว่าได้มีสัญญานั้นแนบไว้"], "ป.พ.พ.|1727": ["", "ผู้มีส่วนได้เสียคนหนึ่งคนใดจะร้องขอให้ศาลสั่งถอนผู้จัดการมรดก เพราะเหตุผู้จัดการมรดกละเลยไม่ทำการตามหน้าที่ หรือเพราะเหตุอย่างอื่นที่สมควรก็ได้ แต่ต้องร้องขอเสียก่อนที่การปันมรดกเสร็จสิ้นลง แม้ถึงว่าจะได้เข้ารับตำแหน่งแล้วก็ดี ผู้จัดการมรดกจะลาออกจากตำแหน่งโดยมีเหตุอันสมควรก็ได้ แต่ต้องได้รับอนุญาตจากศาล"], "ป.พ.พ.|733": ["", "ถ้าเอาทรัพย์จำนองหลุดและราคาทรัพย์สินนั้นมีประมาณต่ำกว่าจำนวนเงินที่ค้างชำระกันอยู่ก็ดี หรือถ้าเอาทรัพย์สินซึ่งจำนองออกขายทอดตลาดใช้หนี้ได้เงินจำนวนสุทธิน้อยกว่าจำนวนเงินที่ค้างชำระกันอยู่นั้นก็ดี เงินยังขาดจำนวนอยู่เท่าใดลูกหนี้ไม่ต้องรับผิดในเงินนั้น"], "ป.พ.พ.|696": ["", "ผู้ค้ำประกันไม่มีสิทธิจะไล่เบี้ยเอาแก่ลูกหนี้ได้ ถ้าว่าตนได้ชำระหนี้แทนไปโดยมิได้บอกลูกหนี้ และลูกหนี้ยังมิรู้ความมาชำระหนี้ซ้ำอีก ในกรณีเช่นว่านี้ ผู้ค้ำประกันก็ได้แต่เพียงจะฟ้องเจ้าหนี้เพื่อคืนลาภมิควรได้เท่านั้น"], "ป.พ.พ.|1625": ["", "ถ้าผู้ตายเป็นผู้สมรสแล้ว การคิดส่วนแบ่งและการปันทรัพย์สินระหว่างผู้ตายกับคู่สมรสที่ยังมีชีวิตอยู่นั้นให้เป็นไปดังนี้ (1) ในเรื่องส่วนแบ่งในทรัพย์สินระหว่างคู่สมรสให้อยู่ในบังคับของบทบัญญัติแห่งประมวลกฎหมายนี้ว่าด้วยการหย่าโดยยินยอมทั้งสองฝ่าย อันมีบทบัญญัติเพิ่มเติมให้บริบูรณ์ในมาตรา 1637 และมาตรา 1638 และโดยเฉพาะต้องอยู่ในบังคับแห่งมาตรา 1513 ถึงมาตรา 1517 แห่งประมวลกฎหมายนี้ แต่การคิดส่วนแบ่งนั้นมีผลตั้งแต่วันที่การสมรสได้สิ้นไปด้วยเหตุความตายนั้น (2) ในเรื่องส่วนแบ่งในทรัพย์มรดกของผู้ตาย ให้อยู่ในบังคับของบทบัญญัติแห่งบรรพนี้ นอกจากมาตรา 1637 และมาตรา 1638"], "ป.พ.พ.|641": ["", "การให้ยืมใช้คงรูปนั้น ท่านว่าย่อมบริบูรณ์ต่อเมื่อส่งมอบทรัพย์สินซึ่งให้ยืม"], "ป.พ.พ.|546": ["", "ผู้ให้เช่าจำต้องส่งมอบทรัพย์สินซึ่งให้เช่านั้นในสภาพอันซ่อมแซมดีแล้ว"], "ป.พ.พ.|727": ["", "ให้นำบทบัญญัติมาตรา 691 มาตรา 697 มาตรา 700 และมาตรา 701 มาใช้บังคับกับกรณีที่บุคคลจำนองทรัพย์สินเพื่อประกันหนี้อันบุคคลอื่นจะต้องชำระด้วยโดยอนุโลม"], "ป.พ.พ.|451": ["", "บุคคลใช้กำลังเพื่อป้องกันสิทธิของตน ถ้าตามพฤติการณ์จะขอให้ศาลหรือเจ้าหน้าที่ช่วยเหลือให้ทันท่วงทีไม่ได้ และถ้ามิได้ทำในทันใด ภัยมีอยู่ด้วยการที่ตนจะได้สมดังสิทธินั้นจะต้องประวิงไปมากหรือถึงแก่สาบสูญได้ไซร้ ท่านว่าบุคคลนั้นหาต้องรับผิดใช้ค่าสินไหมทดแทนไม่ การใช้กำลังดังกล่าวมาในวรรคก่อนนั้น ท่านว่าต้องจำกัดครัดเคร่งแต่เฉพาะที่จำเป็นเพื่อจะบำบัดปัดป้องภยันตรายเท่านั้น ถ้าบุคคลผู้ใดกระทำการดังกล่าวมาในวรรคต้น เพราะหลงสันนิษฐานพลาดไปว่ามีเหตุอันจำเป็นที่จะทำได้โดยชอบด้วยกฎหมายไซร้ ท่านว่าผู้นั้นจะต้องรับผิดใช้ค่าสินไหมทดแทนให้แก่บุคคลอื่น แม้ทั้งการที่หลงพลาดไปนั้นจะมิใช่เป็นเพราะความประมาทเลินเล่อของตน"], "ป.พ.พ.|697": ["", "ถ้าเพราะการกระทำอย่างใดอย่างหนึ่งของเจ้าหนี้เอง เป็นเหตุให้ผู้ค้ำประกันไม่อาจเข้ารับช่วงได้ทั้งหมดหรือแต่บางส่วนในสิทธิก็ดี จำนองก็ดี จำนำก็ดี และบุริมสิทธิอันได้ให้ไว้แก่เจ้าหนี้แต่ก่อนหรือในขณะทำสัญญาค้ำประกันเพื่อชำระหนี้นั้น ท่านว่าผู้ค้ำประกันย่อมหลุดพ้นจากความรับผิดเพียงเท่าที่ตนต้องเสียหายเพราะการนั้น"], "ป.พ.พ.|1656": ["", "พินัยกรรมนั้น จะทำตามแบบดังนี้ก็ได้ กล่าวคือต้องทำเป็นหนังสือลงวัน เดือน ปี ในขณะที่ทำขึ้น และผู้ทำพินัยกรรมต้องลงลายมือชื่อไว้ต่อหน้าพยานอย่างน้อยสองคนพร้อมกัน ซึ่งพยานสองคนนั้นต้องลงลายมือชื่อรับรองลายมือชื่อของผู้ทำพินัยกรรมไว้ในขณะนั้น การขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่จะได้ปฏิบัติตามแบบอย่างเดียวกับการทำพินัยกรรมตามมาตรานี้"], "ป.พ.พ.|21": ["", "ผู้เยาว์จะทำนิติกรรมใด ๆ ต้องได้รับความยินยอมของผู้แทนโดยชอบธรรมก่อนการใด ๆ ที่ผู้เยาว์ได้ทำลงปราศจากความยินยอมเช่นว่านั้นเป็นโมฆียะ เว้นแต่จะบัญญัติไว้เป็นอย่างอื่น"], "ป.พ.พ.|674": ["", "เจ้าสำนักโรงแรมหรือโฮเต็ล หรือสถานที่อื่นทำนองเช่นว่านั้น จะต้องรับผิดเพื่อความสูญหายหรือบุบสลายอย่างใด ๆ อันเกิดแก่ทรัพย์สินซึ่งคนเดินทางหรือแขกอาศัย หากได้พามา"], "ป.พ.พ.|465": ["", "ในการซื้อขายสังหาริมทรัพย์นั้น (1) หากว่าผู้ขายส่งมอบทรัพย์สินน้อยกว่าที่ได้สัญญาไว้ ท่านว่าผู้ซื้อจะปัดเสียไม่รับเอาเลยก็ได้ แต่ถ้าผู้ซื้อรับเอาทรัพย์สินนั้นไว้ ผู้ซื้อก็ต้องใช้ราคาตามส่วน (2) หากว่าผู้ขายส่งมอบทรัพย์สินมากกว่าที่ได้สัญญาไว้ ท่านว่าผู้ซื้อจะรับเอาทรัพย์สินนั้นไว้แต่เพียงตามสัญญาและนอกกว่านั้นปัดเสียก็ได้ หรือจะปัดเสียทั้งหมดไม่รับเอาไว้เลยก็ได้ ถ้าผู้ซื้อรับเอาทรัพย์สินอันเขาส่งมอบเช่นนั้นไว้ทั้งหมด ผู้ซื้อก็ต้องใช้ราคาตามส่วน (3) หากว่าผู้ขายส่งมอบทรัพย์สินตามที่ได้สัญญาไว้ ระคนกับทรัพย์สินอย่างอื่นอันมิได้รวมอยู่ในข้อสัญญาไซร้ ท่านว่าผู้ซื้อจะรับเอาทรัพย์สินไว้แต่ตามสัญญา และนอกกว่านั้นปัดเสียก็ได้ หรือจะปัดเสียทั้งหมดก็ได้"], "ป.พ.พ.|1567": ["", "ผู้ใช้อำนาจปกครองมีสิทธิ (1) กำหนดที่อยู่ของบุตร (2) ทำโทษบุตรเพื่อว่ากล่าวสั่งสอนหรือปรับพฤติกรรม โดยต้องไม่เป็นการกระทำทารุณกรรมหรือทำร้ายด้วยความรุนแรงต่อร่างกายหรือจิตใจ หรือกระทำโดยมิชอบ (3) ให้บุตรทำการงานตามสมควรแก่ความสามารถและฐานานุรูป (4) เรียกบุตรคืนจากบุคคลอื่นซึ่งกักบุตรไว้โดยมิชอบด้วยกฎหมาย"], "ป.พ.พ.|548": ["", "ถ้าผู้ให้เช่าส่งมอบทรัพย์สินซึ่งเช่านั้นโดยสภาพไม่เหมาะแก่การที่จะใช้เพื่อประโยชน์ที่เช่ามา ผู้เช่าจะบอกเลิกสัญญาเสียก็ได้"], "ป.พ.พ.|812": ["", "ถ้ามีความเสียหายเกิดขึ้นอย่างใด ๆ เพราะความประมาทเลินเล่อของตัวแทนก็ดี เพราะไม่ทำการเป็นตัวแทนก็ดี หรือเพราะทำการโดยปราศจากอำนาจหรือนอกเหนืออำนาจก็ดี ท่านว่าตัวแทนจะต้องรับผิด"], "ป.พ.พ.|382": ["", "ถ้าสัญญาว่าจะทำการชำระหนี้อย่างอื่นให้เป็นเบี้ยปรับ ไม่ใช่ใช้เป็นจำนวนเงินไซร้ ท่านให้นำบทบัญญัติแห่งมาตรา 379 ถึงมาตรา 381 มาใช้บังคับ แต่ถ้าเจ้าหนี้เรียกเอาเบี้ยปรับแล้ว สิทธิเรียกร้องค่าสินไหมทดแทนก็เป็นอันขาดไป"], "ป.พ.พ.|1300": ["", "ถ้าได้จดทะเบียนการโอนอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์เป็นทางเสียเปรียบแก่บุคคลผู้อยู่ในฐานะอันจะให้จดทะเบียนสิทธิของตนได้อยู่ก่อนไซร้ ท่านว่าบุคคลนั้นอาจเรียกให้เพิกถอนการจดทะเบียนนั้นได้ แต่การโอนอันมีค่าตอบแทน ซึ่งผู้รับโอนกระทำการโดยสุจริตนั้น ไม่ว่ากรณีจะเป็นประการใดท่านว่าจะเรียกให้เพิกถอนทะเบียนไม่ได้"], "ป.พ.พ.|1611": ["", "ทายาทซึ่งเป็นผู้เยาว์ บุคคลวิกลจริตหรือบุคคลผู้ไม่สามารถจะจัดทำการงานของตนเองได้ตามความหมายแห่งมาตรา 32 แห่งประมวลกฎหมายนี้ จะทำการดังต่อไปนี้ไม่ได้ เว้นแต่จะได้รับความยินยอมของบิดามารดา ผู้ปกครอง ผู้อนุบาล หรือผู้พิทักษ์ แล้วแต่กรณี และได้รับอนุมัติจากศาลแล้วคือ (1) สละมรดก (2) รับมรดกอันมีค่าภาระติดพันหรือเงื่อนไข"], "ป.พ.พ.|305": ["", "เมื่อโอนสิทธิเรียกร้องไป สิทธิจำนอง จำนำ หรือหลักประกันทางธุรกิจที่มีอยู่เกี่ยวพันกับสิทธิเรียกร้องนั้นก็ดี สิทธิอันเกิดขึ้นแต่การค้ำประกันที่ให้ไว้เพื่อสิทธิเรียกร้องนั้นก็ดี ย่อมตกไปได้แก่ผู้รับโอนด้วย อนึ่ง ผู้รับโอนจะใช้บุริมสิทธิใด ๆ ที่ตนมีอยู่เกี่ยวด้วยสิทธิเรียกร้องในกรณีบังคับยึดทรัพย์หรือล้มละลายนั้นก็ได้"], "ป.พ.พ.|1673": ["", "สิทธิและหน้าที่ใด ๆ อันเกิดขึ้นตามพินัยกรรม ให้มีผลบังคับเรียกร้องกันได้ตั้งแต่ผู้ทำพินัยกรรมตายเป็นต้นไป เว้นแต่ผู้ทำพินัยกรรมจะได้กำหนดเงื่อนไขหรือเงื่อนเวลาให้มีผลบังคับเรียกร้องกันได้ภายหลัง"], "ป.พ.พ.|1604": ["", "บุคคลธรรมดาจะเป็นทายาทได้ก็ต่อเมื่อมีสภาพบุคคลหรือสามารถมีสิทธิได้ตามมาตรา 15 แห่งประมวลกฎหมายนี้ ในเวลาที่เจ้ามรดกถึงแก่ความตาย เพื่อประโยชน์แห่งมาตรานี้ ให้ถือว่าเด็กที่เกิดมารอดอยู่ภายในสามร้อยสิบวันนับแต่เวลาที่เจ้ามรดกถึงแก่ความตายนั้น เป็นทารกในครรภ์มารดาอยู่ในเวลาที่เจ้ามรดกถึงแก่ความตาย"], "ป.พ.พ.|1385": ["", "ถ้าโอนการครอบครองแก่กัน ผู้รับโอนจะนับเวลาซึ่งผู้โอนครอบครองอยู่ก่อนนั้นรวมเข้ากับเวลาครอบครองของตนก็ได้ ถ้าผู้รับโอนนับรวมเช่นนั้น และถ้ามีข้อบกพร่องในระหว่างครอบครองของผู้โอนไซร้ ท่านว่าข้อบกพร่องนั้นอาจยกขึ้นเป็นข้อต่อสู้ผู้รับโอนได้"], "ป.พ.พ.|799": ["", "ตัวการคนใดใช้บุคคลผู้ไร้ความสามารถเป็นตัวแทน ท่านว่าตัวการคนนั้นย่อมต้องผูกพันในกิจการที่ตัวแทนกระทำ"], "ป.พ.พ.|904": ["", "อันผู้ทรงนั้น หมายความว่า บุคคลผู้มีตั๋วเงินไว้ในครอบครอง โดยฐานเป็นผู้รับเงิน หรือเป็นผู้รับสลักหลัง ถ้าและเป็นตั๋วเงินสั่งจ่ายให้แก่ผู้ถือ ๆ ก็นับว่าเป็นผู้ทรงเหมือนกัน"], "ป.พ.พ.|452": ["", "ผู้ครองอสังหาริมทรัพย์ชอบที่จะจับสัตว์ของผู้อื่นอันเข้ามาทำความเสียหายในอสังหาริมทรัพย์นั้น และยึดไว้เป็นประกันค่าสินไหมทดแทนอันจะพึงต้องใช้แก่ตนได้ และถ้าเป็นการจำเป็นโดยพฤติการณ์ แม้จะฆ่าสัตว์นั้นเสียก็ชอบที่จะทำได้ แต่ว่าผู้นั้นต้องบอกกล่าวแก่เจ้าของสัตว์โดยไม่ชักช้า ถ้าและหาตัวเจ้าของสัตว์ไม่พบ ผู้ที่จับสัตว์ไว้ต้องจัดการตามสมควรเพื่อสืบหาตัวเจ้าของ"], "ป.พ.พ.|570": ["", "ในเมื่อสิ้นกำหนดเวลาเช่าซึ่งได้ตกลงกันไว้นั้น ถ้าผู้เช่ายังคงครองทรัพย์สินอยู่ และผู้ให้เช่ารู้ความนั้นแล้วไม่ทักท้วงไซร้ ท่านให้ถือว่าคู่สัญญาเป็นอันได้ทำสัญญาใหม่ต่อไปไม่มีกำหนดเวลา"], "ป.พ.พ.|241": ["", "ผู้ใดเป็นผู้ครองทรัพย์สินของผู้อื่น และมีหนี้อันเป็นคุณประโยชน์แก่ตนเกี่ยวด้วยทรัพย์สินซึ่งครองนั้นไซร้ ท่านว่าผู้นั้นจะยึดหน่วงทรัพย์สินนั้นไว้จนกว่าจะได้ชำระหนี้ก็ได้ แต่ความที่กล่าวนี้ท่านมิให้ใช้บังคับ เมื่อหนี้นั้นยังไม่ถึงกำหนด อนึ่ง บทบัญญัติในวรรคก่อนนี้ ท่านมิให้ใช้บังคับ ถ้าการที่เข้าครอบครองนั้นเริ่มมาแต่ทำการอันใดอันหนึ่งซึ่งไม่ชอบด้วยกฎหมาย"], "ป.พ.พ.|1627": ["", "บุตรนอกกฎหมายที่บิดาได้รับรองแล้วและบุตรบุญธรรมนั้น ให้ถือว่าเป็นผู้สืบสันดาน เหมือนกับบุตรที่ชอบด้วยกฎหมาย ตามความหมายแห่งประมวลกฎหมายนี้"], "ป.พ.พ.|291": ["", "ถ้าบุคคลหลายคนจะต้องทำการชำระหนี้โดยทำนองซึ่งแต่ละคนจำต้องชำระหนี้สิ้นเชิงไซร้ แม้ถึงว่าเจ้าหนี้ชอบที่จะได้รับชำระหนี้สิ้นเชิงได้แต่เพียงครั้งเดียว (กล่าวคือลูกหนี้ร่วมกัน) ก็ดี เจ้าหนี้จะเรียกชำระหนี้จากลูกหนี้แต่คนใดคนหนึ่งสิ้นเชิงหรือแต่โดยส่วนก็ได้ตามแต่จะเลือก แต่ลูกหนี้ทั้งปวงก็ยังคงต้องผูกพันอยู่ทั่วทุกคนจนกว่าหนี้นั้นจะได้ชำระเสร็จสิ้นเชิง"], "ป.พ.พ.|1299": ["", "ภายในบังคับแห่งบทบัญญัติในประมวลกฎหมายนี้หรือกฎหมายอื่น ท่านว่าการได้มาโดยนิติกรรมซึ่งอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์นั้นไม่บริบูรณ์ เว้นแต่นิติกรรมจะได้ทำเป็นหนังสือและได้จดทะเบียนการได้มากับพนักงานเจ้าหน้าที่ ถ้ามีผู้ได้มาซึ่งอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์โดยทางอื่นนอกจากนิติกรรม สิทธิของผู้ได้มานั้น ถ้ายังมิได้จดทะเบียนไซร้ ท่านว่าจะมีการเปลี่ยนแปลงทางทะเบียนไม่ได้ และสิทธิอันยังมิได้จดทะเบียนนั้น มิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้ได้สิทธิมาโดยเสียค่าตอบแทนและโดยสุจริต และได้จดทะเบียนสิทธิโดยสุจริตแล้ว"], "ป.พ.พ.|1332": ["", "บุคคลผู้ซื้อทรัพย์สินมาโดยสุจริตในการขายทอดตลาด หรือในท้องตลาด หรือจากพ่อค้าซึ่งขายของชนิดนั้น ไม่จำต้องคืนให้แก่เจ้าของแท้จริง เว้นแต่เจ้าของจะชดใช้ราคาที่ซื้อมา"], "ป.พ.พ.|560": ["", "ถ้าผู้เช่าไม่ชำระค่าเช่า ผู้ให้เช่าจะบอกเลิกสัญญาเสียก็ได้ แต่ถ้าค่าเช่านั้นจะพึงส่งเป็นรายเดือน หรือส่งเป็นระยะเวลายาวกว่ารายเดือนขึ้นไป ผู้ให้เช่าต้องบอกกล่าวแก่ผู้เช่าก่อนว่าให้ชำระค่าเช่าภายในเวลาใด ซึ่งพึงกำหนดอย่าให้น้อยกว่าสิบห้าวัน"], "ป.พ.พ.|1722": ["", "ผู้จัดการมรดกจะทำนิติกรรมใด ๆ ซึ่งตนมีส่วนได้เสียเป็นปฏิปักษ์ต่อกองมรดกหาได้ไม่ เว้นแต่พินัยกรรมจะได้อนุญาตไว้ หรือได้รับอนุญาตจากศาล"], "ป.พ.พ.|1498": ["", "การสมรสที่เป็นโมฆะ ไม่ก่อให้เกิดความสัมพันธ์ทางทรัพย์สินระหว่างคู่สมรส ในกรณีที่การสมรสเป็นโมฆะ ทรัพย์สินที่ฝ่ายใดมีหรือได้มาไม่ว่าก่อนหรือหลังการสมรสรวมทั้งดอกผลคงเป็นของฝ่ายนั้น ส่วนบรรดาทรัพย์สินที่ทำมาหาได้ร่วมกันให้แบ่งคนละครึ่ง เว้นแต่ศาลจะเห็นสมควรสั่งเป็นประการอื่น เมื่อได้พิเคราะห์ถึงภาระในครอบครัว ภาระในการหาเลี้ยงชีพ และฐานะของคู่กรณีทั้งสองฝ่าย ตลอดจนพฤติการณ์อื่นทั้งปวงแล้ว"], "ป.พ.พ.|1358": ["", "ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าของรวมมีสิทธิจัดการทรัพย์สินรวมกัน ในเรื่องจัดการตามธรรมดา ท่านว่าพึงตกลงโดยคะแนนข้างมากแห่งเจ้าของรวม แต่เจ้าของรวมคนหนึ่ง ๆ อาจทำสิ่งใดสิ่งหนึ่งในทางจัดการตามธรรมดาได้ เว้นแต่ฝ่ายข้างมากได้ตกลงไว้เป็นอย่างอื่น แต่เจ้าของรวมคนหนึ่ง ๆ อาจทำการเพื่อรักษาทรัพย์สินได้เสมอ ในเรื่องจัดการอันเป็นสาระสำคัญ ท่านว่าต้องตกลงกัน โดยคะแนนข้างมากแห่งเจ้าของรวม และคะแนนข้างมากนั้น ต้องมีส่วนไม่ต่ำกว่าครึ่งหนึ่งแห่งค่าทรัพย์สิน การเปลี่ยนแปลงวัตถุที่ประสงค์นั้น ท่านว่าจะตกลงกันได้ก็แต่เมื่อเจ้าของรวมเห็นชอบทุกคน"], "ป.พ.พ.|620": ["", "ผู้ขนส่งไม่ต้องรับผิดในเงินทองตรา ธนบัตร ธนาคารบัตร ตั๋วเงิน พันธบัตร ใบหุ้น ใบหุ้นกู้ ประทวนสินค้า อัญมณี และของมีค่าอย่างอื่น ๆ หากมิได้รับบอกราคาหรือสภาพแห่งของไว้ในขณะที่ส่งมอบแก่ตน แต่ถ้าของนั้นได้บอกราคา ท่านว่าความรับผิดของผู้ขนส่งก็ย่อมจำกัดเพียงไม่เกินราคาที่บอก"], "ป.พ.พ.|308": ["", "ถ้าลูกหนี้ได้ให้ความยินยอมดังกล่าวมาในมาตรา 306 โดยมิได้อิดเอื้อน ท่านว่าจะยกข้อต่อสู้ที่มีต่อผู้โอนขึ้นต่อสู้ผู้รับโอนนั้นหาได้ไม่ แต่ถ้าเพื่อจะระงับหนี้นั้น ลูกหนี้ได้ใช้เงินให้แก่ผู้โอนไปไซร้ ลูกหนี้จะเรียกคืนเงินนั้นก็ได้ หรือถ้าเพื่อการเช่นกล่าวมานั้นลูกหนี้รับภาระเป็นหนี้อย่างใดอย่างหนึ่งขึ้นใหม่ต่อผู้โอน จะถือเสมือนหนึ่งว่าหนี้นั้นมิได้ก่อขึ้นเลยก็ได้ ถ้าลูกหนี้เป็นแต่ได้รับคำบอกกล่าวการโอน ท่านว่าลูกหนี้มีข้อต่อสู้ผู้โอนก่อนเวลาที่ได้รับคำบอกกล่าวนั้นฉันใด ก็จะยกขึ้นเป็นข้อต่อสู้แก่ผู้รับโอนได้ฉันนั้น ถ้าลูกหนี้มีสิทธิเรียกร้องจากผู้โอน แต่สิทธินั้นยังไม่ถึงกำหนดในเวลาบอกกล่าวไซร้ ท่านว่าจะเอาสิทธิเรียกร้องนั้นมาหักกลบลบกันก็ได้ หากว่าสิทธินั้นจะได้ถึงกำหนดไม่ช้ากว่าเวลาถึงกำหนดแห่งสิทธิเรียกร้องอันได้โอนไปนั้น"], "ป.พ.พ.|856": ["", "อันว่าสัญญาบัญชีเดินสะพัดนั้น คือสัญญาซึ่งบุคคลสองคนตกลงกันว่าสืบแต่นั้นไป หรือในชั่วเวลากำหนดอันใดอันหนึ่ง ให้ตัดทอนบัญชีหนี้ทั้งหมดหรือแต่บางส่วนอันเกิดขึ้นแต่กิจการในระหว่างเขาทั้งสองนั้นหักกลบลบกัน และคงชำระแต่ส่วนที่เป็นจำนวนคงเหลือโดยดุลยภาค"], "ป.พ.พ.|1738": ["", "ก่อนแบ่งมรดก เจ้าหนี้กองมรดกจะบังคับชำระหนี้เต็มจำนวนจากกองมรดกก็ได้ ในกรณีเช่นนี้ทายาทคนหนึ่ง ๆ อาจเรียกให้ชำระหนี้จากทรัพย์มรดกของเจ้ามรดก หรือให้เอาเป็นประกันก็ได้จนถึงเวลาแบ่งมรดก เมื่อแบ่งมรดกแล้ว เจ้าหนี้อาจเรียกให้ทายาทคนใดคนหนึ่งชำระหนี้ได้เพียงไม่เกินทรัพย์มรดกที่ทายาทคนนั้นได้รับไป ในกรณีเช่นนี้ ทายาทคนใดซึ่งได้ชำระหนี้แก่เจ้าหนี้กองมรดกเกินกว่าส่วนที่ตนจะต้องเฉลี่ยใช้หนี้ ทายาทคนนั้นมีสิทธิไล่เบี้ยจากทายาทคนอื่นได้"], "ป.พ.พ.|1378": ["", "การโอนไปซึ่งการครอบครองนั้นย่อมทำได้โดยส่งมอบทรัพย์สินที่ครอบครอง"], "ป.พ.พ.|547": ["", "ผู้เช่าต้องเสียค่าใช้จ่ายไปโดยความจำเป็นและสมควรเพื่อรักษาทรัพย์สินซึ่งเช่านั้นเท่าใด ผู้ให้เช่าจำต้องชดใช้ให้แก่ผู้เช่า เว้นแต่ค่าใช้จ่ายเพื่อบำรุงรักษาตามปกติและเพื่อซ่อมแซมเพียงเล็กน้อย"], "ป.พ.พ.|371": ["", "บทบัญญัติที่กล่าวมาในมาตราก่อนนี้ท่านมิให้ใช้บังคับ ถ้าเป็นสัญญาต่างตอบแทนมีเงื่อนไขบังคับก่อน และทรัพย์อันเป็นวัตถุแห่งสัญญานั้นสูญหรือทำลายลงในระหว่างที่เงื่อนไขยังไม่สำเร็จ ถ้าทรัพย์นั้นเสียหายเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษเจ้าหนี้มิได้ และเมื่อเงื่อนไขนั้นสำเร็จแล้ว เจ้าหนี้จะเรียกให้ชำระหนี้โดยลดส่วนอันตนจะต้องชำระหนี้ตอบแทนนั้นลงหรือเลิกสัญญานั้นเสียก็ได้ แล้วแต่จะเลือก แต่ในกรณีที่ต้นเหตุเสียหายเกิดเพราะฝ่ายลูกหนี้นั้น ท่านว่าหากระทบกระทั่งถึงสิทธิของเจ้าหนี้ที่จะเรียกค่าสินไหมทดแทนไม่"], "ป.พ.พ.|1613": ["", "การสละมรดกนั้น จะทำแต่เพียงบางส่วน หรือทำโดยมีเงื่อนไข หรือเงื่อนเวลาไม่ได้ การสละมรดกนั้น จะถอนเสียมิได้"], "ป.พ.พ.|1357": ["", "ท่านให้สันนิษฐานไว้ก่อนว่าผู้เป็นเจ้าของรวมกันมีส่วนเท่ากัน"], "ป.พ.พ.|577": ["", "นายจ้างจะโอนสิทธิของตนให้แก่บุคคลภายนอกก็ได้เมื่อลูกจ้างยินยอมพร้อมใจด้วย ลูกจ้างจะให้บุคคลภายนอกทำงานแทนตนก็ได้เมื่อนายจ้างยินยอมพร้อมใจด้วย ถ้าคู่สัญญาฝ่ายใดทำการฝ่าฝืนบทบัญญัตินี้ คู่สัญญาอีกฝ่ายหนึ่งจะบอกเลิกสัญญาเสียก็ได้"], "ป.พ.พ.|1642": ["", "การรับมรดกแทนที่กันนั้น ให้ใช้บังคับแต่ในระหว่างทายาทโดยธรรม"], "ป.พ.พ.|518": ["", "อันว่าแลกเปลี่ยนนั้น คือสัญญาซึ่งคู่กรณีต่างโอนกรรมสิทธิ์แห่งทรัพย์สินให้กันและกัน"], "ป.พ.พ.|1070": ["", "เมื่อใดห้างหุ้นส่วนซึ่งจดทะเบียนผิดนัดชำระหนี้ เมื่อนั้นเจ้าหนี้ของห้างหุ้นส่วนนั้นชอบที่จะเรียกให้ชำระหนี้เอาแต่ผู้เป็นหุ้นส่วนคนใดคนหนึ่งก็ได้"], "ป.พ.พ.|411": ["", "บุคคลใดได้กระทำการเพื่อชำระหนี้ เป็นการอันฝ่าฝืนข้อห้ามตามกฎหมายหรือศีลธรรมอันดี ท่านว่าบุคคลนั้นหาอาจจะเรียกร้องคืนทรัพย์ได้ไม่"], "ป.พ.พ.|988": ["", "อันเช็คนั้น ต้องมีรายการดังกล่าวต่อไปนี้ คือ (1) คำบอกชื่อว่าเป็นเช็ค (2) คำสั่งอันปราศจากเงื่อนไขให้ใช้เงินเป็นจำนวนแน่นอน (3) ชื่อ หรือยี่ห้อและสำนักของธนาคาร (4) ชื่อ หรือยี่ห้อของผู้รับเงิน หรือคำจดแจ้งว่าให้ใช้เงินแก่ผู้ถือ (5) สถานที่ใช้เงิน (6) วันและสถานที่ออกเช็ค (7) ลายมือชื่อผู้สั่งจ่าย"], "ป.พ.พ.|591": ["", "ถ้าความชำรุดบกพร่องหรือความชักช้าในการที่ทำนั้นเกิดขึ้นเพราะสภาพแห่งสัมภาระซึ่งผู้ว่าจ้างส่งให้ก็ดี เพราะคำสั่งของผู้ว่าจ้างก็ดี ท่านว่าผู้รับจ้างไม่ต้องรับผิด เว้นแต่จะได้รู้อยู่แล้วว่าสัมภาระนั้นไม่เหมาะ หรือว่าคำสั่งนั้นไม่ถูกต้องและมิได้บอกกล่าวตักเตือน"], "ป.พ.พ.|438": ["", "ค่าสินไหมทดแทนจะพึงใช้โดยสถานใดเพียงใดนั้น ให้ศาลวินิจฉัยตามควรแก่พฤติการณ์และความร้ายแรงแห่งละเมิด อนึ่ง ค่าสินไหมทดแทนนั้น ได้แก่การคืนทรัพย์สินอันผู้เสียหายต้องเสียไปเพราะละเมิด หรือใช้ราคาทรัพย์สินนั้น รวมทั้งค่าเสียหายอันจะพึงบังคับให้ใช้เพื่อความเสียหายอย่างใด ๆ อันได้ก่อขึ้นนั้นด้วย"], "ป.พ.พ.|223": ["", "ถ้าฝ่ายผู้เสียหายได้มีส่วนทำความผิดอย่างใดอย่างหนึ่งก่อให้เกิดความเสียหายด้วยไซร้ ท่านว่าหนี้อันจะต้องใช้ค่าสินไหมทดแทนแก่ฝ่ายผู้เสียหายมากน้อยเพียงใดนั้น ต้องอาศัยพฤติการณ์เป็นประมาณ ข้อสำคัญก็คือว่าความเสียหายนั้นได้เกิดขึ้นเพราะฝ่ายไหนเป็นผู้ก่อยิ่งหย่อนกว่ากันเพียงไร วิธีเดียวกันนี้ท่านให้ใช้แม้ทั้งที่ความผิดของฝ่ายผู้ที่เสียหายจะมีแต่เพียงละเลยไม่เตือนลูกหนี้ให้รู้สึกถึงอันตรายแห่งการเสียหายอันเป็นอย่างร้ายแรงผิดปกติ ซึ่งลูกหนี้ไม่รู้หรือไม่อาจจะรู้ได้ หรือเพียงแต่ละเลยไม่บำบัดปัดป้อง หรือบรรเทาความเสียหายนั้นด้วย อนึ่ง บทบัญญัติแห่งมาตรา 220 นั้นท่านให้นำมาใช้บังคับด้วยโดยอนุโลม"], "ป.พ.พ.|1623": ["", "ทรัพย์สินของพระภิกษุที่ได้มาในระหว่างเวลาที่อยู่ในสมณเพศนั้น เมื่อพระภิกษุนั้นถึงแก่มรณภาพให้ตกเป็นสมบัติของวัดที่เป็นภูมิลำเนาของพระภิกษุนั้น เว้นไว้แต่พระภิกษุนั้นจะได้จำหน่ายไปในระหว่างชีวิตหรือโดยพินัยกรรม"], "ป.พ.พ.|665": ["", "ผู้รับฝากจำต้องคืนทรัพย์สินซึ่งรับฝากไว้นั้นให้แก่ผู้ฝาก หรือทรัพย์สินนั้นฝากในนามของผู้ใด คืนให้แก่ผู้นั้น หรือผู้รับฝากได้รับคำสั่งโดยชอบให้คืนทรัพย์สินนั้นไปแก่ผู้ใด คืนให้แก่ผู้นั้น แต่หากผู้ฝากทรัพย์ตาย ท่านให้คืนทรัพย์สินนั้นให้แก่ทายาท"], "ป.พ.พ.|1311": ["", "บุคคลใดสร้างโรงเรือนในที่ดินของผู้อื่นโดยไม่สุจริตไซร้ ท่านว่าบุคคลนั้นต้องทำที่ดินให้เป็นตามเดิมแล้วส่งคืนเจ้าของ เว้นแต่เจ้าของจะเลือกให้ส่งคืนตามที่เป็นอยู่ ในกรณีเช่นนี้เจ้าของที่ดินต้องใช้ราคาโรงเรือนหรือใช้ค่าแห่งที่ดินเพียงที่เพิ่มขึ้นเพราะสร้างโรงเรือนนั้น แล้วแต่จะเลือก"], "ป.พ.พ.|1440": ["", "ค่าทดแทนนั้นอาจเรียกได้ ดังต่อไปนี้ (1) ทดแทนความเสียหายต่อกายหรือชื่อเสียงแห่งผู้หมั้นหรือผู้รับหมั้นนั้น (2) ทดแทนความเสียหายเนื่องจากการที่คู่หมั้น บิดามารดา หรือบุคคลผู้กระทำการในฐานะเช่นบิดามารดาได้ใช้จ่ายหรือต้องตกเป็นลูกหนี้เนื่องในการเตรียมการสมรสโดยสุจริตและตามสมควร (3) ทดแทนความเสียหายเนื่องจากการที่คู่หมั้นได้จัดการทรัพย์สินหรือการอื่นอันเกี่ยวแก่อาชีพหรือทางทำมาหาได้ของตนไปโดยสมควรด้วยการคาดหมายว่าจะได้มีการสมรส ในกรณีที่ผู้รับหมั้นเป็นผู้มีสิทธิได้ค่าทดแทน ศาลอาจชี้ขาดว่า ของหมั้นที่ตกเป็นสิทธิแก่ผู้รับหมั้นนั้นเป็นค่าทดแทนทั้งหมดหรือเป็นส่วนหนึ่งของค่าทดแทนที่ผู้รับหมั้นพึงได้รับ หรือศาลอาจให้ค่าทดแทนโดยไม่คำนึงถึงของหมั้นที่ตกเป็นสิทธิแก่ผู้รับหมั้นนั้นก็ได้"], "ป.พ.พ.|1401": ["", "ภาระจำยอมอาจได้มาโดยอายุความ ท่านให้นำบทบัญญัติว่าด้วยอายุความได้สิทธิอันกล่าวไว้ในลักษณะ 3 แห่งบรรพนี้มาใช้บังคับโดยอนุโลม"], "ป.พ.พ.|1726": ["", "ถ้าผู้จัดการมรดกมีหลายคน การทำการตามหน้าที่ของผู้จัดการมรดกนั้นต้องถือเอาเสียงข้างมาก เว้นแต่จะมีข้อกำหนดพินัยกรรมเป็นอย่างอื่น ถ้าเสียงเท่ากัน เมื่อผู้มีส่วนได้เสียร้องขอ ก็ให้ศาลเป็นผู้ชี้ขาด"], "ป.พ.พ.|1602": ["", "เมื่อบุคคลใดต้องถือว่าถึงแก่ความตายตามความในมาตรา 62 แห่งประมวลกฎหมายนี้ มรดกของบุคคลนั้นตกทอดแก่ทายาท ถ้าพิสูจน์ได้ว่าบุคคลนั้นยังคงมีชีวิตอยู่ หรือตายในเวลาอื่นผิดไปจากเวลาดังระบุไว้ในคำสั่งที่สั่งให้เป็นคนสาบสูญ ให้ใช้บทบัญญัติมาตรา 63 แห่งประมวลกฎหมายนี้บังคับแก่ทายาทของบุคคลนั้น"], "ป.พ.พ.|481": ["", "ถ้าผู้ขายไม่ได้เป็นคู่ความในคดีเดิม หรือถ้าผู้ซื้อได้ประนีประนอมยอมความกับบุคคลภายนอก หรือยอมตามที่บุคคลภายนอกเรียกร้องไซร้ ท่านห้ามมิให้ฟ้องคดีในข้อรับผิดเพื่อการรอนสิทธิเมื่อพ้นกำหนดสามเดือนนับแต่วันคำพิพากษาในคดีเดิมถึงที่สุด หรือนับแต่วันประนีประนอมยอมความ หรือวันที่ยอมตามบุคคลภายนอกเรียกร้องนั้น"], "ป.พ.พ.|686": ["", "เมื่อลูกหนี้ผิดนัด ให้เจ้าหนี้มีหนังสือบอกกล่าวไปยังผู้ค้ำประกันภายในหกสิบวันนับแต่วันที่ลูกหนี้ผิดนัด และไม่ว่ากรณีจะเป็นประการใดเจ้าหนี้จะเรียกให้ผู้ค้ำประกันชำระหนี้ก่อนที่หนังสือบอกกล่าวจะไปถึงผู้ค้ำประกันมิได้ แต่ไม่ตัดสิทธิผู้ค้ำประกันที่จะชำระหนี้เมื่อหนี้ถึงกำหนดชำระ ในกรณีที่เจ้าหนี้มิได้มีหนังสือบอกกล่าวภายในกำหนดเวลาตามวรรคหนึ่ง ให้ผู้ค้ำประกันหลุดพ้นจากความรับผิดในดอกเบี้ยและค่าสินไหมทดแทน ตลอดจนค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้นบรรดาที่เกิดขึ้นภายหลังจากพ้นกำหนดเวลาตามวรรคหนึ่ง เมื่อเจ้าหนี้มีสิทธิเรียกให้ผู้ค้ำประกันชำระหนี้หรือผู้ค้ำประกันมีสิทธิชำระหนี้ได้ตามวรรคหนึ่ง ผู้ค้ำประกันอาจชำระหนี้ทั้งหมดหรือใช้สิทธิชำระหนี้ตามเงื่อนไขและวิธีการในการชำระหนี้ที่ลูกหนี้มีอยู่กับเจ้าหนี้ก่อนการผิดนัดชำระหนี้ ทั้งนี้ เฉพาะในส่วนที่ตนต้องรับผิดก็ได้ และให้นำความในมาตรา 701 วรรคสอง มาใช้บังคับโดยอนุโลม ในระหว่างที่ผู้ค้ำประกันชำระหนี้ตามเงื่อนไขและวิธีการในการชำระหนี้ของลูกหนี้ตามวรรคสาม เจ้าหนี้จะเรียกดอกเบี้ยเพิ่มขึ้นเพราะเหตุที่ลูกหนี้ผิดนัดในระหว่างนั้นมิได้ การชำระหนี้ของผู้ค้ำประกันตามมาตรานี้ ไม่กระทบกระเทือนสิทธิของผู้ค้ำประกันตามมาตรา 693"], "ป.พ.พ.|911": ["", "ผู้สั่งจ่ายจะเขียนข้อความกำหนดลงไว้ว่าจำนวนเงินอันจะพึงใช้นั้นให้คิดดอกเบี้ยด้วยก็ได้ และในกรณีเช่นนั้น ถ้ามิได้กล่าวลงไว้เป็นอย่างอื่น ท่านว่าดอกเบี้ยย่อมคิดแต่วันที่ลงในตั๋วเงิน"], "ป.พ.พ.|1633": ["", "ทายาทโดยธรรมในลำดับเดียวกัน ในลำดับหนึ่ง ๆ ที่ระบุไว้ในมาตรา 1629 นั้น ชอบที่จะได้รับส่วนแบ่งเท่ากัน ถ้าในลำดับหนึ่งมีทายาทโดยธรรมคนเดียว ทายาทโดยธรรมคนนั้นมีสิทธิได้รับส่วนแบ่งทั้งหมด"], "ป.พ.พ.|566": ["", "ถ้ากำหนดเวลาเช่าไม่ปรากฏในความที่ตกลงกันหรือไม่พึงสันนิษฐานได้ไซร้ ท่านว่าคู่สัญญาฝ่ายใดจะบอกเลิกสัญญาเช่าในขณะเมื่อสุดระยะเวลาอันเป็นกำหนดชำระค่าเช่าก็ได้ทุกระยะ แต่ต้องบอกกล่าวแก่อีกฝ่ายหนึ่งให้รู้ตัวก่อนชั่วกำหนดเวลาชำระค่าเช่าระยะหนึ่งเป็นอย่างน้อย แต่ไม่จำเป็นต้องบอกกล่าวล่วงหน้ากว่าสองเดือน"], "ป.พ.พ.|1539": ["", "ในกรณีที่สันนิษฐานว่าเด็กเป็นบุตรชอบด้วยกฎหมายของชายผู้เป็นหรือเคยเป็นคู่สมรสตามมาตรา 1536 มาตรา 1537 หรือมาตรา 1538 ชายผู้เป็นหรือเคยเป็นคู่สมรสจะไม่รับเด็กเป็นบุตรของตนก็ได้ โดยฟ้องเด็กกับมารดาเด็กร่วมกันเป็นจำเลยและพิสูจน์ได้ว่าตนไม่ได้อยู่ร่วมกับมารดาเด็กในระยะเวลาตั้งครรภ์คือระหว่างหนึ่งร้อยแปดสิบวันถึงสามร้อยสิบวันก่อนเด็กเกิด หรือตนไม่สามารถเป็นบิดาของเด็กได้เพราะเหตุอย่างอื่น แต่ถ้าในขณะยื่นฟ้องมารดาเด็กไม่มีชีวิตอยู่ จะฟ้องเด็กแต่ผู้เดียวเป็นจำเลยก็ได้ ถ้าเด็กไม่มีชีวิตอยู่ไม่ว่ามารดาของเด็กจะมีชีวิตอยู่หรือไม่ จะยื่นคำร้องขอให้ศาลแสดงว่าเด็กนั้นไม่เป็นบุตรก็ได้ ในกรณีที่มารดาของเด็กหรือทายาทของเด็กยังมีชีวิตอยู่ ให้ศาลส่งสำเนาคำร้องนี้ไปให้ด้วย และถ้าศาลเห็นสมควร จะส่งสำเนาคำร้องไปให้อัยการพิจารณาเพื่อดำเนินคดีแทนเด็กด้วยก็ได้"], "ป.พ.พ.|1393": ["", "ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในนิติกรรมอันก่อให้เกิดภาระจำยอมไซร้ ท่านว่าภาระจำยอมย่อมติดไปกับสามยทรัพย์ซึ่งได้จำหน่าย หรือตกไปในบังคับแห่งสิทธิอื่น ท่านว่าจะจำหน่าย หรือทำให้ภาระจำยอมตกไปในบังคับแห่งสิทธิอื่นต่างหากจากสามยทรัพย์ไม่ได้"], "ป.พ.พ.|1501": ["", "การสมรสย่อมสิ้นสุดลงด้วยความตาย การหย่าหรือศาลพิพากษาให้เพิกถอน"], "ป.พ.พ.|1755": ["", "อายุความหนึ่งปีนั้น จะยกขึ้นต่อสู้ได้ก็แต่โดยบุคคลซึ่งเป็นทายาท หรือบุคคลซึ่งชอบที่จะใช้สิทธิของทายาท หรือโดยผู้จัดการมรดก"], "ป.พ.พ.|707": ["", "บทบัญญัติมาตรา 681 ว่าด้วยค้ำประกันนั้น ท่านให้ใช้ได้ในการจำนอง อนุโลมตามควร"], "ป.พ.พ.|698": ["", "อันผู้ค้ำประกันย่อมหลุดพ้นจากความรับผิด ในขณะเมื่อหนี้ของลูกหนี้ระงับสิ้นไปไม่ว่าเพราะเหตุใด ๆ"], "ป.พ.พ.|552": ["", "อันผู้เช่าจะใช้ทรัพย์สินที่เช่าเพื่อการอย่างอื่น นอกจากที่ใช้กันตามประเพณีนิยมปกติ หรือการดังกำหนดไว้ในสัญญานั้น ท่านว่าหาอาจจะทำได้ไม่"], "ป.พ.พ.|900": ["", "บุคคลผู้ลงลายมือชื่อของตนในตั๋วเงินย่อมจะต้องรับผิดตามเนื้อความในตั๋วเงินนั้น ถ้าลงเพียงแต่เครื่องหมายอย่างหนึ่งอย่างใด เช่น แกงได หรือลายพิมพ์นิ้วมืออ้างเอาเป็นลายมือชื่อในตั๋วเงินไซร้ แม้ถึงว่าจะมีพยานลงชื่อรับรองก็ตาม ท่านว่าหาให้ผลเป็นลงลายมือชื่อในตั๋วเงินนั้นไม่"], "ป.พ.พ.|32": ["", "บุคคลใดมีกายพิการหรือมีจิตฟั่นเฟือนไม่สมประกอบ หรือประพฤติสุรุ่ยสุร่าย เสเพลเป็นอาจิณ หรือติดสุรายาเมา หรือมีเหตุอื่นใดทำนองเดียวกันนั้น จนไม่สามารถจะจัดทำการงานโดยตนเองได้ หรือจัดกิจการไปในทางที่อาจจะเสื่อมเสียแก่ทรัพย์สินของตนเองหรือครอบครัว เมื่อบุคคลตามที่ระบุไว้ในมาตรา 28 ร้องขอต่อศาล ศาลจะสั่งให้บุคคลนั้นเป็นคนเสมือนไร้ความสามารถก็ได้ บุคคลซึ่งศาลได้สั่งให้เป็นคนเสมือนไร้ความสามารถตามวรรคหนึ่ง ต้องจัดให้อยู่ในความพิทักษ์ การแต่งตั้งผู้พิทักษ์ ให้เป็นไปตามบทบัญญัติบรรพ 5 แห่งประมวลกฎหมายนี้ ให้นำบทบัญญัติว่าด้วยการสิ้นสุดของความเป็นผู้ปกครองในบรรพ 5 แห่งประมวลกฎหมายนี้มาใช้บังคับแก่การสิ้นสุดของการเป็นผู้พิทักษ์โดยอนุโลม คำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา"], "ป.พ.พ.|204": ["", "ถ้าหนี้ถึงกำหนดชำระแล้ว และภายหลังแต่นั้นเจ้าหนี้ได้ให้คำเตือนลูกหนี้แล้ว ลูกหนี้ยังไม่ชำระหนี้ไซร้ ลูกหนี้ได้ชื่อว่าผิดนัดเพราะเขาเตือนแล้ว ถ้าได้กำหนดเวลาชำระหนี้ไว้ตามวันแห่งปฏิทิน และลูกหนี้มิได้ชำระหนี้ตามกำหนดไซร้ ท่านว่าลูกหนี้ตกเป็นผู้ผิดนัดโดยมิพักต้องเตือนเลย วิธีเดียวกันนี้ท่านให้ใช้บังคับแก่กรณีที่ต้องบอกกล่าวล่วงหน้าก่อนการชำระหนี้ ซึ่งได้กำหนดเวลาลงไว้อาจคำนวณนับได้โดยปฏิทินนับแต่วันที่ได้บอกกล่าว"], "ป.พ.พ.|224": ["", "หนี้เงินนั้น ให้คิดดอกเบี้ยในระหว่างเวลาผิดนัดในอัตราที่กำหนดตามมาตรา 7 บวกด้วยอัตราเพิ่มร้อยละสองต่อปี ถ้าเจ้าหนี้อาจจะเรียกดอกเบี้ยได้สูงกว่านั้นโดยอาศัยเหตุอย่างอื่นอันชอบด้วยกฎหมาย ก็ให้คงส่งดอกเบี้ยต่อไปตามนั้น ห้ามมิให้คิดดอกเบี้ยซ้อนดอกเบี้ยในระหว่างผิดนัด การพิสูจน์ค่าเสียหายอย่างอื่นนอกจากนั้น ให้พิสูจน์ได้"], "ป.พ.พ.|717": ["", "แม้ว่าทรัพย์สินซึ่งจำนองจะแบ่งออกเป็นหลายส่วนก็ตาม ท่านว่าจำนองก็ยังคงครอบไปถึงส่วนเหล่านั้นหมดทุกส่วนด้วยกันอยู่นั่นเอง ถึงกระนั้นก็ดี ถ้าผู้รับจำนองยินยอมด้วย ท่านว่าจะโอนทรัพย์สินส่วนหนึ่งส่วนใดไปปลอดจากจำนองก็ให้ทำได้ แต่ความยินยอมดังว่านี้ หากมิได้จดทะเบียน ท่านว่าจะยกเอาขึ้นเป็นข้อต่อสู้แก่บุคคลภายนอกหาได้ไม่"], "ป.พ.พ.|37": ["", "ภูมิลำเนาของบุคคลธรรมดา ได้แก่ถิ่นอันบุคคลนั้นมีสถานที่อยู่เป็นแหล่งสำคัญ"], "ป.พ.พ.|482": ["", "ผู้ขายไม่ต้องรับผิดในการรอนสิทธิเมื่อกรณีเป็นดังกล่าวต่อไปนี้ คือ (1) ถ้าไม่มีการฟ้องคดี และผู้ขายพิสูจน์ได้ว่าสิทธิของผู้ซื้อได้สูญไปโดยความผิดของผู้ซื้อเอง หรือ (2) ถ้าผู้ซื้อไม่ได้เรียกผู้ขายเข้ามาในคดี และผู้ขายพิสูจน์ได้ว่า ถ้าได้เรียกเข้ามาในคดีฝ่ายผู้ซื้อจะชนะ หรือ (3) ถ้าผู้ขายได้เข้ามาในคดี แต่ศาลได้ยกคำเรียกร้องของผู้ซื้อเสียเพราะความผิดของผู้ซื้อเอง แต่ถึงกรณีจะเป็นอย่างไรก็ดี ถ้าผู้ขายถูกศาลหมายเรียกให้เข้ามาในคดีและไม่ยอมเข้าว่าคดีร่วมเป็นจำเลยหรือร่วมเป็นโจทก์กับผู้ซื้อไซร้ ท่านว่าผู้ขายคงต้องรับผิด"], "ป.พ.พ.|1496": ["", "คำพิพากษาของศาลเท่านั้นที่จะแสดงว่า การสมรสที่ฝ่าฝืนมาตรา 1449 มาตรา 1450 และมาตรา 1458 เป็นโมฆะ คู่สมรส บิดามารดา หรือผู้สืบสันดานของคู่สมรสอาจร้องขอให้ศาลพิพากษาว่าการสมรสเป็นโมฆะได้ ถ้าไม่มีบุคคลดังกล่าว ผู้มีส่วนได้เสียจะร้องขอให้อัยการเป็นผู้ร้องขอต่อศาลก็ได้"], "ป.พ.พ.|701": ["", "ผู้ค้ำประกันจะขอชำระหนี้แก่เจ้าหนี้ตั้งแต่เมื่อถึงกำหนดชำระก็ได้ ถ้าเจ้าหนี้ไม่ยอมรับชำระหนี้ ผู้ค้ำประกันก็เป็นอันหลุดพ้นจากความรับผิด"], "ป.พ.พ.|526": ["", "ถ้าการให้ทรัพย์สินหรือให้คำมั่นว่าจะให้ทรัพย์สินนั้นได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่แล้ว และผู้ให้ไม่ส่งมอบทรัพย์สินนั้นแก่ผู้รับไซร้ ท่านว่าผู้รับชอบที่จะเรียกให้ส่งมอบตัวทรัพย์สินหรือราคาแทนทรัพย์สินนั้นได้ แต่ไม่ชอบที่จะเรียกค่าสินไหมทดแทนอย่างหนึ่งอย่างใดด้วยอีกได้"], "ป.พ.พ.|476": ["", "ถ้าสิทธิของผู้ก่อการรบกวนนั้นผู้ซื้อรู้อยู่แล้วในเวลาซื้อขาย ท่านว่าผู้ขายไม่ต้องรับผิด"], "ป.พ.พ.|219": ["", "ถ้าการชำระหนี้กลายเป็นพ้นวิสัยเพราะพฤติการณ์อันใดอันหนึ่งซึ่งเกิดขึ้นภายหลังที่ได้ก่อหนี้ และซึ่งลูกหนี้ไม่ต้องรับผิดชอบนั้นไซร้ ท่านว่าลูกหนี้เป็นอันหลุดพ้นจากการชำระหนี้นั้น ถ้าภายหลังที่ได้ก่อหนี้ขึ้นแล้วนั้น ลูกหนี้กลายเป็นคนไม่สามารถจะชำระหนี้ได้ไซร้ ท่านให้ถือเสมือนว่าเป็นพฤติการณ์ที่ทำให้การชำระหนี้ตกเป็นอันพ้นวิสัยฉะนั้น"], "ป.พ.พ.|1088": ["", "ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดผู้ใดสอดเข้าไปเกี่ยวข้องจัดการงานของห้างหุ้นส่วน ท่านว่าผู้นั้นจะต้องรับผิดร่วมกันในบรรดาหนี้ทั้งหลายของห้างหุ้นส่วนนั้นโดยไม่จำกัดจำนวน แต่การออกความเห็นและแนะนำก็ดี ออกเสียงเป็นคะแนนนับในการตั้งและถอดถอนผู้จัดการตามกรณีที่มีบังคับไว้ในสัญญาหุ้นส่วนนั้นก็ดี ท่านหานับว่าเป็นการสอดเข้าไปเกี่ยวข้องจัดการงานของห้างหุ้นส่วนนั้นไม่"], "ป.พ.พ.|1530": ["", "ขณะคดีฟ้องหย่าอยู่ในระหว่างพิจารณา ถ้าฝ่ายใดร้องขอศาลอาจสั่งชั่วคราวให้จัดการตามที่เห็นสมควร เช่น ในเรื่องสินสมรส ที่พักอาศัย การอุปการะเลี้ยงดูคู่สมรสและการพิทักษ์อุปการะเลี้ยงดูบุตร"], "ป.พ.พ.|1080": ["", "บทบัญญัติว่าด้วยห้างหุ้นส่วนสามัญข้อใด ๆ หากมิได้ยกเว้นหรือแก้ไขเปลี่ยนแปลงไปโดยบทบัญญัติแห่งหมวด 3 นี้ ท่านให้นำมาใช้บังคับแก่ห้างหุ้นส่วนจำกัดด้วย ถ้าผู้เป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิดนั้นมีอยู่หลายคนด้วยกัน ท่านให้ใช้บทบัญญัติสำหรับห้างหุ้นส่วนสามัญเป็นวิธีบังคับในความเกี่ยวพันระหว่างคนเหล่านั้นเอง และความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนเหล่านั้นกับห้างหุ้นส่วน"], "ป.พ.พ.|654": ["", "ท่านห้ามมิให้คิดดอกเบี้ยเกินร้อยละสิบห้าต่อปี ถ้าในสัญญากำหนดดอกเบี้ยเกินกว่านั้น ก็ให้ลดลงมาเป็นร้อยละสิบห้าต่อปี"], "ป.พ.พ.|1732": ["", "ผู้จัดการมรดกต้องจัดการตามหน้าที่และทำรายงานแสดงบัญชีการจัดการและแบ่งปันมรดกให้เสร็จภายในหนึ่งปีนับแต่วันที่ระบุไว้ในมาตรา 1728 เว้นแต่ผู้ทำพินัยกรรม ทายาทโดยจำนวนข้างมาก หรือศาลจะได้กำหนดเวลาให้ไว้เป็นอย่างอื่น"], "ป.พ.พ.|852": ["", "ผลของสัญญาประนีประนอมยอมความนั้น ย่อมทำให้การเรียกร้องซึ่งแต่ละฝ่ายได้ยอมสละนั้นระงับสิ้นไป และทำให้แต่ละฝ่ายได้สิทธิตามที่แสดงในสัญญานั้นว่าเป็นของตน"], "ป.พ.พ.|443": ["", "ในกรณีที่ทำให้เขาถึงตายนั้น ค่าสินไหมทดแทนได้แก่ค่าปลงศพรวมทั้งค่าใช้จ่ายอันจำเป็นอย่างอื่น ๆ อีกด้วย ถ้ามิได้ตายในทันที ค่าสินไหมทดแทนได้แก่ค่ารักษาพยาบาลรวมทั้งค่าเสียหายที่ต้องขาดประโยชน์ทำมาหาได้เพราะไม่สามารถประกอบการงานนั้นด้วย ถ้าว่าเหตุที่ตายลงนั้นทำให้บุคคลหนึ่งคนใดต้องขาดไร้อุปการะตามกฎหมายไปด้วยไซร้ ท่านว่าบุคคลคนนั้นชอบที่จะได้รับค่าสินไหมทดแทนเพื่อการนั้น"], "ป.พ.พ.|1025": ["", "อันว่าห้างหุ้นส่วนสามัญนั้น คือห้างหุ้นส่วนประเภทซึ่งผู้เป็นหุ้นส่วนหมดทุกคนต้องรับผิดร่วมกันเพื่อหนี้ทั้งปวงของหุ้นส่วนโดยไม่มีจำกัด"], "ป.พ.พ.|375": ["", "เมื่อสิทธิของบุคคลภายนอกได้เกิดมีขึ้นตามบทบัญญัติแห่งมาตราก่อนแล้ว คู่สัญญาหาอาจจะเปลี่ยนแปลงหรือระงับสิทธินั้นในภายหลังได้ไม่"], "ป.พ.พ.|509": ["", "การขายทอดตลาดย่อมบริบูรณ์ เมื่อผู้ทอดตลาดแสดงความตกลงด้วยเคาะไม้ หรือด้วยกิริยาอื่นอย่างใดอย่างหนึ่งตามจารีตประเพณีในการขายทอดตลาด ถ้ายังมิได้แสดงเช่นนั้นอยู่ตราบใด ท่านว่าผู้สู้ราคาจะถอนคำสู้ราคาของตนเสียก็ยังถอนได้"], "ป.พ.พ.|1698": ["", "ข้อกำหนดพินัยกรรมนั้น ย่อมตกไป (1) เมื่อผู้รับพินัยกรรมตายก่อนผู้ทำพินัยกรรม (2) เมื่อข้อกำหนดพินัยกรรมเป็นผลใช้ได้ต่อเมื่อเงื่อนไขอย่างใดอย่างหนึ่งสำเร็จลง และผู้รับพินัยกรรมตายเสียก่อนเงื่อนไขสำเร็จ หรือปรากฏเป็นที่แน่นอนอยู่แล้วว่าเงื่อนไขนั้นไม่อาจจะสำเร็จได้ (3) เมื่อผู้รับพินัยกรรมบอกสละพินัยกรรม (4) เมื่อทรัพย์สินทั้งหมดที่ยกให้สูญหาย หรือถูกทำลายโดยผู้ทำพินัยกรรมมิได้ตั้งใจในระหว่างที่ผู้ทำพินัยกรรมยังมีชีวิตอยู่ และผู้ทำพินัยกรรมมิได้ได้มาซึ่งของแทน หรือซึ่งสิทธิที่จะเรียกค่าทดแทนในการที่ทรัพย์สินนั้นสูญหายไป"], "ป.พ.พ.|499": ["", "สินไถ่นั้น ถ้าไม่ได้กำหนดกันไว้ว่าเท่าใดไซร้ ท่านให้ไถ่ตามราคาที่ขายฝาก ถ้าปรากฏในเวลาไถ่ว่าสินไถ่หรือราคาขายฝากที่กำหนดไว้สูงกว่าราคาขายฝากที่แท้จริงเกินอัตราร้อยละสิบห้าต่อปี ให้ไถ่ได้ตามราคาขายฝากที่แท้จริงรวมประโยชน์ตอบแทนร้อยละสิบห้าต่อปี"], "ป.พ.พ.|420": ["", "ผู้ใดจงใจหรือประมาทเลินเล่อ ทำต่อบุคคลอื่นโดยผิดกฎหมายให้เขาเสียหายถึงแก่ชีวิตก็ดี แก่ร่างกายก็ดี อนามัยก็ดี เสรีภาพก็ดี ทรัพย์สินหรือสิทธิอย่างหนึ่งอย่างใดก็ดี ท่านว่าผู้นั้นทำละเมิดจำต้องใช้ค่าสินไหมทดแทนเพื่อการนั้น"], "ป.พ.พ.|1473": ["", "สินส่วนตัวของคู่สมรสฝ่ายใดให้ฝ่ายนั้นเป็นผู้จัดการ"], "ป.พ.พ.|703": ["", "อันอสังหาริมทรัพย์นั้นอาจจำนองได้ไม่ว่าประเภทใด ๆ สังหาริมทรัพย์อันจะกล่าวต่อไปนี้ก็อาจจำนองได้ดุจกัน หากว่าได้จดทะเบียนไว้แล้วตามกฎหมาย คือ (1) เรือมีระวางตั้งแต่ห้าตันขึ้นไป (2) แพ (3) สัตว์พาหนะ (4) สังหาริมทรัพย์อื่นใด ๆ ซึ่งกฎหมายหากบัญญัติไว้ให้จดทะเบียนเฉพาะการ"], "ป.พ.พ.|1467": ["", "เมื่อสมรสแล้วจะเปลี่ยนแปลงเพิกถอนสัญญาก่อนสมรสนั้นไม่ได้ นอกจากจะได้รับอนุญาตจากศาล เมื่อได้มีคำสั่งของศาลถึงที่สุดให้เปลี่ยนแปลงเพิกถอนสัญญาก่อนสมรสแล้ว ให้ศาลแจ้งไปยังนายทะเบียนสมรสเพื่อจดแจ้งไว้ในทะเบียนสมรส"], "ป.พ.พ.|327": ["", "ในกรณีชำระดอกเบี้ย หรือชำระหนี้อย่างอื่นอันมีกำหนดชำระเป็นระยะเวลานั้น ถ้าเจ้าหนี้ออกใบเสร็จให้เพื่อระยะหนึ่งแล้วโดยมิได้อิดเอื้อน ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าหนี้ได้รับชำระหนี้เพื่อระยะก่อน ๆ นั้นด้วยแล้ว ถ้าเจ้าหนี้ออกใบเสร็จให้เพื่อการชำระต้นเงิน ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าหนี้ได้รับดอกเบี้ยแล้ว ถ้าเอกสารอันเป็นหลักฐานแห่งหนี้ได้เวนคืนแล้วไซร้ ท่านให้สันนิษฐานไว้ก่อนว่าหนี้นั้นเป็นอันระงับสิ้นไปแล้ว"], "ป.พ.พ.|350": ["", "แปลงหนี้ใหม่ด้วยเปลี่ยนตัวลูกหนี้นั้น จะทำเป็นสัญญาระหว่างเจ้าหนี้กับลูกหนี้คนใหม่ก็ได้ แต่จะทำโดยขืนใจลูกหนี้เดิมหาได้ไม่"], "ป.พ.พ.|797": ["", "อันว่าสัญญาตัวแทนนั้น คือสัญญาซึ่งให้บุคคลหนึ่ง เรียกว่าตัวแทน มีอำนาจทำการแทนบุคคลอีกคนหนึ่ง เรียกว่าตัวการ และตกลงจะทำการดังนั้น อันความเป็นตัวแทนนั้นจะเป็นโดยตั้งแต่งแสดงออกชัดหรือโดยปริยายก็ย่อมได้"], "ป.พ.พ.|959": ["", "ผู้ทรงตั๋วแลกเงินจะใช้สิทธิไล่เบี้ยเอาแก่บรรดาผู้สลักหลัง ผู้สั่งจ่าย และบุคคลอื่น ๆ ซึ่งต้องรับผิดตามตั๋วเงินนั้นก็ได้ คือ ก) ไล่เบี้ยได้เมื่อตั๋วเงินถึงกำหนดในกรณีไม่ใช้เงิน ข) ไล่เบี้ยได้แม้ทั้งตั๋วเงินยังไม่ถึงกำหนดในกรณีดังจะกล่าวต่อไปนี้ คือ (1) ถ้าเขาบอกปัดไม่รับรองตั๋วเงิน (2) ถ้าผู้จ่ายหากจะได้รับรองหรือไม่ก็ตาม ตกเป็นคนล้มละลาย หรือได้งดเว้นการใช้หนี้ แม้การงดเว้นใช้หนี้นั้น จะมิได้มีคำพิพากษาเป็นหลักฐานก็ตาม หรือถ้าผู้จ่ายถูกยึดทรัพย์และการยึดทรัพย์นั้นไร้ผล (3) ถ้าผู้สั่งจ่ายตั๋วเงินชนิดไม่จำเป็นต้องให้ผู้ใดรับรองนั้นตกเป็นคนล้มละลาย"], "ป.พ.พ.|1534": ["", "สินสมรสที่คู่สมรสฝ่ายใดฝ่ายหนึ่งจำหน่ายไปเพื่อประโยชน์ตนฝ่ายเดียวก็ดี จำหน่ายไปโดยเจตนาทำให้คู่สมรสอีกฝ่ายหนึ่งเสียหายก็ดี จำหน่ายไปโดยมิได้รับความยินยอมของคู่สมรสอีกฝ่ายหนึ่งในกรณีที่กฎหมายบังคับว่าการจำหน่ายนั้นจะต้องได้รับความยินยอมของอีกฝ่ายหนึ่งด้วยก็ดี จงใจทำลายให้สูญหายไปก็ดี ให้ถือเสมือนว่าทรัพย์สินนั้นยังคงมีอยู่เพื่อจัดแบ่งสินสมรสตามมาตรา 1533 และถ้าคู่สมรสอีกฝ่ายหนึ่งได้รับส่วนแบ่งสินสมรสไม่ครบตามจำนวนที่ควรจะได้ ให้คู่สมรสฝ่ายที่ได้จำหน่ายหรือจงใจทำลายสินสมรสนั้นชดใช้จากสินสมรสส่วนของตนหรือสินส่วนตัว"], "ป.พ.พ.|1719": ["", "ผู้จัดการมรดกมีสิทธิและหน้าที่ที่จะทำการอันจำเป็น เพื่อให้การเป็นไปตามคำสั่งแจ้งชัดหรือโดยปริยายแห่งพินัยกรรม และเพื่อจัดการมรดกโดยทั่วไปหรือเพื่อแบ่งปันทรัพย์มรดก"], "ป.พ.พ.|625": ["", "ใบรับ ใบตราส่ง หรือเอกสารอื่น ๆ ทำนองนั้นก็ดี ซึ่งผู้ขนส่งออกให้แก่ผู้ส่งนั้น ถ้ามีข้อความยกเว้นหรือจำกัดความรับผิดของผู้ขนส่งประการใด ท่านว่าความนั้นเป็นโมฆะ เว้นแต่ผู้ส่งจะได้แสดงความตกลงด้วยชัดแจ้งในการยกเว้นหรือจำกัดความรับผิดเช่นว่านั้น"], "ป.พ.พ.|1639": ["", "ถ้าบุคคลใดซึ่งจะเป็นทายาทตามมาตรา 1629 (1) (3) (4) หรือ (6) ถึงแก่ความตาย หรือถูกกำจัดมิให้รับมรดกก่อนเจ้ามรดกตาย ถ้าบุคคลนั้นมีผู้สืบสันดานก็ให้ผู้สืบสันดานรับมรดกแทนที่ ถ้าผู้สืบสันดานคนใดของบุคคลนั้นถึงแก่ความตายหรือถูกกำจัดมิให้รับมรดกเช่นเดียวกัน ก็ให้ผู้สืบสันดานของผู้สืบสันดานนั้นรับมรดกแทนที่ และให้มีการรับมรดกแทนที่กันเฉพาะส่วนแบ่งของบุคคลเป็นราย ๆ สืบต่อกันเช่นนี้ไปจนหมดสาย"], "ป.พ.พ.|1621": ["", "เว้นแต่ผู้ทำพินัยกรรมจะได้แสดงเจตนากำหนดไว้ในพินัยกรรมเป็นอย่างอื่น แม้ทายาทโดยธรรมคนใดจะได้รับทรัพย์สินอย่างหนึ่งอย่างใดตามพินัยกรรม ทายาทคนนั้นก็ยังมีสิทธิที่จะเรียกเอาส่วนโดยธรรมของตนจากทรัพย์มรดกส่วนที่ยังไม่ได้จำหน่ายโดยพินัยกรรมจนเต็มอีกก็ได้"], "ป.พ.พ.|460": ["", "ในการซื้อขายทรัพย์สินซึ่งมิได้กำหนดลงไว้แน่นอนนั้น ท่านว่ากรรมสิทธิ์ยังไม่โอนไปจนกว่าจะได้หมาย หรือนับ ชั่ง ตวง วัด หรือคัดเลือก หรือทำโดยวิธีอื่นเพื่อให้บ่งตัวทรัพย์สินนั้นออกเป็นแน่นอนแล้ว ในการซื้อขายทรัพย์สินเฉพาะสิ่ง ถ้าผู้ขายยังจะต้องนับ ชั่ง ตวง วัด หรือทำการอย่างอื่น หรือทำสิ่งหนึ่งสิ่งใดอันเกี่ยวแก่ทรัพย์สินเพื่อให้รู้กำหนดราคาทรัพย์สินนั้นแน่นอน ท่านว่ากรรมสิทธิ์ยังไม่โอนไปยังผู้ซื้อจนกว่าการหรือสิ่งนั้นได้ทำแล้ว"], "ป.พ.พ.|1173": ["", "การประชุมวิสามัญจะต้องนัดเรียกให้มีขึ้นในเมื่อผู้ถือหุ้นมีจำนวนหุ้นรวมกันไม่น้อยกว่าหนึ่งในห้าแห่งจำนวนหุ้นของบริษัทได้เข้าชื่อกันทำหนังสือร้องขอให้เรียกประชุมเช่นนั้น ในหนังสือร้องขอนั้นต้องระบุว่าประสงค์ให้เรียกประชุมเพื่อการใด"], "ป.พ.พ.|1695": ["", "ถ้าพินัยกรรมได้ทำเป็นต้นฉบับแต่ฉบับเดียว ผู้ทำพินัยกรรมอาจเพิกถอนพินัยกรรมนั้นทั้งหมดหรือบางส่วนได้ โดยทำลายหรือขีดฆ่าเสียด้วยความตั้งใจ ถ้าพินัยกรรมได้ทำเป็นต้นฉบับหลายฉบับ การเพิกถอนนั้นไม่บริบูรณ์ เว้นแต่จะได้กระทำแก่ต้นฉบับเหล่านั้นทุกฉบับ"], "ป.พ.พ.|899": ["", "ข้อความอันใดซึ่งมิได้มีบัญญัติไว้ในประมวลกฎหมายลักษณะนี้ ถ้าเขียนลงในตั๋วเงิน ท่านว่าข้อความอันนั้นหาเป็นผลอย่างหนึ่งอย่างใดแก่ตั๋วเงินนั้นไม่"], "ป.พ.พ.|395": ["", "บุคคลใดเข้าทำกิจการแทนผู้อื่นโดยเขามิได้ว่าขานวานใช้ให้ทำก็ดี หรือโดยมิได้มีสิทธิที่จะทำการงานนั้นแทนผู้อื่นด้วยประการใดก็ดี ท่านว่าบุคคลนั้นจะต้องจัดการงานไปในทางที่จะให้สมประโยชน์ของตัวการ ตามความประสงค์อันแท้จริงของตัวการ หรือตามที่จะพึงสันนิษฐานได้ว่าเป็นความประสงค์ของตัวการ"], "ป.พ.พ.|905": ["", "ภายในบังคับแห่งบทบัญญัติมาตรา 1008 บุคคลผู้ได้ตั๋วเงินไว้ในครอบครอง ถ้าแสดงให้ปรากฏสิทธิด้วยการสลักหลังไม่ขาดสาย แม้ถึงว่าการสลักหลังรายที่สุดจะเป็นสลักหลังลอยก็ตาม ท่านให้ถือว่าเป็นผู้ทรงโดยชอบด้วยกฎหมาย เมื่อใดรายการสลักหลังลอยมีสลักหลังรายอื่นตามหลังไปอีก ท่านให้ถือว่าบุคคลผู้ที่ลงลายมือชื่อในการสลักหลังรายที่สุดนั้น เป็นผู้ได้ไปซึ่งตั๋วเงินด้วยการสลักหลังลอย อนึ่ง คำสลักหลังเมื่อขีดฆ่าเสียแล้ว ท่านให้ถือเสมือนว่ามิได้มีเลย ถ้าบุคคลผู้หนึ่งผู้ใดต้องปราศจากตั๋วเงินไปจากครอบครอง ท่านว่าผู้ทรงซึ่งแสดงให้ปรากฏสิทธิของตนในตั๋วตามวิธีการดังกล่าวมาในวรรคก่อนนั้น หาจำต้องสละตั๋วเงินไม่ เว้นแต่จะได้มาโดยทุจริต หรือได้มาด้วยความประมาทเลินเล่ออย่างร้ายแรง อนึ่ง ข้อความในวรรคก่อนนี้ ให้ใช้บังคับตลอดถึงผู้ทรงตั๋วเงินสั่งจ่ายให้แก่ผู้ถือด้วย"], "ป.พ.พ.|1472": ["", "สินส่วนตัวนั้น ถ้าได้แลกเปลี่ยนเป็นทรัพย์สินอื่นก็ดี ซื้อทรัพย์สินอื่นมาก็ดี หรือขายได้เป็นเงินมาก็ดี ทรัพย์สินอื่นหรือเงินที่ได้มานั้นเป็นสินส่วนตัว สินส่วนตัวที่ถูกทำลายไปทั้งหมดหรือแต่บางส่วน แต่ได้ทรัพย์สินอื่นหรือเงินมาทดแทน ทรัพย์สินอื่นหรือเงินที่ได้มานั้นเป็นสินส่วนตัว"], "ป.พ.พ.|810": ["", "เงินและทรัพย์สินอย่างอื่นบรรดาที่ตัวแทนได้รับไว้เกี่ยวด้วยการเป็นตัวแทนนั้น ท่านว่าตัวแทนต้องส่งให้แก่ตัวการจงสิ้น อนึ่ง สิทธิทั้งหลายซึ่งตัวแทนขวนขวายได้มาในนามของตนเองแต่โดยฐานที่ทำการแทนตัวการนั้น ตัวแทนก็ต้องโอนให้แก่ตัวการจงสิ้น"], "ป.พ.พ.|1629": ["", "ทายาทโดยธรรมมีหกลำดับเท่านั้น และภายใต้บังคับแห่งมาตรา 1630 วรรคสอง แต่ละลำดับมีสิทธิได้รับมรดกก่อนหลังดังต่อไปนี้ คือ (1) ผู้สืบสันดาน (2) บิดามารดา (3) พี่น้องร่วมบิดามารดาเดียวกัน (4) พี่น้องร่วมบิดาหรือร่วมมารดาเดียวกัน (5) ปู่ ย่า ตา ยาย (6) ลุง ป้า น้า อา คู่สมรสที่ยังมีชีวิตอยู่นั้นก็เป็นทายาทโดยธรรม ภายใต้บังคับของบทบัญญัติพิเศษแห่งมาตรา 1635"], "ป.พ.พ.|702": ["", "อันว่าจำนองนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้จำนอง เอาทรัพย์สินตราไว้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับจำนอง เป็นประกันการชำระหนี้ โดยไม่ส่งมอบทรัพย์สินนั้นให้แก่ผู้รับจำนอง ผู้รับจำนองชอบที่จะได้รับชำระหนี้จากทรัพย์สินที่จำนองก่อนเจ้าหนี้สามัญ มิพักต้องพิเคราะห์ว่ากรรมสิทธิ์ในทรัพย์สินจะได้โอนไปยังบุคคลภายนอกแล้วหรือหาไม่"], "ป.พ.พ.|1739": ["", "ให้ชำระหนี้ที่กองมรดกค้างชำระตามลำดับต่อไปนี้ และตามบทบัญญัติแห่งประมวลกฎหมายนี้ว่าด้วยบุริมสิทธิ โดยต้องไม่เป็นที่เสื่อมเสียแก่บรรดาเจ้าหนี้ผู้มีบุริมสิทธิพิเศษตามประมวลกฎหมายนี้หรือกฎหมายอื่น และบรรดาเจ้าหนี้ที่มีประกันโดยการจำนำหรือการจำนอง (1) ค่าใช้จ่ายเพื่อประโยชน์อันร่วมกันของกองมรดก (2) ค่าใช้จ่ายในการทำศพเจ้ามรดก (3) ค่าภาษีอากรซึ่งกองมรดกค้างชำระอยู่ (4) ค่าจ้างซึ่งเจ้ามรดกค้างชำระแก่เสมียน คนใช้และคนงาน (5) ค่าเครื่องอุปโภคบริโภคอันจำเป็นประจำวันซึ่งส่งให้แก่เจ้ามรดก (6) หนี้สินสามัญของเจ้ามรดก (7) บำเหน็จของผู้จัดการมรดก"], "ป.พ.พ.|456": ["", "การซื้อขายอสังหาริมทรัพย์ ถ้ามิได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่เป็นโมฆะ วิธีนี้ให้ใช้ถึงซื้อขายเรือมีระวางตั้งแต่ห้าตันขึ้นไป ทั้งซื้อขายแพและสัตว์พาหนะด้วย สัญญาจะขายหรือจะซื้อ หรือคำมั่นในการซื้อขายทรัพย์สินตามที่ระบุไว้ในวรรคหนึ่ง ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างหนึ่งอย่างใดลงลายมือชื่อฝ่ายผู้ต้องรับผิดเป็นสำคัญ หรือได้วางประจำไว้หรือได้ชำระหนี้บางส่วนแล้ว จะฟ้องร้องให้บังคับคดีหาได้ไม่ บทบัญญัติที่กล่าวมาในวรรคก่อนนี้ ให้ใช้บังคับถึงสัญญาซื้อขายสังหาริมทรัพย์ซึ่งตกลงกันเป็นราคาสองหมื่นบาท หรือกว่านั้นขึ้นไปด้วย"], "ป.พ.พ.|407": ["", "บุคคลใดได้กระทำการอันใดตามอำเภอใจเหมือนหนึ่งว่าเพื่อชำระหนี้โดยรู้อยู่ว่าตนไม่มีความผูกพันที่จะต้องชำระ ท่านว่าบุคคลผู้นั้นหามีสิทธิจะได้รับคืนทรัพย์ไม่"], "ป.พ.พ.|379": ["", "ถ้าลูกหนี้สัญญาแก่เจ้าหนี้ว่าจะใช้เงินจำนวนหนึ่งเป็นเบี้ยปรับเมื่อตนไม่ชำระหนี้ก็ดี หรือไม่ชำระหนี้ให้ถูกต้องสมควรก็ดี เมื่อลูกหนี้ผิดนัด ก็ให้ริบเบี้ยปรับ ถ้าการชำระหนี้อันจะพึงทำนั้นได้แก่งดเว้นการอันใดอันหนึ่ง หากทำการอันนั้นฝ่าฝืนมูลหนี้เมื่อใด ก็ให้ริบเบี้ยปรับเมื่อนั้น"], "ป.พ.พ.|416": ["", "ค่าใช้จ่ายทั้งหลายอันควรแก่การเพื่อรักษา บำรุงหรือซ่อมแซมทรัพย์สินนั้น ท่านว่าต้องชดใช้แก่บุคคลผู้คืนทรัพย์สินนั้นเต็มจำนวน แต่บุคคลเช่นว่านี้จะเรียกร้องให้ชดใช้ค่าใช้จ่ายตามธรรมดาเพื่อบำรุง ซ่อมแซมทรัพย์สินนั้น หรือค่าภาระติดพันที่ต้องเสียไปในระหว่างที่ตนคงเก็บดอกผลอยู่นั้นหาได้ไม่"], "ป.พ.พ.|450": ["", "ถ้าบุคคลทำบุบสลาย หรือทำลายทรัพย์สิ่งหนึ่งสิ่งใด เพื่อจะบำบัดปัดป้องภยันตรายซึ่งมีมาเป็นสาธารณะโดยฉุกเฉิน ท่านว่าไม่จำต้องใช้ค่าสินไหมทดแทน หากความเสียหายนั้นไม่เกินสมควรแก่เหตุภยันตราย ถ้าบุคคลทำบุบสลาย หรือทำลายทรัพย์สิ่งหนึ่งสิ่งใด เพื่อจะบำบัดปัดป้องภยันตรายอันมีแก่เอกชนโดยฉุกเฉิน ผู้นั้นจะต้องใช้คืนทรัพย์นั้น ถ้าบุคคลทำบุบสลาย หรือทำลายทรัพย์สิ่งหนึ่งสิ่งใด เพื่อจะป้องกันสิทธิของตนหรือของบุคคลภายนอกจากภยันตรายอันมีมาโดยฉุกเฉินเพราะตัวทรัพย์นั้นเองเป็นเหตุ บุคคลเช่นว่านี้หาต้องรับผิดใช้ค่าสินไหมทดแทนไม่ หากว่าความเสียหายนั้นไม่เกินสมควรแก่เหตุ แต่ถ้าภยันตรายนั้นเกิดขึ้นเพราะความผิดของบุคคลนั้นเองแล้ว ท่านว่าจำต้องรับผิดใช้ค่าสินไหมทดแทนให้"], "ป.พ.พ.|1410": ["", "เจ้าของที่ดินอาจก่อให้เกิดสิทธิเหนือพื้นดินเป็นคุณแก่บุคคลอื่น โดยให้บุคคลนั้นมีสิทธิเป็นเจ้าของโรงเรือน สิ่งปลูกสร้าง หรือสิ่งเพาะปลูก บนดินหรือใต้ดินนั้น"], "ป.พ.พ.|1435": ["", "การหมั้นจะทำได้ต่อเมื่อบุคคลทั้งสองฝ่ายมีอายุสิบแปดปีบริบูรณ์แล้ว การหมั้นที่ฝ่าฝืนบทบัญญัติวรรคหนึ่งเป็นโมฆะ"], "ป.พ.พ.|1458": ["", "การสมรสจะทำได้ต่อเมื่อบุคคลสองคนยินยอมเป็นคู่สมรสกันและต้องแสดงการยินยอมนั้นให้ปรากฏโดยเปิดเผยต่อหน้านายทะเบียนและให้นายทะเบียนบันทึกความยินยอมนั้นไว้ด้วย"], "ป.พ.พ.|826": ["", "อันสัญญาตัวแทนย่อมระงับสิ้นไปด้วยตัวการถอนตัวแทน หรือด้วยตัวแทนบอกเลิกเป็นตัวแทน อนึ่ง สัญญาตัวแทนย่อมระงับสิ้นไป เมื่อคู่สัญญาฝ่ายใดฝ่ายหนึ่งตาย หรือตกเป็นผู้ไร้ความสามารถ หรือล้มละลาย เว้นแต่จะปรากฏว่าขัดกับข้อสัญญาหรือสภาพแห่งกิจการนั้น"], "ป.พ.พ.|1395": ["", "ถ้ามีการแบ่งแยกสามยทรัพย์ ท่านว่าภาระจำยอมยังคงมีอยู่เพื่อประโยชน์แก่ทุกส่วนที่แยกออกนั้น แต่ถ้าภาระจำยอมนั้นไม่ใช้และใช้ไม่ได้ตามรูปการเพื่อประโยชน์แก่ส่วนใดไซร้ ท่านว่าเจ้าของภารยทรัพย์จะเรียกให้พ้นจากภาระจำยอมอันเกี่ยวกับทรัพย์ส่วนนั้นก็ได้"], "ป.พ.พ.|23": ["", "ผู้เยาว์อาจทำการใด ๆ ได้ทั้งสิ้น ซึ่งเป็นการต้องทำเองเฉพาะตัว"], "ป.พ.พ.|583": ["", "ถ้าลูกจ้างจงใจขัดคำสั่งของนายจ้างอันชอบด้วยกฎหมายก็ดี หรือละเลยไม่นำพาต่อคำสั่งเช่นว่านั้นเป็นอาจิณก็ดี ละทิ้งการงานไปเสียก็ดี กระทำความผิดอย่างร้ายแรงก็ดี หรือทำประการอื่นอันไม่สมแก่การปฏิบัติหน้าที่ของตนให้ลุล่วงไปโดยถูกต้องและสุจริตก็ดี ท่านว่านายจ้างจะไล่ออกโดยมิพักต้องบอกกล่าวล่วงหน้าหรือให้สินไหมทดแทนก็ได้"], "ป.พ.พ.|535": ["", "การให้อันจะกล่าวต่อไปนี้ ท่านว่าจะถอนคืนเพราะเหตุเนรคุณไม่ได้ คือ (1) ให้เป็นบำเหน็จสินจ้างโดยแท้ (2) ให้สิ่งที่มีค่าภาระติดพัน (3) ให้โดยหน้าที่ธรรมจรรยา (4) ให้ในการสมรส"], "ป.พ.พ.|1306": ["", "ท่านห้ามมิให้ยกอายุความขึ้นเป็นข้อต่อสู้กับแผ่นดินในเรื่องทรัพย์สินอันเป็นสาธารณสมบัติของแผ่นดิน"], "ป.พ.พ.|1364": ["", "การแบ่งทรัพย์สินพึงกระทำโดยแบ่งทรัพย์สินนั้นเองระหว่างเจ้าของรวม หรือโดยขายทรัพย์สินแล้วเอาเงินที่ขายได้แบ่งกัน ถ้าเจ้าของรวมไม่ตกลงกันว่าจะแบ่งทรัพย์สินอย่างไรไซร้ เมื่อเจ้าของรวมคนหนึ่งคนใดขอ ศาลอาจสั่งให้เอาทรัพย์สินนั้นออกแบ่ง ถ้าส่วนที่แบ่งให้ไม่เท่ากันไซร้ จะสั่งให้ทดแทนกันเป็นเงินก็ได้ ถ้าการแบ่งเช่นว่านี้ไม่อาจทำได้หรือจะเสียหายมากนักก็ดี ศาลจะสั่งให้ขายโดยประมูลราคากันระหว่างเจ้าของรวมหรือขายทอดตลาดก็ได้"], "ป.พ.พ.|744": ["", "อันจำนองย่อมระงับสิ้นไป (1) เมื่อหนี้ที่ประกันระงับสิ้นไปด้วยเหตุประการอื่นใดมิใช่เหตุอายุความ (2) เมื่อปลดจำนองให้แก่ผู้จำนองด้วยหนังสือเป็นสำคัญ (3) เมื่อผู้จำนองหลุดพ้น (4) เมื่อถอนจำนอง (5) เมื่อขายทอดตลาดทรัพย์สินซึ่งจำนองตามคำสั่งศาลอันเนื่องมาแต่การบังคับจำนองหรือถอนจำนอง หรือเมื่อมีการขายทอดตลาดทรัพย์สินตามมาตรา 729/1 (6) เมื่อเอาทรัพย์สินซึ่งจำนองนั้นหลุด"], "ป.พ.พ.|700": ["", "ถ้าค้ำประกันหนี้อันจะต้องชำระ ณ เวลามีกำหนดแน่นอนและเจ้าหนี้ยอมผ่อนเวลาให้แก่ลูกหนี้ ผู้ค้ำประกันย่อมหลุดพ้นจากความรับผิด เว้นแต่ผู้ค้ำประกันจะได้ตกลงด้วยในการผ่อนเวลานั้น ข้อตกลงที่ผู้ค้ำประกันทำไว้ล่วงหน้าก่อนเจ้าหนี้ผ่อนเวลาอันมีผลเป็นการยินยอมให้เจ้าหนี้ผ่อนเวลา ข้อตกลงนั้นใช้บังคับมิได้ ความในวรรคสอง มิให้ใช้บังคับแก่กรณีผู้ค้ำประกันซึ่งเป็นสถาบันการเงินหรือค้ำประกันเพื่อสินจ้างเป็นปกติธุระ"], "ป.พ.พ.|227": ["",
